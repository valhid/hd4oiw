:{"a":"グレートオーシャンロードには「12使徒」と呼ばれる奇岩がある。","b":"ピナクルズは西オーストラリア州のナンバング国立公園にある。","c":"キュランダ鉄道はケアンズから出発する。","d":"スリーシスターズはウルル－カタジュタ国立公園にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。スリーシスターズはブルーマウンテンズ国立公園（シドニー近郊）にある奇岩。","why":"オーストラリアは毎年出題。西部（パース・ピナクルズ）は未出で、東部との取り違えを狙える。","ref":"海外観光資源／オセアニア"},{"id":"Bovs41","no":41,"sub":"ovs","topic":"海外観光資源","stem":"太平洋の島々に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ニューカレドニアは「天国に一番近い島」と呼ばれ、中心都市はヌメアである。","b":"ボラボラ島はタヒチ（フランス領ポリネシア）にある。","c":"パラオにはジェリーフィッシュレイクがある。","d":"フィジーの中心都市はアピアである。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。アピアはサモアの首都。フィジーの首都はスバ、国際空港はナンディにある。","why":"太平洋の島々は5年で未出。リゾート地として実務上重要で、出題されうる。","ref":"海外観光資源／オセアニア"},{"id":"Bovs42","no":42,"sub":"ovs","topic":"海外観光資源","stem":"世界三大瀑布に関する次の記述のうち、正しいものはどれか。","opts":{"a":"イグアスの滝、ヴィクトリアの滝、ナイアガラの滝である。","b":"イグアスの滝、アンヘル滝、ナイアガラの滝である。","c":"ヴィクトリアの滝、アンヘル滝、ナイアガラの滝である。","d":"イグアスの滝、ヴィクトリアの滝、アンヘル滝である。"},"ans":["a"],"pt":2,"exp":"世界三大瀑布はイグアス（ブラジル・アルゼンチン）、ヴィクトリア（ザンビア・ジンバブエ）、ナイアガラ（カナダ・アメリカ）。アンヘル滝は世界最大落差だが三大瀑布ではない。","why":"三大瀑布は5年で未出。個別の滝は出題実績があり、定義を問う形が出やすい。","ref":"海外観光資源／横断"},{"id":"Bovs43","no":43,"sub":"ovs","topic":"海外観光資源","stem":"次の美術館とその所在都市の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"エルミタージュ美術館 ─ サンクトペテルブルク","b":"グッゲンハイム美術館 ─ ビルバオ","c":"マウリッツハイス美術館 ─ アムステルダム","d":"ベルヴェデーレ宮殿上宮 ─ ウィーン"},"ans":["a","b","d"],"pt":2,"exp":"cは誤り。マウリッツハイス美術館はハーグにある。アムステルダムには国立美術館とゴッホ美術館がある。","why":"美術館は毎年1〜2問。オランダの2都市（ハーグ・アムステルダム）の取り違えは未出の切り口。","ref":"海外観光資源／美術館"},{"id":"Bovs44","no":44,"sub":"ovs","topic":"海外観光資源","stem":"次の祭りとその国の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"サン・フェルミン祭（牛追い祭り） ─ スペイン","b":"オクトーバーフェスト ─ ドイツ","c":"ソンクラーン（水掛け祭り） ─ タイ","d":"ホーリー ─ ブラジル"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ホーリーはインドの「色粉かけ祭り」。ブラジルはリオのカーニバル。","why":"祭りと国の組合せは5年で未出だが、国内では毎年出題。海外版として出題されうる。","ref":"海外観光資源／食文化・行事"},{"id":"Bovs45","no":45,"sub":"ovs","topic":"海外実務その他","stem":"次の航空便の所要時間として正しいものはどれか。<br>JL 0002便　ホノルル（HNL）14:45 発 → 東京（NRT）18:30 (+1) 着<br>※ホノルルの対GMTは−10、東京の対GMTは+9とする。","opts":{"a":"8時間45分","b":"9時間45分","c":"27時間45分","d":"3時間45分"},"ans":["a"],"pt":5,"exp":"出発をGMTに直すと14:45−(−10)＝24:45＝翌日00:45。到着は翌日18:30−9＝GMT 09:30（同じ翌日）。9:30−0:45＝8時間45分。日付変更線を越える便は、GMTに直すと出発が翌日にずれる点が分岐点。","why":"所要時間は毎年出題。太平洋路線は日付変更線をまたぐため、GMT換算で日付がずれる処理が難所。","ref":"所要時間の計算","fig":"<svg viewBox=\"0 0 700 156\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"4\" y=\"6\" width=\"340\" height=\"60\" rx=\"2\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"18\" y=\"26\" font-weight=\"700\" fill=\"var(--ai)\">出発をGMTに直す</text>\n<text x=\"18\" y=\"48\" font-size=\"13\">ホノルル 14:45 − (−10) ＝ <tspan font-weight=\"700\">24:45</tspan></text>\n<text x=\"18\" y=\"62\" font-size=\"11\">＝ GMT 翌日 00:45（24を超えたので翌日）</text>\n<rect x=\"352\" y=\"6\" width=\"344\" height=\"60\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"366\" y=\"26\" font-weight=\"700\">到着をGMTに直す</text>\n<text x=\"366\" y=\"48\" font-size=\"13\">東京 翌日18:30 − (+9) ＝ <tspan font-weight=\"700\">GMT 翌日 09:30</tspan></text>\n<rect x=\"4\" y=\"76\" width=\"692\" height=\"46\" rx=\"2\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"18\" y=\"96\" font-weight=\"700\" fill=\"var(--koke)\">差を取る</text>\n<text x=\"18\" y=\"116\" font-size=\"14\">09:30 − 00:45 ＝ <tspan font-weight=\"700\">8時間45分</tspan></text>\n<rect x=\"4\" y=\"130\" width=\"692\" height=\"24\" rx=\"2\" fill=\"var(--shuSoft)\" stroke=\"var(--shuLine)\"/>\n<text x=\"18\" y=\"147\" font-size=\"11.5\">現地時刻のまま引くと27時間45分となる。必ず<tspan font-weight=\"700\">両端をGMTに直してから</tspan>引く。</text>\n</g></svg>","figcap":"日付変更線をまたぐ便の所要時間"},{"id":"Bovs46","no":46,"sub":"ovs","topic":"海外実務その他","stem":"次の組合せのうち、都市（A）が3月20日（金）10時（午前10時）のとき、都市（B）の現地時刻が正しいものをすべて選びなさい。<br>※3月20日時点で、いずれの都市も夏時間を実施していないものとする。","opts":{"a":"東京（+9） ─ ロサンゼルス（−8） ─ 3月19日17時","b":"東京（+9） ─ ドバイ（+4） ─ 3月20日5時","c":"東京（+9） ─ シンガポール（+8） ─ 3月20日9時","d":"東京（+9） ─ ニューヨーク（−5） ─ 3月20日20時"},"ans":["a","b","c"],"pt":5,"exp":"東京10時のGMTは10−9＝1時。ロサンゼルス 1+(−8)＝−7＝前日17時（3月19日）、ドバイ 1+4＝5時、シンガポール 1+8＝9時、ニューヨーク 1+(−5)＝−4＝前日20時（3月19日）。dは日付が誤り。","why":"時差は毎年出題。複数都市を一度に計算させ、日付だけ誤らせる形は難度が高い。","ref":"時差計算"},{"id":"Bovs47","no":47,"sub":"ovs","topic":"海外実務その他","stem":"次の国とその通貨の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"スイス ─ スイスフラン","b":"デンマーク ─ クローネ","c":"チェコ ─ コルナ","d":"ハンガリー ─ ズウォティ"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。ハンガリーの通貨はフォリント。ズウォティはポーランドの通貨。いずれもシェンゲン協定に加盟しているがユーロを導入していない国。","why":"シェンゲンと通貨は2022年度以降4年連続で出題。東欧諸国の通貨名の取り違えが定番。","ref":"シェンゲン協定・通貨"},{"id":"Bovs48","no":48,"sub":"ovs","topic":"海外実務その他","stem":"機内持込手荷物に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"液体物は100ml以下の容器に入れ、容量1リットル以下の再封可能な透明プラスチック袋に入れる必要がある。","b":"容器の容量が100mlを超える場合、中身が100ml以下でも持ち込むことはできない。","c":"出国手続後の免税店で購入した液体物は、所定の袋に入れられていれば持ち込むことができる。","d":"医薬品や乳幼児用ミルクは、液体物の制限の対象外となる場合がある。"},"ans":["a","b","c","d"],"pt":5,"exp":"a〜dすべて正しい。判定基準が「容器の容量」である点と、免税店購入品・医薬品等の例外が要点。","why":"★液体物は2021・2022・2023年度に出題されたが2024・2025年度は出題なし。2年連続で出ていないため次年度の出題確率が高い。","ref":"航空保安／液体物の持込制限"},{"id":"Bovs49","no":49,"sub":"ovs","topic":"海外実務その他","stem":"次の航空会社コードと航空会社名の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"AY ─ フィンエアー","b":"LX ─ スイス インターナショナル エアラインズ","c":"OZ ─ アシアナ航空","d":"SK ─ シンガポール航空"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。SKはSAS（スカンジナビア航空）。シンガポール航空はSQ。SASは2024年にStar AllianceからSkyTeamへ移籍した。","why":"コードは毎年2問。SKとSQ、AYとFJなど紛らわしい組合せが繰り返し狙われる。","ref":"航空会社コード"},{"id":"Bovs50","no":50,"sub":"ovs","topic":"海外実務その他","stem":"ヨーロッパの高速鉄道に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ユーロスターはロンドンとパリ・ブリュッセルを結ぶ。","b":"AVEはスペインの高速鉄道である。","c":"フレッチャロッサはイタリアの高速鉄道である。","d":"ICEはフランスの高速鉄道である。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。ICEはドイツの高速鉄道。フランスはTGV。ユーロスターではジュクスタポーズド・コントロールにより出発駅で相手国の入国審査を行う。","why":"高速鉄道は2022年度に出題。国と列車名の対応（TGV＝仏、ICE＝独、AVE＝西、フレッチャロッサ＝伊）が定番。","ref":"海外の鉄道"},{"id":"Bovs51","no":51,"sub":"ovs","topic":"海外実務その他","stem":"クルーズに関する用語の説明のうち、正しいものをすべて選びなさい。","opts":{"a":"「ショアエクスカーション」とは寄港地観光のことである。","b":"「テンダーボート」とは船と陸を行き来する小型ボートである。","c":"「ポートサイド」とは進行方向に向かって左舷のことである。","d":"「オンボードブッキング」とは乗船中に次回のクルーズを予約することである。"},"ans":["a","b","c","d"],"pt":5,"exp":"a〜dすべて正しい。スターボードサイドが右舷、ポートサイドが左舷。タグボートは曳船で、テンダーボートとは異なる。","why":"クルーズ用語は毎年1〜3問。左舷・右舷とボートの種類が繰り返し問われる。","ref":"クルーズの用語"},{"id":"Bovs52","no":52,"sub":"ovs","topic":"海外実務その他","stem":"ホテルの客室に関する用語の説明のうち、誤っているものはどれか。","opts":{"a":"「コネクティングルーム」とは、内部のドアでつながっている2つの部屋をいう。","b":"「アジョイニングルーム」とは、隣接しているが内部のドアではつながっていない2つの部屋をいう。","c":"「スイートルーム」とは、寝室と居間が分かれている客室をいう。","d":"「ツインルーム」とは、ダブルベッドが1台ある2人用の客室をいう。"},"ans":["d"],"pt":5,"exp":"ツインルームはシングルベッドが2台ある2人用の客室。ダブルベッド1台の客室はダブルルーム。","why":"客室の種類は5年で未出。コネクティング／アジョイニングは既出だが、ベッドタイプは未出の切り口。","ref":"宿泊の用語"}]},{"mark":"C","title":"セットC　発展編","desc":"複数の制度を並べて違いを問う横断型と、過去5年で出題のない領域・直近の時事論点を集めた構成。仕上げに。","n":139,"q":[{"id":"Claw01","no":1,"sub":"law","topic":"目的・定義","stem":"旅行業法における「企画旅行」と「手配旅行」に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"企画旅行では、旅行業者が旅行に関する計画を作成する。","b":"手配旅行では、旅行業者は旅行者の委託により運送等サービスの手配を行う。","c":"企画旅行には、募集型と受注型がある。","d":"手配旅行においても、旅行業者は旅程管理義務を負う。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅程管理義務を負うのは企画旅行のみ。手配旅行では善良な管理者の注意をもって手配をすれば債務の履行は終了する。この債務の違いが両者を分ける本質。","why":"定義は毎年2問。企画旅行と手配旅行の債務の違いは、約款とも共通する横断論点で理解の深さが問われる。","ref":"旅行業法第2条"},{"id":"Claw02","no":2,"sub":"law","topic":"目的・定義","stem":"次の行為のうち、旅行業の登録を受けなければ行うことができないものをすべて選びなさい。","opts":{"a":"報酬を得て、旅行者のため運送機関への支払いを代行する行為","b":"報酬を得て、旅行者のため宿泊機関の予約を媒介する行為","c":"報酬を得て、旅行者からの相談に応ずる行為","d":"旅行業者の依頼により、報酬を得て現地ガイドを手配する行為"},"ans":["a","b","c"],"pt":4,"exp":"dは旅行サービス手配業（ランドオペレーター）の業務であり、旅行業ではなく旅行サービス手配業の登録が必要。a・b・cはいずれも旅行業務に該当する。","why":"旅行業と旅行サービス手配業の境界は、手配業が5年で毎年3〜4問出題される中で繰り返し問われる。","ref":"旅行業法第2条・第23条"},{"id":"Claw03","no":3,"sub":"law","topic":"登録制度","stem":"旅行業と旅行サービス手配業の制度を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業の登録には有効期間があるが、旅行サービス手配業の登録には有効期間がない。","b":"旅行業には営業保証金の供託義務があるが、旅行サービス手配業にはない。","c":"旅行業には約款の認可制度があるが、旅行サービス手配業にはない。","d":"旅行業には標識の掲示義務があるが、旅行サービス手配業にはない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行サービス手配業者にも標識の掲示義務がある（様式は異なる）。手配業にない制度は、有効期間・更新登録・変更登録・営業保証金・約款・外務員・広告規制。","why":"両制度の横断比較は5年で毎年出題。「あるもの／ないもの」を正確に区別できるかが問われる。","ref":"旅行業法／旅行サービス手配業の規定"},{"id":"Claw04","no":4,"sub":"law","topic":"登録制度","stem":"旅行業の登録の取消しに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"不正の手段により登録を受けたときは、登録を取り消すことができる。","b":"登録を受けてから1年以内に事業を開始しないときは、登録を取り消すことができる。","c":"引き続き1年以上事業を行っていないと認めるときは、登録を取り消すことができる。","d":"営業保証金の供託の届出をしないときは、直ちに登録を取り消さなければならない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。営業保証金の供託の届出をしないときは、登録行政庁が期間を定めて届出を催告し、それでも届出がないときに登録を取り消すことができる。直ちに取り消すのではない。","why":"登録取消しの事由と手続は5年で複数回。「1年」という数字と、催告を経る手続が問われる。","ref":"旅行業法第19条"},{"id":"Claw05","no":5,"sub":"law","topic":"営業保証金","stem":"営業保証金と弁済業務保証金を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"弁済業務保証金分担金の額は、営業保証金の額の5分の1である。","b":"保証社員と取引をした旅行者が弁済を受けられる限度額は、営業保証金の額と同額である。","c":"営業保証金からの弁済は登録行政庁の認証を、弁済業務保証金からの弁済は旅行業協会の認証を受ける。","d":"いずれも、旅行業者に旅行サービスを提供した者が弁済を受けることができる。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。いずれも弁済を受けられるのは「旅行業務に関し取引をした旅行者」に限られる。運送機関・宿泊機関等のサービス提供者は対象外。","why":"「負担は5分の1でも弁済限度額は同額」は協会分野の最頻出。認証主体の違いとあわせて横断的に問う形は難度が高い。","ref":"旅行業法第7条・第48条"},{"id":"Claw06","no":6,"sub":"law","topic":"旅行業務取扱管理者","stem":"旅行業務取扱管理者と旅行サービス手配業務取扱管理者を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"いずれも営業所ごとに1人以上を選任しなければならない。","b":"旅行業務取扱管理者の研修は旅行業協会が、旅行サービス手配業務取扱管理者の研修は登録研修機関が実施する。","c":"いずれも5年ごとに研修を受けさせなければならない。","d":"旅行サービス手配業務取扱管理者には、地域限定旅行業務取扱管理者試験の合格者を選任できる。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行サービス手配業務取扱管理者に選任できるのは、登録研修機関の研修修了者、または総合・国内の旅行業務取扱管理者試験合格者（海外を含む場合は総合）。地域限定は不可。","why":"両管理者の比較は毎年出題。研修の実施主体の違いと、地域限定を選任できない点が核心。","ref":"旅行業法第11条の2・第28条"},{"id":"Claw07","no":7,"sub":"law","topic":"旅行業務取扱管理者","stem":"外務員と旅行業務取扱管理者を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"外務員は証明書を携帯しなければならないが、旅行業務取扱管理者に携帯義務はない。","b":"いずれも、旅行者から請求があったときは証明書を提示しなければならない。","c":"外務員は所属する旅行業者等に代わって旅行業務に関する一切の裁判外の行為を行う権限を有するものとみなされる。","d":"旅行業務取扱管理者は、外務員を兼ねることができない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行業務取扱管理者が外務員を兼ねることを禁じる規定はない。外務員は営業所以外の場所で取引を行う者、管理者は営業所における業務を管理・監督する者で、役割が異なる。","why":"外務員は5年連続で毎年1〜2問。管理者との比較で問う形は未出の切り口。","ref":"旅行業法第11条の2・第12条の5"},{"id":"Claw08","no":8,"sub":"law","topic":"取引条件説明・書面交付","stem":"説明書面と契約書面を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"説明書面は契約を締結しようとするとき、契約書面は契約を締結したときに交付する。","b":"いずれも、旅行者の承諾を得れば情報通信の技術を利用する方法により提供できる。","c":"いずれも、一定の場合には交付を省略することができる。","d":"契約書面は、旅行者以外の者と契約を締結したときにも交付しなければならない。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。cの省略ができるのは、旅行者の依頼により乗車券類等のみを手配し当該書面を交付するときなど、契約の履行が確実と認められる場合。","why":"2つの書面の比較は毎年出題。交付の時期・省略の可否・電磁的方法という3軸で整理する形は難度が高い。","ref":"旅行業法第12条の4・第12条の5"},{"id":"Claw09","no":9,"sub":"law","topic":"広告・誇大広告","stem":"企画旅行の広告の表示事項と、契約書面の記載事項を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業務取扱管理者の氏名は、契約書面の記載事項であるが広告の表示事項ではない。","b":"最少催行人員は、広告の表示事項である。","c":"旅程管理業務を行う者の同行の有無は、広告の表示事項である。","d":"旅行業協会に加入している旨は、広告の表示事項である。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行業協会への加入と弁済限度額は契約書面・説明書面の記載事項であって、広告の表示事項ではない。","why":"広告の表示事項と書面の記載事項の混同を狙う形は毎年出る。どちらか一方にしかないものが分岐点。","ref":"旅行業法第12条の7・施行規則"},{"id":"Claw10","no":10,"sub":"law","topic":"広告・誇大広告","stem":"誇大広告として禁止される事項に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行地における感染症の発生の状況その他の衛生に関する事項","b":"旅行地の景観、環境その他の状況に関する事項","c":"旅行業者等の業務の範囲、資力又は信用に関する事項","d":"旅行者が旅行業者等に支払うべき対価に関する事項"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて誇大広告が禁止される事項。ほかに①旅行に関するサービスの内容 ②旅行者の安全の確保 ③旅行地の法令に違反する行為のあっせん等 ④旅程管理業務を行う者の同行の有無 がある。","why":"誇大広告は5年連続で毎年1問。禁止事項の列挙は8項目あり、含まれないものを混ぜる形が定番。","ref":"旅行業法第12条の8"},{"id":"Claw11","no":11,"sub":"law","topic":"約款・料金・標識","stem":"旅行業約款、旅行業務の取扱いの料金、標識の3つを比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"約款は登録行政庁の認可を要するが、料金は掲示のみでよい。","b":"約款・料金・標識のいずれも、営業所において掲示等をしなければならない。","c":"約款は掲示に代えて、旅行者が閲覧できるように備え置くことができる。","d":"料金は、掲示に代えて備え置くことができる。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。備置きが認められるのは約款のみで、料金は掲示しなければならない。この違いは細かいが繰り返し問われる。","why":"約款・料金・標識は5年で18問と法令最多。3者を横断して比較する形は理解の深さを測れる。","ref":"旅行業法第12条・第12条の2・第12条の9"},{"id":"Claw12","no":12,"sub":"law","topic":"受託契約","stem":"受託契約に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"受託契約により代理して締結できるのは、募集型企画旅行契約に限られる。","b":"受託旅行業者は、委託旅行業者の旅行業約款により契約を締結する。","c":"受託契約に基づく契約の当事者は、委託旅行業者と旅行者である。","d":"第3種旅行業者は、第1種旅行業者の海外募集型企画旅行を受託契約により販売することができる。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。dのように、自らは実施できない海外募集型企画旅行であっても、受託契約により他社の商品を販売することはできる。この点が受託契約の実務上の意義。","why":"受託契約は毎年1問。「自ら実施できない旅行でも受託販売はできる」という点は未出の切り口で、制度趣旨の理解を問える。","ref":"旅行業法第14条の2"},{"id":"Claw13","no":13,"sub":"law","topic":"旅程管理","stem":"旅程管理業務に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅程管理業務を行う主任の者の資格要件は、募集型・受注型のいずれの企画旅行にも適用される。","b":"国内の企画旅行に同行する主任の者は、国内の旅程管理業務の実務経験があれば足りる。","c":"海外の企画旅行に同行する主任の者は、海外の旅程管理業務の実務経験が必要である。","d":"手配旅行に同行する添乗員にも、主任の者の資格要件が適用される。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。主任の者の資格要件は企画旅行に適用されるもので、手配旅行の添乗員には適用されない。ただし手配旅行の添乗経験は実務経験としてカウントできる。","why":"主任の者の要件は2024・2025年度に連続出題。国内経験は海外に使えないという一方向の関係が核心。","ref":"旅行業法第12条の11"},{"id":"Claw14","no":14,"sub":"law","topic":"禁止行為・監督","stem":"登録行政庁の監督処分に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"業務改善命令、業務停止命令、登録の取消しの3種類がある。","b":"業務停止の期間は6月以内である。","c":"登録を取り消したときは、その旨を公告しなければならない。","d":"旅行業者代理業者に対しても、監督処分を行うことができる。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。登録の取消し・業務停止をしたときは、遅滞なくその旨を公告しなければならない。処分は理由を付して通知する。","why":"監督処分の全体像を問う形は未出。業務停止6月という数字と、公告の義務が要点。","ref":"旅行業法第18条の3・第19条・第20条"},{"id":"Claw15","no":15,"sub":"law","topic":"旅行サービス手配業","stem":"旅行サービス手配業者の禁止行為に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者に対し、旅行地において施行されている法令に違反するサービスの提供を受けることのあっせんを行ってはならない。","b":"運送サービスを提供する者に対し、輸送の安全の確保を不当に阻害する行為を行ってはならない。","c":"宿泊のサービスを提供する者が旅館業法等の許可を受けているかどうかを確認しなければならない。","d":"その名義を他人に旅行サービス手配業のため利用させてはならない。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。旅行サービス手配業者にも、旅行業者と同様の禁止行為・名義利用の禁止が課される。手配業が制度化された趣旨（違法な現地手配の防止）を反映した規定。","why":"手配業の禁止行為は未出の切り口。2018年の制度創設趣旨（ランドオペレーターの適正化）から出題されうる。","ref":"旅行業法第31条"},{"id":"Claw16","no":16,"sub":"law","topic":"旅行サービス手配業","stem":"旅行サービス手配業務取扱管理者に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"営業所ごとに1人以上を選任しなければならない。","b":"他の営業所の旅行サービス手配業務取扱管理者を兼ねることができない。","c":"選任した者が欠けたときは、新たに選任するまで当該営業所において旅行サービス手配業務に関する契約を締結してはならない。","d":"5年ごとに旅行業協会が実施する研修を受けさせなければならない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行サービス手配業務取扱管理者の研修は「登録研修機関」が実施する。旅行業協会が実施するのは旅行業務取扱管理者の研修。","why":"研修の実施主体の違いは毎年問われる。手配業は5年で毎年3〜4問と高頻度。","ref":"旅行業法第28条"},{"id":"Claw17","no":17,"sub":"law","topic":"旅行業協会","stem":"旅行業協会の5つの業務に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者及び旅行に関するサービスを提供する者からの苦情の解決","b":"旅行業務又は旅行サービス手配業務の取扱いに従事する者に対する研修","c":"弁済業務保証金の弁済業務","d":"旅行業務及び旅行サービス手配業務に関する取引の公正の確保又は旅行業等の健全な発達を図るための調査、研究及び広報"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて協会の法定業務。ほかに「旅行業者等及び旅行サービス手配業者に対する指導」がある。aの苦情の解決は旅行者だけでなくサービス提供者からの苦情も対象となる点に注意。","why":"協会の5業務は5年で複数回。苦情の解決の対象に「サービス提供者」が含まれる点は見落とされやすい。","ref":"旅行業法第42条"},{"id":"Claw18","no":18,"sub":"law","topic":"旅行業協会","stem":"弁済業務保証金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業協会は、弁済業務保証金を供託所に供託する。","b":"保証社員が弁済業務保証金分担金を納付しないときは、旅行業協会は社員の地位を失わせることができる。","c":"社員の地位を失った者は、7日以内に営業保証金を供託しなければならない。","d":"弁済業務保証金からの還付があったときは、旅行業協会は保証社員に対し還付充当金を納付すべきことを通知する。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。還付があった場合の流れは、協会が供託所に還付充当金を供託 → 保証社員に通知 → 保証社員が納付、という順序になる。","why":"弁済業務の仕組みを一連の流れで問う形は未出。個々の規定は既出だが、体系的な理解を測れる。","ref":"旅行業法第48条〜第51条"},{"id":"Claw19","no":19,"sub":"law","topic":"登録制度","stem":"次の事例において、必要な手続として正しいものはどれか。<br>第1種旅行業者K社が、新たに支店を開設することとした。","opts":{"a":"変更登録を受けなければならない。","b":"変更の日から30日以内に変更の届出をしなければならない。","c":"あらかじめ登録行政庁の認可を受けなければならない。","d":"特段の手続は不要である。"},"ans":["b"],"pt":4,"exp":"営業所の名称・所在地の変更（新設・廃止を含む）は事後の届出（30日以内）で足りる。変更登録が必要なのは登録業務範囲の変更のみ。","why":"変更登録と変更届出の切り分けは毎年出題。営業所の新設を事例にすると判断を誤りやすい。","ref":"旅行業法第6条の4"},{"id":"Claw20","no":20,"sub":"law","topic":"約款・料金・標識","stem":"標準旅行業約款に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"観光庁長官及び消費者庁長官が定めて公示する。","b":"標準旅行業約款と同一の約款を定めた旅行業者は、認可を受けたものとみなされる。","c":"標準旅行業約款を採用せず独自の約款を定めることもできるが、その場合は認可が必要である。","d":"旅行業者代理業者は、所属旅行業者の約款を掲示・備置きする。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。標準旅行業約款は認可手続の負担を軽減するための制度で、採用は任意である点が理解の要点。","why":"みなし認可の制度趣旨まで踏み込む形は未出。約款分野は5年で18問と最多で、深い理解が問われうる。","ref":"旅行業法第12条の3"},{"id":"Claw21","no":21,"sub":"law","topic":"取引条件説明・書面交付","stem":"企画旅行契約の契約書面に記載しなければならない事項に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行の目的地及び出発日その他の日程","b":"旅行者が旅行業者等に支払うべき対価及びその収受の方法","c":"旅行業務取扱管理者の氏名及び旅行者の依頼に応じて説明する旨","d":"契約の申込方法及び契約の成立に関する事項"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。「契約の申込方法及び契約の成立に関する事項」は説明書面（取引条件説明書面）の記載事項であって、契約成立後に交付する契約書面には記載しない。契約書面には「契約締結の年月日」を記載する。","why":"説明書面と契約書面で記載事項が異なる点は難度が高い。5年で12問出題される分野で、細部を問う形が想定される。","ref":"旅行業法施行規則第13条・第14条"},{"id":"Claw22","no":22,"sub":"law","topic":"旅程管理","stem":"企画旅行の円滑な実施のための措置に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行に関する計画に定めるサービスの提供を受けることができるようにするために必要な措置を講じなければならない。","b":"旅行に関する計画に定めるサービスの内容の変更を必要とする事由が生じた場合における代替サービスの手配は、講ずべき措置に含まれる。","c":"旅行地における旅行に関するサービスの提供に係る契約の締結のために必要な手続の実施は、講ずべき措置に含まれる。","d":"本邦内の旅行であれば、いかなる場合も措置を講ずる必要はない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。本邦内の旅行で措置の一部が免除されるのは、①契約締結前に措置を講じない旨を説明し、②サービスの提供を受ける権利を表示した書面を交付した場合に限られる。無条件の免除ではない。","why":"旅程管理は2025年度に2問と増加傾向。免除の3条件（本邦内・事前説明・権利表示書面）をすべて満たす必要がある点が核心。","ref":"旅行業法第12条の10・施行規則第32条"},{"id":"Claw23","no":23,"sub":"law","topic":"禁止行為・監督","stem":"旅行業者等が旅行者に対して行ってはならない行為に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者に対し、旅行地において施行されている法令に違反する行為を行うことをあっせんし、又はその行為を行うことに関し便宜を供与する行為","b":"旅行者に対し、旅行地において施行されている法令に違反するサービスの提供を受けることをあっせんし、又はその提供を受けることに関し便宜を供与する行為","c":"旅行者に対し、旅行者の保護に欠け、又は旅行業の信用を失墜させる行為","d":"営業所に掲示した旅行業務の取扱いの料金を超えて料金を収受する行為"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて禁止行為。とくにdは旅行者の承諾を得た場合であっても超過収受は認められない点が繰り返し問われる。","why":"禁止行為は2024・2025年度に出題が少なく（合計1問）、周期からみて次に出やすい。","ref":"旅行業法第13条"},{"id":"Claw24","no":24,"sub":"law","topic":"旅行業協会","stem":"苦情の解決に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業協会は、社員以外の旅行業者等が取り扱った旅行業務に対する苦情についても相談に応じなければならない。","b":"旅行業協会は、苦情に係る事情を調査するとともに、当該旅行業者等に対しその解決を求めなければならない。","c":"旅行業協会は、苦情の解決について必要があると認めるときは、当該旅行業者等に対し文書若しくは口頭による説明を求め、又は資料の提出を求めることができる。","d":"旅行業協会は、苦情に係る事情及びその解決の結果について、社員以外の旅行業者等にも周知させなければならない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。周知の対象は「社員」に限られる。相談・調査・解決の求め・説明の要求は社員以外も対象となるが、周知だけが社員限定という非対称が核心。","why":"苦情の解決は5年で13問と協会分野の中心。「社員以外も対象か」の切り分けが毎年問われる。","ref":"旅行業法第42条"},{"id":"Claw25","no":25,"sub":"law","topic":"登録制度","stem":"旅行業者代理業に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者代理業の登録には、有効期間の定めがある。","b":"旅行業者代理業者は、所属旅行業者以外の旅行業者のために旅行業務を取り扱ってはならない。","c":"旅行業者代理業者は、営業保証金を供託する必要がない。","d":"所属旅行業者との代理業契約が終了したときは、旅行業者代理業の登録は効力を失う。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。代理業の登録も5年の有効期間があるが、営業保証金の供託義務はない（所属旅行業者が供託する）。所属旅行業者は代理業者の行為について責任を負う。","why":"旅行業者代理業の制度は5年で複数回。営業保証金がない点と、代理業契約の終了で登録が失効する点が要点。","ref":"旅行業法第3条・第14条の3"},{"id":"Cyak01","no":1,"sub":"yak","topic":"総則・定義","stem":"標準旅行業約款の4つの契約類型を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"募集型企画旅行契約と受注型企画旅行契約では、いずれも旅行業者が旅行に関する計画を作成する。","b":"手配旅行契約では、旅行業者は旅程管理義務を負わない。","c":"旅行相談契約では、旅行業者は手配の完成を保証しない。","d":"渡航手続代行契約では、旅行業者は旅券等の取得を保証する。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。渡航手続代行契約において、旅行業者は旅券等を取得できることや出入国が許可されることを保証しない。旅行相談契約と同様、結果の保証はしない。","why":"4つの契約類型を横断比較する形は理解の深さを測れる。総則は5年で19問と約款第3位の頻度。","ref":"標準旅行業約款"},{"id":"Cyak02","no":2,"sub":"yak","topic":"契約の成立・申込","stem":"契約の成立時期を契約類型ごとに比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"募集型企画旅行契約は、旅行業者が契約の締結を承諾し申込金を受理した時に成立する。","b":"旅行相談契約は、旅行業者が契約の締結を承諾した時に成立する（通信手段による申込みの場合）。","c":"渡航手続代行契約は、旅行業者が契約の締結を承諾し所定の書面を交付した時に成立する。","d":"手配旅行契約は、申込金の受理を要せず、承諾のみで成立する。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。手配旅行契約も原則として申込金の受理により成立する。ただし団体・グループの場合は申込金なしで承諾することがある。渡航手続代行契約のみ書面交付が成立要件である点が特徴。","why":"成立時期は5年連続で毎年2〜5問。4類型を横断すると、渡航手続代行だけ書面交付が要件という違いが浮かぶ。","ref":"標準旅行業約款"},{"id":"Cyak03","no":3,"sub":"yak","topic":"契約書面・確定書面","stem":"契約書面の記載事項に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者が旅行業者に支払うべき対価及びその支払期日","b":"旅行業務取扱管理者の氏名","c":"契約締結の年月日","d":"旅行代金に含まれない交通費等の費用があるときはその内容"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて記載事項。契約書面は説明書面と共通する事項が多いが、契約書面には「契約締結の年月日」、説明書面には「契約の申込方法及び契約の成立に関する事項」が固有の記載事項となる。","why":"契約書面は5年で23問と約款最頻出。記載事項の網羅的な把握が問われる。","ref":"募集型 第10条"},{"id":"Cyak04","no":4,"sub":"yak","topic":"契約書面・確定書面","stem":"確定書面に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"契約書面において確定された旅行日程等を記載できない場合に交付する。","b":"確定書面を交付した場合、旅行業者が手配し旅程を管理する義務を負う範囲は確定書面に記載するところに特定される。","c":"確定書面の交付期限は、旅行開始日の前日から起算してさかのぼって7日目に当たる日以降の申込みの場合、旅行開始日当日までとなる。","d":"確定書面を交付しなかった場合、旅行者は取消料を支払うことなく契約を解除できる。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。確定書面の不交付は、旅行者が取消料なしで解除できる5事由のひとつ。","why":"確定書面は2024年度に7問と突出。交付期限と義務の特定、不交付の効果を一体で問う形は難度が高い。","ref":"募集型 第10条・第16条"},{"id":"Cyak05","no":5,"sub":"yak","topic":"契約の変更","stem":"旅行代金の変更ができる場合とできない場合を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"運送機関の適用運賃・料金が著しい経済情勢の変化等により通常想定される程度を大幅に超えて改訂されたときは、変更できる。","b":"宿泊機関の宿泊料金が改訂されたときは、変更できない。","c":"為替相場の変動により旅行代金に変動が生じたときは、募集型企画旅行契約では変更できない。","d":"旅行サービス提供機関の過剰予約受付により契約内容を変更し費用が増加したときは、増額できる。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。過剰予約受付が原因の場合は増額できない。cの為替変動による変更は手配旅行契約にはある規定で、企画旅行にはない点が対比になる。","why":"旅行代金の変更は毎年出題。「運送機関に限る」「オーバーブッキングは増額不可」「為替は手配旅行のみ」の3点が核心。","ref":"募集型 第14条／手配旅行"},{"id":"Cyak06","no":6,"sub":"yak","topic":"旅行者の解除・取消料","stem":"旅行者が取消料を支払うことなく契約を解除できる5つの事由に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"契約内容に重要な変更が行われたとき","b":"旅行代金の額が増額されたとき","c":"天災地変等により旅行の安全かつ円滑な実施が不可能となり、又はそのおそれが極めて大きいとき","d":"旅行業者が契約書面に定める期日までに確定書面を交付しなかったとき"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて該当する。5つ目は「旅行業者の責に帰すべき事由により、契約書面に記載した旅行日程に従った旅行の実施が不可能となったとき」。","why":"取消料なしで解除できる5事由は5年で14問出題される分野の核心。すべて挙げられるかを問う形は難度が高い。","ref":"募集型 第16条"},{"id":"Cyak07","no":7,"sub":"yak","topic":"旅行者の解除・取消料","stem":"取消料の率を国内旅行と海外旅行で比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"国内旅行（宿泊を伴う）は、旅行開始日の前日から起算してさかのぼって20日目に当たる日以降に解除した場合、20%以内の取消料を収受できる。","b":"海外旅行（ピーク時以外）は、旅行開始日の前日から起算してさかのぼって30日目に当たる日以降に解除した場合、20%以内の取消料を収受できる。","c":"国内旅行（宿泊を伴う）は、旅行開始日の前日に解除した場合、40%以内の取消料を収受できる。","d":"海外旅行は、旅行開始日の前々日以降に解除した場合、30%以内の取消料を収受できる。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。海外旅行の前々日以降の解除は50%以内。国内旅行は前日40%・当日50%、海外旅行は前々日以降50%と区分の仕方が異なる。","why":"取消料の表は国内（宿泊付・日帰り）と海外（ピーク時・それ以外）で4種類あり、毎年混同を狙われる。","ref":"募集型 第16条 別表第1"},{"id":"Cyak08","no":8,"sub":"yak","topic":"旅行業者の解除","stem":"旅行業者が契約を解除できる場合に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者が旅行業者があらかじめ明示した性別、年齢、資格、技能その他の参加旅行者の条件を満たしていないことが判明したとき","b":"旅行者が他の旅行者に迷惑を及ぼし、又は団体行動の円滑な実施を妨げるおそれがあると認められるとき","c":"旅行者が旅行代金を約定期日までに支払わないとき","d":"最少催行人員に達しなかったとき"},"ans":["a","b","d"],"pt":4,"exp":"cは誤り。旅行代金を期日までに支払わない場合は「旅行者が契約を解除したもの」として取り扱い、旅行業者が解除するのではない。この場合、取消料相当額の違約料を収受する。","why":"旅行業者の解除は5年で4問。代金不払いの扱い（旅行者による解除とみなす）は見落とされやすい。","ref":"募集型 第16条"},{"id":"Cyak09","no":9,"sub":"yak","topic":"旅程管理・保護措置","stem":"旅程管理業務の4つの内容に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者が旅行サービスを受けることができないおそれがあると認められるときの必要な措置","b":"契約内容の変更を余儀なくされる場合における代替サービスの手配","c":"旅行地における旅行サービスの提供に係る契約の締結に必要な手続の実施","d":"旅行者の生命又は身体に危険が及ぶおそれがあるときの保護措置"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて旅程管理業務または関連する措置に含まれる。dの保護措置は旅程管理とは別条だが、旅行業者が講ずべき措置として位置づけられる。","why":"旅程管理は5年連続で毎年1問。業務の内容を網羅的に問う形は理解の確認になる。","ref":"募集型 第22条・第23条"},{"id":"Cyak10","no":10,"sub":"yak","topic":"責任","stem":"旅行業者の責任と特別補償を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"損害賠償責任は旅行業者に故意又は過失がある場合に生じるが、特別補償は故意・過失を問わず支払われる。","b":"損害賠償の通知期限は手荷物以外が2年、特別補償には通知期限の定めがない。","c":"死亡補償金と損害賠償金は合計せず、補償金は賠償金の限度で賠償金とみなされる。","d":"入院見舞金・通院見舞金と損害賠償金は、その合計額を支払う。"},"ans":["a","c","d"],"pt":4,"exp":"bは誤り。特別補償にも事故発生日から一定期間内の通知が必要とされる。とくに「死亡・後遺障害は合計しない／入院・通院は合計する」という非対称が核心。","why":"責任と特別補償の関係は5年で複数回。両制度の性質の違いを横断的に問う形は難度が高い。","ref":"募集型 第27条／特別補償規程"},{"id":"Cyak11","no":11,"sub":"yak","topic":"特別補償","stem":"特別補償規程における補償金・見舞金の額に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"死亡補償金は、国内旅行1,500万円、海外旅行2,500万円である。","b":"後遺障害補償金は、死亡補償金の額に後遺障害の程度に応じた割合を乗じた額である。","c":"携帯品損害補償金は、旅行者1名につき15万円を限度とする。","d":"携帯品損害補償金は、1個又は1組につき10万円を限度とする。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。携帯品損害補償金には「旅行者1名につき15万円」と「1個・1組につき10万円」という二重の限度がある点が特徴。旅行業者の責任における手荷物の限度額15万円とは別の制度。","why":"携帯品損害補償金の二重の限度は5年で未出。金額の暗記が問われる分野で出題されうる。","ref":"特別補償規程"},{"id":"Cyak12","no":12,"sub":"yak","topic":"特別補償","stem":"特別補償が支払われない場合に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者の故意によって生じた損害","b":"旅行者の自殺行為、犯罪行為又は闘争行為によって生じた損害","c":"国内旅行における地震、噴火又は津波によって生じた損害","d":"海外旅行における地震、噴火又は津波によって生じた損害"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。海外旅行では地震・噴火・津波による損害も補償の対象となる。国内旅行のみ免責とされる点が対比の核心。","why":"国内と海外で免責事由が異なる点は5年で複数回。地震等の扱いが逆になる誤答が定番。","ref":"特別補償規程 第3条"},{"id":"Cyak13","no":13,"sub":"yak","topic":"旅程保証・変更補償金","stem":"変更補償金の支払対象となる「重要な変更」に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"契約書面に記載した旅行開始日又は旅行終了日の変更","b":"契約書面に記載した入場する観光地又は観光施設その他の旅行の目的地の変更","c":"契約書面に記載した運送機関の等級又は設備のより低い料金のものへの変更","d":"契約書面に記載した宿泊機関の種類、名称又は客室の種類の変更"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて別表第2に掲げる重要な変更。ほかに①運送機関の会社名の変更②本邦内と本邦外との間の直行便から乗継便等への変更③ツアー・タイトル中に記載のあった重要な事項の変更 がある。","why":"重要な変更の類型は5年で5問出題される分野の核心。網羅的に問う形は難度が高い。","ref":"募集型 第29条 別表第2"},{"id":"Cyak14","no":14,"sub":"yak","topic":"受注型企画旅行","stem":"受注型企画旅行契約における企画料金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"企画書面に企画料金の金額を明示した場合、契約書面にも明示しなければならない。","b":"旅行者からの申込みがなければ、企画料金を収受することはできない。","c":"企画書面及び契約書面に企画料金を明示した場合、旅行開始前の解除の時期にかかわらず企画料金相当額の取消料を請求できる。","d":"企画料金は、旅行代金には含まれない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。企画料金は旅行代金に含まれる。手配旅行契約の旅行代金には企画料金が含まれない（旅行業務取扱料金は含まれる）点との対比が問われる。","why":"受注型は5年で11問。企画料金の3論点（契約書面への明示・申込前は収受不可・解除時期を問わず請求可）が繰り返し出る。","ref":"受注型 第2条・第14条"},{"id":"Cyak15","no":15,"sub":"yak","topic":"手配旅行契約","stem":"手配旅行契約における旅行代金の精算に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、旅行終了後、旅行代金を精算しなければならない。","b":"精算旅行代金が既に収受した旅行代金を超えるときは、旅行者が差額を支払う。","c":"精算旅行代金が既に収受した旅行代金に満たないときは、旅行業者が差額を払い戻す。","d":"手配旅行契約においては、旅行代金の精算は行わない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。手配旅行契約では旅行終了後に精算を行う。企画旅行契約では旅行代金が確定額であり精算は行わない点が対比。","why":"手配旅行の精算は企画旅行にない特徴。5年で2問と少ないが、企画旅行との対比で出題されうる。","ref":"手配旅行 第11条"},{"id":"Cyak16","no":16,"sub":"yak","topic":"団体・グループ","stem":"団体・グループ契約における契約責任者に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、特約を結んだ場合を除き、契約責任者に対して旅行業務に関する一切の代理権を有しているものとみなす。","b":"契約責任者は、旅行業者が定める日までに構成者の名簿を提出しなければならない。","c":"旅行業者は、契約責任者が構成者に対して負っている債務又は義務については何ら責任を負わない。","d":"契約責任者が同行しない場合、旅行開始後は、あらかじめ契約責任者が選任した構成者を契約責任者とみなす。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。dの契約責任者が同行しない場合の扱いは見落とされやすいが、約款に明記されている。","why":"団体・グループは5年連続で毎年1問。契約責任者の代理権のみなし規定と、同行しない場合の扱いが要点。","ref":"募集型 第24条〜第26条"},{"id":"Cyak17","no":17,"sub":"yak","topic":"渡航手続代行・相談","stem":"渡航手続代行契約に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、渡航手続代行契約の締結を、企画旅行契約又は手配旅行契約を締結した旅行者との間でのみ行う。","b":"旅行業者は、旅券、査証等の取得を保証するものではない。","c":"旅行者の要求により、旅行業者は渡航手続代行料金を収受する。","d":"損害賠償の通知期限は、損害発生の翌日から起算して6か月以内である。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。通知期限が6か月である点は、企画旅行・手配旅行の2年（手荷物以外）と大きく異なる。","why":"渡航手続代行は5年連続で毎年1問。通知期限6か月は必出の数字。","ref":"渡航手続代行契約の部"},{"id":"Cyak18","no":18,"sub":"yak","topic":"契約書面・確定書面","stem":"旅行代金の払戻しの期限に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行開始前の解除による払戻しは、解除の翌日から起算して7日以内に行う。","b":"旅行開始後の解除による払戻しは、契約書面に記載した旅行終了日の翌日から起算して30日以内に行う。","c":"旅行代金の減額による払戻しは、契約書面に記載した旅行終了日の翌日から起算して30日以内に行う。","d":"変更補償金の支払いは、実際の旅行終了日の翌日から起算して30日以内に行う。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。起算点が「契約書面に記載した旅行終了日」（b・c）と「実際の旅行終了日」（d）で異なる点が最大の分岐点。","why":"払戻しの期限は5年で複数回。起算点の違いを4つ並べて問う形は難度が高い。","ref":"募集型 第19条・第29条"},{"id":"Cyak19","no":19,"sub":"yak","topic":"旅程管理・保護措置","stem":"旅行者の義務に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者は、契約を締結するに際しては、旅行業者から提供された情報を活用し、契約の内容について理解するよう努めなければならない。","b":"旅行者は、旅行開始後、契約書面に記載された旅行サービスを円滑に受領するよう努めなければならない。","c":"旅行者は、契約書面と異なる旅行サービスが提供されたと認識したときは、旅行地において速やかに申し出なければならない。","d":"旅行者は、団体で行動するときは、旅行業者の指示に従わなければならない。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。cの「旅行地において」速やかに申し出る義務は、旅行終了後の申出を認めない趣旨で、旅程保証の請求とも関連する。","why":"旅行者の義務は約款の中で軽視されがちだが、4つの努力義務・義務を網羅的に問う形は出題されうる。","ref":"募集型 第21条・第28条"},{"id":"Cyak20","no":20,"sub":"yak","topic":"総則・定義","stem":"通信契約に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"通信契約とは、旅行業者が提携するクレジットカード会社のカード会員との間で、電話等により締結する契約をいう。","b":"通信契約は、旅行業者が承諾する旨の通知を発した時に成立する。","c":"通信契約においては、カード利用日は旅行代金等の支払い又は払戻しをすべき日とする。","d":"旅行者がカード会員規約に従って支払いを行うことができないときは、契約の締結を拒否できる。"},"ans":["a","c","d"],"pt":4,"exp":"bは誤り。通信契約は承諾する旨の通知が旅行者に「到達した時」に成立する。ただし電子承諾通知を発する場合は「到達した時」となり、いずれにせよ発信時ではない。","why":"通信契約の成立時期（到達時）は毎年問われる。発信時とする誤答が定番。","ref":"募集型 第2条・第8条"},{"id":"Cyak21","no":21,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>航空券は記名式であり、他人に譲渡することはできない。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。航空券は記名人以外は使用できず、譲渡もできない。搭乗用片は記載された順序どおりに使用しなければならない。","why":"航空券の譲渡不可は国際・国内の双方で規定される基本論点。5年で複数回出題。","ref":"JAL国際運送約款"},{"id":"Cyak22","no":22,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>受託手荷物の延着による損害については、旅客が手荷物を受け取った日から7日以内に書面で異議を述べなければならない。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。延着は受け取った日から21日以内。7日以内は毀損の場合。紛失・滅失は受け取ることができたであろう日から21日以内。","why":"異議申立ての期限（毀損7日／延着・紛失21日）は5年で複数回。日数の入替えが定番。","ref":"JAL国際運送約款"},{"id":"Cyak23","no":23,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>運送人に対する損害賠償請求訴訟は、到達地への到達の日から2年以内に提起しなければならない。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。出訴期限は到達地への到達の日、到達すべきであった日、または運送の中止の日から起算して2年以内。異議申立ての期限（7日・21日）とは別の制度。","why":"出訴期限2年は2021年度に出題。異議申立て期限との混同を狙う形が定番。","ref":"JAL国際運送約款"},{"id":"Cyak24","no":24,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社は、旅客の入国が拒否された場合、当該旅客を送還するために要した運賃及び費用を旅客に請求することができる。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。入国不許可により送還する場合、旅客が適用運賃・料金・費用を支払う。会社は既に収受した運賃を当該費用に充当することができる。","why":"送還の規定は2021年度に出題。旅券・査証の準備は旅客の責任という原則と結びつく。","ref":"JAL国際運送約款"},{"id":"Cyak25","no":25,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社の責により旅客が予約便に搭乗できず、有効期間内に旅行できない場合、会社は航空券の有効期間を延長する。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。会社の責による場合のほか、旅客の病気等により旅行不能となった場合にも有効期間の延長が認められる（この場合は同伴者の航空券も同様に延長される）。","why":"有効期間の延長は5年で複数回。会社の責による場合と旅客の病気による場合の2類型がある。","ref":"JAL国際運送約款"},{"id":"Cyak26","no":26,"sub":"yak","topic":"JAL国内旅客運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社は、航空機の座席数を超えて受け付けた予約により旅客が搭乗できない場合、所定の補償を行う。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。いわゆるオーバーブッキングにより搭乗できない旅客に対しては、他の便への振替や所定の補償が行われる。","why":"オーバーブッキングの扱いは5年で未出。実務上重要な論点として出題されうる。","ref":"JAL国内旅客運送約款"},{"id":"Cyak27","no":27,"sub":"yak","topic":"JAL国内旅客運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社が予約の変更を認める場合、旅客は当初の航空券の有効期間内であれば、いつでも無条件に変更することができる。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。予約の変更ができるかどうか、また手数料を要するかどうかは適用される運賃の種類（運賃規則）による。無条件ではない。","why":"運賃種別により変更の可否が異なる点は、国際線・国内線に共通する実務の基本。","ref":"JAL国内旅客運送約款"},{"id":"Cyak28","no":28,"sub":"yak","topic":"JAL国内旅客運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社は、天候その他やむを得ない事由により航空機を欠航した場合、旅客の求めに応じ運賃及び料金の全額を払い戻す。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。会社の都合または不可抗力により運送ができなかった場合は、未使用区間の運賃・料金を払い戻すか、他の便への振替を行う。この場合、払戻手数料は収受しない。","why":"欠航時の取扱いは5年で未出。旅程保証（変更補償金）との関係でも重要な論点。","ref":"JAL国内旅客運送約款"},{"id":"Cyak29","no":29,"sub":"yak","topic":"貸切バス約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>バス会社は、契約した運送の申込者が、運送申込書に記載した事項を変更しようとするときは、書面により承諾を求めることを要しない。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。契約責任者が契約内容を変更しようとするときは、緊急の場合およびバス会社が認める場合を除き、あらかじめ書面により承諾を求めなければならない。","why":"★貸切バス約款は5年で3問。出題される年は契約内容の変更か出発時刻30分ルールが問われる。","ref":"貸切バス標準運送約款"},{"id":"Cyak30","no":30,"sub":"yak","topic":"モデル宿泊約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>ホテルは、宿泊契約に定める客室を提供できないときは、宿泊客の了解を得て、できる限り同一の条件による他の宿泊施設をあっ旋する。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。あっ旋ができないときは、違約金相当額の補償料を宿泊客に支払い、その補償料は損害賠償額に充当する。ただしホテルに責がないときは補償料を支払わない。","why":"★モデル宿泊約款は5年で2問。客室を提供できない場合の取扱いは基本論点。","ref":"モデル宿泊約款"},{"id":"Cdom01","no":1,"sub":"dom","topic":"国内観光資源","stem":"2024年に世界文化遺産に登録された「佐渡島の金山」に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"新潟県にある。","b":"相川鶴子金銀山と西三川砂金山から構成される。","c":"宿根木は千石船の里として重要伝統的建造物群保存地区に選定されている。","d":"島の玄関口である両津港には、新潟港からジェットフォイルが就航している。"},"ans":["a","b","c","d"],"pt":2,"exp":"a〜dすべて正しい。佐渡島の金山は2024年7月に世界文化遺産に登録された。小木港は直江津航路でたらい舟の地。","why":"直近の世界遺産登録は翌年度に必ず出題される。2025年度に佐渡が下線部型で出題されており、より詳しく問う形が続く可能性が高い。","ref":"国内観光資源／中部"},{"id":"Cdom02","no":2,"sub":"dom","topic":"国内観光資源","stem":"北陸新幹線の敦賀延伸（2024年3月）に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"加賀温泉駅は、山代・山中・片山津の加賀温泉郷の玄関口である。","b":"芦原温泉駅は、あわら温泉の玄関口である。","c":"越前たけふ駅が新設された。","d":"敦賀駅では、北陸新幹線と在来線特急の乗継ぎが行われる。"},"ans":["a","b","c","d"],"pt":2,"exp":"a〜dすべて正しい。2024年3月の敦賀延伸により金沢〜敦賀間が開業し、小松・加賀温泉・芦原温泉・越前たけふ・敦賀の5駅が新設された。敦賀駅で在来線特急「サンダーバード」「しらさぎ」と接続する。","why":"新幹線の延伸開業は翌年度に必ず出題される。2024年度に加賀温泉駅が出題されており、乗継ぎの実務とあわせて再出題されうる。","ref":"国内観光資源／中部"},{"id":"Cdom03","no":3,"sub":"dom","topic":"国内観光資源","stem":"国内の世界自然遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"屋久島は鹿児島県にある。","b":"白神山地は青森県と秋田県にまたがる。","c":"小笠原諸島は東京都に属する。","d":"「奄美大島、徳之島、沖縄島北部及び西表島」は2021年に登録された。"},"ans":["a","b","c","d"],"pt":2,"exp":"a〜dすべて正しい。国内の世界自然遺産は屋久島・白神山地（1993年）、知床（2005年）、小笠原諸島（2011年）、奄美大島等（2021年）の5件。","why":"2021年登録の奄美大島等は5年で未出。世界自然遺産5件を網羅的に問う形は出題されうる。","ref":"国内観光資源／横断"},{"id":"Cdom04","no":4,"sub":"dom","topic":"国内観光資源","stem":"次の下線部a.〜d.のうち、誤っているものはどれか。<br>北海道には、世界自然遺産に登録された <u>a.知床</u>、タンチョウが生息する <u>b.釧路湿原</u>、アイヌ文化の発信拠点である <u>c.ウポポイ</u>、モール温泉で知られる <u>d.登別温泉</u> がある。","opts":{"a":"知床","b":"釧路湿原","c":"ウポポイ","d":"登別温泉"},"ans":["d"],"pt":2,"exp":"モール温泉（植物性の有機物を含む温泉）で北海道遺産に選定されているのは十勝川温泉。登別温泉は地獄谷と多様な泉質で知られる。ウポポイ（民族共生象徴空間）は白老町にある。","why":"十勝川温泉のモール温泉は2025年度に出題済み。登別温泉との取り違えを狙う形は再出題されやすい。","ref":"国内観光資源／北海道"},{"id":"Cdom05","no":5,"sub":"dom","topic":"国内観光資源","stem":"次の記述に該当する温泉地はどれか。<br>山形県にあり、大正から昭和初期の木造多層建築の旅館が川の両岸に並び、夕暮れにガス灯が灯る景観で知られる。","opts":{"a":"銀山温泉","b":"白布温泉","c":"蔵王温泉","d":"かみのやま温泉"},"ans":["a"],"pt":2,"exp":"銀山温泉（尾花沢市）。白布温泉は米沢の奥座敷、蔵王温泉は樹氷とスキー、かみのやま温泉は上山城で知られる。","why":"山形県の温泉は白布温泉が2025年度に出題済み。銀山温泉は知名度が高く未出で、次に出やすい。","ref":"国内観光資源／東北"},{"id":"Cdom06","no":6,"sub":"dom","topic":"国内観光資源","stem":"関東地方の観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"佐原は千葉県にあり、伊能忠敬の旧宅がある重要伝統的建造物群保存地区である。","b":"川越は埼玉県にあり、蔵造りの町並みと時の鐘で知られる。","c":"秩父夜祭は埼玉県で行われる。","d":"鋸山は茨城県にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。鋸山は千葉県にあり、日本寺の大仏と地獄のぞきで知られる。茨城県の代表的な山は筑波山。","why":"千葉・埼玉は関東の中で出題が少ない。佐原・川越はいずれも重伝建で、未出の切り口。","ref":"国内観光資源／関東"},{"id":"Cdom07","no":7,"sub":"dom","topic":"国内観光資源","stem":"次の組合せのうち、庭園とその所在県がいずれも一致しているものをすべて選びなさい。","opts":{"a":"栗林公園 ─ 香川県","b":"水前寺成趣園 ─ 熊本県","c":"縮景園 ─ 広島県","d":"天赦園 ─ 高知県"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。天赦園は愛媛県宇和島市にある宇和島藩伊達家の庭園。高知県の庭園は五台山竹林寺庭園など。","why":"庭園と県の組合せは2022年度に出題。天赦園は既出だが、県を入れ替える誤答は再出しやすい。","ref":"国内観光資源／組合せ"},{"id":"Cdom08","no":8,"sub":"dom","topic":"国内観光資源","stem":"次の記述に該当する街道・ルートはどれか。<br>富山県の立山駅と長野県の扇沢を結び、ケーブルカー、高原バス、トロリーバス、ロープウェイを乗り継いで移動する。","opts":{"a":"志賀草津道路","b":"立山黒部アルペンルート","c":"ビーナスライン","d":"磐梯吾妻スカイライン"},"ans":["b"],"pt":2,"exp":"立山黒部アルペンルート。立山駅→美女平→弥陀ヶ原→室堂→大観峰→黒部平→黒部湖→黒部ダム→扇沢の順。室堂にみくりが池と雪の大谷がある。","why":"アルペンルートは2023・2025年度に出題。経由地の順序を問う形が定番で、ルート全体を問う形も出やすい。","ref":"国内観光資源／中部"},{"id":"Cdom09","no":9,"sub":"dom","topic":"国内観光資源","stem":"近畿地方の観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"伊根の舟屋は京都府にあり、重要伝統的建造物群保存地区である。","b":"美山かやぶきの里は京都府にある。","c":"竹田城跡は兵庫県にあり「天空の城」と呼ばれる。","d":"瀞峡は滋賀県にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。瀞峡は奈良県・三重県・和歌山県にまたがる渓谷。滋賀県の代表的な景勝地は琵琶湖・竹生島。","why":"京都府北部（伊根・美山）は5年で未出。京都市内に偏りがちな出題の空白を突く形。","ref":"国内観光資源／近畿"},{"id":"Cdom10","no":10,"sub":"dom","topic":"国内観光資源","stem":"中国地方の世界遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"原爆ドームは広島県にある文化遺産である。","b":"厳島神社は広島県にある文化遺産である。","c":"石見銀山遺跡とその文化的景観は島根県にある文化遺産である。","d":"萩城下町は山口県にある単独の世界遺産である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。萩の反射炉・恵美須ヶ鼻造船所跡・大板山たたら製鉄遺跡・萩城下町・松下村塾は「明治日本の産業革命遺産」の構成資産であり、単独の世界遺産ではない。","why":"「明治日本の産業革命遺産」は8県23資産にまたがる。構成資産か単独かを問う形は未出の切り口。","ref":"国内観光資源／中国"},{"id":"Cdom11","no":11,"sub":"dom","topic":"国内観光資源","stem":"四国八十八箇所に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"第1番札所の霊山寺は徳島県にある。","b":"第31番札所の竹林寺は高知県にあり、五台山にある。","c":"第51番札所の石手寺は愛媛県松山市にある。","d":"第75番札所の善通寺は徳島県にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。善通寺は香川県にあり、弘法大師の誕生地とされる。八十八箇所は徳島（発心）→高知（修行）→愛媛（菩提）→香川（涅槃）の順に巡る。","why":"四国霊場は個別には出題実績があるが、番号と県の対応を問う形は未出。四国の出題枠で使える切り口。","ref":"国内観光資源／四国"},{"id":"Cdom12","no":12,"sub":"dom","topic":"国内観光資源","stem":"「明治日本の産業革命遺産」の構成資産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"軍艦島（端島炭坑）は長崎県にある。","b":"八幡製鐵所は福岡県にある。","c":"韮山反射炉は静岡県にある。","d":"富岡製糸場は群馬県にあり、この遺産群の構成資産である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。富岡製糸場は「富岡製糸場と絹産業遺産群」として別に世界文化遺産に登録されており、「明治日本の産業革命遺産」の構成資産ではない。","why":"2つの産業遺産の混同を狙う形は未出。いずれも世界遺産で、近年の出題傾向に合致する。","ref":"国内観光資源／横断"},{"id":"Cdom13","no":13,"sub":"dom","topic":"国内観光資源","stem":"九州の世界遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"「神宿る島」宗像・沖ノ島と関連遺産群は福岡県にある。","b":"長崎と天草地方の潜伏キリシタン関連遺産には、原城跡と﨑津集落が含まれる。","c":"琉球王国のグスク及び関連遺産群は沖縄県にある。","d":"吉野ヶ里遺跡は世界文化遺産に登録されている。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。吉野ヶ里遺跡（佐賀県）は特別史跡・国営歴史公園だが世界遺産ではない。","why":"世界遺産か否かを問う形は難度が高い。吉野ヶ里は知名度が高く、誤って世界遺産と思われやすい。","ref":"国内観光資源／九州"},{"id":"Cdom14","no":14,"sub":"dom","topic":"国内観光資源","stem":"沖縄県の世界遺産「琉球王国のグスク及び関連遺産群」の構成資産に含まれるものをすべて選びなさい。","opts":{"a":"今帰仁城跡","b":"勝連城跡","c":"園比屋武御嶽石門","d":"浦添ようどれ"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。浦添ようどれは構成資産ではない。構成資産は今帰仁城跡・座喜味城跡・勝連城跡・中城城跡・首里城跡・園比屋武御嶽石門・玉陵・識名園・斎場御嶽の9件。","why":"玉陵は2022年度に出題。9件の構成資産を正確に把握しているかを問う形は難度が高い。","ref":"国内観光資源／沖縄"},{"id":"Cdom15","no":15,"sub":"dom","topic":"国内観光資源","stem":"次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"日本三大祭は、祇園祭、天神祭、神田祭である。","b":"日本三大美肌の湯は、斐乃上温泉、喜連川温泉、龍神温泉である。","c":"日本三名橋は、日本橋、錦帯橋、眼鏡橋である。","d":"日本三大がっかり名所には、札幌の時計台が含まれる。"},"ans":["a","b","c","d"],"pt":2,"exp":"a〜dすべて一般に知られる分類。日本三大美肌の湯は島根・栃木・和歌山、日本三名橋は東京・山口・長崎にある。","why":"「三大○○」は毎年どれかが出る。三名橋・三大美肌の湯は未出で、既出の三名園・三景の周辺論点として出題されうる。","ref":"国内観光資源／横断"},{"id":"Cdom16","no":16,"sub":"dom","topic":"国内観光資源","stem":"次の郷土料理とその都道府県の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"いぶりがっこ ─ 秋田県","b":"ばら寿司 ─ 岡山県","c":"治部煮 ─ 石川県","d":"ますのすし ─ 新潟県"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ますのすしは富山県の郷土料理。新潟県はへぎそば・笹団子・のっぺ。いぶりがっこ（秋田）・ばら寿司（岡山）・治部煮（石川）はいずれも代表的な郷土料理。","why":"郷土料理は毎年出題。北陸・中国地方の料理は未出のものが多い。","ref":"国内観光資源／組合せ"},{"id":"Cdom17","no":17,"sub":"dom","topic":"国内観光資源","stem":"日本の国立公園に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"瀬戸内海国立公園は、日本で最初に指定された国立公園のひとつである。","b":"やんばる国立公園は沖縄県にある。","c":"奄美群島国立公園は鹿児島県にある。","d":"伊勢志摩国立公園は和歌山県にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。伊勢志摩国立公園は三重県にある。和歌山県は吉野熊野国立公園。1934年に瀬戸内海・雲仙・霧島の3公園が日本初の国立公園に指定された。","why":"国立公園34か所は5年で正面から問われていない。世界自然遺産を含む公園（知床・小笠原・屋久島・奄美・やんばる・西表石垣）は出やすい。","ref":"国内観光資源／横断"},{"id":"Cdom18","no":18,"sub":"dom","topic":"国内観光資源","stem":"次の空欄に該当するものはどれか。<br>島根県にある　▢　は、庭園日本一と評される日本庭園と横山大観のコレクションで知られ、安来市にある。","opts":{"a":"足立美術館","b":"由志園","c":"松江フォーゲルパーク","d":"出雲文化伝承館"},"ans":["a"],"pt":2,"exp":"足立美術館。由志園は松江市の日本庭園で牡丹の島として知られる。足立美術館は米国の日本庭園専門誌のランキングで連続首位を獲得している。","why":"足立美術館は2025年度に出題済み。島根県内の他の施設を並べる形は再出題されうる。","ref":"国内観光資源／中国"},{"id":"Cdom19","no":19,"sub":"dom","topic":"国内観光資源","stem":"次の組合せのうち、重要伝統的建造物群保存地区とその所在県がいずれも一致しているものをすべて選びなさい。","opts":{"a":"御手洗 ─ 広島県","b":"矢掛 ─ 岡山県","c":"内子 ─ 愛媛県","d":"吹屋 ─ 島根県"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。吹屋（ベンガラの町）は岡山県高梁市にある。御手洗は呉市大崎下島の港町、矢掛は旧山陽道の宿場町、内子は木蝋の町で内子座がある。","why":"重伝建は120地区以上あり、中国・四国には未出のものが多い。個別には出題実績がある地区の県を問う形。","ref":"国内観光資源／横断"},{"id":"Cdom20","no":20,"sub":"dom","topic":"国内観光資源","stem":"日本の城に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"現存十二天守のうち、四国には丸亀城、伊予松山城、宇和島城、高知城の4城がある。","b":"弘前城は青森県にある現存天守である。","c":"松江城は2015年に国宝に指定された。","d":"首里城は現存天守である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。首里城は1945年に焼失し、1992年に復元された（2019年に再び焼失し復元工事中）。世界遺産の構成資産は「首里城跡」であり、地下の遺構が対象。","why":"城は毎年出題。首里城の「跡」が世界遺産という点は、沖縄の出題枠でも問われうる未出の切り口。","ref":"国内観光資源／横断"},{"id":"Cdom21","no":21,"sub":"dom","topic":"宿泊料金","stem":"次の条件でホテルに宿泊する場合、宿泊客が支払うべき料金の総額として正しいものはどれか。<br>大人3人がツインルーム1室（室料24,000円）とシングルルーム1室（室料12,000円）に1泊する（食事なし）。<br>※サービス料は室料の10%。※消費税は10%。※東京都の宿泊税は、1人1泊の宿泊料金が1万円未満は課税されず、1万円以上1万5千円未満は100円、1万5千円以上は200円とする。","opts":{"a":"43,860円","b":"43,560円","c":"43,960円","d":"39,600円"},"ans":["a"],"pt":5,"exp":"① 宿泊税の判定：ツイン24,000÷2人＝1人12,000円 → 100円×2人＝200円。シングル12,000÷1人＝12,000円 → 100円。計300円。② 室料計36,000円＋サービス料3,600円＝39,600円。③ 消費税＝39,600×10%＝3,960円。④ 合計＝36,000＋3,600＋3,960＋300＝43,860円。宿泊税には消費税を課さない。","why":"宿泊料金は毎年1〜2問。複数の客室タイプがある場合、部屋ごとに1人あたりの額を出して宿泊税を判定する必要がある。","ref":"モデル宿泊約款／東京都宿泊税"},{"id":"Cdom22","no":22,"sub":"dom","topic":"貸切バス運賃","stem":"貸切バスの運賃・料金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"運賃及び料金は、旅客の出発地域に適用されているものを基礎として計算する。","b":"特殊車両割増料金は、運賃の5割以内の割増である。","c":"運賃の割引は、身体障害者福祉法等の適用を受ける団体及び学校教育法による学校に通学・通園する者の団体に対して行う。","d":"運賃の割引は、届け出た運賃の下限額を下回る額まで行うことができる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。割引は届け出た運賃の下限額を下回らない額を限度として行う。また大学・高等専門学校は通学割引の対象から除かれる。","why":"貸切バスは2024年度に11問と突出。割引の対象と限度は未出の切り口。","ref":"貸切バス標準運送約款"},{"id":"Cdom23","no":23,"sub":"dom","topic":"フェリー","stem":"次の条件でフェリーを利用する場合の旅客運賃の合計額として正しいものはどれか。<br>貸切バス1台（運転者1人、バスガイド1人）と旅行者20人（すべて大人）が乗船する。<br>※大人の2等旅客運賃は2,500円。※バスの航送運賃は50,000円で、運転者1人分の2等旅客運賃を含む。<br>※団体割引は考慮しない。","opts":{"a":"50,000＋2,500×21＝102,500円","b":"50,000＋2,500×20＝100,000円","c":"50,000＋2,500×22＝105,000円","d":"50,000＋2,500×19＝97,500円"},"ans":["a"],"pt":5,"exp":"航送運賃50,000円に運転者1人分の2等運賃が含まれるため、運転者の旅客運賃は不要。バスガイド1人と旅行者20人の計21人分の旅客運賃が必要。50,000＋2,500×21＝102,500円。","why":"フェリーは毎年出題。「バスガイドは旅客として運賃が必要」は2021年度に出題された論点で、運転者との扱いの違いが分岐点。","ref":"フェリー運送約款"},{"id":"Cdom24","no":24,"sub":"dom","topic":"国内航空","stem":"国内航空の運賃及び料金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"年齢の判定は搭乗日の実年齢による。","b":"日本航空の小児は満3歳以上12歳未満である。","c":"全日空の小児は満2歳以上12歳未満である。","d":"座席を使用しない幼児は、同伴者1人につき2人まで無償である。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。座席を使用しない幼児が無償となるのは同伴者1人につき1人まで。JRは大人1人につき幼児2人まで無賃で、扱いが異なる。","why":"航空の年齢区分は毎年出題。JR（2人）とフェリー・航空（1人）の違いは横断的に問われうる。","ref":"国内旅客運送約款"},{"id":"Cdom25","no":25,"sub":"dom","topic":"国内航空","stem":"次の条件で国内航空券を払いもどす場合の払戻額として正しいものはどれか。<br>券面額30,000円（うち旅客施設使用料440円、旅客保安サービス料1,540円）。取消手数料は税抜運賃の20%が適用される。<br>※税抜運賃＝（券面額−旅客施設使用料−旅客保安サービス料）÷1.1とし、1円未満は切り捨てる。","opts":{"a":"24,906円","b":"22,926円","c":"5,094円","d":"24,000円"},"ans":["a"],"pt":5,"exp":"① 税抜運賃＝(30,000−440−1,540)÷1.1＝28,020÷1.1＝25,472円（1円未満切捨て）。② 取消手数料＝25,472×20%＝5,094円。③ 払戻額＝30,000−5,094＝24,906円。施設使用料・保安サービス料は返金されるため、払戻額からさらに差し引かない（22,926円とするのは誤り）。","why":"★航空の取消手数料は2021・2023年度のみで2年連続出題なし。JAL方式の2段階計算は難度が高い。","ref":"国内旅客運送約款"},{"id":"Cdom26","no":26,"sub":"dom","topic":"JR運賃・料金","stem":"JRの特定都区市内制度に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"中心駅からの営業キロが200.1km以上となる場合に適用される。","b":"札幌、仙台、東京、横浜、名古屋、京都、大阪、神戸、広島、北九州、福岡の11市に設定されている。","c":"運賃は中心駅を起点として計算する。","d":"券面表示の都区市内各駅で下車しても、前途は無効とならない。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。券面表示の都区市内各駅で下車すると前途は無効となる。この制度により、実際の乗車キロより運賃計算上のキロが短くなることも長くなることもある。","why":"★特定都区市内は5年で未出。JR普通運賃が2025年度に出題されていないこととあわせ、次に出やすい論点。","ref":"JR旅客営業規則"},{"id":"Cdom27","no":27,"sub":"dom","topic":"JR運賃・料金","stem":"JRの大都市近郊区間内相互発着の場合の取扱いに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"実際の乗車経路にかかわらず、最短の経路によって運賃を計算する。","b":"営業キロが101km以上であっても、有効期間は当日限りである。","c":"区間内では途中下車することができない。","d":"新幹線を利用する区間も大都市近郊区間に含まれる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。東海道（東京〜熱海）、山陽（新大阪〜西明石ほか）、東北（東京〜那須塩原ほか）、上越（東京〜高崎ほか）の各新幹線は大都市近郊区間に含まれない。新幹線を含み101km以上なら通常の有効期間となり途中下車もできる。","why":"大都市近郊区間は5年で未出。特定都区市内とあわせて出題されうるJR運賃の基本論点。","ref":"JR旅客営業規則"},{"id":"Cdom28","no":28,"sub":"dom","topic":"JR運賃・料金","stem":"次の行程で大人1人が乗車する場合の特急料金に関する記述のうち、正しいものはどれか。<br>［行程］東京 —(東海道・山陽新幹線「のぞみ」普通車指定席)— 新大阪 —(山陽・九州新幹線「みずほ」普通車指定席)— 鹿児島中央<br>※博多駅で改札を出ずに乗り継ぐ。","opts":{"a":"東京〜鹿児島中央間の通しの特急料金を適用する。","b":"博多駅で区分し、山陽新幹線区間と九州新幹線区間の特急料金を合算する。","c":"新大阪駅で区分し、それぞれの特急料金を合算する。","d":"乗継割引が適用され、九州新幹線区間の特急料金が半額となる。"},"ans":["b"],"pt":5,"exp":"山陽新幹線と九州新幹線は博多駅で区分して合算する（通し料金にならない5つの例外のひとつ）。このとき九州新幹線側は特定特急料金を用い、シーズン加減は山陽新幹線側にのみ適用する。乗継割引は新幹線と在来線特急の間の制度で、新幹線どうしには適用されない。","why":"新幹線内乗継の例外（東京・大宮・高崎・山陽＋九州・東北＋北海道）は5年で未出。九州新幹線の直通運転は実務上重要。","ref":"JR旅客営業規則"},{"id":"Cdom29","no":29,"sub":"dom","topic":"JR運賃・料金","stem":"JRのグランクラスに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"グランクラス（A）はアテンダントによる軽食・ドリンクのサービスがある。","b":"グランクラス（B）は座席のみの提供である。","c":"北陸新幹線がJR東日本とJR西日本にまたがる場合、グランクラス料金（A）は上越妙高駅で区分し、それぞれから1,500円引きした額を合算する。","d":"グランクラスを利用する場合、ジパング倶楽部の割引が適用される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。グランクラス利用時の特急料金・グランクラス料金はジパング倶楽部の割引対象外。（B）の場合の引き額は1,050円。","why":"グランクラスは2025年度に出題。ジパング倶楽部の対象外という論点との組合せは未出の切り口。","ref":"JR旅客営業規則／特別企画乗車券"},{"id":"Cdom30","no":30,"sub":"dom","topic":"JR運賃・料金","stem":"JRの団体旅客運賃に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"普通団体は8人以上で構成される。","b":"31人以上50人以下の団体では、1人が無賃扱いとなる。","c":"51人以上100人以下の団体では、2人が無賃扱いとなる。","d":"団体旅客運賃には、料金の割引も含まれる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。団体割引は運賃のみが対象で、料金（特急料金等）には割引がない。無賃扱い人員は31〜50人で1人、51〜100人で2人、101〜150人で3人。","why":"団体運賃は5年で未出。無賃扱い人員の区分と「料金は割引されない」点が要点。","ref":"JR旅客営業規則"},{"id":"Cdom31","no":31,"sub":"dom","topic":"JR運賃・料金","stem":"JRの寝台料金及び個室に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"小児の寝台料金は大人と同額である。","b":"2人用個室寝台を利用する場合、特急料金は実際の乗車人員にかかわらず大人2人分が必要である。","c":"個室の払いもどし手数料は、1個室を1券片として計算する。","d":"小児のグリーン料金は大人の半額である。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。小児のグリーン料金は大人と同額。半額になるのは運賃・急行料金（特急料金）・座席指定料金で、グリーン料金と寝台料金は設備の対価として大人と同額。","why":"小児の料金は毎年どこかで問われる。「半額になるもの／ならないもの」の区別が核心。","ref":"JR旅客営業規則"},{"id":"Cdom32","no":32,"sub":"dom","topic":"JR運賃・料金","stem":"次の時刻表の記号に関する記述のうち、正しいものをすべて選びなさい。","opts":{"a":"「レ」はその駅を通過することを表す。","b":"「‖」はその駅を通らない（他線区経由）ことを表す。","c":"「＝」はその駅止まりであることを表す。","d":"マークのない列車には、グリーン車自由席が連結されている。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。マークのない列車は全車両が普通車自由席。グリーン車・指定席・グランクラスはそれぞれ専用のマークで表示される。","why":"JR時刻表の読み取りは5年連続で毎年1問と完全に固定。記号の意味を正面から問う形は出やすい。","ref":"JR時刻表の記号"},{"id":"Covs01","no":1,"sub":"ovs","topic":"国際航空運賃","stem":"［資料］に基づき、東京（TYO）→シンガポール（SIN）→ドバイ（DXB）→ロンドン（LON）と旅行する場合の、往路のマイレージ超過による割増率として正しいものはどれか。","opts":{"a":"1.15","b":"1.20","c":"1.25","d":"いずれの割増率も適用されず、lowest combination となる"},"ans":["d"],"pt":5,"exp":"TPM＝3,300＋3,637＋3,414＝10,351。TYO－LONのMPMは7,146。10,351÷7,146＝1.449となり1.25を超えるため、割増率による計算はできず、運賃計算区間を分割して安い運賃の組合せを探す lowest combination となる。","why":"国際航空運賃は毎年8問。経由地が増えてMPMを大きく超える場合の扱い（lowest combination）は、割増率の表の最下段に記載されており、資料を最後まで読む力が問われる。","ref":"マイレージシステム","fig":"<svg viewBox=\"0 0 700 268\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"11\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<text x=\"14\" y=\"18\" font-weight=\"700\" font-size=\"12\">［資料1］区間マイル（TPM）</text>\n<rect x=\"14\" y=\"26\" width=\"320\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"24\" y=\"41\" font-weight=\"700\">区間</text><text x=\"250\" y=\"41\" font-weight=\"700\">TPM</text>\n<rect x=\"14\" y=\"48\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"63\">TYO － SIN</text><text x=\"250\" y=\"63\">3,300</text>\n<rect x=\"14\" y=\"68\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"83\">SIN － DXB</text><text x=\"250\" y=\"83\">3,637</text>\n<rect x=\"14\" y=\"88\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"103\">DXB － LON</text><text x=\"250\" y=\"103\">3,414</text>\n<rect x=\"14\" y=\"108\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"123\">TYO － BKK</text><text x=\"250\" y=\"123\">2,865</text>\n<rect x=\"14\" y=\"128\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"143\">BKK － LON</text><text x=\"250\" y=\"143\">5,928</text>\n<text x=\"354\" y=\"18\" font-weight=\"700\" font-size=\"12\">［資料2］最大許容マイル（MPM）</text>\n<rect x=\"354\" y=\"26\" width=\"332\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"364\" y=\"41\" font-weight=\"700\">区間</text><text x=\"600\" y=\"41\" font-weight=\"700\">MPM</text>\n<rect x=\"354\" y=\"48\" width=\"332\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"63\">TYO － LON</text><text x=\"600\" y=\"63\">7,146</text>\n<rect x=\"354\" y=\"68\" width=\"332\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"83\">TYO － DXB</text><text x=\"600\" y=\"83\">6,014</text>\n<text x=\"354\" y=\"112\" font-weight=\"700\" font-size=\"12\">［資料3］割増率</text>\n<rect x=\"354\" y=\"120\" width=\"166\" height=\"20\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"135\">TPM÷MPM</text>\n<rect x=\"520\" y=\"120\" width=\"166\" height=\"20\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"135\">乗じる率</text>\n<rect x=\"354\" y=\"140\" width=\"166\" height=\"18\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"154\">1.00以下</text>\n<rect x=\"520\" y=\"140\" width=\"166\" height=\"18\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"154\">1.00</text>\n<rect x=\"354\" y=\"158\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"172\">1.05まで</text>\n<rect x=\"520\" y=\"158\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"172\">1.05</text>\n<rect x=\"354\" y=\"176\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"190\">1.10まで</text>\n<rect x=\"520\" y=\"176\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"190\">1.10</text>\n<rect x=\"354\" y=\"194\" width=\"166\" height=\"18\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"208\">1.15まで</text>\n<rect x=\"520\" y=\"194\" width=\"166\" height=\"18\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"208\">1.15</text>\n<rect x=\"354\" y=\"212\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"226\">1.20まで</text>\n<rect x=\"520\" y=\"212\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"226\">1.20</text>\n<rect x=\"354\" y=\"230\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"244\">1.25まで</text>\n<rect x=\"520\" y=\"230\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"244\">1.25</text>\n<rect x=\"14\" y=\"160\" width=\"320\" height=\"88\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"26\" y=\"180\" font-weight=\"700\">運賃額（往復・円）</text>\n<text x=\"26\" y=\"200\">TYO － LON　Flex Y　　840,000</text>\n<text x=\"26\" y=\"220\">TYO － LON　Standard　280,000</text>\n<text x=\"26\" y=\"240\" font-size=\"10.5\">サーチャージ 往路20,000／復路15,000</text>\n</g></svg>","figcap":"資料（マイレージ表・割増率表・運賃額）"},{"id":"Covs02","no":2,"sub":"ovs","topic":"国際航空運賃","stem":"［資料］に基づき、東京（TYO）→バンコク（BKK）→ロンドン（LON）と旅行する場合の、往路のマイレージ超過による割増率として正しいものはどれか。","opts":{"a":"1.10","b":"1.15","c":"1.20","d":"1.25"},"ans":["d"],"pt":5,"exp":"TPM＝2,865＋5,928＝8,793。TYO－LONのMPMは7,146。8,793÷7,146＝1.230。1.20を超え1.25までの区分に該当するため1.25を乗じる。区分は「〜まで」で読み、該当する区分の上限値を用いる。","why":"割増率の区分の読み方が分岐点。1.230を「1.20」と切り捨てる誤答が定番で、区分の境界の理解を問える。","ref":"マイレージシステム","fig":"<svg viewBox=\"0 0 700 268\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"11\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<text x=\"14\" y=\"18\" font-weight=\"700\" font-size=\"12\">［資料1］区間マイル（TPM）</text>\n<rect x=\"14\" y=\"26\" width=\"320\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"24\" y=\"41\" font-weight=\"700\">区間</text><text x=\"250\" y=\"41\" font-weight=\"700\">TPM</text>\n<rect x=\"14\" y=\"48\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"63\">TYO － SIN</text><text x=\"250\" y=\"63\">3,300</text>\n<rect x=\"14\" y=\"68\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"83\">SIN － DXB</text><text x=\"250\" y=\"83\">3,637</text>\n<rect x=\"14\" y=\"88\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"103\">DXB － LON</text><text x=\"250\" y=\"103\">3,414</text>\n<rect x=\"14\" y=\"108\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"123\">TYO － BKK</text><text x=\"250\" y=\"123\">2,865</text>\n<rect x=\"14\" y=\"128\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"143\">BKK － LON</text><text x=\"250\" y=\"143\">5,928</text>\n<text x=\"354\" y=\"18\" font-weight=\"700\" font-size=\"12\">［資料2］最大許容マイル（MPM）</text>\n<rect x=\"354\" y=\"26\" width=\"332\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"364\" y=\"41\" font-weight=\"700\">区間</text><text x=\"600\" y=\"41\" font-weight=\"700\">MPM</text>\n<rect x=\"354\" y=\"48\" width=\"332\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"63\">TYO － LON</text><text x=\"600\" y=\"63\">7,146</text>\n<rect x=\"354\" y=\"68\" width=\"332\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"83\">TYO － DXB</text><text x=\"600\" y=\"83\">6,014</text>\n<text x=\"354\" y=\"112\" font-weight=\"700\" font-size=\"12\">［資料3］割増率</text>\n<rect x=\"354\" y=\"120\" width=\"166\" height=\"20\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"135\">TPM÷MPM</text>\n<rect x=\"520\" y=\"120\" width=\"166\" height=\"20\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"135\">乗じる率</text>\n<rect x=\"354\" y=\"140\" width=\"166\" height=\"18\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"154\">1.00以下</text>\n<rect x=\"520\" y=\"140\" width=\"166\" height=\"18\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"154\">1.00</text>\n<rect x=\"354\" y=\"158\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"172\">1.05まで</text>\n<rect x=\"520\" y=\"158\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"172\">1.05</text>\n<rect x=\"354\" y=\"176\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"190\">1.10まで</text>\n<rect x=\"520\" y=\"176\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"190\">1.10</text>\n<rect x=\"354\" y=\"194\" width=\"166\" height=\"18\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"208\">1.15まで</text>\n<rect x=\"520\" y=\"194\" width=\"166\" height=\"18\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"208\">1.15</text>\n<rect x=\"354\" y=\"212\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"226\">1.20まで</text>\n<rect x=\"520\" y=\"212\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"226\">1.20</text>\n<rect x=\"354\" y=\"230\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"244\">1.25まで</text>\n<rect x=\"520\" y=\"230\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"244\">1.25</text>\n<rect x=\"14\" y=\"160\" width=\"320\" height=\"88\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"26\" y=\"180\" font-weight=\"700\">運賃額（往復・円）</text>\n<text x=\"26\" y=\"200\">TYO － LON　Flex Y　　840,000</text>\n<text x=\"26\" y=\"220\">TYO － LON　Standard　280,000</text>\n<text x=\"26\" y=\"240\" font-size=\"10.5\">サーチャージ 往路20,000／復路15,000</text>\n</g></svg>","figcap":"資料（マイレージ表・割増率表・運賃額）"},{"id":"Covs03","no":3,"sub":"ovs","topic":"国際航空運賃","stem":"国際航空券の運賃の種類に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"普通運賃（ノーマル運賃）は、有効期間が1年で予約変更や払戻しの制限が少ない。","b":"PEX運賃は、航空会社が個人旅行者向けに設定する正規割引運賃である。","c":"IT運賃は、旅行業者がパッケージツアーを造成するために用いる包括旅行運賃である。","d":"普通運賃は、PEX運賃より一般に安価である。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。普通運賃は制限が少ない分、一般にPEX運賃やIT運賃より高額。運賃の種類と制限の強さは反比例の関係にある。","why":"運賃の種類は5年で未出だが、資料編の運賃規則表を読む前提知識として重要。制度の枠組みを問う形が出うる。","ref":"国際航空運賃／運賃の種類"},{"id":"Covs04","no":4,"sub":"ovs","topic":"国際航空運賃","stem":"国際航空運賃における運賃計算の基本に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"運賃計算はNUC（運賃計算単位）で行い、最後にROE（換算レート）で現地通貨に換算する。","b":"往復旅程では、往路と復路それぞれについてマイレージの検証を行う。","c":"途中降機地がある場合は、HIP CHECKにより高い運賃が採用されることがある。","d":"マイレージ超過の割増は、区間ごとに個別に適用する。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。マイレージ超過の割増は運賃計算区間（始点から終点まで）の全体について適用する。区間ごとではない。","why":"運賃計算の手順を体系的に問う形。個々の要素は既出だが、全体像を問う形は未出。","ref":"国際航空運賃"},{"id":"Covs05","no":5,"sub":"ovs","topic":"国際航空運賃","stem":"eチケットに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"運賃計算情報欄には、都市コード、航空会社コード、NUC額が順に記載される。","b":"X/は24時間以内の乗継地を表す。","c":"Qは特定便追加運賃等の追加運賃を表す。","d":"ENDは運賃計算の終了を表し、その後にROEが記載される。"},"ans":["a","b","c","d"],"pt":5,"exp":"a〜dすべて正しい。運賃計算情報欄の読み方は、記号の意味と記載順序の両方を押さえる必要がある。","why":"◎eチケットは2021〜2024年度に毎年出題されたが2025年度は出題なし。前年に出ていないため次年度の出題確率が高い。","ref":"国際航空運賃／eチケット"},{"id":"Covs06","no":6,"sub":"ovs","topic":"国際航空運賃","stem":"国際航空券の払戻しに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"払戻しは、旅客用片又は旅客控及びすべての未使用搭乗用片が提出された場合に限り行う。","b":"払戻しを受けられるのは、原則として航空券の記名人である。","c":"旅行開始後の払戻しでは、使用済み区間の運賃相当額を差し引く。","d":"払戻しの可否及び手数料は、適用される運賃の規則による。"},"ans":["a","b","c","d"],"pt":5,"exp":"a〜dすべて正しい。払戻しの可否は運賃種別により異なるため、まず規則表を確認する必要がある。","why":"払戻しの手続は5年で複数回。約款（JAL国際運送約款）と運賃規則の双方にまたがる論点。","ref":"JAL国際運送約款／運賃規則"},{"id":"Covs07","no":7,"sub":"ovs","topic":"国際航空運賃","stem":"適用運賃・規則の時点に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"運賃・規則は、航空券の第一区間の旅行開始日に適用される、発券日に有効なものを使用する。","b":"発券日から旅行開始日までに運賃改定があっても、発券日に有効な運賃が適用される。","c":"運送約款は、運送の開始日に有効なものが適用される。","d":"運賃と約款は、いずれも発券日に有効なものが適用される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。運賃は「発券日に有効なもの」、約款は「運送開始日に有効なもの」で時点が異なる。この非対称が繰り返し問われる。","why":"「運賃＝発券日／約款＝運送開始日」の対比は2022・2024・2025年度に出題。もっとも狙われる時点の区別。","ref":"国際航空運賃／JAL国際運送約款"},{"id":"Covs08","no":8,"sub":"ovs","topic":"国際航空運賃","stem":"［資料］に基づき、東京〜ロンドン間を往復する場合、Flex Y運賃とStandard運賃の差額として正しいものはどれか。<br>※いずれも折り返し地点はLONとし、マイレージ超過はないものとする。","opts":{"a":"560,000円","b":"840,000円","c":"280,000円","d":"595,000円"},"ans":["a"],"pt":5,"exp":"840,000−280,000＝560,000円。サーチャージは運賃種別にかかわらず同額のため差額には影響しない。運賃額表から該当する行と列を正確に読み取る。","why":"資料の読み取りは毎年出題。運賃額の比較を問う形は計算が単純だが、行と列の取り違えを狙える。","ref":"国際航空運賃","fig":"<svg viewBox=\"0 0 700 268\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"11\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<text x=\"14\" y=\"18\" font-weight=\"700\" font-size=\"12\">［資料1］区間マイル（TPM）</text>\n<rect x=\"14\" y=\"26\" width=\"320\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"24\" y=\"41\" font-weight=\"700\">区間</text><text x=\"250\" y=\"41\" font-weight=\"700\">TPM</text>\n<rect x=\"14\" y=\"48\" width=\"320\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"63\">TYO － SIN</text><text x=\"250\" y=\"63\">3,300</text>\n<rect x=\"14\" y=\"68\" width=\"320\" height=\
