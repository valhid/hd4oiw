/text>\n<rect x=\"14\" y=\"206\" width=\"150\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"220\">TYO － LON</text>\n<rect x=\"164\" y=\"206\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"174\" y=\"220\">840,000</text>\n<rect x=\"284\" y=\"206\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"294\" y=\"220\">420,000</text>\n<rect x=\"404\" y=\"206\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"414\" y=\"220\">280,000</text>\n<rect x=\"14\" y=\"226\" width=\"150\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"240\">TYO － PAR</text>\n<rect x=\"164\" y=\"226\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"174\" y=\"240\">860,000</text>\n<rect x=\"284\" y=\"226\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"294\" y=\"240\">440,000</text>\n<rect x=\"404\" y=\"226\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"414\" y=\"240\">300,000</text>\n\n<text x=\"14\" y=\"270\" font-weight=\"700\" font-size=\"12\">［資料3］TPM／MPM</text>\n<rect x=\"14\" y=\"278\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"292\">TYO － LON　5,955</text>\n<rect x=\"174\" y=\"278\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"184\" y=\"292\">LON － PAR　215</text>\n<rect x=\"334\" y=\"278\" width=\"176\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"344\" y=\"292\">MPM TYO－PAR　7,432</text>\n<rect x=\"510\" y=\"278\" width=\"176\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"520\" y=\"292\">MPM TYO－LON　7,146</text>\n<rect x=\"14\" y=\"300\" width=\"672\" height=\"26\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"24\" y=\"318\" font-size=\"11\">サーチャージ：往路 18,000円／復路 13,000円　発券手数料：1件 10,000円</text>\n</g></svg>","figcap":"資料（運賃規則表・運賃額表・マイレージ表）"},{"id":"Bovs02","no":2,"sub":"ovs","topic":"国際航空運賃","stem":"［資料］に基づき、往路にSemi Flex M運賃、復路にStandard L運賃を適用して東京〜パリ間を往復する場合の合計額として正しいものはどれか。<br>※サーチャージ及び発券手数料（各片道1件とする）を加算する。","opts":{"a":"440,000×1/2＋300,000×1/2＋18,000＋13,000＋10,000×2＝421,000円","b":"440,000＋300,000＋18,000＋13,000＝771,000円","c":"440,000×1/2＋300,000×1/2＋18,000＋13,000＝401,000円","d":"740,000＋31,000＋20,000＝791,000円"},"ans":["a"],"pt":5,"exp":"往復で異なる運賃種別を組み合わせるときは、それぞれの往復運賃額の1/2を片道分として合算する。440,000÷2＝220,000、300,000÷2＝150,000で計370,000円。これにサーチャージ往路18,000・復路13,000と発券手数料10,000×2件を加えて421,000円。","why":"異なる運賃種別の組合せは5年で複数回。「往復運賃額の1/2ずつ」という処理が分岐点で、そのまま合算する誤答が定番。","ref":"国際航空運賃／運賃の組合せ","fig":"<svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"11\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<text x=\"14\" y=\"18\" font-weight=\"700\" font-size=\"12\">［資料1］運賃規則表（東京発 ヨーロッパ行）</text>\n<rect x=\"14\" y=\"26\" width=\"130\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"41\" font-weight=\"700\">項目</text>\n<rect x=\"144\" y=\"26\" width=\"180\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"154\" y=\"41\" font-weight=\"700\">Flex Y</text>\n<rect x=\"324\" y=\"26\" width=\"180\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"334\" y=\"41\" font-weight=\"700\">Semi Flex M</text>\n<rect x=\"504\" y=\"26\" width=\"182\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"514\" y=\"41\" font-weight=\"700\">Standard L</text>\n<rect x=\"14\" y=\"48\" width=\"130\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"62\">必要旅行日数</text>\n<rect x=\"144\" y=\"48\" width=\"180\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"154\" y=\"62\">制限なし</text>\n<rect x=\"324\" y=\"48\" width=\"180\" height=\"20\" fill=\"var(--surface)\" stroke=\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"294\" y=\"240\">440,000</text>\n<rect x=\"404\" y=\"226\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"414\" y=\"240\">300,000</text>\n\n<text x=\"14\" y=\"270\" font-weight=\"700\" font-size=\"12\">［資料3］TPM／MPM</text>\n<rect x=\"14\" y=\"278\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"292\">TYO － LON　5,955</text>\n<rect x=\"174\" y=\"278\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"184\" y=\"292\">LON － PAR　215</text>\n<rect x=\"334\" y=\"278\" width=\"176\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"344\" y=\"292\">MPM TYO－PAR　7,432</text>\n<rect x=\"510\" y=\"278\" width=\"176\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"520\" y=\"292\">MPM TYO－LON　7,146</text>\n<rect x=\"14\" y=\"300\" width=\"672\" height=\"26\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"24\" y=\"318\" font-size=\"11\">サーチャージ：往路 18,000円／復路 13,000円　発券手数料：1件 10,000円</text>\n</g></svg>","figcap":"資料（運賃規則表・運賃額表・マイレージ表）"},{"id":"Bovs05","no":5,"sub":"ovs","topic":"国際航空運賃","stem":"次の旅程について、eチケットの運賃計算情報欄の表示として正しいものはどれか。<br>［旅程］東京（TYO）→ 乗継24時間以内 → ロンドン（LON）→ 途中降機 → パリ（PAR）→ 東京（TYO）","opts":{"a":"TYO X/LON PAR ... の順で、LONの前にX/を付す。","b":"TYO S/LON PAR ... の順で、LONの前にS/を付す。","c":"乗継地であってもX/は付さない。","d":"途中降機地の前にX/を付す。"},"ans":["a"],"pt":5,"exp":"24時間以内の乗継地には都市コードの前にX/を付す。途中降機地には付さず、途中降機料金が生じる場合はSで表示する。記載は都市コード→航空会社コード→NUC額→Q・S→END→ROEの順。","why":"◎eチケットの運賃計算欄は2021〜2024年度に毎年出題されたが2025年度は出題なし。X/とSの使い分けが核心。","ref":"国際航空運賃／eチケット"},{"id":"Bovs06","no":6,"sub":"ovs","topic":"国際航空運賃","stem":"マイレージ超過による割増に関する次の事例において、適用される割増率として正しいものはどれか。<br>運賃計算区間のMPMが7,000マイル、実際の経路のTPMが7,800マイルである。","opts":{"a":"1.05","b":"1.10","c":"1.15","d":"1.20"},"ans":["c"],"pt":5,"exp":"7,800÷7,000＝1.114…。1.10を超え1.15までの区分に該当するため1.15（15%の割増）を乗じる。割増率は該当する区分の上限値を用いる点が重要。","why":"TPM÷MPMの計算結果から区分を選ぶ形は毎年の中心。1.114を「1.10」と切り捨てる誤答が定番。","ref":"国際航空運賃／マイレージシステム"},{"id":"Bovs07","no":7,"sub":"ovs","topic":"国際航空運賃","stem":"国際航空運賃に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"NUCとは運賃計算単位のことで、各区間のNUC額を合計して運賃を構成する。","b":"ROEとは換算レートのことで、NUC額を現地通貨に換算する際に用いる。","c":"Qサーチャージとは、特定の便を利用する場合に加算される追加運賃である。","d":"途中降機料金は、乗継ぎ（24時間以内の滞在）の場合にも加算される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。途中降機料金が生じるのは24時間を超える滞在（途中降機）の場合。乗継ぎには加算されない。","why":"運賃計算の用語（NUC・ROE・Q・S）は毎年どこかで問われる。定義を正面から問う形は難度が高くない。","ref":"国際航空運賃／用語"},{"id":"Bovs08","no":8,"sub":"ovs","topic":"国際航空運賃","stem":"［資料］に基づき、Flex Y運賃で発券した航空券を旅行開始前に取り消す場合の取扱いに関する次の記述のうち、正しいものはどれか。","opts":{"a":"予約変更が無料であるため、取消しも無料である。","b":"Flex Y運賃の途中降機は往復各2回まで無料である。","c":"Flex Y運賃の必要旅行日数は3日以上である。","d":"Flex Y運賃の最長旅行期間は3か月である。"},"ans":["b"],"pt":5,"exp":"aは予約変更の可否と取消しの可否は別の規定であり、資料からは取消しが無料とは読み取れない。cの必要旅行日数は制限なし、dの最長旅行期間は1年。","why":"規則表の各項目を横断して読む力を問う形。予約変更と取消しを混同させる誤答は実務でも起きやすい。","ref":"国際航空運賃／規則の適用","fig":"<svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"11\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<text x=\"14\" y=\"18\" font-weight=\"700\" font-size=\"12\">［資料1］運賃規則表（東京発 ヨーロッパ行）</text>\n<rect x=\"14\" y=\"26\" width=\"130\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"41\" font-weight=\"700\">項目</text>\n<rect x=\"144\" y=\"26\" width=\"180\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"154\" y=\"41\" font-weight=\"700\">Flex Y</text>\n<rect x=\"324\" y=\"26\" width=\"180\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"334\" y=\"41\" font-weight=\"700\">Semi Flex M</text>\n<rect x=\"504\" y=\"26\" width=\"182\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"514\" y=\"41\" font-weight=\"700\">Standard L</text>\n<rect x=\"14\" y=\"48\" width=\"130\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"62\">必要旅行日数</text>\n<rect x=\"144 14\" y=\"226\" width=\"150\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"240\">TYO － PAR</text>\n<rect x=\"164\" y=\"226\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"174\" y=\"240\">860,000</text>\n<rect x=\"284\" y=\"226\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"294\" y=\"240\">440,000</text>\n<rect x=\"404\" y=\"226\" width=\"120\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"414\" y=\"240\">300,000</text>\n\n<text x=\"14\" y=\"270\" font-weight=\"700\" font-size=\"12\">［資料3］TPM／MPM</text>\n<rect x=\"14\" y=\"278\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"292\">TYO － LON　5,955</text>\n<rect x=\"174\" y=\"278\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"184\" y=\"292\">LON － PAR　215</text>\n<rect x=\"334\" y=\"278\" width=\"176\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"344\" y=\"292\">MPM TYO－PAR　7,432</text>\n<rect x=\"510\" y=\"278\" width=\"176\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"520\" y=\"292\">MPM TYO－LON　7,146</text>\n<rect x=\"14\" y=\"300\" width=\"672\" height=\"26\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"24\" y=\"318\" font-size=\"11\">サーチャージ：往路 18,000円／復路 13,000円　発券手数料：1件 10,000円</text>\n</g></svg>","figcap":"資料（運賃規則表・運賃額表・マイレージ表）"},{"id":"Bovs09","no":9,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"次の事例において、旅券の取扱いとして正しいものはどれか。<br>旅行者Iは、有効期間が2年3か月残っている旅券の査証欄の余白が見開き2ページとなった。","opts":{"a":"残存有効期間にかかわらず、新規発給を申請することができる。","b":"残存有効期間が1年未満となるまで新規発給を申請できない。","c":"査証欄の増補を2回まで受けることができる。","d":"旅券を返納しなければならない。"},"ans":["a"],"pt":5,"exp":"査証欄の余白が見開き3ページ以下となったときは、残存有効期間にかかわらず新規発給を申請できる。なお査証欄の増補制度は2023年3月をもって廃止された。","why":"旅券の発給は毎年3〜4問。「残存有効期間にかかわらず申請できる場合」（記載事項変更・査証欄不足・著しい損傷）の3類型が核心。","ref":"旅券法第3条"},{"id":"Bovs10","no":10,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"次の事例において、旅券の発給申請に必要な書類として正しいものはどれか。<br>夫婦（同一戸籍）が同時に、同じ都道府県において一般旅券の発給を申請する。","opts":{"a":"戸籍謄本は、いずれか1人が1通提出すれば足りる。","b":"戸籍謄本は、各自1通ずつ提出しなければならない。","c":"写真は、いずれか1人が1葉提出すれば足りる。","d":"申請書は、いずれか1人が1通提出すれば足りる。"},"ans":["a"],"pt":5,"exp":"同一戸籍内にある2人以上が同時に申請する場合、いずれか1人が戸籍謄本を提出すれば他の者は省略できる。申請する都道府県が同一であればよく、住民票が同じである必要はない。写真と申請書は各自必要。","why":"戸籍謄本の省略は2021・2025年度に出題。「都道府県が同一であればよい」という条件が問われる。","ref":"旅券法施行規則"},{"id":"Bovs11","no":11,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"次の事例において、税関に申告すべき金額として正しいものはどれか。<br>海外から帰国した旅行者が、海外市価でネクタイ3本（1本8,000円）、腕時計1個（180,000円）、バッグ1個（60,000円）を購入して持ち帰った。","opts":{"a":"264,000円","b":"240,000円","c":"180,000円","d":"60,000円"},"ans":["b"],"pt":5,"exp":"1品目の海外市価の合計額が1万円以下のものは免税枠の計算から除外される。ネクタイは1本8,000円なので除外。腕時計180,000＋バッグ60,000＝240,000円が申告価格となり、免税枠20万円を超える。","why":"免税範囲は5年連続で毎年2問。「1品目1万円以下は除外」を落として264,000円とする誤答が定番。","ref":"関税法／携帯品の免税範囲","fig":"<svg viewBox=\"0 0 700 170\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"4\" y=\"6\" width=\"200\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"24\" font-weight=\"700\">品目</text>\n<rect x=\"204\" y=\"6\" width=\"200\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"218\" y=\"24\" font-weight=\"700\">海外市価</text>\n<rect x=\"404\" y=\"6\" width=\"292\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"418\" y=\"24\" font-weight=\"700\">免税枠の計算</text>\n<rect x=\"4\" y=\"32\" width=\"200\" height=\"30\" fill=\"var(--kinSoft)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"52\">ネクタイ 3本</text>\n<rect x=\"204\" y=\"32\" width=\"200\" height=\"30\" fill=\"var(--kinSoft)\" stroke=\"var(--rule)\"/><text x=\"218\" y=\"52\">1本 8,000円（計24,000円）</text>\n<rect x=\"404\" y=\"32\" width=\"292\" height=\"30\" fill=\"var(--kinSoft)\" stroke=\"var(--rule)\"/>\n<text x=\"418\" y=\"52\" font-weight=\"700\">1品目1万円以下 → 除外</text>\n<rect x=\"4\" y=\"62\" width=\"200\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"80\">腕時計 1個</text>\n<rect x=\"204\" y=\"62\" width=\"200\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"218\" y=\"80\">180,000円</text>\n<rect x=\"404\" y=\"62\" width=\"292\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"418\" y=\"80\">算入</text>\n<rect x=\"4\" y=\"88\" width=\"200\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"106\">バッグ 1個</text>\n<rect x=\"204\" y=\"88\" width=\"200\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"218\" y=\"106\">60,000円</text>\n<rect x=\"404\" y=\"88\" width=\"292\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"418\" y=\"106\">算入</text>\n<rect x=\"4\" y=\"124\" width=\"692\" height=\"42\" rx=\"2\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"18\" y=\"144\" font-weight=\"700\" fill=\"var(--koke)\">申告価格 ＝ 180,000 ＋ 60,000 ＝ 240,000円</text>\n<text x=\"18\" y=\"160\" font-size=\"11.5\">ネクタイを加えて264,000円とするのは誤り。免税枠20万円を超えた部分が課税対象となる。</text>\n</g></svg>","figcap":"申告価格の算定"},{"id":"Bovs12","no":12,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"次の事例において、免税の適用に関する記述として正しいものはどれか。<br>19歳の旅行者が、海外でワイン2本（1本760ml）と紙巻たばこ100本を購入して持ち帰った。","opts":{"a":"ワインもたばこも免税とならない。","b":"ワインは3本まで免税なので免税となる。","c":"たばこは200本まで免税なので免税となる。","d":"ワインのみ免税となる。"},"ans":["a"],"pt":5,"exp":"20歳未満の者には酒類・たばこの免税が適用されない。19歳であるため、数量が免税範囲内であっても課税される。年齢制限が数量制限に優先する。","why":"未成年者の免税不適用は2021・2022・2024年度に出題。数量だけを見て判断させる誤答が定番。","ref":"関税法"},{"id":"Bovs13","no":13,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"次の物品のうち、日本への持込みに際して検疫等の手続を要しないものをすべて選びなさい。","opts":{"a":"フランスで購入したバター","b":"台湾で購入した乾燥マンゴー","c":"ハワイで購入したビーフジャーキー","d":"韓国で購入した白菜キムチ"},"ans":["a","b","d"],"pt":5,"exp":"cは誤り。米国（ハワイを含む）産の牛肉加工品は輸入禁止。aのバターは乳製品で動物検疫の対象外、bの乾果とdの塩漬け加工品は植物検疫の対象外。","why":"検疫は5年連続で毎年1問。乳製品・乾果・塩漬けが対象外、肉製品が禁止という線引きが毎回問われる。","ref":"家畜伝染病予防法／植物防疫法"},{"id":"Bovs14","no":14,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"日本を出国する際の手続に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"外国製品の持出し届は、現品を提示して税関の確認を受ける。","b":"外国製品の持出し届を紛失した場合、再発行を受けることができる。","c":"合計重量が1kgを超える金の地金を持ち出す場合、申告書を提出しなければならない。","d":"重要文化財を輸出する場合、文化庁長官の許可が必要である。"},"ans":["a","c","d"],"pt":5,"exp":"bは誤り。外国製品の持出し届は紛失しても再発行されない。この届出をしていないと、帰国時に海外で購入した品物と区別できず課税される場合がある。","why":"出国時の手続は毎年出題。持出し届の再発行不可は見落とされやすい論点。","ref":"関税法"},{"id":"Bovs15","no":15,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"次の事例において、外国人Jの出国時の取扱いとして正しいものはどれか。<br>在留資格「技術・人文知識・国際業務」で在留期間3年の中長期在留者Jが、在留カードを所持して1年間の海外出張のため出国する。在留期間の満了日は出国から2年後である。","opts":{"a":"みなし再入国許可により、出国の日から1年間は再入国できる。","b":"みなし再入国許可の有効期間は在留期間の満了日までとなる。","c":"再入国許可を受けなければ再入国できない。","d":"みなし再入国許可の有効期間を在外公館で延長できる。"},"ans":["a"],"pt":5,"exp":"みなし再入国許可の有効期間は出国の日から1年（在留期間の満了が先に到来する場合はその日まで）。本事例では満了日が2年後なので1年が上限。dの在外公館での延長制度はみなし再入国許可にはない。","why":"再入国許可は5年連続で毎年1問。事例に当てはめると「1年」と「在留期間の満了日」のどちらが先かの判断を要する。","ref":"入管法第26条の2"},{"id":"Bovs16","no":16,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"日本に入国する際の手続の順序として正しいものはどれか。","opts":{"a":"検疫 → 入国審査 → 税関","b":"入国審査 → 検疫 → 税関","c":"検疫 → 税関 → 入国審査","d":"税関 → 検疫 → 入国審査"},"ans":["a"],"pt":5,"exp":"入国（帰国）時はQ（検疫）→ I（入国審査）→ C（税関）の順。出国時はQ→C→Iで、税関と審査の順が逆になる。動植物検疫は入国審査の後、税関の前に行う。","why":"CIQの順序は毎年出題。出国と入国で順序が逆になる点が核心。","ref":"出入国手続"},{"id":"Bovs17","no":17,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Tour Cancellation Policy】 Cancellations must be notified in writing. If we receive your cancellation more than 60 days before departure, we will refund your payment less an administration fee of £50 per person. Between 60 and 31 days, 30% of the total cost is payable. Between 30 and 15 days, 60% is payable. Fourteen days or less before departure, no refund will be given.","opts":{"a":"取消しは書面で通知しなければならない。","b":"出発の61日前に取り消した場合、1人50ポンドの事務手数料を差し引いて返金される。","c":"出発の20日前に取り消した場合、総額の60%を支払う。","d":"出発の14日前に取り消した場合、総額の30%が返金される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。Fourteen days or less（14日以下）は no refund＝返金なし。区間の境界（more than 60 / between 60 and 31 / between 30 and 15 / 14 or less）を正確に読む。","why":"取消料の英文は5年で複数回。日数の区間と「以上・以下・超」の読み分けが毎回の分岐点。","ref":"旅行英語／約款"},{"id":"Bovs18","no":18,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Baggage Allowance】 Each passenger travelling in Economy Class may check in one piece of baggage not exceeding 23 kg. Additional pieces will be charged at £65 each. Hand baggage must not exceed 56 x 45 x 25 cm including handles and wheels, and one small personal item may also be carried. Items exceeding 32 kg cannot be accepted as checked baggage under any circumstances.","opts":{"a":"エコノミークラスの受託手荷物は1個23kgまでである。","b":"追加の受託手荷物は1個につき65ポンドが課される。","c":"機内持込手荷物のサイズには取っ手と車輪を含む。","d":"32kgを超える手荷物も追加料金を支払えば受託される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。under any circumstances（いかなる場合も）32kgを超える手荷物は受託されない。including handles and wheels（取っ手と車輪を含む）の読み取りも頻出。","why":"手荷物の英文は5年で未出だが、約款の日本語では毎年出題される。英文で問う形は次に出やすい。","ref":"旅行英語／内容一致"},{"id":"Bovs19","no":19,"sub":"ovs","topic":"旅行英語","stem":"次の英文の空欄に入る語句として最も適切なものはどれか。<br>The hotel reserves the right to cancel your booking ▢ payment is not received by the due date.","opts":{"a":"in the event that","b":"in spite of","c":"as a result of","d":"with a view to"},"ans":["a"],"pt":5,"exp":"in the event that 〜 で「〜の場合には」。節を導く条件表現。in spite of・as a result of・with a view to はいずれも名詞句を伴う前置詞句で、節を導けない。","why":"条件節の定型は約款英文の頻出。2025年度に Whether A or B が出題された。","ref":"旅行英語／文法"},{"id":"Bovs20","no":20,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Rail Pass Conditions】 The pass must be validated at a ticket office before your first journey. Once validated, the pass cannot be exchanged or refunded. Seat reservations are compulsory on high-speed and night trains and incur an additional fee. Children under 4 travel free of charge but are not guaranteed a seat.","opts":{"a":"最初の乗車前に窓口で有効化する必要がある。","b":"有効化した後は交換も払戻しもできない。","c":"高速列車と夜行列車では座席指定が必須で、追加料金がかかる。","d":"4歳未満の子供は無料で、座席も保証される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。4歳未満は無料だが but are not guaranteed a seat＝座席は保証されない。無料と座席保証を区別する。","why":"鉄道パスの英文は5年で未出。ユーレイルパス等の実務知識と英文読解を組み合わせた形として出題されうる。","ref":"旅行英語／内容一致"},{"id":"Bovs21","no":21,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Travel Insurance】 Cover is only valid if the policy is purchased before departure from your home country. Pre-existing medical conditions must be declared at the time of purchase; failure to do so may invalidate your claim. The policy provides cover for trip cancellation up to £5,000 and medical expenses up to £10 million.","opts":{"a":"保険は自国出発前に購入しなければ有効とならない。","b":"既往症は購入時に申告しなければならず、怠ると請求が無効となることがある。","c":"旅行取消しの補償は最大5,000ポンドである。","d":"医療費の補償は最大500万ポンドである。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。医療費の補償は up to £10 million＝最大1,000万ポンド。数値を半分にする誤答が定番。","why":"保険の英文は5年で未出。海外旅行の実務として出題される可能性がある分野。","ref":"旅行英語／内容一致"},{"id":"Bovs22","no":22,"sub":"ovs","topic":"旅行英語","stem":"次の英文の下線部の語と最も近い意味で用いられているものはどれか。<br>All rates are <u>subject to</u> change without prior notice.","opts":{"a":"The plan is subject to approval by the committee.","b":"He is a British subject.","c":"The subject of the lecture was climate change.","d":"They subjected the metal to high pressure."},"ans":["a"],"pt":5,"exp":"下線部の subject to は「〜の対象となる・〜次第で変わりうる」の意味。aの「委員会の承認を要する」が同じ用法。bは名詞「国民」、cは名詞「主題」、dは動詞「さらす」。","why":"多義語の用法は2021年度に due で出題。subject to は約款英文の最頻出表現で、次に出やすい。","ref":"旅行英語／多義語"},{"id":"Bovs23","no":23,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Airport Transfer】 Our meet-and-greet service operates 24 hours a day. Your driver will wait for up to 60 minutes after your scheduled arrival time at no extra cost. If your flight is delayed, please inform us as soon as possible. A surcharge of €25 applies for pick-ups between 23:00 and 06:00.","opts":{"a":"送迎サービスは24時間運行している。","b":"運転手は到着予定時刻から最大60分まで無料で待機する。","c":"23時から6時までの送迎には25ユーロの追加料金がかかる。","d":"フライトが遅延した場合、追加料金は一切かからない。"},"ans":["a","b","c"],"pt":5,"exp":"dは本文に記載がない。60分を超える待機については無料と述べられておらず、遅延時に追加料金がかからないとは読み取れない。","why":"送迎サービスの英文は未出。本文に記載のない事項を選ばせる誤答は内容一致の定番。","ref":"旅行英語／内容一致"},{"id":"Bovs24","no":24,"sub":"ovs","topic":"旅行英語","stem":"次の英文の空欄に入る語として最も適切なものはどれか。<br>Passengers are advised to ▢ their travel documents carefully before departure.","opts":{"a":"verify","b":"notify","c":"testify","d":"certify"},"ans":["a"],"pt":5,"exp":"verify＝確認する。notifyは「通知する」、testifyは「証言する」、certifyは「証明する」。旅行書類を「確認する」文脈にはverifyが適切。","why":"語彙の空欄補充は毎年1〜2問。似た語尾の語を並べる形が定番。","ref":"旅行英語／語彙"},{"id":"Bovs25","no":25,"sub":"ovs","topic":"海外観光資源","stem":"次の記述に該当する都市はどれか。<br>チェコ第2の都市に次ぐ規模をもつ南ボヘミアの小都市で、ヴルタヴァ川が蛇行する地形に旧市街が広がり、城とともに世界遺産に登録されている。","opts":{"a":"カルロヴィ・ヴァリ","b":"チェスキー・クルムロフ","c":"クトナー・ホラ","d":"ブルノ"},"ans":["b"],"pt":2,"exp":"チェスキー・クルムロフ。カルロヴィ・ヴァリは温泉保養地、クトナー・ホラは骨の教会、ブルノはチェコ第2の都市。","why":"中東欧は5年でほぼ未出。チェコはプラハのみ既出で、地方都市は次に出やすい。","ref":"海外観光資源／中東欧"},{"id":"Bovs26","no":26,"sub":"ovs","topic":"海外観光資源","stem":"バルト三国の首都に関する次の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"エストニア ─ タリン","b":"ラトビア ─ リガ","c":"リトアニア ─ ヴィリニュス","d":"ラトビア ─ ヴィリニュス"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ヴィリニュスはリトアニアの首都。バルト三国は北からエストニア（タリン）・ラトビア（リガ）・リトアニア（ヴィリニュス）の順。","why":"バルト三国は5年で完全に未出。3か国の並びと首都の対応は出題しやすい。","ref":"海外観光資源／北欧・バルト"},{"id":"Bovs27","no":27,"sub":"ovs","topic":"海外観光資源","stem":"アイスランドの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ブルーラグーンは地熱を利用した温泉施設である。","b":"ゲイシールは間欠泉で、英語のgeyserの語源となった。","c":"シンクヴェトリル国立公園は世界文化遺産に登録されている。","d":"首都はオスロである。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。アイスランドの首都はレイキャビク。オスロはノルウェーの首都。","why":"アイスランドは5年で完全に未出。火山・地熱・オーロラという特徴から出題しやすい国。","ref":"海外観光資源／北欧"},{"id":"Bovs28","no":28,"sub":"ovs","topic":"海外観光資源","stem":"ロシアの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"エルミタージュ美術館はサンクトペテルブルクにある。","b":"聖ワシリイ大聖堂は赤の広場に面している。","c":"バイカル湖は世界で最も深い湖である。","d":"ネヴァ川はモスクワを流れる。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ネヴァ川はサンクトペテルブルクを流れる。モスクワを流れるのはモスクワ川。","why":"ロシアは5年で未出。エルミタージュ美術館は収蔵作品の問題で出題される可能性がある。","ref":"海外観光資源／ロシア"},{"id":"Bovs29","no":29,"sub":"ovs","topic":"海外観光資源","stem":"次の記述に該当する国はどれか。<br>ブレッド湖の湖上に教会が浮かび、ポストイナ鍾乳洞がある。首都はリュブリャナ。","opts":{"a":"クロアチア","b":"スロベニア","c":"スロバキア","d":"モンテネグロ"},"ans":["b"],"pt":2,"exp":"スロベニア。クロアチアの首都はザグレブ、スロバキアはブラチスラバ、モンテネグロはポドゴリツァ。スロベニアとスロバキアの混同に注意。","why":"旧ユーゴ諸国はクロアチアのみ既出。スロベニアは未出で、スロバキアとの名称の混同を狙える。","ref":"海外観光資源／南東欧"},{"id":"Bovs30","no":30,"sub":"ovs","topic":"海外観光資源","stem":"ペルーの観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"マチュピチュは「空中都市」と呼ばれる世界複合遺産である。","b":"クスコはインカ帝国の首都であった。","c":"ナスカの地上絵は世界文化遺産に登録されている。","d":"チチカカ湖はペルーとブラジルの国境にある。"},"ans":["d"],"pt":2,"exp":"チチカカ湖はペルーとボリビアの国境にある。標高約3,800mで、葦の浮島ウロス島で知られる。","why":"ペルーは2024年度にクスコが出題。チチカカ湖の国境（ボリビア）は未出の切り口。","ref":"海外観光資源／南米"},{"id":"Bovs31","no":31,"sub":"ovs","topic":"海外観光資源","stem":"中米・カリブの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ティカルはグアテマラにあるマヤ文明の遺跡で、世界複合遺産である。","b":"アンティグアはグアテマラの古都で世界文化遺産である。","c":"ハバナ旧市街はキューバにあり世界文化遺産である。","d":"パナマ運河は大西洋と太平洋を結ぶ。"},"ans":["a","b","c","d"],"pt":2,"exp":"a〜dすべて正しい。中米・カリブは5年で完全に未出の地域。","why":"中米・カリブは完全な空白地帯。ティカル（複合遺産）とハバナは世界的知名度が高く出題しやすい。","ref":"海外観光資源／中米"},{"id":"Bovs32","no":32,"sub":"ovs","topic":"海外観光資源","stem":"アメリカの都市と観光資源の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"シアトル ─ パイク・プレイス・マーケット","b":"ボストン ─ フリーダム・トレイル","c":"ニューオリンズ ─ フレンチ・クオーター","d":"アトランタ ─ ロデオドライブ"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ロデオドライブはロサンゼルスのビバリーヒルズにある高級商店街。アトランタは「風と共に去りぬ」の舞台。","why":"アメリカの都市は2023・2024年度に出題。都市と施設の組合せは誤答を作りやすい定番形式。","ref":"海外観光資源／北米"},{"id":"Bovs33","no":33,"sub":"ovs","topic":"海外観光資源","stem":"中国の古都に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"西安には兵馬俑坑がある。","b":"洛陽には龍門石窟がある。","c":"南京には明の孝陵がある。","d":"杭州には拙政園がある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。拙政園は蘇州の庭園。杭州は西湖と六和塔で知られる。","why":"中国は毎年出題。蘇州と杭州の混同（拙政園・西湖）は2023年度に類題が出た定番。","ref":"海外観光資源／中国"},{"id":"Bovs34","no":34,"sub":"ovs","topic":"海外観光資源","stem":"韓国の世界遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"昌徳宮は李氏朝鮮の離宮で、後苑（秘苑）がある。","b":"石窟庵と仏国寺は慶州にある。","c":"宗廟は歴代王の位牌を祀る廟である。","d":"安東河回村は釜山にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。安東河回村は慶尚北道安東市にある伝統集落で、釜山ではない。","why":"韓国は毎年出題。ソウル・釜山・慶州の位置関係は取り違えを狙いやすい
