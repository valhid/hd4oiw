 x=\"354\" y=\"158\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"172\">1.05まで</text>\n<rect x=\"520\" y=\"158\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"172\">1.05</text>\n<rect x=\"354\" y=\"176\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"190\">1.10まで</text>\n<rect x=\"520\" y=\"176\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"190\">1.10</text>\n<rect x=\"354\" y=\"194\" width=\"166\" height=\"18\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"208\">1.15まで</text>\n<rect x=\"520\" y=\"194\" width=\"166\" height=\"18\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"208\">1.15</text>\n<rect x=\"354\" y=\"212\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"226\">1.20まで</text>\n<rect x=\"520\" y=\"212\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"226\">1.20</text>\n<rect x=\"354\" y=\"230\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"364\" y=\"244\">1.25まで</text>\n<rect x=\"520\" y=\"230\" width=\"166\" height=\"18\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"530\" y=\"244\">1.25</text>\n<rect x=\"14\" y=\"160\" width=\"320\" height=\"88\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"26\" y=\"180\" font-weight=\"700\">運賃額（往復・円）</text>\n<text x=\"26\" y=\"200\">TYO － LON　Flex Y　　840,000</text>\n<text x=\"26\" y=\"220\">TYO － LON　Standard　280,000</text>\n<text x=\"26\" y=\"240\" font-size=\"10.5\">サーチャージ 往路20,000／復路15,000</text>\n</g></svg>","figcap":"資料（マイレージ表・割増率表・運賃額）"},{"id":"Covs09","no":9,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"一般旅券の種類及び有効期間に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"10年用旅券は申請時18歳以上の者に発給される。","b":"5年用旅券は申請時18歳未満の者に発給されるほか、18歳以上でも希望すれば発給される。","c":"記載事項変更旅券の有効期間は、従前の旅券の残存有効期間と同一である。","d":"旅券の記載事項には、本籍の市区町村名が含まれる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。旅券に記載されるのは本籍の「都道府県名」であり、市区町村名までは記載されない。","why":"旅券の記載事項は5年で未出の細部。本籍の記載範囲は実務的にも重要で、出題されうる。","ref":"旅券法第5条"},{"id":"Covs10","no":10,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"旅券の申請手続に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"申請書に貼付する写真は、申請日前6か月以内に撮影されたものでなければならない。","b":"戸籍謄本は、申請日前6か月以内に発行されたものでなければならない。","c":"居所申請においては、代理申請が認められない。","d":"15歳未満の者の申請は、法定代理人が行う。"},"ans":["a","b","c","d"],"pt":5,"exp":"a〜dすべて正しい。写真は4.5cm×3.5cm、正面・無帽・無背景。15〜17歳は本人による申請が可能だが親権者同意書を求められる。","why":"申請手続の細部（写真・戸籍謄本の有効期間、居所申請、未成年者）を網羅的に問う形は難度が高い。","ref":"旅券法施行規則"},{"id":"Covs11","no":11,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"日本人が国外で旅券を紛失した場合の手続に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"遅滞なく領事官に紛失一般旅券等届出書を提出する。","b":"新たな旅券の発給を申請するほか、帰国のための渡航書の発給を申請することができる。","c":"渡航書は、原則として日本への帰国のために発給される。","d":"紛失の届出をすれば、従前の旅券は届出の時に失効する。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。紛失の届出をしただけでは失効せず、新たな旅券の発給または渡航書の発給を受けたときに従前の旅券が失効する。","why":"紛失時の手続は5年で複数回。失効の時点は繰り返し狙われる論点。","ref":"旅券法第18条・第19条の3"},{"id":"Covs12","no":12,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"外国人の日本への入国に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"上陸のためには、有効な旅券を所持し、査証を要する場合は査証を受けている必要がある。","b":"上陸拒否事由に該当する者は上陸を許可されない。","c":"中長期在留者には在留カードが交付される。","d":"短期滞在の在留資格で在留する者にも在留カードが交付される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。在留カードが交付されるのは中長期在留者であり、「3月以下の在留期間が決定された者」「短期滞在」「外交・公用」の在留資格の者などは対象外。","why":"在留カードの交付対象は5年で未出。再入国許可（みなし再入国は中長期在留者が対象）と関連する論点。","ref":"入管法第6条・第19条の3"},{"id":"Covs13","no":13,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"次の事例において、課税される品目として正しいものはどれか。<br>成人の旅行者が海外から次の品目を持ち帰った。<br>・ウイスキー 3本（1本760ml）　・紙巻たばこ 200本　・香水 3オンス　・バッグ 1個（150,000円）","opts":{"a":"香水のみ","b":"ウイスキーのみ","c":"たばこのみ","d":"バッグのみ"},"ans":["a"],"pt":5,"exp":"酒類は3本まで、紙巻たばこは200本まで、その他の品目は20万円まで免税。香水は2オンスまでのため、3オンスのうち1オンス分が課税対象となる。バッグ150,000円は20万円以内。","why":"免税範囲は毎年2問。複数品目を並べて超過するものを選ばせる形は、4つの基準をすべて把握しているかを問える。","ref":"関税法／携帯品の免税範囲","fig":"<svg viewBox=\"0 0 700 176\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"4\" y=\"6\" width=\"180\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"24\" font-weight=\"700\">品目</text>\n<rect x=\"184\" y=\"6\" width=\"200\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"198\" y=\"24\" font-weight=\"700\">持込み</text>\n<rect x=\"384\" y=\"6\" width=\"150\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"398\" y=\"24\" font-weight=\"700\">免税範囲</text>\n<rect x=\"534\" y=\"6\" width=\"162\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"548\" y=\"24\" font-weight=\"700\">判定</text>\n<rect x=\"4\" y=\"32\" width=\"180\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"50\">ウイスキー</text>\n<rect x=\"184\" y=\"32\" width=\"200\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"198\" y=\"50\">3本</text>\n<rect x=\"384\" y=\"32\" width=\"150\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"398\" y=\"50\">3本</text>\n<rect x=\"534\" y=\"32\" width=\"162\" height=\"26\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"548\" y=\"50\" fill=\"var(--koke)\">範囲内</text>\n<rect x=\"4\" y=\"58\" width=\"180\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"76\">紙巻たばこ</text>\n<rect x=\"184\" y=\"58\" width=\"200\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"198\" y=\"76\">200本</text>\n<rect x=\"384\" y=\"58\" width=\"150\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"398\" y=\"76\">200本</text>\n<rect x=\"534\" y=\"58\" width=\"162\" height=\"26\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"548\" y=\"76\" fill=\"var(--koke)\">範囲内</text>\n<rect x=\"4\" y=\"84\" width=\"180\" height=\"26\" fill=\"var(--shuSoft)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"102\" font-weight=\"700\">香水</text>\n<rect x=\"184\" y=\"84\" width=\"200\" height=\"26\" fill=\"var(--shuSoft)\" stroke=\"var(--rule)\"/><text x=\"198\" y=\"102\" font-weight=\"700\">3オンス</text>\n<rect x=\"384\" y=\"84\" width=\"150\" height=\"26\" fill=\"var(--shuSoft)\" stroke=\"var(--rule)\"/><text x=\"398\" y=\"102\" font-weight=\"700\">2オンス</text>\n<rect x=\"534\" y=\"84\" width=\"162\" height=\"26\" fill=\"var(--shuSoft)\" stroke=\"var(--rule)\"/><text x=\"548\" y=\"102\" fill=\"var(--shu)\" font-weight=\"700\">1オンス超過</text>\n<rect x=\"4\" y=\"110\" width=\"180\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"128\">バッグ</text>\n<rect x=\"184\" y=\"110\" width=\"200\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"198\" y=\"128\">150,000円</text>\n<rect x=\"384\" y=\"110\" width=\"150\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"398\" y=\"128\">20万円</text>\n<rect x=\"534\" y=\"110\" width=\"162\" height=\"26\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"548\" y=\"128\" fill=\"var(--koke)\">範囲内</text>\n<rect x=\"4\" y=\"144\" width=\"692\" height=\"28\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"18\" y=\"163\" font-size=\"11.5\">免税範囲は品目ごとに独立して判定する。酒3本・たばこ200本・香水2オンス・その他20万円。</text>\n</g></svg>","figcap":"品目ごとの免税範囲の判定"},{"id":"Covs14","no":14,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"ワシントン条約に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"象牙製品は規制の対象である。","b":"ワニ革のハンドバッグは規制の対象である。","c":"キャビアは規制の対象である。","d":"規制対象品は、輸出国の許可書があれば日本に持ち込むことができる場合がある。"},"ans":["a","b","c","d"],"pt":5,"exp":"a〜dすべて正しい。ワシントン条約の対象は原則として携帯品として扱われず、輸出許可書や経済産業省の輸入承認証がなければ持ち込めない。ほかにトラ・ヒョウの毛皮、ウミガメのはく製、サンゴ製品、ヘビ皮の楽器（胡弓・二胡）など。","why":"ワシントン条約は2021年度に出題。対象品目を網羅的に問う形は、検疫とあわせて出題されうる。","ref":"ワシントン条約"},{"id":"Covs15","no":15,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"日本への持込みが禁止されている物品に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"知的財産権を侵害する物品（ブランドのコピー商品）","b":"覚せい剤、大麻、あへんなどの麻薬類","c":"銃砲、これらの銃砲弾及びけん銃部品","d":"公安又は風俗を害すべき書籍、図画等"},"ans":["a","b","c","d"],"pt":5,"exp":"a〜dすべて関税法上の輸入禁制品。ほかに通貨・有価証券の偽造品、児童ポルノ、爆発物・火薬類、化学兵器の原材料、病原体などがある。","why":"輸入禁制品は5年で未出。免税範囲とあわせて税関の論点として出題されうる。","ref":"関税法第69条の11"},{"id":"Covs16","no":16,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"出国時と入国時の手続を比較した次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"出国時は検疫、税関、出国審査の順である。","b":"入国時は検疫、入国審査、税関の順である。","c":"出国時の税関手続は、外国製品の持出しや100万円超の現金持出しなど該当する場合にのみ行う。","d":"入国時の動植物検疫は、入国審査の前に行う。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。動植物検疫は入国審査の後、税関の前に行う。入国時の順序は 検疫（人）→ 入国審査 → 動植物検疫 → 税関。","why":"CIQの順序は毎年出題。動植物検疫の位置づけまで問う形は未出の切り口。","ref":"出入国手続"},{"id":"Covs17","no":17,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Visa Information】 Citizens of Japan may enter for tourism purposes without a visa for stays of up to 90 days within any 180-day period. Your passport must be valid for at least three months beyond your intended date of departure. Proof of onward or return travel may be requested at the border. Employment of any kind is strictly prohibited under this arrangement.","opts":{"a":"日本国民は観光目的であれば180日間のうち90日まで査証なしで滞在できる。","b":"旅券は出国予定日から3か月以上の残存有効期間が必要である。","c":"国境で出国用または帰国用の航空券の提示を求められることがある。","d":"この取決めのもとでも、短期間であれば就労が認められる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。Employment of any kind is strictly prohibited＝いかなる就労も厳格に禁止されている。","why":"査証の英文は5年で未出。出入国法令と英語を結びつけた形として出題されうる。","ref":"旅行英語／出入国"},{"id":"Covs18","no":18,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Group Booking Terms】 A minimum of 10 paying passengers is required for group rates. One complimentary place is granted for every 20 full-paying passengers. Names must be submitted no later than 45 days before departure. A non-refundable deposit of 25% is required to confirm the booking.","opts":{"a":"団体料金の適用には有料10名以上が必要である。","b":"有料20名につき1名が無料となる。","c":"氏名は出発の45日前までに提出する。","d":"25%の保証金は取消時に返金される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。non-refundable deposit＝返金されない保証金。complimentary place＝無料の枠（いわゆるFOC）。","why":"団体予約の英文は5年で未出。約款の団体規定と対応する実務論点として出題されうる。","ref":"旅行英語／内容一致"},{"id":"Covs19","no":19,"sub":"ovs","topic":"旅行英語","stem":"次の英文の空欄に入る語句として最も適切なものはどれか。<br>The company shall not be liable for any loss ▢ from circumstances beyond its reasonable control.","opts":{"a":"arising","b":"raising","c":"rising","d":"arousing"},"ans":["a"],"pt":5,"exp":"arise from 〜 で「〜から生じる」。arising from が正しい。raiseは他動詞「上げる」、riseは自動詞「上がる」、arouseは「喚起する」。","why":"約款英文の定型（arising from / beyond one's control / shall not be liable）は5年で未出だが、免責条項の頻出表現。","ref":"旅行英語／文法"},{"id":"Covs20","no":20,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Car Rental Conditions】 Drivers must be at least 21 years of age and hold a valid licence for a minimum of one year. An additional young driver surcharge applies to drivers under 25. An International Driving Permit is required for licences not issued in the Roman alphabet. The vehicle must be returned with the same level of fuel as at pick-up.","opts":{"a":"運転者は21歳以上で、免許取得後1年以上経過している必要がある。","b":"25歳未満の運転者には追加料金がかかる。","c":"ローマ字表記でない免許証の場合、国際運転免許証が必要である。","d":"車両は満タンで返却しなければならない。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。the same level of fuel as at pick-up＝借りたときと同じ燃料レベルで返却する。満タンとは限らない。","why":"レンタカーの英文は5年で未出。国際運転免許証という実務論点を含み、出題されうる。","ref":"旅行英語／内容一致"},{"id":"Covs21","no":21,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Excursion Notice】 This excursion involves approximately 3 km of walking over uneven terrain and is not recommended for guests with limited mobility. Comfortable footwear is essential. The tour operates in all weather conditions except in cases of extreme heat warnings, when it may be cancelled at short notice with a full refund.","opts":{"a":"約3kmの不整地を歩くため、移動に制約のある人には勧められない。","b":"歩きやすい靴が必須である。","c":"猛暑警報が出た場合を除き、あらゆる天候で催行される。","d":"猛暑警報による中止の場合、返金は行われない。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。with a full refund＝全額返金される。except in cases of 〜（〜の場合を除き）の読み取りが要点。","why":"ツアー注意事項の英文は毎年出題。除外規定（except）と、その場合の取扱いを問う形が定番。","ref":"旅行英語／内容一致"},{"id":"Covs22","no":22,"sub":"ovs","topic":"旅行英語","stem":"次の英文の下線部の語と最も近い意味で用いられているものはどれか。<br>The itinerary is <u>subject to</u> alteration without notice.","opts":{"a":"All bookings are subject to availability.","b":"He was subject to the laws of the country.","c":"The subject was too difficult for beginners.","d":"They subjected the sample to a series of tests."},"ans":["a"],"pt":5,"exp":"下線部の subject to は「〜次第で変わりうる・〜の条件に従う」の意味。aの「すべての予約は空席状況次第」が同じ用法。bは「〜に服する」、cは名詞「主題」、dは動詞「さらす」。","why":"多義語は2021年度に due で出題。subject to は約款英文の最頻出表現で次に出やすい。","ref":"旅行英語／多義語"},{"id":"Covs23","no":23,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Lost Property】 Items left on board are held at the terminal lost property office for a period of 30 days. A handling fee of €10 applies to all items collected. After 30 days, unclaimed items are donated to charity or disposed of. Valuables such as passports are forwarded to the relevant embassy.","opts":{"a":"遺失物はターミナルの遺失物取扱所で30日間保管される。","b":"受取りには10ユーロの手数料がかかる。","c":"30日を過ぎた未受取品は慈善団体に寄付されるか処分される。","d":"旅券は30日経過後に処分される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。旅券などの貴重品は関係する大使館に転送される（forwarded to the relevant embassy）。","why":"遺失物の英文は5年で未出。空港・駅の実務案内として出題されうる題材。","ref":"旅行英語／内容一致"},{"id":"Covs24","no":24,"sub":"ovs","topic":"旅行英語","stem":"次の英文の空欄に入る語として最も適切なものはどれか。<br>Please ▢ your seat belt fastened while the seat belt sign is illuminated.","opts":{"a":"keep","b":"hold","c":"take","d":"make"},"ans":["a"],"pt":5,"exp":"keep + 目的語 + 過去分詞 で「〜を…の状態に保つ」。機内アナウンスの定型表現。hold・take・makeはこの構文で用いない。","why":"機内アナウンスの定型は5年で未出。旅行英語の実務表現として出題されうる。","ref":"旅行英語／文法"},{"id":"Covs25","no":25,"sub":"ovs","topic":"海外観光資源","stem":"次の記述に該当する国はどれか。<br>首都はブリュッセルで、世界遺産のグラン・プラスがある。中世の街並みが残るブルージュは「水の都」と呼ばれる。","opts":{"a":"オランダ","b":"ベルギー","c":"ルクセンブルク","d":"デンマーク"},"ans":["b"],"pt":2,"exp":"ベルギー。グラン・プラスは「世界で最も美しい広場」と称される。小便小僧、ワッフル、チョコレートでも知られる。","why":"ベネルクスはオランダのみ既出（2024年度ハーグ）。ベルギーは未出で、世界遺産の広場という特徴から出題しやすい。","ref":"海外観光資源／西欧"},{"id":"Covs26","no":26,"sub":"ovs","topic":"海外観光資源","stem":"ポルトガルの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"リスボンにはベレンの塔とジェロニモス修道院がある。","b":"ポルトはポートワインの産地として知られる。","c":"シントラの文化的景観は世界遺産に登録されている。","d":"首都はバルセロナである。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ポルトガルの首都はリスボン。バルセロナはスペインの都市。","why":"ポルトガルは5年で完全に未出。スペインは毎年のように出題されており、隣国として次に出やすい。","ref":"海外観光資源／南欧"},{"id":"Covs27","no":27,"sub":"ovs","topic":"海外観光資源","stem":"次の記述に該当する遺跡はどれか。<br>ヨルダン南部にあり、ナバテア人が岩山を削って築いた都市遺跡。シークと呼ばれる細い岩の裂け目を抜けると、エル・ハズネ（宝物殿）が姿を現す。","opts":{"a":"パルミラ","b":"ペトラ","c":"バールベック","d":"ペルセポリス"},"ans":["b"],"pt":2,"exp":"ペトラ遺跡。パルミラはシリア、バールベックはレバノン、ペルセポリスはイランの遺跡。いずれも中東の世界遺産。","why":"中東はトルコ・エジプト以外がほぼ未出。ペトラは世界的知名度が高く、有力な候補。","ref":"海外観光資源／中東"},{"id":"Covs28","no":28,"sub":"ovs","topic":"海外観光資源","stem":"UAE（アラブ首長国連邦）の観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ドバイには世界一高いビルであるブルジュ・ハリファがある。","b":"アブダビにはシェイク・ザイード・グランドモスクがある。","c":"パーム・ジュメイラは人工島である。","d":"首都はドバイである。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。UAEの首都はアブダビ。ドバイは最大の商業都市。都市コードはドバイDXB、アブダビAUH。","why":"UAEは都市コードで2021年度に出題。観光資源としては未出で、中東のハブとして重要性が増している。","ref":"海外観光資源／中東"},{"id":"Covs29","no":29,"sub":"ovs","topic":"海外観光資源","stem":"次の記述に該当する国はどれか。<br>首都はカトマンズ。世界最高峰エベレストへの玄関口であり、ポカラはアンナプルナ連峰を望む保養地。釈迦生誕の地ルンビニがある。","opts":{"a":"ブータン","b":"ネパール","c":"スリランカ","d":"バングラデシュ"},"ans":["b"],"pt":2,"exp":"ネパール。ブータンはタクツァン僧院とパロ、スリランカはシギリヤとキャンディ、バングラデシュはダッカ。","why":"南アジアはインドのみが繰り返し出題され、ネパール・ブータン・スリランカは未出。","ref":"海外観光資源／南アジア"},{"id":"Covs30","no":30,"sub":"ovs","topic":"海外観光資源","stem":"モンゴル及び中央アジアの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"モンゴルの首都はウランバートルである。","b":"ゴビ砂漠はモンゴルと中国にまたがる。","c":"サマルカンドはウズベキスタンにある世界遺産の都市である。","d":"カザフスタンの首都はタシケントである。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。タシケントはウズベキスタンの首都。カザフスタンの首都はアスタナ。","why":"モンゴル・中央アジアは5年で完全に未出。シルクロードの世界遺産（サマルカンド・ブハラ）は出題しやすい。","ref":"海外観光資源／中央アジア"},{"id":"Covs31","no":31,"sub":"ovs","topic":"海外観光資源","stem":"中国の世界自然遺産及び名山に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"九寨溝は四川省にある世界自然遺産である。","b":"黄龍は四川省にある世界自然遺産である。","c":"張家界（武陵源）は湖南省にある世界自然遺産である。","d":"泰山は仏教四大名山のひとつである。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。泰山は道教の五岳の筆頭で、世界複合遺産。仏教四大名山は五台山・峨眉山・普陀山・九華山。","why":"中国は毎年出題されるが自然遺産は未出。九寨溝・黄龍・武陵源はいずれも景観で知られ出題しやすい。","ref":"海外観光資源／中国"},{"id":"Covs32","no":32,"sub":"ovs","topic":"海外観光資源","stem":"ベトナムの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ハロン湾は世界自然遺産である。","b":"フエは阮朝の古都で世界文化遺産である。","c":"ホイアンには日本橋（来遠橋）が残る。","d":"ベンタイン市場はハノイにある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ベンタイン市場はホーチミン（旧サイゴン）にある中央市場。ハノイの旧市街は36通りで知られる。","why":"ベトナムは2023・2025年度に出題。ハノイとホーチミンの取り違えは未出の切り口。","ref":"海外観光資源／東南アジア"},{"id":"Covs33","no":33,"sub":"ovs","topic":"海外観光資源","stem":"フィリピンの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"コルディリェーラの棚田群は世界文化遺産である。","b":"チョコレートヒルズはボホール島にある。","c":"ボラカイ島はホワイトビーチで知られる。","d":"首都はセブである。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。フィリピンの首都はマニラ。セブは中部ビサヤ地方のリゾート。","why":"フィリピンは2024年度にボラカイ島が出題。棚田群・チョコレートヒルズは未出で出題しやすい。","ref":"海外観光資源／東南アジア"},{"id":"Covs34","no":34,"sub":"ovs","topic":"海外観光資源","stem":"韓国の観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"済州島は世界自然遺産に登録されている。","b":"城山日出峰は済州島にある。","c":"安東河回村は世界文化遺産である。","d":"甘川文化村はソウルにある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。甘川文化村は釜山にあるカラフルな斜面の集落。ソウルの類似スポットは北村韓屋村。","why":"韓国は毎年出題。済州島の世界自然遺産（2007年登録）は未出で、ソウル・釜山以外の切り口。","ref":"海外観光資源／韓国"},{"id":"Covs35","no":35,"sub":"ovs","topic":"海外観光資源","stem":"アメリカの世界遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"自由の女神像は世界文化遺産である。","b":"グランドキャニオン国立公園は世界自然遺産である。","c":"イエローストーン国立公園は世界自然遺産である。","d":"ゴールデンゲートブリッジは世界文化遺産である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ゴールデンゲートブリッジは世界遺産に登録されていない。アメリカの世界遺産には自由の女神、独立記念館、メサ・ヴェルデ、ヨセミテなどがある。","why":"アメリカは毎年出題されるが世界遺産という切り口は未出。国立公園との対応で出題されうる。","ref":"海外観光資源／北米"},{"id":"Covs36","no":36,"sub":"ovs","topic":"海外観光資源","stem":"メキシコの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"チチェン・イッツァのエル・カスティージョは9層のピラミッドである。","b":"テオティワカンには太陽のピラミッドと月のピラミッドがある。","c":"グアナフアトはカラフルな街並みで知られる世界遺産である。","d":"カンクンは太平洋岸のリゾートである。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。カンクンはユカタン半島のカリブ海側にあるリゾート。太平洋岸のリゾートはアカプルコ。","why":"メキシコは2023・2025年度に出題。カンクンの位置（カリブ海側）は未出の切り口。","ref":"海外観光資源／中米"},{"id":"Covs37","no":37,"sub":"ovs","topic":"海外観光資源","stem":"ブラジル及びアルゼンチンの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"リオデジャネイロにはコルコバードのキリスト像がある。","b":"ポン・デ・アスーカル（砂糖パン山）はリオデジャネイロにある。","c":"ブエノスアイレスのカミニートはタンゴ発祥の地とされる。","d":"アマゾン川の河口はアルゼンチンにある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。アマゾン川の河口はブラジル。中流の拠点都市はマナウス。","why":"南米は2022・2025年度に出題。リオの2大シンボルとブエノスアイレスは未出。","ref":"海外観光資源／南米"},{"id":"Covs38","no":38,"sub":"ovs","topic":"海外観光資源","stem":"アフリカの世界遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ヴィクトリアの滝はザンビアとジンバブエの国境にある世界自然遺産である。","b":"ンゴロンゴロ保全地域はタンザニアにある世界複合遺産である。","c":"アイト・ベン・ハドゥはモロッコにある世界文化遺産である。","d":"キリマンジャロ国立公園はケニアにある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。キリマンジャロ国立公園はタンザニアにある。ケニアのアンボセリ国立公園からキリマンジャロを望むことができる。","why":"アフリカは2021・2023・2024年度に出題。キリマンジャロの所属国は誤答を作りやすい未出の切り口。","ref":"海外観光資源／アフリカ"},{"id":"Covs39","no":39,"sub":"ovs","topic":"海外観光資源","stem":"エチオピア及び東アフリカの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ラリベラの岩窟教会群はエチオピアにある世界文化遺産である。","b":"エチオピアの首都はアディスアベバである。","c":"ザンジバル島はタンザニアに属する。","d":"ケニアの首都はモンバサである。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ケニアの首都はナイロビ。モンバサはインド洋に面した港湾都市。","why":"エチオピアは5年で完全に未出。ラリベラの岩窟教会群は世界的に知られた世界遺産で出題しやすい。","ref":"海外観光資源／アフリカ"},{"id":"Covs40","no":40,"sub":"ovs","topic":"海外観光資源","stem":"オセアニアの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"シドニーのオペラハウスは世界文化遺産である。","b":"グレートバリアリーフは世界自然遺産である。","c":"トンガリロ国立公園はニュージーランド北島にある世界複合遺産である。","d":"テカポ湖はニュージーランド北島にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。テカポ湖はニュージーランド南島にある。星空保護区として知られる。","why":"オセアニアは毎年出題。北島と南島の取り違えは繰り返し狙われる型。","ref":"海外観光資源／オセアニア"},{"id":"Covs41","no":41,"sub":"ovs","topic":"海外観光資源","stem":"次の観光列車とその運行区間の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"ロッキーマウンテニア ─ バンクーバー〜バンフ／ジャスパー","b":"ブルートレイン ─ プレトリア〜ケープタウン","c":"イースタン&オリエンタル ─ シンガポール〜バンコク","d":"オリエント急行 ─ ロンドン〜モスクワ"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。オリエント急行はパリとイスタンブールを結んだ歴史的路線。ロンドン〜モスクワではない。","why":"観光列車は2024・2025年度にスイスの列車が出題。大陸横断・長距離列車は未出で出題しやすい。","ref":"海外観光資源／鉄道"},{"id":"Covs42","no":42,"sub":"ovs","topic":"海外観光資源","stem":"次の絵画作品とその収蔵施設との組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"「ヴィーナスの誕生」（ボッティチェリ） ─ ウフィツィ美術館","b":"「最後の審判」（ミケランジェロ） ─ システィーナ礼拝堂","c":"「リッタの聖母」（ダ・ヴィンチ） ─ エルミタージュ美術館","d":"「民衆を導く自由の女神」（ドラクロワ） ─ オルセー美術館"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。「民衆を導く自由の女神」はルーブル美術館の収蔵。オルセー美術館は主に19世紀後半の作品（ミレー「晩鐘」、ゴーギャン「タヒチの女たち」など）を収蔵する。","why":"美術館は毎年1〜2問。ルーブルとオルセーの区別（時代による所蔵の分担）は未出の切り口。","ref":"海外観光資源／美術館"},{"id":"Covs43","no":43,"sub":"ovs","topic":"海外観光資源","stem":"次の民族舞踊・音楽とその発祥国の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"フラメンコ ─ スペイン","b":"タンゴ ─ アルゼンチン","c":"サンバ ─ ブラジル","d":"ベリーダンス ─ インド"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ベリーダンスは中東・北アフリカ発祥。インドの古典舞踊はバラタナティヤムやカタックなど。","why":"民族舞踊は2023年度にフラメンコが出題。他の舞踊と並べる形は再出題されうる。","ref":"海外観光資源／文化"},{"id":"Covs44","no":44,"sub":"ovs","topic":"海外観光資源","stem":"次の祭りとその開催国の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"リオのカーニバル ─ ブラジル","b":"ソンクラーン ─ タイ","c":"ホーリー ─ インド","d":"死者の日 ─ ペルー"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。死者の日（ディア・デ・ムエルトス）はメキシコの祭り。ユネスコ無形文化遺産にも登録されている。","why":"祭りは5年で未出だが、料理・舞踊とあわせて文化の論点として出題されうる。","ref":"海外観光資源／文化"},{"id":"Covs45","no":45,"sub":"ovs","topic":"海外実務その他","stem":"次の組合せのうち、都市（A）が7月15日（水）9時（午前9時）のとき、都市（B）の現地時刻が誤っているものはどれか。<br>※7月15日時点で、北半球のヨーロッパ・北米は夏時間を実施し、南半球は実施していないものとする。","opts":{"a":"東京（+9） ─ ロンドン（夏時間 +1） ─ 7月15日1時","b":"東京（+9） ─ ニューヨーク（夏時間 −4） ─ 7月14日20時","c":"東京（+9） ─ シドニー（+10） ─ 7月15日10時","d":"東京（+9） ─ ホノルル（−10） ─ 7月15日14時"},"ans":["d"],"pt":5,"exp":"東京9時のGMTは9−9＝0時。ホノルルは0＋(−10)＝−10時＝前日14時、すなわち7月14日14時。「7月15日14時」とする点で日付が誤り。a（0+1＝1時）、b（0−4＝−4＝前日20時）、c（0+10＝10時）は正しい。","why":"時差は5年連続で毎年1問。夏時間を実施する7月の設定は、10月末の設定とは逆に「夏時間を加算する」処理が必要になる。","ref":"時差計算"},{"id":"Covs46","no":46,"sub":"ovs","topic":"海外実務その他","stem":"次の航空便の所要時間として正しいものはどれか。<br>SQ 011便　シンガポール（SIN）09:30 発 → 東京（NRT）17:35 着<br>※シンガポールの対GMTは+8、東京の対GMTは+9とする。","opts":{"a":"7時間05分","b":"8時間05分","c":"9時間05分","d":"6時間05分"},"ans":["a"],"pt":5,"exp":"出発をGMTに直すと09:30−8＝01:30。到着は17:35−9＝08:35。08:35−01:30＝7時間05分。時差1時間の路線では、現地時刻の差（8時間05分）から時差1時間を引いた値になる。","why":"所要時間は毎年出題。アジア域内の短距離路線は時差が小さく、計算を単純にした基本形。","ref":"所要時間の計算"},{"id":"Covs47","no":47,"sub":"ovs","topic":"海外実務その他","stem":"シェンゲン協定に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"加盟国間の移動では原則として出入国審査が行われない。","b":"最初に到着した加盟国で入国審査を受ける。","c":"最後に出国する加盟国で出国審査を受ける。","d":"EU加盟国はすべてシェンゲン協定に加盟している。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。EU加盟国でもアイルランドはシェンゲン非加盟。逆にノルウェー・アイスランド・スイス・リヒテンシュタインはEU非加盟だがシェンゲン協定に加盟している。","why":"シェンゲンは2022年度以降4年連続で出題。EU加盟とシェンゲン加盟が別概念である点が核心。","ref":"シェンゲン協定"},{"id":"Covs48","no":48,"sub":"ovs","topic":"海外実務その他","stem":"次の都市コードと国の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"AUH ─ アラブ首長国連邦","b":"CAI ─ エジプト","c":"AKL ─ ニュージーランド","d":"OAK ─ ニュージーランド"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。OAKはアメリカ・カリフォルニア州のオークランド。ニュージーランドのオークランドはAKL。この2つの取り違えは2021年度に出題された。","why":"コードは毎年2問。AKLとOAKの取り違えは繰り返し狙われる定番。","ref":"都市コード"},{"id":"Covs49","no":49,"sub":"ovs","topic":"海外実務その他","stem":"航空機内への液体物の持込みに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"液体物は100ml以下の容器に入れる必要がある。","b":"容器は容量1リットル以下の再封可能な透明プラスチック袋に入れる。","c":"袋は1人1個までとする。","d":"容器の容量が100mlを超える場合でも、中身が100ml以下であれば持ち込める。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。判定基準は「容器の容量」であり、中身の量ではない。150mlの容器に50mlだけ入っていても持ち込めない。","why":"★液体物は2021・2022・2023年度に出題されたが2024・2025年度は出題なし。2年連続で出ていないため次年度の出題確率が高い。","ref":"航空保安／液体物の持込制限"},{"id":"Covs50","no":50,"sub":"ovs","topic":"海外実務その他","stem":"海外の出入国手続に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"アメリカでは、最初に到着した空港で入国審査と税関検査を受ける。","b":"ESTAの有効期限は許可日から2年間である（旅券の有効期限が先に到来する場合はその日まで）。","c":"カナダへ空路で入国する場合、eTAの事前申請が必要である。","d":"ユーロスターでロンドンからパリへ向かう場合、フランスの入国審査はパリ到着後に行われる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。ユーロスターではジュクスタポーズド・コントロールにより、出発駅（ロンドン）でフランスの入国審査を受ける。","why":"出入国手続は毎年1〜2問。米国の「最初の到着地」とユーロスターの事前審査は繰り返し問われる。","ref":"出入国手続"},{"id":"Covs51","no":51,"sub":"ovs","topic":"海外実務その他","stem":"ホテルの料金プランに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ヨーロピアンプランは室料のみの料金である。","b":"コンチネンタルプランは室料と簡単な朝食の料金である。","c":"アメリカンプランは室料と3食の料金である。","d":"モディファイドアメリカンプランは室料と3食の料金である。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。モディファイドアメリカンプラン（MAP）は室料と2食（朝食＋昼食または夕食）。アメリカンプラン（AP）が3食付き。","why":"ホテルの料金プランは5年で未出。宿泊の実務用語として出題されうる基本論点。","ref":"宿泊の用語"},{"id":"Covs52","no":52,"sub":"ovs","topic":"海外実務その他","stem":"クルーズに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ショアエクスカーションとは寄港地観光のことである。","b":"テンダーボートとは、大型船が接岸できない港で本船と陸を結ぶ小型ボートである。","c":"オンボードブッキングとは、乗船中に次回のクルーズを予約することである。","d":"日本船籍のクルーズ船では、公海上であればカジノで現金を賭けることができる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。日本船籍の船では公海上であっても賭博罪の適用があり、現金や換金可能なチップを利用したギャンブルは認められない。","why":"クルーズ用語は毎年1〜3問。日本船籍のカジノは2021年度に出題された論点で、再出題されうる。","ref":"クルーズの用語"}]}];

 <li>解答後に表示される<b>「予想の根拠」</b>には、その論点が過去何年に出題され、なぜ次に出やすいかを記載しています。</li>
 <li>間違えた設問は「復習」タブに集まります。</li></ul></div></div>`;
 $$('.setcard').forEach(b=>b.onclick=()=>{CUR.set=+b.dataset.set;CUR.sub=null;go('exam')});
}

/* ── 受験 ── */
function viewExam(){
 if(CUR.set===null){go('home');return}
 const st=SETS[CUR.set];
 if(CUR.sub===null){
  $('#viewExam').innerHTML=`<div class="page">
  <p class="eyebrow">${esc(st.title)}</p><h2 class="sec">科目を選ぶ</h2>
  <div class="setpick">${SUBS.map(s=>{
    const qs=st.q.filter(q=>q.sub===s[0]); const lg=S.done[CUR.set+'|'+s[0]];
    return `<button class="setcard" data-sub="${s[0]}">
     <span class="sn">${s[1].slice(0,1)}</span>
     <span><span class="st">${s[1]}</span><span class="sd">${qs.length}問 ／ ${s[3]} ／ ${s[4]}点満点（合格 ${s[5]}点）</span></span>
     <span class="sg">${lg?lg.score+' / '+s[4]:'未受験'}</span></button>`}).join('')}</div>
  <button class="iconbtn" id="back">← セット選択へ</button></div>`;
  $$('#viewExam .setcard').forEach(b=>b.onclick=()=>{CUR.sub=b.dataset.sub;viewExam()});
  $('#back').onclick=()=>{CUR.set=null;go('home')};
  return;
 }
 const meta=SUBS.find(s=>s[0]===CUR.sub);
 const qs=st.q.filter(q=>q.sub===CUR.sub);
 $('#viewExam').innerHTML=`<div class="page">
 <div class="exhead"><div class="t">${esc(st.title)}　${meta[1]}</div>
  <div class="m">${qs.length}問 ／ ${meta[3]} ／ 満点 ${meta[4]}点 ／ 合格ライン ${meta[5]}点</div></div>
 <div class="subtabs">${SUBS.map(s=>`<button data-sub="${s[0]}" aria-selected="${s[0]===CUR.sub}">${s[1]}</button>`).join('')}
  <span class="spacer"></span></div>
 <div id="qlist">${qs.map(q=>card(q)).join('')}</div>
 <div style="display:flex;gap:8px;margin:20px 0 8px"><button class="iconbtn" id="sub" style="border-color:var(--ai);color:var(--ai);font-weight:600;padding:9px 20px">採点する</button>
 <button class="iconbtn" id="bk">← 科目選択へ</button></div>
 <div id="res"></div></div>`;
 $$('.subtabs button').forEach(b=>b.onclick=()=>{CUR.sub=b.dataset.sub;viewExam()});
 $('#bk').onclick=()=>{CUR.sub=null;viewExam()};
 qs.forEach(q=>bind(q));
 $('#sub').onclick=()=>grade(qs,meta);
}

function card(q){
 const multi=q.ans.length>1;
 return `<div class="q" data-id="${q.id}">
  <div class="head"><span class="no">問${q.no}</span>
   <span class="tag">${esc(q.topic)}</span>
   ${multi?'<span class="tag" style="border-color:var(--shuLine);color:var(--shu)">複数選択</span>':''}
   <span class="spacer"></span>
   <button class="star" title="重要">☆</button></div>
  <div class="body"><div class="stem">${esc(q.stem)}</div>
  ${q.items?`<ul class="kijutsu">${q.items.map(it=>`<li><span class="kk">（${it.k}）</span><span>${esc(it.t)}</span></li>`).join('')}</ul>`:''}
  ${q.fig?`<figure class="qfig">${q.figcap?`<figcaption>${esc(q.figcap)}</figcaption>`:''}${q.fig}</figure>`:''}
  <ul class="opts">${Object.keys(q.opts).sort().map(k=>`
   <li data-k="${k}" data-r="${q.ans.includes(k)?1:0}"><label>
    <span class="lb"><input type="${multi?'checkbox':'radio'}" name="y${q.id}" value="${k}">${k}.</span>
    <span>${esc(q.opts[k])}<span class="mk"></span></span></label></li>`).join('')}</ul>
  <div class="verdict"></div>
  <div class="exp" hidden><div class="ttl">解 説</div><div>${esc(q.exp)}</div>
   ${q.ref?`<span class="ref">${esc(q.ref)}</span>`:''}
   <div class="why"><span class="lbl">予想の根拠</span>${esc(q.why)}</div></div>
  </div></div>`;
}

function bind(q){
 const el=$(`.q[data-id="${q.id}"]`); if(!el)return;
 const stb=$('.star',el);
 if(S.star[q.id])stb.classList.add('on'),stb.textContent='★';
 stb.onclick=()=>{S.star[q.id]=!S.star[q.id];stb.classList.toggle('on');stb.textContent=S.star[q.id]?'★':'☆';save()};
 const lg=S.log[q.id];
 if(lg){ $$('.opts li',el).forEach(li=>{const i=li.querySelector('input'); if(lg.pick.includes(li.dataset.k))i.checked=true}); }
}

function grade(qs,meta){
 let score=0, right=0;
 qs.forEach(q=>{
  const el=$(`.q[data-id="${q.id}"]`);
  const pick=$$('.opts input:checked',el).map(i=>i.value).sort();
  const ok=pick.length===q.ans.length&&pick.every((v,i)=>v===[...q.ans].sort()[i]);
  el.className='q '+(ok?'ok':'ng');
  $$('.opts li',el).forEach(li=>{
   const r=li.dataset.r==='1', p=pick.includes(li.dataset.k);
   li.className=r?'right':(p?'wrong':'');
   li.querySelector('.mk').textContent=r?'正':(p?'誤':'');
   li.querySelector('input').disabled=true;});
  $('.verdict',el).textContent=ok?'正 解':'不正解　正解：'+[...q.ans].sort().join('・');
  $('.exp',el).hidden=false;
  if(ok){score+=q.pt;right++}
  S.log[q.id]={c:ok,pick,t:Date.now()};
 });
 const pass=score>=meta[5];
 S.done[CUR.set+'|'+CUR.sub]={score,right,total:qs.length,t:Date.now()};
 save();
 $('#res').innerHTML=`<div class="result"><div class="score">${score} / ${meta[4]}</div>
  <div class="judge ${pass?'pass':'fail'}">${pass?'合格ライン到達':'合格ライン未満'}（${meta[5]}点以上で合格）</div>
  <div class="detail">正答 ${right} / ${qs.length}問</div></div>`;
 const rv=$('#res'); if(rv&&rv.scrollIntoView)rv.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ── 復習 ── */
function viewRev(){
 const all=SETS.flatMap((s,si)=>s.q.map(q=>({...q,si})));
 const ng=all.filter(q=>(S.log[q.id]&&!S.log[q.id].c)||S.star[q.id]);
 $('#viewRev').innerHTML=`<div class="page"><p class="eyebrow">復習</p>
  <h2 class="sec">誤答・重要マークの設問（${ng.length}）</h2>
  ${ng.length?ng.map(q=>card(q)).join(''):'<div class="empty">誤答はまだありません。</div>'}</div>`;
 ng.forEach(q=>{bind(q);
  const el=$(`.q[data-id="${q.id}"]`); const lg=S.log[q.id]; if(!lg)return;
  el.className='q '+(lg.c?'ok':'ng');
  $$('.opts li',el).forEach(li=>{const r=li.dataset.r==='1',p=lg.pick.includes(li.dataset.k);
   li.className=r?'right':(p?'wrong':'');li.querySelector('.mk').textContent=r?'正':(p?'誤':'');
   li.querySelector('input').disabled=true;});
  $('.verdict',el).textContent=lg.c?'正 解（解答済み）':'不正解　正解：'+[...q.ans].sort().join('・');
  $('.exp',el).hidden=false;});
}

/* ── 成績 ── */
function viewAnal(){
 const rows=[];
 SETS.forEach((s,si)=>SUBS.forEach(sb=>{
  const d=S.done[si+'|'+sb[0]];
  if(d)rows.push({set:s.title,sub:sb[1],max:sb[4],pass:sb[5],...d});
 }));
 const byTopic={};
 SETS.forEach(s=>s.q.forEach(q=>{
  const lg=S.log[q.id]; if(!lg)return;
  byTopic[q.topic]=byTopic[q.topic]||{c:0,t:0};
  byTopic[q.topic].t++; if(lg.c)byTopic[q.topic].c++;}));
 $('#viewAnal').innerHTML=`<div class="page"><p class="eyebrow">成績</p><h2 class="sec">受験結果</h2>
 ${rows.length?`<div class="scrollx"><table class="mx"><thead><tr><th>セット</th><th>科目</th><th>得点</th><th>判定</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td>${esc(r.set)}</td><td>${esc(r.sub)}</td><td>${r.score} / ${r.max}</td>
  <td style="color:${r.score>=r.pass?'var(--koke)':'var(--shu)'}">${r.score>=r.pass?'合格':'不合格'}</td></tr>`).join('')}
 </tbody></table></div>`:'<div class="empty">まだ受験していません。</div>'}
 <h3>分野別の正答率</h3>
 ${Object.keys(byTopic).length?Object.entries(byTopic).sort((a,b)=>a[1].c/a[1].t-b[1].c/b[1].t).map(([k,v])=>{
   const p=Math.round(v.c/v.t*100);
   return `<div class="barrow"><span class="bl">${esc(k)}</span><span class="bar"><i style="width:${p}%"></i></span><span class="bv">${v.c}/${v.t}</span></div>`;
  }).join(''):'<div class="empty">データがありません。</div>'}
 <div style="margin-top:20px"><button class="iconbtn" id="rst">記録を消去</button></div></div>`;
 $('#rst').onclick=()=>{if(confirm('すべての解答記録を消去します。よろしいですか。')){S={log:{},star:{},done:{}};save();viewAnal()}};
}

/* ── ルーティング ── */
const V={home:viewHome,exam:viewExam,rev:viewRev,anal:viewAnal};
function go(v){
 ['home','exam','rev','anal'].forEach(k=>{
  const el=$('#view'+k[0].toUpperCase()+k.slice(1));
  if(el)el.classList.toggle('hidden',k!==v);});
 $$('.navtabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));
 V[v]&&V[v]();
 window.scrollTo(0,0);
}
$$('.navtabs button').forEach(b=>b.onclick=()=>go(b.dataset.view));
$('#tg').onclick=()=>{const d=document.documentElement;
 d.setAttribute('data-theme',d.getAttribute('data-theme')==='dark'?'light':'dark');};
go('home');
</script>
<script id="hlmarkJs">/* HLMARK-v1 */
/* ============================================================
   マーカー・下線機能（本文の HTML は書き換えない）

   記録方式：
     ルート要素（.page など）ごとに、その要素の全テキストを
     連結した文字列上の開始・終了位置で範囲を持つ。
     読み込み時にテキストノードを走査して span で包む。
     span を入れてもテキスト内容は変わらないため、
     付け外しを繰り返しても位置がずれない。

   保存先：localStorage（ファイル名ごと）
   ============================================================ */
(function () {
  'use strict';

  var KEY = 'hlmark:' + (location.pathname.split('/').pop() || 'index');
  var COLORS = [
    { k: 'y', name: '黄' },
    { k: 'g', name: '緑' },
    { k: 'b', name: '青' },
    { k: 'p', name: '桃' }
  ];
  var UNDER = { k: 'u', name: '下線' };

  var store = load();          // [{r:ルートID, s:開始, e:終了, c:色}]
  var pop = null;              // 操作ボタン
  var panel = null;            // 一覧
  var maskOn = false;          // 文字を隠す
  var lastSel = null;          // 直近の選択範囲
  var lastHid = null;          // 押したマーカーの ID

  /* ---------- 保存 ---------- */
  function load() {
    try {
      var v = localStorage.getItem(KEY);
      return v ? JSON.parse(v) : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
  }

  /* ---------- ルート要素の登録 ---------- */
  function roots() {
    return document.querySelectorAll('[data-hlr]');
  }
  function setupRoots() {
    var n = 0;
    var sel = ['.page', 'main .page', '[id^="view"] > .page'];
    var seen = [];
    sel.forEach(function (s) {
      document.querySelectorAll(s).forEach(function (el) {
        if (seen.indexOf(el) >= 0) return;
        seen.push(el);
      });
    });
    if (!seen.length) {
      // .page が無いページは各ビュー、それも無ければ主要ブロック
      document.querySelectorAll('[id^="view"], main, article, section').forEach(function (el) {
        if (el.querySelector('[id^="view"], main, article')) return;
        if (!el.textContent.trim()) return;
        seen.push(el);
      });
    }
    seen.forEach(function (el) {
      if (el.hasAttribute('data-hlr')) return;
      el.setAttribute('data-hlr', el.id || ('r' + (++n)));
    });
  }

  /* ---------- テキストノードの走査 ---------- */
  function walk(root) {
    var out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (t) {
        if (!t.nodeValue.length) return NodeFilter.FILTER_REJECT;
        var p = t.parentNode;
        while (p && p !== root) {
          var tag = p.nodeName;
          if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'SVG' || tag === 'svg')
            return NodeFilter.FILTER_REJECT;
          p = p.parentNode;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var t;
    while ((t = w.nextNode())) out.push(t);
    return out;
  }
  function offsetOf(root, node, off) {
    var ns = walk(root), pos = 0;
    for (var i = 0; i < ns.length; i++) {
      if (ns[i] === node) return pos + off;
      pos += ns[i].nodeValue.length;
    }
    return -1;
  }
  function textOf(root) {
    return walk(root).map(function (t) { return t.nodeValue; }).join('');
  }

  /* ---------- 適用 ---------- */
  function applyOne(root, rec) {
    var ns = walk(root), pos = 0, made = [];
    for (var i = 0; i < ns.length; i++) {
      var t = ns[i], len = t.nodeValue.length;
      var a = Math.max(rec.s, pos), b = Math.min(rec.e, pos + len);
      if (a < b) {
        var node = t;
        if (a - pos > 0) node = node.splitText(a - pos);
        if (b - a < node.nodeValue.length) node.splitText(b - a);
        var sp = document.createElement('span');
        sp.className = 'hlm hlm-' + rec.c;
        sp.setAttribute('data-hid', rec.id);
        node.parentNode.insertBefore(sp, node);
        sp.appendChild(node);
        made.push(sp);
        // splitText で配列がずれるため作り直す
        ns = walk(root); pos = 0; i = -1;
        // すでに包んだ範囲は再処理しない
        var done = 0;
        for (var j = 0; j < ns.length; j++) {
          if (ns[j].parentNode === sp) { done = 1; }
        }
        // 位置を進めて続行
        var np = 0, k = 0;
        for (k = 0; k < ns.length; k++) {
          if (np + ns[k].nodeValue.length > b) break;
          np += ns[k].nodeValue.length;
        }
        i = k - 1; pos = np;
        if (b >= rec.e) break;
        continue;
      }
      pos += len;
      if (pos >= rec.e) break;
    }
    return made;
  }
  function renderAll() {
    // いったん全部外す
    document.querySelectorAll('span.hlm').forEach(function (sp) {
      var p = sp.parentNode;
      while (sp.firstChild) p.insertBefore(sp.firstChild, sp);
      p.removeChild(sp);
    });
    roots().forEach(function (r) { r.normalize(); });
    // 付け直す（後ろから当てると位置がずれない）
    var byRoot = {};
    store.forEach(function (rec) {
      (byRoot[rec.r] = byRoot[rec.r] || []).push(rec);
    });
    Object.keys(byRoot).forEach(function (rid) {
      var root = document.querySelector('[data-hlr="' + cssEsc(rid) + '"]');
      if (!root) return;
      byRoot[rid].slice().sort(function (a, b) { return b.s - a.s; })
        .forEach(function (rec) { applyOne(root, rec); });
    });
    document.body.classList.toggle('hlm-mask', maskOn);
  }
  function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

  /* ---------- 追加・削除 ---------- */
  function addMark(c) {
    var sel = window.getSelection();
    var rg = lastSel || (sel && sel.rangeCount ? sel.getRangeAt(0) : null);
    if (!rg || rg.collapsed) return;
    var root = rootOf(rg.commonAncestorContainer);
    if (!root) return;
    var s = offsetOf(root, rg.startContainer, rg.startOffset);
    var e = offsetOf(root, rg.endContainer, rg.endOffset);
    if (s < 0 || e < 0 || s >= e) return;
    var rid = root.getAttribute('data-hlr');
    var isU = (c === 'u');
    // 同種（マーカー同士／下線同士）が重なる分は置き換える
    store = store.filter(function (x) {
      if (x.r !== rid) return true;
      var same = (x.c === 'u') === isU;
      if (!same) return true;
      return !(x.s < e && s < x.e);
    });
    store.push({ id: 'h' + Date.now() + Math.random().toString(36).slice(2, 6),
                 r: rid, s: s, e: e, c: c });
    save(); renderAll(); hidePop();
    if (sel) sel.removeAllRanges();
    lastSel = null;
  }
  function delRange() {
    var sel = window.getSelection();
    // 付けたマーカーを押して出したボタンなら、そのマーカーだけを消す
    if (lastHid) {
      var hid = lastHid; lastHid = null; lastSel = null;
      if (sel) sel.removeAllRanges();
      delById(hid);
      return;
    }
    var rg = lastSel || (sel && sel.rangeCount ? sel.getRangeAt(0) : null);
    if (!rg) return;
    var root = rootOf(rg.commonAncestorContainer);
    if (!root) return;
    var rid = root.getAttribute('data-hlr');
    if (rg.collapsed) {
      var sp = upto(rg.startContainer, 'hlm');
      if (sp) { delById(sp.getAttribute('data-hid')); }
      return;
    }
    var s = offsetOf(root, rg.startContainer, rg.startOffset);
    var e = offsetOf(root, rg.endContainer, rg.endOffset);
    store = store.filter(function (x) {
      return !(x.r === rid && x.s < e && s < x.e);
    });
    save(); renderAll(); hidePop();
    if (sel) sel.removeAllRanges();
    lastSel = null;
  }
  function delById(id) {
    store = store.filter(function (x) { return x.id !== id; });
    save(); renderAll(); hidePop();
  }
  function rootOf(node) {
    var el = node.nodeType === 1 ? node : node.parentNode;
    while (el && el !== document.body) {
      if (el.hasAttribute && el.hasAttribute('data-hlr')) return el;
      el = el.parentNode;
    }
    return null;
  }
  function upto(node, cls) {
    var el = node.nodeType === 1 ? node : node.parentNode;
    while (el && el !== document.body) {
      if (el.classList && el.classList.contains(cls)) return el;
      el = el.parentNode;
    }
    return null;
  }

  /* ---------- 操作ボタン ---------- */
  function buildPop() {
    pop = document.createElement('div');
    pop.id = 'hlmPop';
    var html = '';
    COLORS.forEach(function (c, i) {
      html += '<button data-c="' + c.k + '" title="' + c.name + '（' + (i + 1) + '）">' +
              '<i class="sw sw-' + c.k + '"></i>' + c.name + '</button>';
    });
    html += '<button data-c="u" title="下線（5）"><i class="sw sw-u"></i>下線</button>';
    html += '<span class="sep"></span>';
    html += '<button data-c="del" title="消す（Delete）">消す</button>';
    pop.innerHTML = html;
    document.body.appendChild(pop);
    pop.addEventListener('mousedown', function (e) { e.preventDefault(); });
    pop.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var c = b.getAttribute('data-c');
      if (c === 'del') delRange(); else addMark(c);
    });
  }
  function showPop(rect) {
    if (!pop) buildPop();
    pop.classList.add('on');
    var mob = false;
    try { mob = window.matchMedia && window.matchMedia('(max-width:760px)').matches; }
    catch (e) { mob = (window.innerWidth || 1200) <= 760; }
    if (mob) { pop.classList.add('bottom'); pop.style.left = ''; pop.style.top = ''; return; }
    pop.classList.remove('bottom');
    var pw = pop.offsetWidth || 320, ph = pop.offsetHeight || 40;
    var x = rect.left + rect.width / 2 - pw / 2 + window.scrollX;
    var y = rect.top - ph - 8 + window.scrollY;
    if (y < window.scrollY + 4) y = rect.bottom + 8 + window.scrollY;
    x = Math.max(8, Math.min(x, window.innerWidth - pw - 8));
    pop.style.left = x + 'px'; pop.style.top = y + 'px';
  }
  function hidePop() { if (pop) pop.classList.remove('on'); }
  function rectOf(rg) {
    var r = null;
    try { r = rg.getBoundingClientRect && rg.getBoundingClientRect(); } catch (e) {}
    if (r && (r.width || r.height || r.top)) return r;
    var el = rg.commonAncestorContainer;
    if (el && el.nodeType !== 1) el = el.parentNode;
    try { r = el && el.getBoundingClientRect(); } catch (e) {}
    return r || { left: 0, top: 0, width: 0, height: 0, bottom: 0 };
  }

  /* ---------- 一覧 ---------- */
  function unitOf(el) {
    var p = el;
    while (p && p !== document.body) {
      if (p.classList && p.classList.contains('page')) {
        var h = p.querySelector('h2.sec, h2, h3');
        if (h) return h.textContent.replace(/\s+/g, ' ').trim();
      }
      p = p.parentNode;
    }
    return '';
  }
  function buildPanel() {
    panel = document.createElement('div');
    panel.id = 'hlmPanel';
    panel.innerHTML =
      '<div class="hd"><b>マーカー一覧</b>' +
      '<button class="x" title="閉じる">✕</button></div>' +
      '<div class="tools">' +
      '<div class="f"><button data-f="all" class="on">すべて</button>' +
      COLORS.map(function (c) {
        return '<button data-f="' + c.k + '"><i class="sw sw-' + c.k + '"></i></button>';
      }).join('') +
      '<button data-f="u"><i class="sw sw-u"></i></button></div>' +
      '<label class="mk"><input type="checkbox" id="hlmMask">マーカー部分の文字を隠す</label>' +
      '<div class="io"><button id="hlmExp">書き出す</button>' +
      '<button id="hlmImp">読み込む</button>' +
      '<button id="hlmClr">全部消す</button></div></div>' +
      '<div class="list"></div>' +
      '<details class="help"><summary>使い方</summary>' +
      '<dl>' +
      '<dt>付ける</dt><dd>本文を選ぶと、選んだ箇所の上にボタンが出ます。' +
      'スマートフォンでは画面の下に出ます。</dd>' +
      '<dt>変える・消す</dt><dd>付けた箇所を押すと同じボタンが出ます。' +
      '範囲を選んで「消す」を押すと、その範囲の分をまとめて消せます。</dd>' +
      '<dt>キーボード</dt><dd>選んだあと <b>1〜4</b> で色、<b>5</b> で下線、' +
      '<b>Delete</b> で削除、<b>Esc</b> で閉じます。</dd>' +
      '<dt>重ね方</dt><dd>マーカーと下線は重ねられます。' +
      'マーカー同士・下線同士を同じ範囲に付けると、前のものが置き換わります。</dd>' +
      '<dt>文字を隠す</dt><dd>上の切り替えを入れると、マーカー部分が色の帯になります。' +
      '帯を押すとその箇所だけ文字が出ます。下線は隠しません。</dd>' +
      '<dt>印刷</dt><dd>マーカーと下線はそのまま印刷されます。</dd>' +
      '<dt>保存</dt><dd>付けた箇所は、見ているブラウザにファイル名ごとに保存されます。' +
      '同じブラウザで開き直せば元に戻ります。別の端末やブラウザには引き継がれず、' +
      'ファイル名を変えた場合も同じです。そのときは「書き出す」で保存ファイルを作り、' +
      '移した先で「読み込む」を使ってください。' +
      'ブラウザの閲覧データを消すと、記録も消えます。</dd>' +
      '</dl></details>';
    document.body.appendChild(panel);
    panel.querySelector('.x').onclick = function () { panel.classList.remove('on'); };
    panel.querySelectorAll('.f button').forEach(function (b) {
      b.onclick = function () {
        panel.querySelectorAll('.f button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on'); fillList(b.getAttribute('data-f'));
      };
    });
    panel.querySelector('#hlmMask').onchange = function () {
      maskOn = this.checked; document.body.classList.toggle('hlm-mask', maskOn);
    };
    panel.querySelector('#hlmExp').onclick = expJson;
    panel.querySelector('#hlmImp').onclick = impJson;
    panel.querySelector('#hlmClr').onclick = function () {
      if (!confirm('この教材のマーカーと下線をすべて消します。よろしいですか。')) return;
      store = []; save(); renderAll(); fillList('all');
    };
  }
  function fillList(f) {
    var box = panel.querySelector('.list');
    var items = [];
    roots().forEach(function (root) {
      var rid = root.getAttribute('data-hlr');
      store.filter(function (x) { return x.r === rid; })
        .sort(function (a, b) { return a.s - b.s; })
        .forEach(function (rec) {
          if (f && f !== 'all' && rec.c !== f) return;
          var sp = document.querySelector('span.hlm[data-hid="' + rec.id + '"]');
          var txt = '';
          document.querySelectorAll('span.hlm[data-hid="' + rec.id + '"]')
            .forEach(function (s) { txt += s.textContent; });
          items.push({ rec: rec, el: sp, unit: unitOf(root), txt: txt });
        });
    });
    if (!items.length) {
      box.innerHTML = '<p class="empty">まだマーカーはありません。本文を選ぶとボタンが出ます。</p>';
      return;
    }
    var html = '', cur = '';
    items.forEach(function (it) {
      if (it.unit !== cur) { cur = it.unit; html += '<div class="u">' + esc(cur) + '</div>'; }
      html += '<div class="it" data-id="' + it.rec.id + '">' +
              '<i class="sw sw-' + it.rec.c + '"></i>' +
              '<span>' + esc(it.txt.slice(0, 90)) + (it.txt.length > 90 ? '…' : '') + '</span>' +
              '<button class="d" title="削除">✕</button></div>';
    });
    box.innerHTML = html;
    box.querySelectorAll('.it').forEach(function (el) {
      el.onclick = function (e) {
        var id = el.getAttribute('data-id');
        if (e.target.classList.contains('d')) {
          delById(id); fillList(f); return;
        }
        jump(id);
      };
    });
  }
  function jump(id) {
    var sp = document.querySelector('span.hlm[data-hid="' + id + '"]');
    if (!sp) return;
    // 閉じている解説・詳細を開く
    var p = sp;
    while (p && p !== document.body) {
      if (p.nodeName === 'DETAILS') p.open = true;
      if (p.classList && p.classList.contains('q')) p.classList.add('done');
      p = p.parentNode;
    }
    // 非表示のビューなら知識タブに戻す
    var view = sp.closest('[id^="view"]');
    if (view && view.classList.contains('hidden') && typeof window.showView === 'function') {
      window.showView(view.id.replace('view', '').toLowerCase());
    }
    sp.scrollIntoView({ behavior: 'smooth', block: 'center' });
    sp.classList.add('flash');
    setTimeout(function () { sp.classList.remove('flash'); }, 1400);
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------- 書き出し・読み込み ---------- */
  function expJson() {
    var b = new Blob([JSON.stringify({ file: KEY, data: store }, null, 1)],
                     { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = KEY.replace(/[^\w.-]/g, '_') + '.json';
    a.click();
  }
  function impJson() {
    var i = document.createElement('input');
    i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = function () {
      var f = i.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var o = JSON.parse(r.result);
          var d = Array.isArray(o) ? o : o.data;
          if (!Array.isArray(d)) throw 0;
          store = d; save(); renderAll(); fillList('all');
          alert(d.length + '件を読み込みました。');
        } catch (e) { alert('読み込めませんでした。'); }
      };
      r.readAsText(f);
    };
    i.click();
  }

  /* ---------- 起動 ---------- */
  function boot() {
    setupRoots();
    renderAll();

    var fab = document.createElement('button');
    fab.id = 'hlmFab'; fab.textContent = 'マーカー一覧';
    fab.onclick = function () {
      if (!panel) buildPanel();
      panel.classList.toggle('on');
      if (panel.classList.contains('on')) {
        panel.querySelector('#hlmMask').checked = maskOn;
        fillList('all');
      }
    };
    document.body.appendChild(fab);

    document.addEventListener('mouseup', onSel);
    document.addEventListener('touchend', function (ev) { setTimeout(function () { onSel(ev); }, 10); });

    function onSel(e) {
      if (pop && pop.contains(e && e.target)) return;
      if (panel && panel.contains(e && e.target)) return;
      var sel = window.getSelection();
      var rg = sel && sel.rangeCount ? sel.getRangeAt(0) : null;
      if (!rg || rg.collapsed) {
        // マーカーを押したときは操作ボタンを出す（選択範囲が無い場合も）
        var tg = e && e.target ? e.target : null;
        var sp = tg && tg.nodeType ? upto(tg, 'hlm') : null;
        if (sp && sp.getAttribute('data-hid')) {
          lastHid = sp.getAttribute('data-hid');
          lastSel = document.createRange();
          lastSel.selectNodeContents(sp);
          showPop(rectOf(lastSel));
          return;
        }
        hidePop(); lastSel = null; lastHid = null; return;
      }
      lastHid = null;
      if (!rootOf(rg.commonAncestorContainer)) { hidePop(); return; }
      lastSel = rg.cloneRange();
      showPop(rectOf(rg));
    }

    document.addEventListener('keydown', function (e) {
      if (!pop || !pop.classList.contains('on')) return;
      var t = e.target.nodeName;
      if (t === 'INPUT' || t === 'TEXTAREA' || e.target.isContentEditable) return;
      if (e.key === 'Escape') { hidePop(); return; }
      if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); delRange(); return; }
      var i = ['1', '2', '3', '4'].indexOf(e.key);
      if (i >= 0) { e.preventDefault(); addMark(COLORS[i].k); return; }
      if (e.key === '5') { e.preventDefault(); addMark('u'); }
    });

    // 隠した文字は押すと出す
    document.addEventListener('click', function (e) {
      if (!maskOn) return;
      var sp = upto(e.target, 'hlm');
      if (sp && sp.getAttribute('data-hid')) {
        document.querySelectorAll('span.hlm[data-hid="' + sp.getAttribute('data-hid') + '"]')
          .forEach(function (x) { x.classList.toggle('peek'); });
      }
    });

    // タブ切替や再描画で DOM が変わったら付け直す
    var tm = null, busy = false;
    function refresh() {
      if (busy) return;
      clearTimeout(tm);
      tm = setTimeout(function () {
        busy = true;
        try { setupRoots(); renderAll(); } catch (e) {}
        setTimeout(function () { busy = false; }, 60);
      }, 140);
    }
    document.querySelectorAll('.navtabs button').forEach(function (b) {
      b.addEventListener('click', refresh);
    });
    if (window.MutationObserver) {
      var mo = new MutationObserver(function (list) {
        if (busy) return;
        for (var i = 0; i < list.length; i++) {
          var m = list[i];
          // マーカー自身の出し入れは無視する
          var own = false;
          [].forEach.call(m.addedNodes, function (n) {
            if (n.nodeType === 1 && n.classList && n.classList.contains('hlm')) own = true;
          });
          [].forEach.call(m.removedNodes, function (n) {
            if (n.nodeType === 1 && n.classList && n.classList.contains('hlm')) own = true;
          });
          if (own) continue;
          if (m.target && m.target.closest &&
              (m.target.closest('#hlmPanel') || m.target.closest('#hlmPop'))) continue;
          // 中身が差し替わった場合だけ拾う
          if (m.addedNodes.length &&
              [].some.call(m.addedNodes, function (n) {
                return n.nodeType === 1 && (n.classList.contains('page') ||
                       n.querySelector && n.querySelector('.page'));
              })) { refresh(); return; }
        }
      });
      mo.observe(document.body, { childList: true, subtree: true });
    }
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body></html>
