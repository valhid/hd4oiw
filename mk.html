<!doctype html><html lang="ja"><head><meta name="robots" content="noindex, nofollow, noarchive, noimageindex"><meta name="googlebot" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>総合旅行業務取扱管理者試験 予想問題集</title>
<style>:root { --paper: #E8E9E3; --surface: #FCFCFA; --surface2: #F1F2ED; --sunken: #E2E4DC; --ink: #14171A; --ink2: #4C514C; --ink3: #7B8079; --rule: #CCCFC6; --rule2: #E1E3DC; --ai: #1E3A52; --aiSoft: #E2E9EF; --aiLine: #8FA6B8; --shu: #A2382A; --shuSoft: #F4E5E1; --shuLine: #C98577; --koke: #3A6647; --kokeSoft: #E1EBE3; --kokeLine: #86A992; --kin: #7E6423; --kinSoft: #F0EAD8; --shadow: 0 1px 0 rgba(20,23,26,.04), 0 6px 18px -12px rgba(20,23,26,.28); --mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Songti SC",serif; --gothic: "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Helvetica Neue",Arial,sans-serif; --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace; }


[data-theme="dark"] { --paper: #16181A; --surface: #1D2023; --surface2: #23272A; --sunken: #101214; --ink: #E6E8E4; --ink2: #AAB0AB; --ink3: #7D847E; --rule: #363B3D; --rule2: #2A2E31; --ai: #9EC2DC; --aiSoft: #1F2C36; --aiLine: #41637C; --shu: #E08575; --shuSoft: #33211E; --shuLine: #7E4438; --koke: #8FC5A0; --kokeSoft: #1C2A21; --kokeLine: #3E6249; --kin: #D6BC7A; --kinSoft: #2A2519; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px -12px rgba(0,0,0,.7); }


*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--gothic);font-size:15px;line-height:1.9;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit}
svg text,svg tspan{font-family:var(--gothic)}
.top{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;padding:8px 16px;box-shadow:var(--shadow)}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;background:var(--shu);color:#fff;font-family:var(--mincho);font-size:15px;border-radius:2px}
.brand h1{margin:0;font-family:var(--mincho);font-size:14.5px;letter-spacing:.08em;font-weight:600}
.brand .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--ink3)}
.brand{display:flex;align-items:center;gap:9px}
.navtabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:3px;border:1px solid var(--rule2);flex-wrap:wrap}
.navtabs button{border:0;background:transparent;padding:6px 12px;border-radius:2px;cursor:pointer;font-size:12.5px;color:var(--ink2)}
.navtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--rule);background:var(--surface);color:var(--ink2);border-radius:2px;padding:5px 10px;font-size:12px;cursor:pointer}
.iconbtn:hover{border-color:var(--ink3)}
.menubtn{display:none}
.wrap{display:grid;grid-template-columns:262px 1fr;align-items:start}
.side{position:sticky;top:47px;max-height:calc(100vh - 47px);overflow:auto;border-right:1px solid var(--rule);padding:16px 12px 40px;background:var(--surface)}
.side h2{margin:0 0 10px;font-family:var(--mincho);font-size:11px;letter-spacing:.22em;color:var(--ink3)}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:grid;grid-template-columns:26px 1fr auto;gap:7px;align-items:baseline;text-decoration:none;color:var(--ink2);padding:7px 8px;border-radius:2px;font-size:13px;line-height:1.5;cursor:pointer}
.toc a:hover{background:var(--surface2)}
.toc a.on{background:var(--aiSoft);color:var(--ink);font-weight:600}
.toc .n{font-family:var(--mono);font-size:10.5px;color:var(--shu)}
.toc .pct{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.sidefoot{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px;display:grid;gap:6px}
.sidefoot button{border:1px solid var(--rule);background:var(--surface);color:var(--ink2);border-radius:2px;padding:6px 9px;font-size:11.5px;cursor:pointer;text-align:left}
.sidefoot button:hover{border-color:var(--ink3)}
main{min-width:0}
.page{max-width:860px;margin:0 auto;padding:26px 26px 90px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--ink3);margin:0 0 6px}
h2.sec{font-family:var(--mincho);font-size:25px;letter-spacing:.06em;margin:0 0 18px;font-weight:600;line-height:1.5}
.aim{border:1px solid var(--aiLine);background:var(--aiSoft);border-radius:3px;padding:14px 18px;margin:0 0 26px}
.aim .t{font-family:var(--mincho);font-size:11px;letter-spacing:.2em;color:var(--ai);margin-bottom:7px}
.aim ul{margin:0;padding-left:20px}
.aim li{font-size:13.5px;line-height:1.85;margin-bottom:3px}
.content h3{font-family:var(--mincho);font-size:17px;letter-spacing:.05em;margin:34px 0 12px;font-weight:600;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--rule);padding-bottom:7px}
.content h3 .no{display:inline-grid;place-items:center;min-width:22px;height:22px;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;border-radius:2px}
.content p{margin:0 0 12px;font-size:14.5px}
.content p.note{font-size:13px;color:var(--ink2);background:var(--surface2);border-left:2px solid var(--kin);padding:9px 13px;border-radius:0 2px 2px 0}
b.r{color:var(--shu)}
.fig{margin:18px 0 22px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;padding:14px 16px}
.fig figcaption{font-family:var(--mincho);font-size:12px;color:var(--ink2);margin-bottom:10px;display:flex;gap:9px;align-items:baseline}
.fig .fn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--shu);border:1px solid var(--shuLine);padding:1px 6px;border-radius:2px}
.fig svg{width:100%;height:auto;display:block}
.fig p.note{margin:12px 0 0}
.scrollx{overflow-x:auto;margin:0 0 16px}
table.mx{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
table.mx th,table.mx td{border:1px solid var(--rule);padding:9px 12px;text-align:left;vertical-align:top;line-height:1.75}
table.mx thead th{background:var(--surface2);font-family:var(--mincho);font-size:12.5px;letter-spacing:.06em}
table.mx tbody th{background:var(--surface2);font-weight:600;white-space:nowrap}
table.mx small{color:var(--ink3);font-size:11.5px}
.warn{border:1px solid var(--shuLine);background:var(--shuSoft);border-radius:3px;padding:13px 16px;margin:16px 0 20px}
.warn .lbl{display:inline-block;font-family:var(--mincho);font-size:10.5px;letter-spacing:.16em;color:#fff;background:var(--shu);padding:2px 9px;border-radius:2px;margin-bottom:8px}
.warn ul{margin:0;padding-left:20px}
.warn li{font-size:13.5px;line-height:1.85;margin-bottom:4px}
.arts{margin:34px 0 0;border-top:1px solid var(--rule);padding-top:18px}
.arts .ah{font-family:var(--mincho);font-size:11.5px;letter-spacing:.16em;color:var(--ink3);margin:0 0 10px}
details.art{border:1px solid var(--rule);border-radius:2px;background:var(--surface);margin-bottom:6px}
details.art summary{cursor:pointer;padding:9px 13px;display:flex;gap:10px;align-items:center;font-size:13px;list-style:none}
details.art summary::-webkit-details-marker{display:none}
details.art summary::before{content:"▸";color:var(--ink3);font-size:11px}
details.art[open] summary::before{content:"▾"}
details.art .no{font-family:var(--mincho);font-weight:600;letter-spacing:.06em}
details.art .cp{color:var(--ink2)}
details.art .tg{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3);border:1px solid var(--rule2);padding:1px 6px;border-radius:2px}
.artbody{padding:2px 15px 14px;font-size:13px;line-height:1.95;color:var(--ink2);border-top:1px dotted var(--rule)}
.artbody p{margin:10px 0 0}
ol.it{margin:8px 0 0;padding-left:22px}
ol.it li{margin-bottom:5px}
.check{margin:34px 0 0;padding:20px 20px 8px;background:var(--sunken);border:1px solid var(--rule);border-radius:3px}
.check>h4{margin:0 0 4px;font-family:var(--mincho);font-size:15px;letter-spacing:.08em;display:flex;align-items:center;gap:9px}
.check>h4 .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;background:var(--ai);color:var(--surface);padding:2px 7px;border-radius:2px}
[data-theme="dark"] .check>h4 .tag{color:#1d2023}
.check .hint{font-size:12px;color:var(--ink3);margin:0 0 14px}
.q{border:1px solid var(--rule);border-radius:3px;background:var(--surface);margin:0 0 12px;overflow:hidden}
.q.ok{border-color:var(--kokeLine)}.q.ng{border-color:var(--shuLine)}
.q .qhead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--rule2);font-size:11px;flex-wrap:wrap}
.q.ok .qhead{background:var(--kokeSoft)}.q.ng .qhead{background:var(--shuSoft)}
.q .qid{font-family:var(--mono);letter-spacing:.08em;color:var(--ink3)}
.q .qtype{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;padding:1px 6px;border-radius:2px;border:1px solid var(--aiLine);color:var(--ai);background:var(--surface)}
.q .qtopic,.q .qsrc{font-size:10.5px;color:var(--ink2);background:var(--surface);border:1px solid var(--rule2);padding:1px 7px;border-radius:2px}
.q .rep{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;padding:1px 6px;border-radius:2px;background:var(--kin);color:#fff}
.q .sp{flex:1}
.q .star{border:0;background:transparent;cursor:pointer;font-size:15px;color:var(--ink3);padding:2px 4px;opacity:.35}
.q .star[aria-pressed="true"]{color:var(--kin);opacity:1}
.q .body{padding:14px 16px}
.q .stem{margin:0 0 12px;font-size:14.5px;line-height:1.85;white-space:pre-wrap}
.q figure{margin:0 0 12px;text-align:center}
.q figure img{max-width:100%;border:1px solid var(--rule2);border-radius:2px}
.kijutsu{list-style:none;margin:0 0 14px;padding:0;border:1px solid var(--rule2);border-radius:2px;background:var(--surface2)}
.kijutsu li{display:grid;grid-template-columns:38px 1fr;gap:6px;padding:9px 12px;font-size:14px;line-height:1.8;border-bottom:1px dotted var(--rule2)}
.kijutsu li:last-child{border-bottom:0}
.kijutsu .kk{font-family:var(--mincho);color:var(--ai);font-weight:600}
.opts{list-style:none;margin:0 0 12px;padding:0}
.opts li{margin:0 0 6px}
.opts label{display:grid;grid-template-columns:22px 1fr;gap:9px;align-items:start;cursor:pointer;padding:8px 10px;border:1px solid var(--rule2);border-radius:2px;background:var(--surface);font-size:14px;line-height:1.7;white-space:pre-wrap}
.opts label:hover{border-color:var(--ink3)}
.q.done .opts label{cursor:default}
.opts .lb{font-family:var(--mono);color:var(--ink3);font-size:12.5px;padding-top:2px}
.opts .mk{display:none;font-family:var(--mono);font-size:11px;margin-left:6px;padding:0 5px;border-radius:2px}
.q.done .opts .mk{display:inline-block}
.opts li.right label{border-color:var(--kokeLine);background:var(--kokeSoft)}
.opts li.right .mk{background:var(--koke);color:#fff}
.opts li.wrong label{border-color:var(--shuLine);background:var(--shuSoft)}
.opts li.wrong .mk{background:var(--shu);color:#fff}
.opts small{display:none;margin-top:5px;font-size:12px;color:var(--ink3);line-height:1.75}
.q.done .opts small{display:block}
.qbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:2px;padding:7px 15px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ai);border-color:var(--ai);color:#fff}
.verdict{font-family:var(--mincho);font-size:14px;letter-spacing:.1em;font-weight:600}
.verdict.ok{color:var(--koke)}.verdict.ng{color:var(--shu)}
.exp{margin:12px 0 0;border-top:1px dotted var(--rule);padding-top:12px;font-size:13.5px;line-height:1.85;color:var(--ink2)}
.exp[hidden]{display:none}
.exp .ttl{font-family:var(--mincho);font-size:11px;letter-spacing:.18em;color:var(--ink3);margin-bottom:6px}
.exp .ref{display:inline-block;margin-top:8px;font-size:11.5px;font-family:var(--mono);color:var(--ink3);border:1px solid var(--rule2);padding:2px 8px;border-radius:2px}
.secnav{display:flex;justify-content:space-between;gap:10px;margin:36px 0 0;border-top:1px solid var(--rule);padding-top:14px}
.secnav a{text-decoration:none;color:var(--ink2);font-size:13px;cursor:pointer;padding:8px 12px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);min-width:44%}
.secnav a:hover{border-color:var(--ink3)}
.secnav .k{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:3px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}
.hidden{display:none}
@media(max-width:900px){
 .wrap{grid-template-columns:1fr}
 .menubtn{display:inline-block}
 .side{position:fixed;left:0;top:47px;bottom:0;width:270px;z-index:55;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
 .side.open{transform:none}
 .page{padding:18px 14px 80px}
 h2.sec{font-size:21px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.toolbar{position:sticky;top:47px;z-index:40;background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:11px 13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;box-shadow:var(--shadow)}
.toolbar .grp{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:3px;border:1px solid var(--rule2);flex-wrap:wrap}
.toolbar .grp button{border:0;background:transparent;padding:5px 10px;border-radius:2px;cursor:pointer;font-size:12px;color:var(--ink2)}
.toolbar .grp button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.toolbar select{font-size:12.5px;padding:6px 9px;border:1px solid var(--rule);border-radius:2px;background:var(--surface);color:var(--ink)}
.toolbar .stat{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.toolbar .stat b{color:var(--koke)}.toolbar .stat i{font-style:normal;color:var(--shu)}
.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0 0}
.overview button{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:2px;padding:12px 14px;cursor:pointer;color:inherit}
.overview button:hover{border-color:var(--ink3)}
.overview .n{font-family:var(--mono);font-size:11px;color:var(--shu);letter-spacing:.1em}
.overview .t{font-family:var(--mincho);font-size:14px;margin:2px 0 6px}
.overview .m{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.exambar{position:sticky;top:47px;z-index:40;display:flex;gap:14px;align-items:center;background:var(--ai);color:#fff;padding:10px 14px;border-radius:3px;margin-bottom:14px;font-size:13px;flex-wrap:wrap}
.exambar .t{font-family:var(--mono);font-size:17px}.exambar .sp{flex:1}
.exambar button{border:1px solid rgba(255,255,255,.5);background:transparent;color:inherit;border-radius:2px;padding:5px 12px;font-size:12px;cursor:pointer}
.result{text-align:center;padding:22px;border:1px solid var(--rule);background:var(--surface);border-radius:3px;margin-bottom:16px}
.result .score{font-family:var(--mono);font-size:40px}
.result .judge{font-family:var(--mincho);font-size:22px;letter-spacing:.14em;margin-top:6px}
.result .judge.pass{color:var(--koke)}.result .judge.fail{color:var(--shu)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin:14px 0}
.nums div{border:1px solid var(--rule);background:var(--surface);border-radius:2px;padding:9px 11px}
.nums .v{font-family:var(--mono);font-size:17px;color:var(--shu);line-height:1.3}
.nums .l{font-size:11.5px;color:var(--ink2);margin-top:2px}
.bar{display:grid;grid-template-columns:210px 1fr 62px;gap:10px;align-items:center;margin-bottom:6px;font-size:12.5px}
.bar .tr{height:14px;background:var(--sunken);border:1px solid var(--rule);border-radius:1px;overflow:hidden}
.bar .fl{height:100%;background:var(--ai)}
.bar .vn{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:right}
.empty{margin:64px auto;text-align:center;color:var(--ink3);font-size:14px}
.empty .big{font-family:var(--mincho);font-size:20px;color:var(--ink2);margin-bottom:10px}
#markCount{font-family:var(--mono);font-size:10px;color:var(--kin)}
@media(max-width:640px){.bar{grid-template-columns:1fr 78px 44px;font-size:12px}}

/* ── 予想問題の追加スタイル ── */
.setpick{display:grid;gap:10px;margin:0 0 22px}
.setcard{border:1px solid var(--rule);border-radius:2px;background:var(--surface);padding:14px 16px;cursor:pointer;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.setcard:hover{border-color:var(--ai)}
.setcard .sn{font-family:var(--mincho);font-size:22px;color:var(--shu);line-height:1}
.setcard .st{font-weight:600;font-size:14.5px}
.setcard .sd{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.7}
.setcard .sg{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.subtabs button{border:1px solid var(--rule);background:var(--surface);border-radius:2px;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.subtabs button[aria-selected="true"]{background:var(--ai);color:#fff;border-color:var(--ai);font-weight:600}
.exhead{border:1px solid var(--rule);border-left:3px solid var(--shu);background:var(--surface2);padding:12px 16px;margin:0 0 18px;border-radius:2px}
.exhead .t{font-weight:700;font-size:15px}
.exhead .m{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:4px}
.why{border:1px solid var(--kokeLine);background:var(--kokeSoft);border-radius:2px;padding:9px 12px;margin-top:9px;font-size:12.5px;line-height:1.85}
.why b{color:var(--koke)}
.why .lbl{font-family:var(--mincho);font-size:10.5px;letter-spacing:.14em;color:var(--koke);display:block;margin-bottom:3px}
.qfig{margin:12px 0;border:1px solid var(--rule2);border-radius:2px;background:var(--surface);padding:12px;overflow-x:auto}
.qfig svg{display:block;max-width:100%;height:auto;min-width:520px}
.qfig figcaption{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-bottom:8px}
@media(max-width:820px){.qfig svg{min-width:440px}}
</style>
<style id="hlmarkCss">/* HLMARK-v1 */
/* ============ マーカー・下線 ============ */
.hlm{border-radius:2px;padding:0 .04em;box-decoration-break:clone;
 -webkit-box-decoration-break:clone;cursor:pointer}
.hlm-y{background:#FBEFA8}
.hlm-g{background:#CFE9CE}
.hlm-b{background:#CFE0F2}
.hlm-p{background:#F7D5E0}
.hlm-u{background:none;border-bottom:2px solid #A2382A;padding-bottom:1px}
.hlm.flash{outline:2px solid var(--shu);outline-offset:2px;
 animation:hlmFlash 1.4s ease-out}
@keyframes hlmFlash{0%{outline-color:var(--shu)}100%{outline-color:transparent}}

/* 文字を隠す（下線は対象外） */
body.hlm-mask .hlm-y,body.hlm-mask .hlm-g,
body.hlm-mask .hlm-b,body.hlm-mask .hlm-p{color:transparent}
body.hlm-mask .hlm.peek{color:inherit}

/* ---- 操作ボタン ---- */
#hlmPop{position:absolute;z-index:9999;display:none;gap:2px;padding:4px;
 background:var(--surface);border:1px solid var(--rule);border-radius:8px;
 box-shadow:0 6px 24px -8px rgba(20,23,26,.35);font-family:var(--gothic)}
#hlmPop.on{display:flex}
#hlmPop button{display:flex;align-items:center;gap:4px;padding:5px 8px;
 border:0;border-radius:6px;background:transparent;cursor:pointer;
 font-size:12.5px;color:var(--ink);white-space:nowrap;font-family:inherit}
#hlmPop button:hover{background:var(--surface2)}
#hlmPop .sep{width:1px;background:var(--rule2);margin:2px 3px}
#hlmPop.bottom{position:fixed;left:8px!important;right:8px;top:auto!important;
 bottom:calc(8px + env(safe-area-inset-bottom));justify-content:center;
 flex-wrap:wrap}

.sw{display:inline-block;width:13px;height:13px;border-radius:3px;
 border:1px solid rgba(20,23,26,.18)}
.sw-y{background:#FBEFA8}.sw-g{background:#CFE9CE}
.sw-b{background:#CFE0F2}.sw-p{background:#F7D5E0}
.sw-u{background:none;border:0;border-bottom:2px solid #A2382A;
 border-radius:0;height:9px}

/* ---- 一覧を開くボタン ---- */
#hlmFab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
 z-index:9990;padding:9px 14px;border:1px solid var(--rule);border-radius:999px;
 background:var(--surface);color:var(--ink);font-size:12.5px;cursor:pointer;
 box-shadow:var(--shadow);font-family:var(--gothic)}
#hlmFab:hover{background:var(--surface2)}

/* ---- 一覧 ---- */
#hlmPanel{position:fixed;right:0;top:0;bottom:0;width:min(380px,92vw);
 z-index:9995;display:none;flex-direction:column;background:var(--surface);
 border-left:1px solid var(--rule);box-shadow:-8px 0 30px -18px rgba(20,23,26,.4);
 font-family:var(--gothic)}
#hlmPanel.on{display:flex}
#hlmPanel .hd{display:flex;align-items:center;justify-content:space-between;
 padding:12px 14px;border-bottom:1px solid var(--rule2);font-size:14px}
#hlmPanel .hd .x{border:0;background:transparent;cursor:pointer;
 font-size:15px;color:var(--ink2);padding:2px 6px}
#hlmPanel .tools{padding:10px 14px;border-bottom:1px solid var(--rule2);
 display:flex;flex-direction:column;gap:8px}
#hlmPanel .f{display:flex;gap:5px;flex-wrap:wrap}
#hlmPanel .f button{padding:4px 9px;border:1px solid var(--rule);
 border-radius:999px;background:var(--surface);cursor:pointer;font-size:12px;
 color:var(--ink2);font-family:inherit;line-height:1.5}
#hlmPanel .f button.on{background:var(--ink);color:var(--paper);
 border-color:var(--ink)}
#hlmPanel .mk{display:flex;align-items:center;gap:6px;font-size:12.5px;
 color:var(--ink2);cursor:pointer}
#hlmPanel .io{display:flex;gap:6px}
#hlmPanel .io button{flex:1;padding:5px;border:1px solid var(--rule);
 border-radius:6px;background:var(--surface);cursor:pointer;font-size:12px;
 color:var(--ink2);font-family:inherit}
#hlmPanel .io button:hover{background:var(--surface2)}
#hlmPanel .list{flex:1;overflow:auto;padding:6px 0 20px}
#hlmPanel .u{padding:9px 14px 4px;font-size:11.5px;color:var(--ink3);
 font-weight:700;letter-spacing:.02em;position:sticky;top:0;
 background:var(--surface)}
#hlmPanel .it{display:flex;align-items:flex-start;gap:7px;padding:7px 14px;
 cursor:pointer;font-size:12.5px;line-height:1.7;color:var(--ink)}
#hlmPanel .it:hover{background:var(--surface2)}
#hlmPanel .it .sw{flex:0 0 auto;margin-top:4px}
#hlmPanel .it span{flex:1}
#hlmPanel .it .d{border:0;background:transparent;cursor:pointer;
 color:var(--ink3);font-size:12px;padding:0 2px;opacity:0}
#hlmPanel .it:hover .d{opacity:1}
#hlmPanel .empty{padding:20px 14px;font-size:12.5px;color:var(--ink3);
 line-height:1.9}

#hlmPanel .help{border-top:1px solid var(--rule2);font-size:12px;
 color:var(--ink2);background:var(--surface2)}
#hlmPanel .help summary{padding:10px 14px;cursor:pointer;font-size:12.5px;
 color:var(--ink);list-style:none}
#hlmPanel .help summary::-webkit-details-marker{display:none}
#hlmPanel .help summary::before{content:"＋ ";color:var(--ink3)}
#hlmPanel .help[open] summary::before{content:"− "}
#hlmPanel .help dl{margin:0;padding:0 14px 14px}
#hlmPanel .help dt{font-weight:700;color:var(--ink);margin-top:9px;
 font-size:12px}
#hlmPanel .help dd{margin:2px 0 0;line-height:1.85}

@media print{
 #hlmPop,#hlmFab,#hlmPanel{display:none!important}
 .hlm{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body.hlm-mask .hlm{color:inherit!important}
}

<script>
const SETS=[{"mark":"A","title":"セットA　標準編","desc":"毎年出題される中心論点に、直近2年で出題がなく次に出やすい周期論点を加えた構成。まずここから。","n":139,"q":[{"id":"Alaw01","no":1,"sub":"law","topic":"目的・定義","stem":"旅行業法の目的に関する次の記述のうち、正しいものはどれか。","opts":{"a":"旅行業等を営む者について登録制度を実施し、あわせて旅行業等を営む者の業務の適正な運営を確保するとともに、その組織する団体の適正な活動を促進することにより、旅行業務に関する取引の公正の維持、旅行の安全の確保及び旅行者の利便の増進を図ることを目的とする。","b":"旅行業等を営む者について許可制度を実施し、旅行業等を営む者の利便の増進を図ることを目的とする。","c":"旅行業等を営む者について登録制度を実施し、旅行業等を営む者の経営の安定を図ることを目的とする。","d":"旅行業等を営む者について届出制度を実施し、旅行業務に関する取引の公正の維持を図ることを目的とする。"},"ans":["a"],"pt":4,"exp":"法1条の目的規定。①登録制度の実施 ②業務の適正な運営の確保 ③団体の適正な活動の促進 という手段により、④取引の公正の維持 ⑤旅行の安全の確保 ⑥旅行者の利便の増進 を図る。bの「許可制度」「旅行業者の利便」、cの「経営の安定」、dの「届出制度」はいずれも誤り。","why":"目的・定義は5年連続で毎年2問出題。とくに目的規定は「旅行業者の利便」など主体をすり替える誤答が定番で、2024年度にも同型が出た。","ref":"旅行業法第1条"},{"id":"Alaw02","no":2,"sub":"law","topic":"目的・定義","stem":"旅行業法に定める用語に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"「企画旅行」とは、旅行の目的地及び日程、運送又は宿泊のサービスの内容並びに旅行者が支払うべき対価に関する事項を定めた旅行に関する計画を作成し、これにより実施する旅行をいう。","b":"「運送等関連サービス」とは、運送及び宿泊のサービス以外の旅行に関するサービスをいう。","c":"「旅行業者代理業」とは、旅行業を営む者のため旅行業務について代理して契約を締結する行為を行う事業をいう。","d":"「旅行サービス手配業」とは、報酬を得て、旅行者のため、運送等サービスの提供を受けることについて代理して契約を締結する行為を行う事業をいう。"},"ans":["d"],"pt":4,"exp":"旅行サービス手配業は「旅行者のため」ではなく「旅行業を営む者のため」（外国の旅行業者を含む）に、運送等サービス等の提供につき提供者との間で代理・媒介・取次ぎをする事業。主体を旅行者にすり替える誤答が繰り返し出る。a・b・cは正しい。","why":"用語の定義は毎年出題。手配業の定義は「誰のため」を入れ替える形が定番で、2021・2024年度に類題。","ref":"旅行業法第2条"},{"id":"Alaw03","no":3,"sub":"law","topic":"登録制度","stem":"旅行業の登録に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"第1種旅行業の新規登録の申請は、主たる営業所の所在地を管轄する都道府県知事を経由して観光庁長官に対して行う。","b":"旅行業の登録の有効期間は、登録の日から起算して5年である。","c":"有効期間の満了後引き続き旅行業を営もうとする者は、有効期間の満了の日の2か月前までに更新登録の申請をしなければならない。","d":"更新登録の申請があった場合において、有効期間の満了の日までにその申請に対する処分がなされないときは、従前の登録は有効期間の満了後もその処分がなされるまでの間は効力を有する。"},"ans":["a","b","d"],"pt":4,"exp":"cの更新登録の申請期限は有効期間満了の日の「2か月前まで」ではなく、有効期間満了の日の2か月前までに申請する旨の規定はあるが、正確には有効期間の満了の日の2か月前までに申請しなければならないとされている（この点は正しい記述）。本問では申請期限を誤って記載しているため誤り。a・b・dは正しい。","why":"登録制度は毎年3〜4問出題される最頻出分野。とくに有効期間5年と更新登録のみなし継続（d）はセットで問われる。2022〜2025年度いずれも出題。","ref":"旅行業法第3条・第6条の2・第6条の3"},{"id":"Alaw04","no":4,"sub":"law","topic":"登録制度","stem":"旅行業の登録の拒否事由に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業法の規定により登録を取り消され、その取消しの日から5年を経過していない者は、登録を拒否される。","b":"破産手続開始の決定を受けて復権を得ない者は、登録を拒否される。","c":"心身の故障により旅行業を適正に営むことができない者として国土交通省令で定めるものは、登録を拒否される。","d":"申請前3年以内に旅行業務に関し不正な行為をした者は、登録を拒否される。"},"ans":["a","b","c"],"pt":4,"exp":"dは「申請前3年以内」ではなく「申請前5年以内」に旅行業務に関し不正な行為をした者が拒否事由。年数を1年・3年に変える誤答が定番。a・b・cは法6条1項の拒否事由として正しい。","why":"欠格事由は5年連続で毎年2〜3問。年数（5年）と「復権を得ない」の2点が繰り返し狙われる。","ref":"旅行業法第6条"},{"id":"Alaw05","no":5,"sub":"law","topic":"登録制度","stem":"旅行業者の変更登録及び変更届出に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"旅行業者が登録業務範囲を変更しようとするときは、変更登録を受けなければならない。","b":"旅行業者は、氏名又は名称及び住所に変更があったときは、変更の日から30日以内にその旨を登録行政庁に届け出なければならない。","c":"旅行業者は、営業所の名称及び所在地に変更があったときは、あらかじめ登録行政庁の許可を受けなければならない。","d":"旅行業者代理業者は、所属旅行業者の氏名又は名称及び住所に変更があったときは、変更の日から30日以内にその旨を登録行政庁に届け出なければならない。"},"ans":["c"],"pt":4,"exp":"営業所の名称・所在地の変更は事後の「届出」（変更の日から30日以内）で足り、事前の許可は不要。変更「登録」が必要なのは登録業務範囲の変更のみ。事前許可・事前届出とする誤答が定番。","why":"変更登録・変更届出は5年連続出題。「変更登録が必要なもの」と「届出で足りるもの」の切り分けが毎年問われる。","ref":"旅行業法第6条の4"},{"id":"Alaw06","no":6,"sub":"law","topic":"営業保証金","stem":"営業保証金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、営業保証金を供託し、その旨を登録行政庁に届け出た後でなければ事業を開始してはならない。","b":"営業保証金は、金銭のほか国土交通省令で定める有価証券をもって供託することができる。","c":"旅行業者と旅行業務に関し取引をした旅行者は、その取引によって生じた債権に関し、営業保証金から弁済を受ける権利を有する。","d":"旅行業者に旅行サービスを提供した運送機関は、その債権に関し、営業保証金から弁済を受ける権利を有する。"},"ans":["a","b","c"],"pt":4,"exp":"dの営業保証金から弁済を受けられるのは「旅行業務に関し取引をした旅行者」に限られる。運送機関・宿泊機関等のサービス提供者は対象外。この点は弁済業務保証金と共通の論点。","why":"営業保証金は2022年度以降4年連続で出題。「弁済を受けられるのは旅行者のみ」は営業保証金・弁済業務保証金の双方で問われる基本論点。","ref":"旅行業法第7条・第8条"},{"id":"Alaw07","no":7,"sub":"law","topic":"受託契約","stem":"受託契約に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"旅行業者は、他の旅行業者を代理して企画旅行契約を締結することについて、当該他の旅行業者と受託契約を締結することができる。","b":"受託契約を締結した旅行業者（受託旅行業者）は、委託旅行業者を代理して、委託旅行業者が実施する募集型企画旅行契約を締結することができる。","c":"旅行業者代理業者は、その所属旅行業者が委託旅行業者から委託を受けた募集型企画旅行契約を、所属旅行業者を代理して締結することができる。","d":"受託契約を締結するときは、あらかじめ登録行政庁の認可を受けなければならない。"},"ans":["d"],"pt":4,"exp":"受託契約の締結に登録行政庁の認可は不要。当事者間の契約により行うことができる。「認可」「届出」を要するとする誤答が定番。a・b・cは正しい。","why":"受託契約は5年連続で毎年1問出題される安定分野。認可の要否と、代理業者が受託契約に基づく契約を締結できるかの2点が繰り返し問われる。","ref":"旅行業法第14条の2"},{"id":"Alaw08","no":8,"sub":"law","topic":"旅行業務取扱管理者","stem":"旅行業務取扱管理者の選任に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者等は、営業所ごとに、1人以上の旅行業務取扱管理者を選任しなければならない。","b":"旅行業務取扱管理者は、他の営業所の旅行業務取扱管理者を兼ねることができない。","c":"旅行業者等は、旅行業務取扱管理者が欠けるに至ったときは、新たに旅行業務取扱管理者を選任するまでの間、当該営業所において旅行業務に関する契約を締結してはならない。","d":"旅行業者等は、旅行業務取扱管理者に対し、5年ごとに旅行業協会が実施する研修を受けさせなければならない。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。なお、旅行業務取扱管理者の研修は「旅行業協会」が実施するのに対し、旅行サービス手配業務取扱管理者の研修は「登録研修機関」が実施する点が対比で問われる。","why":"旅行業務取扱管理者は5年連続で毎年2〜4問出題される最頻出分野。とくに「営業所ごとに1人以上」「兼任不可」「欠けたときの契約締結禁止」「5年ごとの研修」の4点は必出。","ref":"旅行業法第11条の2"},{"id":"Alaw09","no":9,"sub":"law","topic":"旅行業務取扱管理者","stem":"次の記述のうち、旅行業務取扱管理者が管理及び監督しなければならない職務として旅行業法施行規則に定められているものをすべて選びなさい。","opts":{"a":"旅行に関する計画の作成に関する事項","b":"料金の掲示に関する事項","c":"旅行業務に関し取引をした者からの苦情の処理に関する事項","d":"営業保証金の供託に関する事項"},"ans":["a","b","c"],"pt":4,"exp":"dの営業保証金の供託は旅行業者の義務であって、旅行業務取扱管理者の職務としては定められていない。職務は①計画の作成 ②料金の掲示 ③約款の掲示・備置き ④取引条件の説明 ⑤書面の交付 ⑥広告の表示 ⑦企画旅行の円滑な実施のための措置 ⑧苦情の処理 ⑨契約締結の年月日等の記録・書類保管 ⑩個人情報の管理 ⑪その他取引の公正等を確保するため必要な事項。","why":"管理者の職務は2024年度に3問、5年で16問と極めて高頻度。職務に含まれないもの（営業保証金の供託・弁済業務保証金分担金の納付）を混ぜる形が定番。","ref":"旅行業法施行規則第10条"},{"id":"Alaw10","no":10,"sub":"law","topic":"旅行業務取扱管理者","stem":"外務員に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"外務員は、その業務を行うときは、外務員の証明書を携帯しなければならない。","b":"外務員は、旅行者から請求があったときは、外務員の証明書を提示しなければならない。","c":"外務員は、その所属する旅行業者等に代わって、旅行業務に関する一切の裁判外の行為を行う権限を有するものとみなされる。","d":"外務員の証明書を携帯していない者は、営業所以外の場所において旅行業務について取引を行うことができるが、旅行者から請求があったときは身分を明らかにしなければならない。"},"ans":["d"],"pt":4,"exp":"外務員の証明書を携帯しない者は、営業所以外の場所で旅行業務について取引を行ってはならない。dはこれを可能とする点で誤り。cのみなし規定は、旅行者が悪意であった場合を除く。","why":"外務員は5年連続で毎年1〜2問出題。「携帯」と「請求があったときの提示」の区別、みなし代理権の範囲（裁判外の行為）が繰り返し狙われる。","ref":"旅行業法第12条の5"},{"id":"Alaw11","no":11,"sub":"law","topic":"約款・料金・標識","stem":"旅行業務の取扱いの料金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、事業の開始前に、旅行者から収受する旅行業務の取扱いの料金を定め、営業所において旅行者に見やすいように掲示しなければならない。","b":"旅行業務の取扱いの料金は、契約の種類及び内容に応じて定率、定額その他の方法により定められ、旅行者にとって明確なものでなければならない。","c":"旅行業者代理業者は、所属旅行業者が定めた料金を掲示しなければならない。","d":"旅行業者は、旅行業務の取扱いの料金を定め、又は変更しようとするときは、登録行政庁の認可を受けなければならない。"},"ans":["a","b","c"],"pt":4,"exp":"dの料金の設定・変更に登録行政庁の認可は不要（掲示のみ）。認可が必要なのは旅行業約款。この「料金＝掲示のみ／約款＝認可」の対比が最頻出。","why":"約款・料金・標識は5年で18問と法令で最多の分野。料金と約款の手続の違いは毎年どちらかの形で問われる。","ref":"旅行業法第12条"},{"id":"Alaw12","no":12,"sub":"law","topic":"約款・料金・標識","stem":"旅行業約款に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"旅行業者は、旅行業約款を定め、登録行政庁の認可を受けなければならない。これを変更しようとするときも、同様とする。","b":"観光庁長官及び消費者庁長官が標準旅行業約款を定めて公示したときは、その約款と同一の約款を定めたものは、認可を受けたものとみなされる。","c":"旅行業者は、旅行業約款を営業所において旅行者に見やすいように掲示し、又は旅行者が閲覧できるように備え置かなければならない。","d":"旅行業者代理業者は、独自の旅行業約款を定め、登録行政庁の認可を受けなければならない。"},"ans":["d"],"pt":4,"exp":"旅行業者代理業者は所属旅行業者の約款を掲示・備置きするのであって、独自の約款を定めて認可を受けるのではない。標準旅行業約款のみなし認可（b）も頻出。","why":"約款の認可・みなし認可は5年連続出題。代理業者に独自の約款を求める誤答は2023年度にも出た。","ref":"旅行業法第12条の2"},{"id":"Alaw13","no":13,"sub":"law","topic":"約款・料金・標識","stem":"旅行業者等の標識に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者等は、営業所において、公衆に見やすいように国土交通省令で定める様式の標識を掲げなければならない。","b":"標識には、登録番号、登録の有効期間、商号・名称又は氏名、旅行業務取扱管理者の氏名を記載する。","c":"旅行業者等以外の者は、標識又はこれに類似する標識を掲げてはならない。","d":"標識の様式は、旅行業者と旅行業者代理業者とで同一である。"},"ans":["a","b","c"],"pt":4,"exp":"dの標識の様式は、第1種〜第3種・地域限定旅行業者、旅行業者代理業者、旅行サービス手配業者で異なる（色や記載事項が異なる）。同一とする記述は誤り。","why":"★標識は2022〜2024年度に3年連続で出題されたが2025年度は出題なし。周期からみて次年度の出題確率が高い論点。","ref":"旅行業法第12条の9"},{"id":"Alaw14","no":14,"sub":"law","topic":"取引条件説明・書面交付","stem":"取引条件の説明に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"旅行業者等は、旅行者と旅行業務に関し契約を締結しようとするときは、旅行者が提供を受けることができる旅行に関するサービスの内容等について説明しなければならない。","b":"旅行業者等は、取引条件の説明に際し、国土交通省令で定める事項を記載した書面を交付しなければならない。","c":"旅行者の同意を得て、書面の交付に代えて、電子情報処理組織を使用する方法等により提供することができる。","d":"旅行者と締結する契約が確実に履行されると認められる場合であっても、説明書面の交付を省略することはできない。"},"ans":["d"],"pt":4,"exp":"旅行者の依頼により乗車券類等のみを手配する場合など、契約が確実に履行されると認められる一定の場合には、説明書面の交付を省略できる。dはこれを否定する点で誤り。","why":"取引条件説明・書面交付は5年で12問。「説明は必須／書面は例外的に省略可」という非対称が繰り返し問われる。","ref":"旅行業法第12条の4"},{"id":"Alaw15","no":15,"sub":"law","topic":"取引条件説明・書面交付","stem":"旅行業者等が旅行者と契約を締結したときに交付する書面に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者等は、契約を締結したときは、遅滞なく、旅行者に対し所定の事項を記載した書面を交付しなければならない。","b":"企画旅行契約の場合、書面には旅行業務取扱管理者の氏名及び旅行者の依頼に応じて説明する旨を記載しなければならない。","c":"旅行者の依頼により乗車券類のみを手配する場合において、当該乗車券類を交付するときは、書面の交付を省略することができる。","d":"旅行業者は、旅行者以外の者と旅行業務に関し契約を締結したときは、書面を交付する必要はない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行業者は、旅行者以外の者（旅行サービス提供者等）と契約を締結したときも、所定の事項を記載した書面を交付しなければならない。","why":"書面交付は毎年出題。「旅行者以外の者への交付義務」は見落とされやすく、2023・2025年度に出題実績がある。","ref":"旅行業法第12条の5"},{"id":"Alaw16","no":16,"sub":"law","topic":"広告・誇大広告","stem":"企画旅行の広告に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"企画旅行の参加者を募集するための広告をするときは、旅行の目的地及び日程に関する事項を表示しなければならない。","b":"広告には、旅行業者の登録番号を表示しなければならない。","c":"企画者以外の者の名称等を表示する場合は、企画者の名称等を当該者の名称等よりも著しく小さく表示してはならない。","d":"広告には、旅行業務取扱管理者の氏名を表示しなければならない。"},"ans":["a","b","c"],"pt":4,"exp":"dの旅行業務取扱管理者の氏名は広告の表示事項ではない（契約書面・説明書面の記載事項）。表示事項は①企画者の氏名等・住所・登録番号 ②目的地・日程 ③サービスの内容 ④旅行代金 ⑤最少催行人員 ⑥旅程管理業務を行う者の同行の有無 ほか。","why":"広告の表示事項は5年連続で毎年2〜3問。表示事項でないもの（管理者の氏名・営業保証金の額）を混ぜる形が定番。","ref":"旅行業法第12条の7"},{"id":"Alaw17","no":17,"sub":"law","topic":"広告・誇大広告","stem":"誇大広告の禁止に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"旅行業者等は、旅行業務について広告をするときは、著しく事実に相違する表示をし、又は実際のものよりも著しく優良であり、若しくは有利であると人を誤認させるような表示をしてはならない。","b":"誇大広告が禁止される事項には、旅行地における旅行者の安全の確保に関する事項が含まれる。","c":"誇大広告が禁止される事項には、感染症の発生の状況その他の旅行地における衛生に関する事項が含まれる。","d":"誇大広告の禁止は、企画旅行の募集広告についてのみ適用され、手配旅行の広告には適用されない。"},"ans":["d"],"pt":4,"exp":"誇大広告の禁止は「旅行業務について広告をするとき」に適用され、企画旅行の募集広告に限られない。禁止事項は①サービスの内容 ②旅行地の景観・環境その他の状況 ③旅行者の安全の確保 ④感染症の発生状況その他の衛生 ⑤旅行地の法令に違反する行為を行うことのあっせん等 ⑥旅行者が支払うべき対価 ⑦旅程管理業務を行う者の同行の有無 ⑧旅行業者等の業務の範囲・実績・信用。","why":"誇大広告は5年連続で毎年1問。適用範囲を「企画旅行のみ」と限定する誤答が定番。","ref":"旅行業法第12条の8"},{"id":"Alaw18","no":18,"sub":"law","topic":"旅程管理","stem":"企画旅行の円滑な実施のための措置に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、募集型企画旅行のほか、受注型企画旅行についても円滑な実施のための措置を講じなければならない。","b":"計画に定めるサービスを確実に提供するための予約その他の措置は、旅行の開始前に行う。","c":"本邦内の旅行であって、措置を講じない旨を契約の締結前に説明し、かつサービスの提供を受ける権利を表示した書面を交付したときは、旅行地における手続の実施及び代替サービスの手配の措置を要しない。","d":"本邦外の旅行であっても、権利を表示した書面を交付した場合には、措置の一部を講じないことができる。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。海外旅行はいかなる場合も措置の免除がない。免除の3条件は①本邦内の旅行 ②契約締結前の説明 ③権利表示書面の交付をすべて満たす場合に限られる。","why":"旅程管理は2025年度に2問出題され増加傾向。「海外は免除されない」は毎回問われる核心論点。","ref":"旅行業法第12条の10・施行規則第32条"},{"id":"Alaw19","no":19,"sub":"law","topic":"旅程管理","stem":"旅程管理業務を行う主任の者に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"主任の者となるために必要な実務の経験は、研修の課程を修了した日の前後1年以内に1回以上の旅程管理業務に従事した経験でよい。","b":"主任の者となるために必要な実務の経験は、研修の課程を修了した日から3年以内に2回以上の旅程管理業務に従事した経験でもよい。","c":"本邦外の企画旅行に同行する主任の者に必要な実務の経験は、本邦内の旅程管理業務に従事したものでも足りる。","d":"主任の者は、法第6条第1項第1号から第6号までのいずれにも該当しない者でなければならない。"},"ans":["c"],"pt":4,"exp":"海外の企画旅行の主任の者に必要な実務経験は「本邦外」の旅程管理業務に従事したものに限られる。海外の研修・経験は国内にも有効だが、国内の経験は海外に使えないという一方向の関係。","why":"主任の者の要件は2024・2025年度に連続出題。「前後1年に1回／から3年に2回」の数字入替えと、国内経験の海外への流用可否が定番。","ref":"旅行業法第12条の11・施行規則第33条"},{"id":"Alaw20","no":20,"sub":"law","topic":"禁止行為・監督","stem":"旅行業法に定める禁止行為に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者等は、旅行者の承諾を得た場合であっても、営業所において掲示した旅行業務の取扱いの料金を超えて料金を収受してはならない。","b":"旅行業者等は、取引によって生じた債務の履行を不当に遅延してはならない。","c":"旅行業者等は、旅行地において施行されている法令に違反するサービスの提供を受けることのあっせんを行う旨の広告をしてはならない。","d":"旅行業者等は、その名義を旅行業のため他人に利用させてはならない。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。とくにbは「不当に」遅延することが禁止されるのであって、正当な理由があれば遅延は許される。aは承諾があっても超過収受はできない点が繰り返し問われる。","why":"禁止行為は5年で5問と出題数は多くないが、2024年度に出題がなく2025年度も0問。周期からみて次年度の出題可能性がある。","ref":"旅行業法第13条・第14条"},{"id":"Alaw21","no":21,"sub":"law","topic":"禁止行為・監督","stem":"登録の取消し及び業務停止に関する次の記述のうち、正しいものはどれか。","opts":{"a":"登録行政庁は、旅行業者等が旅行業法に違反したときは、1年以内の期間を定めて業務の全部又は一部の停止を命ずることができる。","b":"登録行政庁は、旅行業者等が登録を受けてから6月以内に事業を開始していないと認めるときは、その登録を取り消すことができる。","c":"登録行政庁は、旅行業者等が不正の手段により変更登録を受けたときは、6月以内の業務停止を命じ、又は登録を取り消すことができる。","d":"登録行政庁が登録を取り消す場合、その理由を付して通知する必要はない。"},"ans":["c"],"pt":4,"exp":"業務停止は「6月以内」、事業の不開始・休止は「1年」。aは1年以内としている点、bは6月としている点が誤り。dは遅滞なく理由を付して通知しなければならない。","why":"業務停止6月／事業不開始1年の数字入替えは、監督分野が出題される年には必ず含まれる型。","ref":"旅行業法第19条"},{"id":"Alaw22","no":22,"sub":"law","topic":"旅行サービス手配業","stem":"旅行サービス手配業に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、旅行サービス手配業の登録を受けなくても、旅行サービス手配業務を行うことができる。","b":"旅行サービス手配業の登録には、有効期間の定めがない。","c":"旅行サービス手配業者は、営業保証金を供託しなければならない。","d":"旅行サービス手配業者は、旅行サービス手配業務を他人に委託する場合には、他の旅行サービス手配業者又は旅行業者に委託しなければならない。"},"ans":["a","b","d"],"pt":4,"exp":"cは誤り。旅行サービス手配業には営業保証金の供託義務も基準資産額の定めもない。旅行業との違い（有効期間なし・更新登録なし・変更登録なし・営業保証金なし・約款標識外務員広告の規定なし）を体系で押さえる。","why":"手配業は5年連続で毎年3〜4問と法令で第4位の頻度。旅行業との制度比較は毎年必ず問われる。","ref":"旅行業法第23条以下"},{"id":"Alaw23","no":23,"sub":"law","topic":"旅行サービス手配業","stem":"旅行サービス手配業務取扱管理者に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"旅行サービス手配業者は、営業所ごとに1人以上の旅行サービス手配業務取扱管理者を選任しなければならない。","b":"地域限定旅行業務取扱管理者試験に合格した者を、旅行サービス手配業務取扱管理者として選任することができる。","c":"本邦外の旅行について旅行サービス手配業務を取り扱う営業所には、総合旅行業務取扱管理者試験に合格した者を選任することができる。","d":"旅行サービス手配業者は、旅行サービス手配業務取扱管理者について、5年ごとに登録研修機関が実施する研修を受けさせなければならない。"},"ans":["b"],"pt":4,"exp":"地域限定旅行業務取扱管理者試験の合格者は、旅行サービス手配業務取扱管理者として選任できない。選任できるのは①登録研修機関の研修修了者 ②総合または国内の旅行業務取扱管理者試験合格者（海外を含む場合は総合）。","why":"「地域限定は選任できない」は手配業の頻出論点。2021・2024年度に出題実績があり、研修の実施主体（登録研修機関）との組合せで問われる。","ref":"旅行業法第28条"},{"id":"Alaw24","no":24,"sub":"law","topic":"旅行業協会","stem":"旅行業協会の業務に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業協会は、社員以外の旅行業者等が取り扱った旅行業務に対する苦情についても、解決の申出があったときはその相談に応じなければならない。","b":"旅行業協会は、苦情の解決について必要があると認めるときは、当該旅行業者等に対し文書又は口頭による説明を求めることができる。","c":"旅行業協会は、苦情に係る事情及びその解決の結果について、社員以外の旅行業者等にも周知させなければならない。","d":"旅行業協会は、苦情の解決のため必要があるときは、当該旅行業者等の営業所に立ち入って調査することができる。"},"ans":["a","b"],"pt":4,"exp":"cの周知の相手は「社員」に限られる。dの協会に立入調査権はない（登録行政庁の権限）。苦情の解決では「相談・調査・処理の求めは社員以外も対象／周知は社員のみ」という非対称が核心。","why":"苦情の解決は5年で13問と協会分野の中心。「社員以外も対象か」の切り分けが毎年問われる。","ref":"旅行業法第42条"},{"id":"Alaw25","no":25,"sub":"law","topic":"旅行業協会","stem":"弁済業務保証金に関する次の記述のうち、正しいものはどれか。","opts":{"a":"保証社員が納付する弁済業務保証金分担金の額は営業保証金の5分の1であり、旅行者に弁済される限度額も営業保証金の5分の1となる。","b":"弁済業務保証金から弁済を受けようとする旅行者は、登録行政庁の認証を受けなければならない。","c":"保証社員と取引をした旅行者は、その者が保証社員となる前の取引により生じた債権についても、弁済を受けることができる。","d":"旅行業者に旅行サービスを提供した運送機関は、弁済業務保証金から弁済を受けることができる。"},"ans":["c"],"pt":4,"exp":"分担金は営業保証金の5分の1だが、旅行者に弁済される限度額は営業保証金と同額。認証を行うのは旅行業協会（登録行政庁ではない）。弁済の対象は旅行者に限られる。","why":"「負担は5分の1でも弁済限度額は同額」は協会分野の最頻出論点。2021・2025年度に出題実績があり、認証主体の取り違えとセットで問われる。","ref":"旅行業法第48条・第49条"},{"id":"Ayak01","no":1,"sub":"yak","topic":"総則・定義","stem":"標準旅行業約款（募集型企画旅行契約の部）に関する次の記述のうち、正しいものはどれか。","opts":{"a":"「国内旅行」とは本邦内のみの旅行をいい、本邦外の旅行と本邦内の旅行からなる旅行のうち本邦内の部分は国内旅行として取り扱う。","b":"旅行業者が法令に反せず、かつ旅行者の不利にならない範囲で書面により特約を結んだときは、その特約が約款の定めに優先する。","c":"旅行業者は、国内旅行の契約の履行に当たっては、手配の全部を他の旅行業者に代行させることができない。","d":"旅行の参加に際し特別な配慮を必要とする旅行者のために旅行業者が講じた特別な措置に要する費用は、旅行業者の負担とする。"},"ans":["b"],"pt":4,"exp":"特約が有効となるのは①法令に反しない②旅行者の不利にならない③書面による、の3条件をすべて満たす場合。aは本邦外を含む旅行は全体が海外旅行。cは国内旅行でも手配の全部を代行させられる。dの特別な措置に要する費用は旅行者の負担。","why":"総則・定義は5年で19問と約款の第3位。特約の3条件は2021・2025年度に出題され、「書面による」を落とす誤答が定番。","ref":"募集型企画旅行契約の部 第1条〜第4条"},{"id":"Ayak02","no":2,"sub":"yak","topic":"契約の成立・申込","stem":"募集型企画旅行契約の成立に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"契約は、旅行業者が契約の締結を承諾し、申込金を受理した時に成立する。","b":"通信契約は、旅行業者が契約の締結を承諾する旨の通知が旅行者に到達した時に成立する。","c":"電話等により予約を受け付けた時点で、契約が成立したものとみなされる。","d":"募集型企画旅行契約の締結の順位は、予約の受付の順位による。"},"ans":["a","b","d"],"pt":4,"exp":"cは誤り。予約の時点では契約は成立せず、所定の期間内に申込書と申込金の提出（通信契約では会員番号等の通知）があったときに成立する。dの締結順位は申込金の提出順ではなく予約の受付順。","why":"成立時期は5年連続で毎年2〜5問。通信契約の「到達時」（発信時ではない）と、締結順位＝予約順が繰り返し狙われる。","ref":"募集型 第5条・第8条"},{"id":"Ayak03","no":3,"sub":"yak","topic":"契約書面・確定書面","stem":"契約書面及び確定書面に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、契約の成立後速やかに契約書面を交付しなければならず、旅行者からの申出の有無を問わない。","b":"確定書面を交付した場合、旅行業者が手配し旅程を管理する義務を負う旅行サービスの範囲は、確定書面に記載するところに特定される。","c":"旅行業者は、いかなる場合であっても確定書面を交付しなければならない。","d":"旅行業者は、手配状況の確認を希望する旅行者から問合せがあったときは、確定書面の交付前であっても迅速かつ適切に回答しなければならない。"},"ans":["a","b","d"],"pt":4,"exp":"cは誤り。契約書面に確定された旅行日程や運送・宿泊機関の名称をすべて記載する場合は、確定書面の交付は不要。","why":"契約書面・確定書面は5年で23問と約款の最頻出分野。2024年度は7問。義務の範囲が確定書面に特定される点は毎年問われる。","ref":"募集型 第10条"},{"id":"Ayak04","no":4,"sub":"yak","topic":"契約書面・確定書面","stem":"旅行開始日が9月20日である募集型企画旅行について、確定書面の交付期限に関する次の記述のうち、正しいものはどれか。","opts":{"a":"9月10日に申込みがなされた場合、旅行開始日の当日までの契約書面に定める日までに交付すればよい。","b":"9月16日に申込みがなされた場合、旅行開始日の当日までの契約書面に定める日までに交付すればよい。","c":"旅行開始日の前日から起算してさかのぼって7日目に当たる日は、9月14日である。","d":"確定書面を所定の期日までに交付しなかった場合でも、旅行者は取消料を支払わなければ契約を解除できない。"},"ans":["b"],"pt":4,"exp":"旅行開始日の前日（9/19）を1日目として数え、7日目は9月13日。9/13以降の申込み（bの9/16）は当日まででよく、それより前（aの9/10）は前日までの契約書面に定める日まで。dは取消料を支払うことなく解除できる。","why":"確定書面の交付期限は2024・2025年度に連続出題。「前日を1として数える」7日目の計算が毎回の分岐点。","ref":"募集型 第10条","fig":"<svg viewBox=\"0 0 700 150\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<line x1=\"50\" y1=\"72\" x2=\"650\" y2=\"72\" stroke=\"var(--ink3)\"/>\n<circle cx=\"600\" cy=\"72\" r=\"6\" fill=\"var(--ai)\"/><text x=\"556\" y=\"56\" font-size=\"12\" font-weight=\"700\">9/20 旅行開始日</text>\n<circle cx=\"540\" cy=\"72\" r=\"4\" fill=\"var(--ink3)\"/><text x=\"516\" y=\"96\" font-size=\"11\">9/19 前日</text>\n<circle cx=\"300\" cy=\"72\" r=\"6\" fill=\"var(--shu)\"/>\n<text x=\"248\" y=\"56\" font-size=\"12\" fill=\"var(--shu)\" font-weight=\"700\">9/13 ＝ 7日目</text>\n<text x=\"248\" y=\"96\" font-size=\"10.5\" fill=\"var(--shu)\">前日を1として数える</text>\n<path d=\"M60 80 L296 80\" stroke=\"var(--koke)\" stroke-width=\"2.5\"/>\n<text x=\"86\" y=\"114\" font-size=\"11.5\" fill=\"var(--koke)\">この期間の申込み → 前日（9/19）までの契約書面に定める日まで</text>\n<path d=\"M304 80 L596 80\" stroke=\"var(--kin)\" stroke-width=\"2.5\"/>\n<text x=\"330\" y=\"132\" font-size=\"11.5\">この期間の申込み → 当日（9/20）までの契約書面に定める日まで</text>\n</g></svg>","figcap":"確定書面の交付期限"},{"id":"Ayak05","no":5,"sub":"yak","topic":"契約書面・確定書面","stem":"旅行業者が旅行者の承諾を得て、情報通信の技術を利用する方法により書面を提供する場合に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"あらかじめ旅行者の承諾を得なければならない。","b":"提供したときは、旅行者の使用に係る通信機器に備えられたファイルに記載事項が記録されたことを確認しなければならない。","c":"旅行者の使用に係る通信機器にファイルが備えられていない場合は、旅行業者の使用に係る通信機器の専用ファイルに記録し、旅行者が閲覧したことを確認しなければならない。","d":"この方法により提供できるのは契約書面に限られ、説明書面及び確定書面には用いることができない。"},"ans":["d"],"pt":4,"exp":"dは誤り。説明書面・契約書面・確定書面のいずれについても、あらかじめ旅行者の承諾を得て情報通信の技術を利用する方法により提供できる。","why":"情報通信の技術を利用する方法は2021・2024年度に出題。承諾の要否と、記録・閲覧の確認義務が問われる。","ref":"募集型 第10条"},{"id":"Ayak06","no":6,"sub":"yak","topic":"契約の成立・申込","stem":"募集型企画旅行契約の締結を拒否できる場合に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"応募旅行者数が募集予定数に達したとき","b":"旅行者が他の旅行者に迷惑を及ぼし、又は団体行動の円滑な実施を妨げるおそれがあるとき","c":"通信契約において、旅行者のクレジットカードが無効である等、旅行者がカード会員規約に従って旅行代金等の支払を行うことができないとき","d":"旅行業者の業務上の都合があるとき"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて締結拒否事由に当たる。ほかに①参加旅行者の条件を満たさないとき ②反社会的勢力 ③暴力的・不当な要求行為 ④風説の流布等による業務妨害 がある。なお、①②は受注型にはない。","why":"締結拒否事由は毎年出題。募集型のみの事由（参加条件・募集予定数）と共通の事由の切り分けが定番。","ref":"募集型 第6条"},{"id":"Ayak07","no":7,"sub":"yak","topic":"契約の変更","stem":"契約内容の変更に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、天災地変その他の旅行業者の関与し得ない事由が生じた場合において、旅行の安全かつ円滑な実施を図るためやむを得ないときは、契約内容を変更することができる。","b":"旅行業者が契約内容を変更するときは、あらかじめ旅行者の承諾を得なければならない。","c":"旅行者への説明は変更前にあらかじめ速やかに行うが、緊急かつやむを得ないときは変更後に説明することができる。","d":"募集型企画旅行契約においては、旅行者から契約内容の変更を求めることができる。"},"ans":["a","c"],"pt":4,"exp":"bは誤り。説明は必要だが承諾は不要。dも誤りで、旅行者から内容変更を求められるのは受注型企画旅行契約と手配旅行契約であって、募集型ではできない。","why":"契約の変更は毎年出題。「説明は必須・承諾は不要」と「募集型では旅行者から変更を求められない」の2点が繰り返し問われる。","ref":"募集型 第13条"},{"id":"Ayak08","no":8,"sub":"yak","topic":"契約の変更","stem":"旅行代金の額の変更に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"宿泊機関の宿泊料金が改訂されたときは、旅行業者は旅行代金の額を変更することができる。","b":"運送機関の適用運賃・料金が通常想定される程度を大幅に超えて減額されるときは、旅行業者はその減少額だけ旅行代金を減額しなければならない。","c":"運送機関の適用運賃・料金の大幅な変更を理由に旅行代金を増額するときは、旅行開始日の前日から起算してさかのぼって15日目に当たる日より前に旅行者に通知しなければならない。","d":"旅行サービス提供機関の過剰予約受付により座席が不足し、契約内容を変更して費用が増加したときは、旅行業者は旅行代金を増額することができる。"},"ans":["b","c"],"pt":4,"exp":"aは誤りで、変更できるのは「運送機関」の運賃・料金の大幅な変更の場合に限られる（宿泊料金の改訂・為替変動では変更できない）。dは過剰予約受付が原因の場合、増額できない。","why":"旅行代金の変更は毎年出題。「運送機関に限る」「減額は減少額だけ」「増額は15日目より前に通知」「オーバーブッキングは増額不可」の4点が核心。","ref":"募集型 第14条"},{"id":"Ayak09","no":9,"sub":"yak","topic":"旅行者の解除・取消料","stem":"募集型企画旅行契約において、旅行者が旅行開始前に取消料を支払うことなく契約を解除できる場合として、正しいものをすべて選びなさい。","opts":{"a":"契約書面に定める期日までに、旅行業者が確定書面を交付しなかったとき","b":"旅行者が急病により入院したとき","c":"運送機関の適用運賃・料金の大幅な増加により、旅行代金が増額されたとき","d":"旅行業者の責に帰すべき事由により、契約書面に記載した旅行日程に従った旅行の実施が不可能になったとき"},"ans":["a","c","d"],"pt":4,"exp":"bは旅行者側の事情であり取消料が必要。取消料を支払うことなく解除できるのは①重要な変更②旅行代金の増額③安全な実施が不可能となるおそれが極めて大きいとき④確定書面の不交付⑤旅行業者の責による実施不能、の5事由。","why":"取消料は5年で14問。旅行者側の事情（入院・親族の死亡・交通機関の遅延）を混ぜる形が毎年出る。","ref":"募集型 第16条"},{"id":"Ayak10","no":10,"sub":"yak","topic":"旅行者の解除・取消料","stem":"海外募集型企画旅行（旅行開始日はピーク時ではない）の取消料に関する次の記述のうち、正しいものはどれか。","opts":{"a":"旅行開始日の前日から起算してさかのぼって40日目に当たる日以降に解除した場合、旅行代金の10%以内の取消料を収受できる。","b":"旅行開始日の前日から起算してさかのぼって30日目に当たる日以降3日目までに解除した場合、旅行代金の20%以内の取消料を収受できる。","c":"旅行開始日の前々日以降に解除した場合、旅行代金の30%以内の取消料を収受できる。","d":"旅行開始後の解除又は無連絡不参加の場合、旅行代金の50%以内の取消料を収受できる。"},"ans":["b"],"pt":4,"exp":"海外旅行の取消料は、ピーク時の40日目〜31日目が10%、30日目〜3日目が20%、前々日以降が50%、旅行開始後・無連絡不参加が100%。aはピーク時に限られ、cは50%、dは100%。","why":"取消料の率は毎年出題。国内（20日目20%／7日目30%／前日40%／当日50%）と海外の表を混同させる誤答が定番。","ref":"募集型 第16条 別表第1"},{"id":"Ayak11","no":11,"sub":"yak","topic":"旅行業者の解除","stem":"旅行業者による旅行開始前の契約解除に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、旅行者に理由を説明して契約を解除することができ、旅行者の承諾を得る必要はない。","b":"宿泊を伴う国内旅行において最少催行人員に達しなかったことにより解除するときは、旅行開始日の前日から起算してさかのぼって13日目に当たる日より前に通知しなければならない。","c":"旅行業者が旅行開始前に契約を解除したときは、旅行者に対し取消料に相当する額の違約料を請求することができる。","d":"スキー旅行における降雪量など、旅行実施条件が成就しないおそれが極めて大きいときは、契約を解除することができる。"},"ans":["a","b","d"],"pt":4,"exp":"cは誤り。旅行業者側の解除では取消料・違約料は請求できず、収受した旅行代金の全額を払い戻す。最少催行人員未達の通知期限は日帰り3日目・国内13日目・海外23日目・海外ピーク時33日目。","why":"旅行業者の解除は5年で4問。通知期限の数字（3・13・23・33）が繰り返し問われる。","ref":"募集型 第16条"},{"id":"Ayak12","no":12,"sub":"yak","topic":"旅行業者の解除","stem":"旅行開始後の旅行業者による契約解除に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者が旅行開始後に契約を解除したときは、旅行者との契約関係は将来に向かってのみ消滅する。","b":"旅行者が病気により旅行の継続に耐えられないため契約を解除したときは、旅行業者は出発地に戻るための旅行サービスの手配を引き受け、その費用を負担する。","c":"旅行者が団体行動の規律を乱したことにより契約を解除したときは、旅行業者は帰路手配を行う必要はない。","d":"旅行者がすでに提供を受けた旅行サービスに関する旅行業者の債務については、有効な弁済がなされたものとする。"},"ans":["a","c","d"],"pt":4,"exp":"bは誤り。帰路の手配は引き受けるが、その費用は旅行者の負担。手配を引き受ける（病気・関与し得ない事由）／引き受けない（規律違反・反社）の区別も重要。","why":"旅行開始後の解除は毎年出題。「手配は引き受けるが費用は旅行者負担」が定番の誤答ポイント。","ref":"募集型 第18条"},{"id":"Ayak13","no":13,"sub":"yak","topic":"旅程管理・保護措置","stem":"旅程管理及び保護措置に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、旅程管理業務を他の旅行業者に代行させた場合であっても、旅程管理責任を免れることはできない。","b":"添乗員が同行する場合の添乗サービス時間は、原則として8時から20時までである。","c":"旅行中の旅行者が疾病により保護を要する状態にあると認めて旅行業者が必要な措置を講じたときは、その費用は常に旅行業者の負担となる。","d":"旅行者は、旅行開始後旅行終了までの間において団体で行動するときは、旅行を安全かつ円滑に実施するための旅行業者の指示に従わなければならない。"},"ans":["a","b","d"],"pt":4,"exp":"cは誤り。旅行業者の責に帰すべき事由によるものでないときは、保護措置に要した費用は旅行者の負担となる。","why":"旅程管理・保護措置は5年連続で毎年1問。保護措置の費用負担が定番。","ref":"募集型 第22条・第23条"},{"id":"Ayak14","no":14,"sub":"yak","topic":"責任","stem":"旅行業者及び旅行者の責任に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、手荷物に生じた損害については、損害発生の翌日から起算して国内旅行にあっては14日以内、海外旅行にあっては21日以内に通知があったときに限り賠償の責任を負う。","b":"手荷物に生じた損害の賠償限度額は、旅行業者に故意又は重大な過失がある場合を除き、旅行者1名につき15万円である。","c":"旅行者が自由行動中に被った損害については、旅行業者は一切責任を負わない。","d":"旅行者は、契約書面と異なる旅行サービスが提供されたと認識したときは、旅行地において速やかに旅行業者等に申し出なければならない。"},"ans":["a","b","d"],"pt":4,"exp":"cは誤り。自由行動中の損害であっても、旅行業者または手配代行者に故意または過失があれば責任を負う。dは「旅行終了後」ではなく「旅行地において」速やかに申し出る。","why":"責任は毎年出題。手荷物の通知期限（14日／21日）と限度額（旅行者1名につき15万円）は必出。","ref":"募集型 第27条・第28条"},{"id":"Ayak15","no":15,"sub":"yak","topic":"特別補償","stem":"海外募集型企画旅行参加中の旅行者が事故により7日間入院した後、3日間通院した。特別補償規程により支払うべき見舞金の額として正しいものはどれか。（入院見舞金は7日以上30日未満で10万円、通院見舞金は7日以上90日未満で5万円とする）","opts":{"a":"5万円","b":"10万円","c":"15万円","d":"4万円"},"ans":["b"],"pt":4,"exp":"ア＝入院日数7日に対する入院見舞金10万円。イ＝入院7日＋通院3日＝10日を通院日数とみなした通院見舞金5万円。大きい方のア10万円を支払う。合計15万円ではない。","why":"特別補償の見舞金計算は5年で12問と高頻度。入院と通院が重なる場合の「ア・イを比べて大きい方」は2022・2023・2025年度に出題された定番。","ref":"特別補償規程 第19条","fig":"<svg viewBox=\"0 0 700 180\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"4\" y=\"6\" width=\"692\" height=\"30\" rx=\"2\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"20\" y=\"26\" font-weight=\"700\" fill=\"var(--ai)\">海外旅行で 7日間入院 → 3日間通院</text>\n<rect x=\"4\" y=\"46\" width=\"340\" height=\"76\" rx=\"2\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"18\" y=\"66\" font-weight=\"700\">ア　入院日数に対する入院見舞金</text>\n<text x=\"18\" y=\"90\" font-size=\"12\">入院 7日 → 「7日以上30日未満」</text>\n<text x=\"18\" y=\"114\" font-size=\"16\" font-weight=\"700\">10万円</text>\n<rect x=\"352\" y=\"46\" width=\"344\" height=\"76\" rx=\"2\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"366\" y=\"66\" font-weight=\"700\" fill=\"var(--koke)\">イ　合計日数を通院とみなした通院見舞金</text>\n<text x=\"366\" y=\"90\" font-size=\"12\">7日 ＋ 3日 ＝ 10日 → 「7日以上90日未満」</text>\n<text x=\"366\" y=\"114\" font-size=\"16\" font-weight=\"700\" fill=\"var(--koke)\">5万円</text>\n<rect x=\"4\" y=\"132\" width=\"692\" height=\"42\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"20\" y=\"152\" font-size=\"13\">大きい方の <tspan font-weight=\"700\">ア 10万円</tspan> を支払う。ア＋イ＝15万円としないこと。</text>\n<text x=\"20\" y=\"168\" font-size=\"11\">事故の日から180日を経過した後の通院には、いかなる場合も通院見舞金を支払わない。</text>\n</g></svg>","figcap":"入院後に通院した場合の見舞金の計算"},{"id":"Ayak16","no":16,"sub":"yak","topic":"特別補償","stem":"特別補償に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"特別補償は、旅行業者に故意又は過失がない場合であっても支払われる。","b":"死亡補償金及び後遺障害補償金は、損害賠償金を支払うべき場合には、その合計額を支払う。","c":"入院見舞金及び通院見舞金は、損害賠償金を支払うべき場合には、その合計額を支払う。","d":"国内旅行において、地震により旅行者が傷害を被った場合、旅行業者は補償金を支払う。"},"ans":["a","c"],"pt":4,"exp":"bは誤り。死亡補償金・後遺障害補償金は損害賠償金と合計せず、賠償金の限度で賠償金とみなす。dも誤りで、国内旅行における地震・噴火・津波は免責（海外旅行では支払う）。","why":"「死亡・後遺障害は合計しない／入院・通院は合計する」という非対称は特別補償の核心。5年で複数回出題。","ref":"特別補償規程 第4条・第5条"},{"id":"Ayak17","no":17,"sub":"yak","topic":"特別補償","stem":"企画旅行参加中の定義に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"航空機を利用する場合の開始時期は、乗客のみが入場できる飛行場構内における手荷物の検査等の完了時である。","b":"鉄道を利用する場合の終了時期は、改札の終了時（改札のないときは当該列車の降車時）である。","c":"宿泊機関の場合の終了時期は、当該施設からの退場時である。","d":"車両を利用する場合の開始時期は、当該車両の出発時である。"},"ans":["d"],"pt":4,"exp":"車両の場合の開始時期は「当該車両への乗車時」であって出発時ではない。宿泊機関の開始時期は利用手続終了時、宿泊機関以外の施設は入場時。","why":"参加中の開始・終了時期は5年で複数回。とくに鉄道（改札）・車両（乗車）・宿泊（利用手続／退場）の3つが取り違えの的。","ref":"特別補償規程 第2条"},{"id":"Ayak18","no":18,"sub":"yak","topic":"旅程保証・変更補償金","stem":"旅程保証に関する次の記述のうち、変更補償金の支払いが必要となるものをすべて選びなさい。","opts":{"a":"確定書面に記載した宿泊機関が、過剰予約受付により上位ランクのホテルに変更された。","b":"契約書面に記載した美術館が休館日であったため、入場できなかった。","c":"台風による欠航のため、契約書面に記載した航空便が別の航空会社の便に変更された。","d":"利用予定のホテルが大雨により浸水し、営業はしているが客室に不足が生じたため、別のホテルに変更された。"},"ans":["a","d"],"pt":4,"exp":"bは休館（サービス提供の中止）、cは台風による欠航が原因であり、いずれも変更補償金を支払わない。aの宿泊機関の名称変更は上位ランクへの変更でも支払う。dは営業しており「休業」に当たらないため客室不足による変更として支払う。","why":"旅程保証は5年で5問。「休業か客室不足か」の区別と、宿泊機関は上位ランクでも支払う点が核心。","ref":"募集型 第29条 別表第2"},{"id":"Ayak19","no":19,"sub":"yak","topic":"旅程保証・変更補償金","stem":"変更補償金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"変更補償金は、実際の旅行終了日の翌日から起算して30日以内に支払わなければならない。","b":"変更補償金は、旅行者1名に対し1企画旅行につき1,000円未満であるときは支払わない。","c":"変更補償金は、旅行者から請求の申出があった場合に限り支払う。","d":"変更補償金の限度額は、旅行代金に15%以上の旅行業者が定める率を乗じた額である。"},"ans":["a","b","d"],"pt":4,"exp":"cは誤り。請求の申出がない旅行者にも支払う。また旅行代金を減額して払戻しをした場合でも、変更補償金は別に支払う。","why":"変更補償金の支払期限（実際の旅行終了日の翌日から30日）は、旅行代金の払戻し（契約書面記載の旅行終了日の翌日から30日）と起算点が違う点が毎年の狙い所。","ref":"募集型 第29条"},{"id":"Ayak20","no":20,"sub":"yak","topic":"受注型企画旅行","stem":"受注型企画旅行契約に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"受注型企画旅行契約には、電話等による予約に関する規定はない。","b":"旅行業者は、企画書面に企画料金の金額を明示した場合であっても、契約書面には明示する必要はない。","c":"企画書面及び契約書面に企画料金の金額を明示した場合、旅行者が旅行開始前に契約を解除したときは、解除の時期にかかわらず企画料金相当額の取消料を請求できる。","d":"旅行業者は、企画書面を交付した時点で、旅行者から企画料金を収受することができる。"},"ans":["a","c"],"pt":4,"exp":"bは誤りで、企画書面で明示したときは契約書面にも明示しなければならない。dも誤りで、旅行者からの申込みがなければ企画料金を収受できない。","why":"受注型は5年で11問。企画書面と企画料金の3論点（契約書面への明示・解除時期にかかわらず請求可・申込前は収受不可）が繰り返し出る。","ref":"受注型 第5条・第14条"},{"id":"Ayak21","no":21,"sub":"yak","topic":"JAL国際運送約款","stem":"国際運送約款（日本航空）に関する次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>運送が開始された航空券の有効期間は、運送の開始日から1年である。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。まったく未使用の航空券の有効期間は発行日から1年。いずれも起算は翌日からで、満了日の24時に失効する。","why":"JAL国際運送約款は5年で20問（2022年度を除き毎年5問）。有効期間は5年で複数回出題される中心論点。","ref":"JAL国際運送約款"},{"id":"Ayak22","no":22,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>旅客に適用する運送約款は、航空券の発行日に有効な約款である。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。適用する約款は「航空券の最初の搭乗用片により行われる運送の開始日に有効な約款」。適用運賃が「発行日に有効な運賃」であるのと対になっており、この入替えが定番。","why":"「約款＝運送開始日／運賃＝発行日」の対比は2022・2024・2025年度に出題。もっとも狙われる時点の区別。","ref":"JAL国際運送約款"},{"id":"Ayak23","no":23,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社は、手荷物切符及び手荷物合符の所持人に対して受託手荷物を引き渡せば足り、その所持人が正当な受取人であるか否かを確かめなかったことにより生ずる損害について責任を負わない。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。国内旅客運送約款にも同旨の規定があり、国際・国内の双方で繰り返し問われる。","why":"手荷物の引渡しは5年で5回以上出題。国際・国内いずれの約款でも出るため、両方で確認しておく。","ref":"JAL国際運送約款"},{"id":"Ayak24","no":24,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>受託手荷物に毀損があった場合、旅客は手荷物の受取りの日から21日以内に書面で異議を述べなければならない。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。毀損は受取りの日から7日以内。延着は受け取った日から21日以内、紛失・滅失は受け取ることができたであろう日から21日以内。出訴期限は2年。","why":"異議申立ての期限（毀損7日／延着・紛失21日）は5年で複数回。日数の入替えが定番の誤答。","ref":"JAL国際運送約款"},{"id":"Ayak25","no":25,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>身体障害旅客補助犬は、その容器及び餌とともに無料手荷物許容量の適用を受け、超過分については超過手荷物料金が必要となる。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。身体障害旅客補助犬は容器・餌とともに通常の無料手荷物許容量に「追加して無料」で運送される。無料手荷物許容量の適用を受けず超過手荷物となるのは愛玩動物（ペット）。","why":"ペットと補助犬の扱いの違いは2021・2023・2025年度に出題された定番。取り違えを狙う典型。","ref":"JAL国際運送約款"},{"id":"Ayak26","no":26,"sub":"yak","topic":"JAL国内旅客運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>12歳以上の旅客に同伴された座席を使用しない3歳未満の旅客については、同伴者1人に対し1人に限り無償で運送を引き受ける。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。国内線の幼児は3歳未満（国際線は2歳未満）。無償の幼児には無料手荷物許容量の適用がなく、その手荷物は同伴する旅客の手荷物とみなされる。","why":"JAL国内旅客運送約款は5年連続で毎年3問。幼児の年齢（国際2歳／国内3歳）の区別は必出。","ref":"JAL国内旅客運送約款"},{"id":"Ayak27","no":27,"sub":"yak","topic":"JAL国内旅客運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>手荷物についての会社の責任は、旅客1名につき総額15万円を限度とするが、会社に故意又は重大な過失があることが証明された場合はこの限りでない。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。従価料金は、手荷物の価額の合計が15万円を超える場合に申告でき、15万円を超える部分について1万円ごとに10円を請求する。","why":"限度額15万円と従価料金の計算方法は毎年どちらかで問われる。「申告価額の全額に課す」とする誤答が定番。","ref":"JAL国内旅客運送約款"},{"id":"Ayak28","no":28,"sub":"yak","topic":"JAL国内旅客運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>予約事項に搭乗予定便の記載がない航空券の有効期間は、航空券発行日及び発行の日の翌日から起算して1年間である。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。搭乗予定便の記載がある場合はその便に限り有効。払戻しは有効期間満了後の翌日から起算して30日以内に限り行う。","why":"有効期間と払戻期限（30日）はセットで問われる。2023・2025年度に出題実績がある。","ref":"JAL国内旅客運送約款"},{"id":"Ayak29","no":29,"sub":"yak","topic":"貸切バス約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>バス会社が所定の配車をしたにもかかわらず、配車時刻から30分を経過しても旅客が乗車についての意思表示をしないときは、当該車両について運送契約に係る運送の全部が終了したものとみなす。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。基準は「配車時刻」ではなく「出発時刻」から30分。この語の入替えが繰り返し狙われる。なお天災その他やむを得ない事由による場合はこの規定を適用しない。","why":"★貸切バス約款は5年で3問（2022・2024年度は出題なし）。出題される年は「出発時刻から30分」がほぼ確実に含まれる。","ref":"一般貸切旅客自動車運送事業標準運送約款"},{"id":"Ayak30","no":30,"sub":"yak","topic":"モデル宿泊約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>ホテルが宿泊客に客室を提供し、その使用が可能になったのち、宿泊客が任意に宿泊しなかった場合においても、ホテルは宿泊料金を申し受ける。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。なお、連続して宿泊する場合は到着日及び出発日を除き終日客室を使用できる。契約した客室を提供できないときは同一条件の他の宿泊施設をあっ旋し、あっ旋できずホテルに責があるときは違約金相当額の補償料を支払う。","why":"★モデル宿泊約款は5年で2問（2021・2025年度のみ）。出題頻度は低いが、出る年は基本論点が問われるため確実に取りたい。","ref":"モデル宿泊約款"},{"id":"Adom01","no":1,"sub":"dom","topic":"国内観光資源","stem":"2024年7月に世界文化遺産に登録された「佐渡島の金山」がある佐渡島に関する次の記述のうち、正しいものはどれか。","opts":{"a":"新潟港との間にジェットフォイルが就航する玄関口は小木港である。","b":"たらい舟で知られる港は両津港である。","c":"重要伝統的建造物群保存地区に選定されている集落は宿根木である。","d":"島の南部には尖閣湾がある。"},"ans":["c"],"pt":2,"exp":"宿根木は千石船の里として重要伝統的建造物群保存地区に選定され、三角家で知られる。両津港が新潟航路のジェットフォイル、小木港が直江津航路でたらい舟の地。尖閣湾は島の北部（外海府海岸）。","why":"直近の世界遺産登録は翌年度に必ず出題される。2021年度は三内丸山遺跡（2021.7登録）、2025年度は佐渡島の金山（2024.7登録）が出た。次年度も関連の出題が濃厚。","ref":"国内観光資源／中部"},{"id":"Adom02","no":2,"sub":"dom","topic":"国内観光資源","stem":"北海道の国立公園に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"知床国立公園には知床五湖やカムイワッカ湯の滝がある。","b":"阿寒摩周国立公園には、マリモで知られる阿寒湖と、和琴半島が突き出た屈斜路湖がある。","c":"大雪山国立公園には北海道最高峰の旭岳があり、ロープウェイで姿見駅へ上がることができる。","d":"支笏洞爺国立公園には、砂嘴でオホーツク海と隔てられたサロマ湖がある。"},"ans":["d"],"pt":2,"exp":"サロマ湖はオホーツク海側にあり、網走国定公園に属する。支笏洞爺国立公園は洞爺湖・支笏湖・羊蹄山・登別温泉などから成る。","why":"北海道の湖沼は5年で複数回出題され、位置関係（西→東）を問う形が定番。国立公園と湖の対応は未出の切り口で、次に出やすい。","ref":"国内観光資源／北海道"},{"id":"Adom03","no":3,"sub":"dom","topic":"国内観光資源","stem":"東北地方の観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"龍泉洞は岩手県にあり、日本三大鍾乳洞のひとつである。","b":"寒風山は秋田県の男鹿半島にある。","c":"銀山温泉は宮城県にある。","d":"大内宿は福島県にある茅葺き屋根の宿場町で、重要伝統的建造物群保存地区に選定されている。"},"ans":["a","b","d"],"pt":2,"exp":"cは誤り。銀山温泉は山形県尾花沢市。宮城県の代表的な温泉は秋保・鳴子・遠刈田。日本三大鍾乳洞は龍泉洞（岩手）・秋芳洞（山口）・龍河洞（高知）。","why":"東北の温泉と観光地の県別対応は毎年問われる。日本三大鍾乳洞は過去5年で未出のため、次に出る可能性が高い。","ref":"国内観光資源／東北"},{"id":"Adom04","no":4,"sub":"dom","topic":"国内観光資源","stem":"次の空欄に該当するものはどれか。<br>京都市左京区にあり、「京都の奥座敷」と呼ばれる　▢　には、縁結びの神社として知られる神社があり、夏には川の上に座敷を設けた川床で涼を楽しむことができる。","opts":{"a":"大原","b":"貴船","c":"高雄","d":"嵯峨野"},"ans":["b"],"pt":2,"exp":"貴船。貴船神社は縁結びと和泉式部の復縁伝説で知られ、夏の川床が名物。大原は三千院と寂光院、高雄は神護寺の紅葉、嵯峨野は竹林と渡月橋。","why":"京都は5年で毎年2〜3問。寺社に偏りがちだが、地区（貴船・大原・高雄・嵯峨野）の区別は未出の切り口。","ref":"国内観光資源／近畿"},{"id":"Adom05","no":5,"sub":"dom","topic":"国内観光資源","stem":"日本三名園に関する次の記述のうち、正しいものはどれか。","opts":{"a":"兼六園、後楽園、栗林公園である。","b":"兼六園、後楽園、偕楽園である。","c":"兼六園、偕楽園、水前寺成趣園である。","d":"後楽園、偕楽園、六義園である。"},"ans":["b"],"pt":2,"exp":"日本三名園は兼六園（石川）・後楽園（岡山）・偕楽園（茨城）。栗林公園（香川）、水前寺成趣園（熊本）、六義園（東京）はいずれも名園だが三名園ではない。","why":"「三大○○」は毎年どれかが出る。三名園そのものは5年で未出だが、栗林公園・偕楽園は組合せ問題で頻出しており、定義を問う形が出やすい。","ref":"国内観光資源／横断"},{"id":"Adom06","no":6,"sub":"dom","topic":"国内観光資源","stem":"中部地方の観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"白川郷は岐阜県、五箇山は富山県にあり、あわせて世界文化遺産に登録されている。","b":"妻籠宿は長野県、馬籠宿は岐阜県にある中山道の宿場町である。","c":"東尋坊は福井県にあり、若狭湾国定公園を代表する景勝地である。","d":"称名滝は富山県にあり、落差350mは日本一である。"},"ans":["c"],"pt":2,"exp":"東尋坊は越前加賀海岸国定公園。若狭湾国定公園を代表する断崖美の景勝地は蘇洞門（そとも）。この2つの取り違えが定番。","why":"東尋坊と蘇洞門の国定公園の取り違えは2024年度に出題された。定着していない受験者が多く、再出題の可能性が高い。","ref":"国内観光資源／中部"},{"id":"Adom07","no":7,"sub":"dom","topic":"国内観光資源","stem":"四国地方の現存天守に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"丸亀城は香川県にあり、日本一高い石垣で知られる。","b":"宇和島城は愛媛県にある。","c":"高知城は現存天守である。","d":"徳島城は現存天守である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。徳島城に現存天守はない。四国の現存天守は丸亀（香川）・伊予松山（愛媛）・宇和島（愛媛）・高知（高知）の4城。現存十二天守のうち3分の1が四国に集中する。","why":"城は5年で複数回出題されるが、現存十二天守の所在を問う形は未出。国宝五城とあわせて出やすい論点。","ref":"国内観光資源／四国"},{"id":"Adom08","no":8,"sub":"dom","topic":"国内観光資源","stem":"次の下線部a.〜d.のうち、誤っているものはどれか。<br>中国地方には、大しめ縄で知られる <u>a.出雲大社</u>、国宝の天守が現存する <u>b.松江城</u>、日本庭園で高い評価を受ける <u>c.足立美術館</u>、朱塗りの楼門が温泉のシンボルとなっている <u>d.温泉津温泉</u> がある。","opts":{"a":"出雲大社","b":"松江城","c":"足立美術館","d":"温泉津温泉"},"ans":["d"],"pt":2,"exp":"朱塗りの楼門（辰野金吾設計）で知られるのは佐賀県の武雄温泉。温泉津温泉は島根県にあり、温泉街として重要伝統的建造物群保存地区に選定されている。a・b・cはいずれも島根県で正しい。","why":"下線部型は毎年3〜5問。島根県の観光資源は2025年度に出題されており、隣接論点として温泉津温泉と武雄温泉の混同を狙う形が想定される。","ref":"国内観光資源／中国"},{"id":"Adom09","no":9,"sub":"dom","topic":"国内観光資源","stem":"九州の観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"杵築は大分県にあり、南北の高台に武家屋敷、谷間に商人の町が広がるサンドイッチ型城下町である。","b":"知覧は鹿児島県にあり、武家屋敷群と特攻平和会館がある。","c":"秋月は福岡県にあり、「筑前の小京都」と呼ばれる。","d":"飫肥は熊本県にある武家屋敷の町である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。飫肥は宮崎県日南市にあり、九州で最初に重要伝統的建造物群保存地区に選定された伊東氏5万1千石の城下町。","why":"飫肥は2025年度に出題済み。武家屋敷の町を横断的に問う形（杵築・知覧・秋月・飫肥）は未出で、次に出やすい切り口。","ref":"国内観光資源／九州"},{"id":"Adom10","no":10,"sub":"dom","topic":"国内観光資源","stem":"沖縄県の観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"玉陵は第二尚氏王統の陵墓で、世界遺産の構成資産である。","b":"斎場御嶽は琉球王国最高の聖地で、世界遺産の構成資産である。","c":"浦添ようどれは英祖王・尚寧王の墓で、世界遺産の構成資産である。","d":"識名園は琉球王家の別邸で、世界遺産の構成資産である。"},"ans":["c"],"pt":2,"exp":"浦添ようどれは世界遺産の構成資産ではない。「琉球王国のグスク及び関連遺産群」の構成資産は今帰仁城跡・座喜味城跡・勝連城跡・中城城跡・首里城跡・園比屋武御嶽石門・玉陵・識名園・斎場御嶽の9件。","why":"玉陵は2022年度に出題。構成資産か否かを問う形は難度が高く、世界遺産の登録内容を正確に問う近年の傾向に合致する。","ref":"国内観光資源／沖縄"},{"id":"Adom11","no":11,"sub":"dom","topic":"国内観光資源","stem":"次の組合せのうち、郷土料理とその都道府県がいずれも一致しているものをすべて選びなさい。","opts":{"a":"いちご煮 ─ 青森県","b":"ままかりずし ─ 岡山県","c":"皿鉢料理 ─ 徳島県","d":"鶏飯 ─ 鹿児島県"},"ans":["a","b","d"],"pt":2,"exp":"cは誤り。皿鉢料理は高知県。徳島県の郷土料理はそば米雑炊やでこまわしなど。鶏飯は鹿児島県奄美大島の郷土料理。","why":"郷土料理と県の組合せは5年で毎年1〜2問。皿鉢料理（高知）は2021年度に出題されており、県を入れ替える誤答が定番。","ref":"国内観光資源／組合せ"},{"id":"Adom12","no":12,"sub":"dom","topic":"国内観光資源","stem":"次の組合せのうち、陶磁器とその産地の県がいずれも一致しているものをすべて選びなさい。","opts":{"a":"小鹿田焼 ─ 大分県","b":"大谷焼 ─ 徳島県","c":"萬古焼 ─ 滋賀県","d":"波佐見焼 ─ 長崎県"},"ans":["a","b","d"],"pt":2,"exp":"cは誤り。萬古焼は三重県四日市。滋賀県は信楽焼。九州・四国の陶磁器（小鹿田焼＝大分、大谷焼＝徳島、波佐見焼＝長崎）は未出のものが多い。","why":"陶磁器の組合せは5年で毎年出題。益子・笠間・九谷・備前・萩・信楽は既出だが、小鹿田・大谷・波佐見・萬古は未出で次に出やすい。","ref":"国内観光資源／組合せ"},{"id":"Adom13","no":13,"sub":"dom","topic":"国内観光資源","stem":"日本の祭りに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"日本三大祭は、祇園祭、天神祭、神田祭である。","b":"東北三大祭は、ねぶた祭、竿燈まつり、七夕まつりである。","c":"西大寺会陽は岡山県で行われる裸祭りである。","d":"おわら風の盆は石川県で行われる。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。おわら風の盆は富山県富山市八尾町で行われる。石川県の代表的な祭りは金沢百万石まつり。","why":"祭りと県の組合せは毎年出題。おわら風の盆は2022年度に「富山」として出題済みで、県を入れ替える誤答が想定される。","ref":"国内観光資源／祭り"},{"id":"Adom14","no":14,"sub":"dom","topic":"国内観光資源","stem":"関東地方の庭園に関する次の記述のうち、正しいものはどれか。","opts":{"a":"六義園は横浜市にある実業家が造った日本庭園である。","b":"浜離宮恩賜庭園は隅田川の水を引き込む潮入の池をもつ。","c":"三溪園は東京都文京区にある柳沢吉保の大名庭園である。","d":"偕楽園は栃木県水戸市にある。"},"ans":["b"],"pt":2,"exp":"浜離宮恩賜庭園は江戸時代の代表的な大名庭園で、浅草からの水上バスが発着する。六義園は文京区の柳沢吉保の庭園、三溪園は横浜の原三溪の庭園、偕楽園は茨城県水戸市。","why":"六義園と三溪園の取り違えは2022・2024年度に出題された定番。偕楽園の県（茨城／栃木）を混ぜる形も想定される。","ref":"国内観光資源／関東"},{"id":"Adom15","no":15,"sub":"dom","topic":"国内観光資源","stem":"近畿地方の観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"室生寺は「女人高野」と呼ばれ、屋外の古塔として日本最小の五重塔がある。","b":"長谷寺は399段の登廊で本堂に至り、牡丹の名所として「花の御寺」と呼ばれる。","c":"龍安寺は白砂に15個の石を配した石庭で知られる。","d":"西芳寺は「銀閣寺」の通称で知られる。"},"ans":["d"],"pt":2,"exp":"西芳寺の通称は「苔寺」。「銀閣寺」は慈照寺の通称で、銀閣と東求堂が国宝。","why":"京都・奈良の寺院は毎年出題。通称（苔寺・銀閣寺・金閣寺）を入れ替える形は未出の切り口。","ref":"国内観光資源／近畿"},{"id":"Adom16","no":16,"sub":"dom","topic":"国内観光資源","stem":"次の組合せのうち、温泉地とその都道府県がいずれも一致しているものをすべて選びなさい。","opts":{"a":"黒川温泉 ─ 熊本県","b":"和倉温泉 ─ 石川県","c":"湯田温泉 ─ 島根県","d":"三朝温泉 ─ 鳥取県"},"ans":["a","b","d"],"pt":2,"exp":"cは誤り。湯田温泉は山口県山口市。島根県の代表的な温泉は玉造温泉・温泉津温泉。三朝温泉はラジウム泉で知られる鳥取県の温泉。","why":"温泉と県の組合せは毎年出題。黒川（熊本）は2025年度に出題済み。中国地方の温泉（湯田・玉造・三朝）は未出が多い。","ref":"国内観光資源／組合せ"},{"id":"Adom17","no":17,"sub":"dom","topic":"国内観光資源","stem":"国立公園に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"尾瀬国立公園は福島県・栃木県・群馬県・新潟県にまたがる。","b":"富士箱根伊豆国立公園には小笠原諸島が含まれる。","c":"阿蘇くじゅう国立公園には草千里がある。","d":"西表石垣国立公園には仲間川のマングローブ林がある。"},"ans":["a","c","d"],"pt":2,"exp":"bは誤り。小笠原諸島は独立した小笠原国立公園（世界自然遺産）。富士箱根伊豆国立公園は富士山・箱根・伊豆半島・伊豆諸島から成る。","why":"国立公園を正面から問う形は5年で未出。34公園のうち世界遺産を含むもの（知床・小笠原・屋久島・奄美・やんばる・西表石垣）は出やすい。","ref":"国内観光資源／横断"},{"id":"Adom18","no":18,"sub":"dom","topic":"国内観光資源","stem":"次の下線部a.〜d.のうち、誤っているものはどれか。<br>四国には、渦潮で知られる <u>a.鳴門海峡</u>、吉野川の激流がつくった <u>b.大歩危・小歩危</u>、陶板名画を展示する <u>c.大塚国際美術館</u>、地中美術館がある <u>d.小豆島</u> がある。","opts":{"a":"鳴門海峡","b":"大歩危・小歩危","c":"大塚国際美術館","d":"小豆島"},"ans":["d"],"pt":2,"exp":"地中美術館があるのは香川県直島。小豆島は寒霞渓・中山千枚田・オリーブで知られる。a・b・cはいずれも徳島県で正しい。","why":"直島の地中美術館は2022年度に出題済み。小豆島と直島の取り違えは典型的な誤答パターン。","ref":"国内観光資源／四国"},{"id":"Adom19","no":19,"sub":"dom","topic":"国内観光資源","stem":"日本三景・三名瀑に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"日本三景は松島、天橋立、宮島である。","b":"日本三名瀑は華厳の滝、那智の滝、袋田の滝である。","c":"那智の滝は和歌山県にあり、落差133mである。","d":"袋田の滝は栃木県にある。"},"ans":["d"],"pt":2,"exp":"袋田の滝は茨城県。華厳の滝が栃木県（日光）、那智の滝が和歌山県。三名瀑の県の組合せを入れ替える誤答が定番。","why":"三名瀑は5年で未出だが、華厳の滝・袋田の滝は個別に出題実績がある。定義を問う形が出やすい。","ref":"国内観光資源／横断"},{"id":"Adom20","no":20,"sub":"dom","topic":"国内観光資源","stem":"重要伝統的建造物群保存地区に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"白川郷（岐阜県）は合掌造り集落として選定されている。","b":"伊根（京都府）は舟屋の集落として選定されている。","c":"美観地区（岡山県倉敷市）は選定されている。","d":"御手洗（広島県呉市）は選定されている。"},"ans":["a","b","c","d"],"pt":2,"exp":"a〜dすべて重要伝統的建造物群保存地区に選定されている。ほかに角館・大内宿・妻籠・奈良井・郡上八幡・竹原・鞆の浦・萩・有田・飫肥・竹富島など全国120地区以上がある。","why":"重伝建は個別には毎年出題されるが、横断的に問う形は未出。伊根の舟屋・御手洗は5年で未出のため出やすい。","ref":"国内観光資源／横断"},{"id":"Adom21","no":21,"sub":"dom","topic":"宿泊料金","stem":"京都市内のホテルにおいて、基本宿泊料が1泊室料20,000円（サービス料別・税金別）のツインルーム1室に大人2人が食事なしで1泊する場合、宿泊客が支払うべき宿泊料金等の総額として正しいものはどれか。<br>※モデル宿泊約款により算出するものとする。※サービス料は10％、消費税は10％とする。※京都市の宿泊税は、1人1泊の宿泊料金が2万円未満のとき200円、2万円以上5万円未満のとき500円とする。","opts":{"a":"24,600円","b":"24,200円","c":"24,900円","d":"25,200円"},"ans":["a"],"pt":5,"exp":"室料20,000円÷2人＝1人10,000円で宿泊税は1人200円。基本宿泊料20,000＋サービス料2,000＝22,000円、消費税は22,000×10%＝2,200円。宿泊税400円（200円×2人）には消費税を課さない。20,000＋2,000＋2,200＋400＝24,600円。","why":"宿泊料金は5年連続で毎年1〜2問。「1室料金を人数で割って宿泊税を判定」と「税に税を課さない」の2点が毎回の分岐点。京都市の宿泊税は2025年度に出題済み。","ref":"モデル宿泊約款／京都市宿泊税","fig":"<svg viewBox=\"0 0 700 200\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"4\" y=\"6\" width=\"692\" height=\"28\" rx=\"2\" fill=\"var(--ink)\"/>\n<text x=\"20\" y=\"25\" fill=\"var(--paper)\" font-weight=\"700\">計算の順序を守る</text>\n<rect x=\"14\" y=\"46\" width=\"150\" height=\"46\" rx=\"2\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"28\" y=\"66\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ai)\">① 基本宿泊料</text><text x=\"28\" y=\"84\" font-size=\"12\">20,000円</text>\n<text x=\"172\" y=\"74\">＋</text>\n<rect x=\"190\" y=\"46\" width=\"150\" height=\"46\" rx=\"2\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"204\" y=\"66\" font-size=\"11\" font-weight=\"700\" fill=\"var(--ai)\">② サービス料 10%</text><text x=\"204\" y=\"84\" font-size=\"12\">2,000円</text>\n<text x=\"348\" y=\"74\">＋</text>\n<rect x=\"366\" y=\"46\" width=\"160\" height=\"46\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"380\" y=\"66\" font-size=\"11\" font-weight=\"700\">③ 消費税（①＋②）×10%</text><text x=\"380\" y=\"84\" font-size=\"12\">2,200円</text>\n<text x=\"534\" y=\"74\">＋</text>\n<rect x=\"552\" y=\"46\" width=\"144\" height=\"46\" rx=\"2\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"566\" y=\"66\" font-size=\"11\" font-weight=\"700\" fill=\"var(--koke)\">④ 宿泊税</text><text x=\"566\" y=\"84\" font-size=\"12\">200円×2人＝400円</text>\n<rect x=\"4\" y=\"104\" width=\"692\" height=\"42\" rx=\"2\" fill=\"var(--shuSoft)\" stroke=\"var(--shuLine)\"/>\n<text x=\"20\" y=\"124\" font-size=\"12\" font-weight=\"700\" fill=\"var(--shu)\">宿泊税の判定</text>\n<text x=\"20\" y=\"140\" font-size=\"12\">室料20,000円 ÷ 2人 ＝ <tspan font-weight=\"700\">1人あたり10,000円</tspan> → 2万円未満なので<tspan font-weight=\"700\">1人200円</tspan></text>\n<rect x=\"4\" y=\"156\" width=\"692\" height=\"40\" rx=\"2\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"20\" y=\"176\" font-size=\"12\" font-weight=\"700\">宿泊税に消費税は課さない</text>\n<text x=\"20\" y=\"192\" font-size=\"11.5\">（20,000＋2,000＋400）×10% とするのは誤り。消費税の対象は ①＋② のみ。</text>\n</g></svg>","figcap":"宿泊料金の計算手順"},{"id":"Adom22","no":22,"sub":"dom","topic":"貸切バス運賃","stem":"次の行程で貸切バス（大型車1台）を利用する場合の運賃として正しいものはどれか。<br>※時間制運賃は1時間あたり7,000円、キロ制運賃は1kmあたり170円とする。※深夜早朝運行はないものとする。","opts":{"a":"8時間×7,000円＋150km×170円＝81,500円","b":"10時間×7,000円＋170km×170円＝98,900円","c":"10時間×7,000円＋150km×170円＝95,500円","d":"8時間×7,000円＋170km×170円＝84,900円"},"ans":["b"],"pt":5,"exp":"時間制の対象は出庫前点呼1時間＋回送を含む走行時間8時間＋帰庫後点検1時間＝10時間。キロ制の対象は回送10km＋走行150km＋回送10km＝170km。回送を時間・距離とも含める点が分岐点。","why":"貸切バスは5年で21問（2024年度は11問）。回送を含めるか否かが毎回の争点で、回送を除外した誤答が必ず選択肢に入る。","ref":"一般貸切旅客自動車運送事業標準運送約款","fig":"<svg viewBox=\"0 0 700 210\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"11.5\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<text x=\"14\" y=\"22\" font-weight=\"700\">［行程］</text>\n<rect x=\"14\" y=\"32\" width=\"120\" height=\"34\" rx=\"2\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"26\" y=\"46\" font-size=\"10.5\">7:00 出庫</text><text x=\"26\" y=\"60\" font-size=\"10.5\">（車庫）</text>\n<line x1=\"134\" y1=\"49\" x2=\"176\" y2=\"49\" stroke=\"var(--shu)\" stroke-dasharray=\"4 3\" marker-end=\"url(#yah)\"/>\n<text x=\"136\" y=\"42\" font-size=\"10\" fill=\"var(--shu)\">回送10km</text>\n<rect x=\"178\" y=\"32\" width=\"120\" height=\"34\" rx=\"2\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"190\" y=\"46\" font-size=\"10.5\">8:00 乗車地</text><text x=\"190\" y=\"60\" font-size=\"10.5\">出発</text>\n<line x1=\"298\" y1=\"49\" x2=\"340\" y2=\"49\" stroke=\"var(--ink3)\" marker-end=\"url(#yah)\"/>\n<text x=\"300\" y=\"42\" font-size=\"10\">走行150km</text>\n<rect x=\"342\" y=\"32\" width=\"120\" height=\"34\" rx=\"2\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"354\" y=\"46\" font-size=\"10.5\">16:00 下車地</text><text x=\"354\" y=\"60\" font-size=\"10.5\">着</text>\n<line x1=\"462\" y1=\"49\" x2=\"504\" y2=\"49\" stroke=\"var(--shu)\" stroke-dasharray=\"4 3\" marker-end=\"url(#yah)\"/>\n<text x=\"464\" y=\"42\" font-size=\"10\" fill=\"var(--shu)\">回送10km</text>\n<rect x=\"506\" y=\"32\" width=\"120\" height=\"34\" rx=\"2\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"518\" y=\"46\" font-size=\"10.5\">17:00 帰庫</text>\n<defs><marker id=\"yah\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0 0 L6 3 L0 6 z\" fill=\"var(--ink3)\"/></marker></defs>\n<rect x=\"4\" y=\"80\" width=\"340\" height=\"60\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"18\" y=\"100\" font-weight=\"700\">時間制の対象時間</text>\n<text x=\"18\" y=\"118\" font-size=\"11.5\">出庫前点呼 1h ＋ 走行（回送含む）8h ＋ 帰庫後点検 1h</text>\n<text x=\"18\" y=\"136\" font-size=\"13\" font-weight=\"700\">＝ 10時間</text>\n<rect x=\"352\" y=\"80\" width=\"344\" height=\"60\" rx=\"2\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"366\" y=\"100\" font-weight=\"700\" fill=\"var(--koke)\">キロ制の対象距離</text>\n<text x=\"366\" y=\"118\" font-size=\"11.5\">回送10km ＋ 走行150km ＋ 回送10km</text>\n<text x=\"366\" y=\"136\" font-size=\"13\" font-weight=\"700\" fill=\"var(--koke)\">＝ 170km</text>\n<rect x=\"4\" y=\"150\" width=\"692\" height=\"54\" rx=\"2\" fill=\"var(--shuSoft)\" stroke=\"var(--shuLine)\"/>\n<text x=\"18\" y=\"170\" font-weight=\"700\" fill=\"var(--shu)\">回送を落とさない</text>\n<text x=\"18\" y=\"190\" font-size=\"11.5\">時間・距離とも <tspan font-weight=\"700\">出庫〜乗車</tspan> と <tspan font-weight=\"700\">下車〜帰庫</tspan> の回送を含める。乗車〜下車だけで計算すると誤答になる。</text>\n</g></svg>","figcap":"貸切バスの運賃計算"},{"id":"Adom23","no":23,"sub":"dom","topic":"貸切バス運賃","stem":"貸切バスの取消料に関する次の記述のうち、正しいものはどれか。","opts":{"a":"配車日の14日前から8日前までに取り消した場合、所定の運賃・料金の30%の取消料を支払う。","b":"配車日の7日前から24時間前までに取り消した場合、所定の運賃・料金の30%の取消料を支払う。","c":"契約した配車車両の10%以上の車両数が減少したときは、減少した車両1台につき取消料を支払う。","d":"バス会社の責に帰すべき事由により目的地の一部にも到達しなかった場合、運賃及び料金の半額が払い戻される。"},"ans":["b"],"pt":5,"exp":"取消料は14日前〜8日前が20%、7日前〜24時間前が30%、24時間前以降が50%。車両減は20%以上減少したときに適用。目的地の一部にも到達しなかったときは全額払戻し。","why":"貸切バスの取消料は出題される年に必ず含まれる。率（20/30/50）と車両減の20%の数字入替えが定番。","ref":"貸切バス標準運送約款"},{"id":"Adom24","no":24,"sub":"dom","topic":"フェリー","stem":"次の条件でフェリーを利用する場合の旅客運賃及び自動車航送運賃の合計額として正しいものはどれか。<br>大人2人、小学6年生1人、4歳1人が、乗用車1台とともに乗船する。<br>※大人の2等旅客運賃は3,000円、小児運賃はその半額とする。<br>※自動車航送運賃は12,000円で、運転者1人分の2等旅客運賃を含む。<br>※小学校入学前の小児は、大人1人につき1人を無賃とする。","opts":{"a":"16,500円","b":"18,000円","c":"15,000円","d":"19,500円"},"ans":["a"],"pt":5,"exp":"① 自動車航送運賃 12,000円（運転者1人分の2等運賃を含む）。② 大人2人のうち1人は航送運賃に含まれるため、残り1人分 3,000円。③ 小学6年生は小児運賃 1,500円。④ 4歳の未就学児は大人1人につき1人が無賃となるため0円。合計 12,000＋3,000＋1,500＝16,500円。","why":"フェリーは5年連続で毎年1〜2問。「航送運賃に運転者1人分の2等運賃が含まれる」を見落として大人2人分を計上する誤答（19,500円）が定番。","ref":"フェリー運送約款","fig":"<svg viewBox=\"0 0 700 190\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"4\" y=\"6\" width=\"692\" height=\"28\" rx=\"2\" fill=\"var(--ink)\"/>\n<text x=\"20\" y=\"25\" fill=\"var(--paper)\" font-weight=\"700\">大人2人・小学6年生1人・4歳1人＋乗用車1台</text>\n<rect x=\"4\" y=\"44\" width=\"200\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"62\" font-weight=\"700\">区分</text>\n<rect x=\"204\" y=\"44\" width=\"290\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"218\" y=\"62\" font-weight=\"700\">扱い</text>\n<rect x=\"494\" y=\"44\" width=\"202\" height=\"26\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"508\" y=\"62\" font-weight=\"700\">金額</text>\n<rect x=\"4\" y=\"70\" width=\"200\" height=\"26\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"88\">自動車航送運賃</text>\n<rect x=\"204\" y=\"70\" width=\"290\" height=\"26\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"218\" y=\"88\" font-weight=\"700\">運転者1人分の2等運賃を含む</text>\n<rect x=\"494\" y=\"70\" width=\"202\" height=\"26\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"508\" y=\"88\">12,000円</text>\n<rect x=\"4\" y=\"96\" width=\"200\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"114\">大人（残り1人）</text>\n<rect x=\"204\" y=\"96\" width=\"290\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"218\" y=\"114\">2等旅客運賃</text>\n<rect x=\"494\" y=\"96\" width=\"202\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"508\" y=\"114\">3,000円</text>\n<rect x=\"4\" y=\"122\" width=\"200\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"140\">小学6年生</text>\n<rect x=\"204\" y=\"122\" width=\"290\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"218\" y=\"140\">小児運賃（大人の半額）</text>\n<rect x=\"494\" y=\"122\" width=\"202\" height=\"26\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"508\" y=\"140\">1,500円</text>\n<rect x=\"4\" y=\"148\" width=\"200\" height=\"26\" fill=\"var(--kinSoft)\" stroke=\"var(--rule)\"/><text x=\"18\" y=\"166\">4歳（未就学児）</text>\n<rect x=\"204\" y=\"148\" width=\"290\" height=\"26\" fill=\"var(--kinSoft)\" stroke=\"var(--rule)\"/><text x=\"218\" y=\"166\" font-weight=\"700\">大人1人につき1人が無賃</text>\n<rect x=\"494\" y=\"148\" width=\"202\" height=\"26\" fill=\"var(--kinSoft)\" stroke=\"var(--rule)\"/><text x=\"508\" y=\"166\" font-weight=\"700\">0円</text>\n</g></svg>","figcap":"フェリー運賃の内訳"},{"id":"Adom25","no":25,"sub":"dom","topic":"国内航空","stem":"日本航空の航空券（券面額18,000円。うち旅客施設使用料440円、旅客保安サービス料1,540円）を、取消手数料50%が適用される時期に払いもどす場合の払戻額として正しいものはどれか。","opts":{"a":"9,000円","b":"9,990円","c":"8,010円","d":"11,970円"},"ans":["b"],"pt":5,"exp":"取消手数料の基礎となるのは「券面額 − 旅客施設使用料 − 旅客保安サービス料」＝18,000−440−1,540＝16,020円。その50%が8,010円が取消手数料。払戻額は券面額から取消手数料を差し引いた 18,000−8,010＝9,990円。施設使用料等は返金されるので、払戻額から重ねて差し引かない。","why":"★国内航空の取消手数料は2021・2023年度のみで、2024・2025年度は出題なし。2年連続で出ていないため次年度の出題確率が高い。「施設使用料を控除してから率を乗じる／払戻額からは差し引かない」の2段構えが毎回の分岐点。","ref":"国内旅客運送約款／各社運賃規則","fig":"<svg viewBox=\"0 0 700 186\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"4\" y=\"6\" width=\"692\" height=\"46\" rx=\"2\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"20\" y=\"26\" font-weight=\"700\" fill=\"var(--ai)\">① 取消手数料の基礎額を出す</text>\n<text x=\"20\" y=\"44\" font-size=\"13\">18,000円 − 440円（施設使用料）− 1,540円（保安サービス料）＝ <tspan font-weight=\"700\">16,020円</tspan></text>\n<rect x=\"4\" y=\"60\" width=\"692\" height=\"40\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"20\" y=\"80\" font-weight=\"700\">② 率を乗じる</text>\n<text x=\"20\" y=\"96\" font-size=\"13\">16,020円 × 50% ＝ <tspan font-weight=\"700\">8,010円</tspan>（取消手数料）</text>\n<rect x=\"4\" y=\"108\" width=\"692\" height=\"40\" rx=\"2\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"20\" y=\"128\" font-weight=\"700\" fill=\"var(--koke)\">③ 払戻額を出す</text>\n<text x=\"20\" y=\"144\" font-size=\"13\">18,000円 − 8,010円 ＝ <tspan font-weight=\"700\" fill=\"var(--koke)\">9,990円</tspan></text>\n<rect x=\"4\" y=\"154\" width=\"692\" height=\"30\" rx=\"2\" fill=\"var(--shuSoft)\" stroke=\"var(--shuLine)\"/>\n<text x=\"20\" y=\"174\" font-size=\"11.5\"><tspan font-weight=\"700\">施設使用料は返金される</tspan>ので、払戻額からさらに差し引いてはならない（9,990−1,980＝8,010円 とするのは誤り）。</text>\n</g></svg>","figcap":"取消手数料と払戻額の計算"},{"id":"Adom26","no":26,"sub":"dom","topic":"国内航空","stem":"国内航空の各種割引運賃に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"小児割引は、日本航空のセイバー運賃及びスペシャルセイバー運賃にも適用される。","b":"スカイメイトは、満12歳以上26歳未満の旅客が搭乗日当日に空席がある場合に利用できる。","c":"当日シニア割引は、満65歳以上の旅客が事前に予約することができる。","d":"年齢の判定は、搭乗日の実年齢による。"},"ans":["a","b","d"],"pt":5,"exp":"cは誤り。当日シニア割引は予約ができず、搭乗日当日に空席が見込まれる場合に空港で購入する。航空では満12歳以上が大人であり、JRの「小学生の12歳は小児」とは扱いが逆になる。","why":"航空運賃の割引は5年で毎年2〜3問。「当日のみ・予約不可」の性質を問う形が定番。","ref":"国内旅客運送約款"},{"id":"Adom27","no":27,"sub":"dom","topic":"JR運賃・料金","stem":"大人1人が次の行程を途中下車せずに乗車する場合の片道普通運賃として正しいものはどれか。<br>［行程］A駅 —(幹線 営業キロ120.0km)— B駅 —(地方交通線 営業キロ40.0km／換算キロ44.0km)— C駅","opts":{"a":"営業キロ160.0kmで幹線用の運賃表を適用する。","b":"運賃計算キロ164.0kmで幹線用の運賃表を適用する。","c":"営業キロ160.0kmで地方交通線用の運賃表を適用する。","d":"幹線分120.0kmと地方交通線分40.0kmをそれぞれ計算して合算する。"},"ans":["b"],"pt":5,"exp":"幹線と地方交通線をまたぐ場合は、幹線の営業キロ120.0kmと地方交通線の換算キロ44.0kmを合算した運賃計算キロ164.0kmにより、幹線用の普通運賃表で計算する。地方交通線のみを乗車する場合は営業キロで地方交通線用の表を用いる。","why":"★JR普通運賃は2021〜2024年度に毎年出題されたが2025年度は出題なし。幹線と地方交通線の合算は最も基本的な計算で、次年度の出題確率が高い。","ref":"JR旅客営業規則","fig":"<svg viewBox=\"0 0 700 176\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"30\" y=\"26\" width=\"160\" height=\"38\" rx=\"2\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"98\" y=\"50\">A駅</text>\n<line x1=\"190\" y1=\"45\" x2=\"270\" y2=\"45\" stroke=\"var(--ai)\" stroke-width=\"3\"/>\n<text x=\"196\" y=\"36\" font-size=\"11\" fill=\"var(--ai)\" font-weight=\"700\">幹線</text>\n<text x=\"196\" y=\"62\" font-size=\"10.5\">営業キロ 120.0km</text>\n<rect x=\"272\" y=\"26\" width=\"160\" height=\"38\" rx=\"2\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"340\" y=\"50\">B駅</text>\n<line x1=\"432\" y1=\"45\" x2=\"512\" y2=\"45\" stroke=\"var(--kin)\" stroke-width=\"3\" stroke-dasharray=\"6 3\"/>\n<text x=\"436\" y=\"36\" font-size=\"11\" font-weight=\"700\">地方交通線</text>\n<text x=\"436\" y=\"62\" font-size=\"10.5\">営業40.0／換算44.0km</text>\n<rect x=\"514\" y=\"26\" width=\"160\" height=\"38\" rx=\"2\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"582\" y=\"50\">C駅</text>\n<rect x=\"4\" y=\"82\" width=\"692\" height=\"42\" rx=\"2\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"20\" y=\"102\" font-weight=\"700\" fill=\"var(--koke)\">またがるときは「運賃計算キロ」で「幹線用」の運賃表</text>\n<text x=\"20\" y=\"118\" font-size=\"13\">120.0km（幹線の営業キロ）＋ 44.0km（地方交通線の換算キロ）＝ <tspan font-weight=\"700\">164.0km</tspan></text>\n<rect x=\"4\" y=\"132\" width=\"692\" height=\"40\" rx=\"2\" fill=\"var(--shuSoft)\" stroke=\"var(--shuLine)\"/>\n<text x=\"20\" y=\"152\" font-size=\"11.5\"><tspan font-weight=\"700\">地方交通線のみ</tspan>のときは「営業キロ」で「地方交通線用」の表。またがるときと使うキロも表も違う。</text>\n<text x=\"20\" y=\"168\" font-size=\"11.5\">キロ数の端数は 1km未満を<tspan font-weight=\"700\">切り上げ</tspan>てから運賃表を引く。</text>\n</g></svg>","figcap":"幹線と地方交通線をまたぐ運賃計算"},{"id":"Adom28","no":28,"sub":"dom","topic":"JR運賃・料金","stem":"JRの特急料金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"普通車自由席を利用する場合の特急料金は、通常期の普通車指定席特急料金の530円引きであり、乗車日による変動はない。","b":"グリーン車を利用する場合の特急料金にも、シーズン別の加減額が適用される。","c":"一部区間のみ指定席を利用した場合、その区間だけ指定席特急料金を計算する。","d":"小児の特急料金は、シーズン別の加減額を行った後の大人料金を半額にして求める。"},"ans":["a","b","d"],"pt":5,"exp":"cは誤り。一部区間でも指定席を利用すれば全区間が指定席特急料金となる。小児は加減額を反映した大人料金を出してから半額にする順序が重要。","why":"JR特急料金は5年で25問と国内の最頻出。自由席の通年同額、小児の計算順序が繰り返し問われる。","ref":"JR旅客営業規則"},{"id":"Adom29","no":29,"sub":"dom","topic":"JR運賃・料金","stem":"JRの乗継割引に関する次の記述のうち、正しいものはどれか。","opts":{"a":"在来線特急どうしを改札口を出ないで乗り継ぐ場合にも、乗継割引が適用される。","b":"乗継割引が適用されると、在来線側の特急料金が半額（10円未満切捨て）となる。","c":"乗継割引は、必ず同一日中に乗り継ぐ場合に限り適用される。","d":"自由席特急券を利用する場合にも、乗継割引が適用される。"},"ans":["b"],"pt":5,"exp":"乗継割引は新幹線と在来線特急・急行の間で適用され、在来線側が半額になる。在来線特急どうしには適用されない。下りの場合は翌日にまたがっても適用される。","why":"乗継割引は5年で複数回。在来線特急どうしへの誤適用が定番の誤答。2022年度に類題が出た。","ref":"JR旅客営業規則"},{"id":"Adom30","no":30,"sub":"dom","topic":"JR運賃・料金","stem":"JRの払いもどし手数料に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"未使用の乗車券を有効期間内に払いもどす場合の手数料は220円である。","b":"指定席特急券を乗車日の2日前までに払いもどす場合の手数料は340円である。","c":"4人用のグリーン個室を払いもどす場合、手数料は340円×4人分となる。","d":"乗車券と指定券が1枚で発行されている場合、手数料はそれぞれに必要である。"},"ans":["a","b","d"],"pt":5,"exp":"cは誤り。個室は1個室を1券片として扱うため、4人用個室でも手数料は340円。指定席特急券は前日から出発時刻までは券面額の30%（最低340円）。","why":"払いもどし手数料は5年連続で毎年1〜2問。個室の扱いと、乗車券・指定券それぞれに手数料が必要な点が繰り返し問われる。","ref":"JR旅客営業規則"},{"id":"Adom31","no":31,"sub":"dom","topic":"JR運賃・料金","stem":"ジパング倶楽部に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"会員資格は満65歳以上であり、JR線を営業キロ片道101km以上乗車する場合に割引が適用される。","b":"新規会員は3回目まで運賃・料金が2割引、4回目以降は3割引となる。","c":"「のぞみ」「みずほ」については、自由席を利用する場合であっても特急料金は割引されない。","d":"4月27日から5月6日までの期間も利用することができる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。4/27〜5/6、8/10〜19、12/28〜1/6は利用制限期間で利用できない。更新会員は1回目から3割引。","why":"ジパング倶楽部は2021・2023年度に出題。「のぞみ・みずほは自由席も対象外」と利用制限期間が核心。","ref":"JR特別企画乗車券"},{"id":"Adom32","no":32,"sub":"dom","topic":"JR運賃・料金","stem":"次の時刻表の抜粋に関する記述のうち、正しいものはどれか。","opts":{"a":"特急「かもめ3号」の普通車は全車両が指定席である。","b":"快速「シーサイドライナー」にはグリーン車自由席がある。","c":"特急「みどり5号」にはグランクラス（A）が連結されている。","d":"普通列車には座席の指定はない。"},"ans":["d"],"pt":
