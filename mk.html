5,"exp":"時刻表でマークのない列車は全車両が普通車自由席。指定席・グリーン車・グランクラスはそれぞれ専用のマークで表示されるため、マークの有無を確認する。","why":"JR時刻表の読み取りは5年連続で毎年1問と完全に固定。記号の意味（指定席・グリーン車自由席・グランクラス）を問う形が定番。","ref":"JR時刻表の記号"},{"id":"Aovs01","no":1,"sub":"ovs","topic":"国際航空運賃","stem":"［資料］に基づき、東京（TYO）を出発し、ヘルシンキ（HEL）を経由してパリ（PAR）へ向かう往路について、マイレージ超過による割増率として正しいものはどれか。","opts":{"a":"割増なし（1.00）","b":"1.05","c":"1.10","d":"1.15"},"ans":["a"],"pt":5,"exp":"TPMは TYO－HEL 4,795 ＋ HEL－PAR 1,148 ＝ 5,943マイル。運賃計算区間 TYO－PAR のMPMは7,432マイル。5,943÷7,432＝0.80で1.00以下のため、マイレージ超過による割増は生じない。","why":"国際航空運賃は5年連続で毎年8問。TPMとMPMの比較は毎回の第一歩で、折り返し地点の選択とセットで問われる。","ref":"マイレージシステム","fig":"<svg viewBox=\"0 0 700 250\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"11.5\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<text x=\"14\" y=\"20\" font-weight=\"700\">［資料1］区間マイル（TPM）</text>\n<rect x=\"14\" y=\"28\" width=\"330\" height=\"24\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"26\" y=\"45\" font-weight=\"700\">区間</text><text x=\"250\" y=\"45\" font-weight=\"700\">TPM</text>\n<rect x=\"14\" y=\"52\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"68\">TYO － HEL</text><text x=\"250\" y=\"68\">4,795</text>\n<rect x=\"14\" y=\"74\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"90\">HEL － PAR</text><text x=\"250\" y=\"90\">1,148</text>\n<rect x=\"14\" y=\"96\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"112\">TYO － LON</text><text x=\"250\" y=\"112\">5,955</text>\n<rect x=\"14\" y=\"118\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"134\">LON － PAR</text><text x=\"250\" y=\"134\">215</text>\n<rect x=\"14\" y=\"140\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"156\">PAR － TYO</text><text x=\"250\" y=\"156\">6,194</text>\n<text x=\"366\" y=\"20\" font-weight=\"700\">［資料2］最大許容マイル（MPM）</text>\n<rect x=\"366\" y=\"28\" width=\"320\" height=\"24\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"378\" y=\"45\" font-weight=\"700\">区間</text><text x=\"590\" y=\"45\" font-weight=\"700\">MPM</text>\n<rect x=\"366\" y=\"52\" width=\"320\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"68\">TYO － PAR</text><text x=\"590\" y=\"68\">7,432</text>\n<rect x=\"366\" y=\"74\" width=\"320\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"90\">TYO － LON</text><text x=\"590\" y=\"90\">7,146</text>\n<text x=\"366\" y=\"118\" font-weight=\"700\">［資料3］マイレージ超過による割増</text>\n<rect x=\"366\" y=\"126\" width=\"160\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"142\" font-size=\"11\">TPM÷MPM</text>\n<rect x=\"526\" y=\"126\" width=\"160\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"142\" font-size=\"11\">乗じる率</text>\n<rect x=\"366\" y=\"148\" width=\"160\" height=\"20\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"163\" font-size=\"11\">1.00以下</text>\n<rect x=\"526\" y=\"148\" width=\"160\" height=\"20\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"163\" font-size=\"11\">1.00</text>\n<rect x=\"366\" y=\"168\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"183\" font-size=\"11\">1.05まで</text>\n<rect x=\"526\" y=\"168\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"183\" font-size=\"11\">1.05</text>\n<rect x=\"366\" y=\"188\" width=\"160\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"203\" font-size=\"11\">1.10まで</text>\n<rect x=\"526\" y=\"188\" width=\"160\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"203\" font-size=\"11\">1.10</text>\n<rect x=\"366\" y=\"208\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"223\" font-size=\"11\">1.15まで</text>\n<rect x=\"526\" y=\"208\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"223\" font-size=\"11\">1.15</text>\n<text x=\"14\" y=\"188\" font-size=\"11\">［資料4］運賃額（往復）</text>\n<rect x=\"14\" y=\"196\" width=\"200\" height=\"20\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"211\" font-size=\"11\">Flex Y（TYO－PAR）</text>\n<rect x=\"214\" y=\"196\" width=\"130\" height=\"20\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"226\" y=\"211\" font-size=\"11\">860,000円</text>\n<rect x=\"14\" y=\"216\" width=\"200\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"231\" font-size=\"11\">Flex Y（TYO－LON）</text>\n<rect x=\"214\" y=\"216\" width=\"130\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"226\" y=\"231\" font-size=\"11\">840,000円</text>\n</g></svg>","figcap":"資料（マイレージ表・運賃表）"},{"id":"Aovs02","no":2,"sub":"ovs","topic":"国際航空運賃","stem":"［資料］に基づき、東京（TYO）を出発し、ロンドン（LON）を経由してパリ（PAR）へ向かう往路について、マイレージ超過による割増率として正しいものはどれか。","opts":{"a":"割増なし（1.00）","b":"1.05","c":"1.10","d":"1.15"},"ans":["a"],"pt":5,"exp":"TPMは TYO－LON 5,955 ＋ LON－PAR 215 ＝ 6,170マイル。TYO－PAR のMPMは7,432マイル。6,170÷7,432＝0.83で1.00以下のため割増なし。折り返し地点をPARとすると、経由地をHELにしてもLONにしても割増は生じない。","why":"同一の目的地に対して複数の経由地を示し、どちらが有利かを問う形は毎年出る。MPMは運賃計算区間の両端で決まる点が理解の要。","ref":"マイレージシステム","fig":"<svg viewBox=\"0 0 700 250\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"11.5\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<text x=\"14\" y=\"20\" font-weight=\"700\">［資料1］区間マイル（TPM）</text>\n<rect x=\"14\" y=\"28\" width=\"330\" height=\"24\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"26\" y=\"45\" font-weight=\"700\">区間</text><text x=\"250\" y=\"45\" font-weight=\"700\">TPM</text>\n<rect x=\"14\" y=\"52\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"68\">TYO － HEL</text><text x=\"250\" y=\"68\">4,795</text>\n<rect x=\"14\" y=\"74\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"90\">HEL － PAR</text><text x=\"250\" y=\"90\">1,148</text>\n<rect x=\"14\" y=\"96\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"112\">TYO － LON</text><text x=\"250\" y=\"112\">5,955</text>\n<rect x=\"14\" y=\"118\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"134\">LON － PAR</text><text x=\"250\" y=\"134\">215</text>\n<rect x=\"14\" y=\"140\" width=\"330\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"156\">PAR － TYO</text><text x=\"250\" y=\"156\">6,194</text>\n<text x=\"366\" y=\"20\" font-weight=\"700\">［資料2］最大許容マイル（MPM）</text>\n<rect x=\"366\" y=\"28\" width=\"320\" height=\"24\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"378\" y=\"45\" font-weight=\"700\">区間</text><text x=\"590\" y=\"45\" font-weight=\"700\">MPM</text>\n<rect x=\"366\" y=\"52\" width=\"320\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"68\">TYO － PAR</text><text x=\"590\" y=\"68\">7,432</text>\n<rect x=\"366\" y=\"74\" width=\"320\" height=\"22\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"90\">TYO － LON</text><text x=\"590\" y=\"90\">7,146</text>\n<text x=\"366\" y=\"118\" font-weight=\"700\">［資料3］マイレージ超過による割増</text>\n<rect x=\"366\" y=\"126\" width=\"160\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"142\" font-size=\"11\">TPM÷MPM</text>\n<rect x=\"526\" y=\"126\" width=\"160\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"142\" font-size=\"11\">乗じる率</text>\n<rect x=\"366\" y=\"148\" width=\"160\" height=\"20\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"163\" font-size=\"11\">1.00以下</text>\n<rect x=\"526\" y=\"148\" width=\"160\" height=\"20\" fill=\"var(--kokeSoft)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"163\" font-size=\"11\">1.00</text>\n<rect x=\"366\" y=\"168\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"183\" font-size=\"11\">1.05まで</text>\n<rect x=\"526\" y=\"168\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"183\" font-size=\"11\">1.05</text>\n<rect x=\"366\" y=\"188\" width=\"160\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"203\" font-size=\"11\">1.10まで</text>\n<rect x=\"526\" y=\"188\" width=\"160\" height=\"20\" fill=\"var(--aiSoft)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"203\" font-size=\"11\">1.10</text>\n<rect x=\"366\" y=\"208\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"378\" y=\"223\" font-size=\"11\">1.15まで</text>\n<rect x=\"526\" y=\"208\" width=\"160\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"538\" y=\"223\" font-size=\"11\">1.15</text>\n<text x=\"14\" y=\"188\" font-size=\"11\">［資料4］運賃額（往復）</text>\n<rect x=\"14\" y=\"196\" width=\"200\" height=\"20\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"211\" font-size=\"11\">Flex Y（TYO－PAR）</text>\n<rect x=\"214\" y=\"196\" width=\"130\" height=\"20\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"226\" y=\"211\" font-size=\"11\">860,000円</text>\n<rect x=\"14\" y=\"216\" width=\"200\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"26\" y=\"231\" font-size=\"11\">Flex Y（TYO－LON）</text>\n<rect x=\"214\" y=\"216\" width=\"130\" height=\"20\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"226\" y=\"231\" font-size=\"11\">840,000円</text>\n</g></svg>","figcap":"資料（マイレージ表・運賃表）"},{"id":"Aovs03","no":3,"sub":"ovs","topic":"国際航空運賃","stem":"運賃計算における途中降機（Stopover）と乗り継ぎ（Transit）に関する次の記述のうち、正しいものはどれか。","opts":{"a":"途中降機とは、運賃計算区間内の中間地点で24時間以内の滞在をすることをいう。","b":"乗り継ぎとは、運賃計算区間内の中間地点で24時間以内の滞在をすることをいう。","c":"途中降機は、eチケットの運賃計算情報欄でX/と表示される。","d":"乗り継ぎには、必ず途中降機料金が加算される。"},"ans":["b"],"pt":5,"exp":"途中降機は24時間を超える滞在、乗り継ぎは24時間以内の滞在。運賃計算欄では乗換地にX/を付し、途中降機料金はSで表示する。","why":"途中降機と乗り継ぎの区別は運賃計算の前提。24時間という数字と、X/・Sの記号は5年で複数回問われている。","ref":"国際航空運賃／用語"},{"id":"Aovs04","no":4,"sub":"ovs","topic":"国際航空運賃","stem":"HIP CHECK（Higher Intermediate Point Check）に関する次の記述のうち、正しいものはどれか。","opts":{"a":"運賃計算区間内において、始点から終点の運賃と、始点から中間途中降機地点の運賃及び中間途中降機地点から終点の運賃を比較し、始点から終点の運賃より高い場合にその一番高い運賃を使用する規則である。","b":"マイレージ超過の割増率が1.25を超える場合に、区間を分割して安い運賃の組合せを探す規則である。","c":"往路と復路で異なる運賃種別を適用する場合に、高いほうの運賃額を全区間に適用する規則である。","d":"燃油サーチャージが運賃額を上回る場合に、運賃額を引き上げる規則である。"},"ans":["a"],"pt":5,"exp":"HIP CHECKは安い運賃で長く乗ることを防ぐ規則。bはlowest combinationの説明。","why":"HIP CHECKは2021年度に出題。国際航空運賃の規則を正面から問う形は毎年8問の枠内で必ず1〜2問含まれる。","ref":"国際航空運賃／HIP CHECK"},{"id":"Aovs05","no":5,"sub":"ovs","topic":"国際航空運賃","stem":"適用運賃及び規則に関する次の記述のうち、正しいものはどれか。","opts":{"a":"運賃・規則は、航空券の発券日に適用される、旅行開始日に有効なものを使用する。","b":"運賃・規則は、航空券の第一区間の旅行開始日に適用される、航空券の発券日に有効なものを使用する。","c":"発券日から旅行開始日までの間に運賃の変更があった場合は、変更後の運賃が適用される。","d":"運賃・規則は、旅行終了日に有効なものを使用する。"},"ans":["b"],"pt":5,"exp":"運賃・規則は「第一区間の旅行開始日に適用される、発券日に有効なもの」。発券後に運賃が改定されても、発券日に有効な運賃が適用される。","why":"適用時点は2021年度の資料編にも明記された基本規則。JAL国際運送約款の「約款＝運送開始日／運賃＝発行日」とあわせて押さえる。","ref":"国際航空運賃／適用運賃"},{"id":"Aovs06","no":6,"sub":"ovs","topic":"国際航空運賃","stem":"eチケットの運賃計算情報欄に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"X/は乗換地（24時間以内の乗り継ぎ）を表す。","b":"Qは追加運賃（特定便追加運賃等）を表す。","c":"NUCは運賃計算単位の合計額を表す。","d":"ROEは途中降機料金を表す。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。ROEはRate of Exchange（換算レート）。途中降機料金はSで表示する。記載は都市コード→航空会社コード→NUC額→Q・S→END→ROEの順。","why":"◎eチケットの運賃計算欄は2021〜2024年度に毎年出題されたが2025年度は出題なし。前年に出ていないため次年度の出題確率が高い。","ref":"国際航空運賃／eチケット"},{"id":"Aovs07","no":7,"sub":"ovs","topic":"国際航空運賃","stem":"マイレージ超過による割増に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"TPMがMPM以内である場合、割増は生じない。","b":"TPM÷MPMが1.15までの場合、運賃額に1.15を乗じる。","c":"TPM÷MPMが1.25を超える場合は、1.30を乗じて計算する。","d":"MPMは、運賃計算区間の両端の地点によって決まる。"},"ans":["a","b","d"],"pt":5,"exp":"cは誤り。1.25を超える場合はlowest combination（区間を分けて安い組合せを探す）となる。割増率は1.05→5%、1.10→10%、1.15→15%、1.20→20%、1.25→25%。","why":"割増率の表は資料編に掲載されるが、上限を超えた場合の扱いは記憶が必要。2021年度の資料編にlowest combinationの記載がある。","ref":"国際航空運賃／マイレージシステム"},{"id":"Aovs08","no":8,"sub":"ovs","topic":"国際航空運賃","stem":"国際航空券の予約変更及び払戻しに関する次の記述のうち、正しいものはどれか。","opts":{"a":"予約変更が可能な運賃であれば、旅行開始後であっても同一便・同一クラスへの日付変更は無条件で認められる。","b":"予約変更が不可能な運賃の航空券は、いかなる場合も払戻しを受けることができない。","c":"発券期限までに発券を受けない場合、航空会社は予約を取り消すことができる。","d":"旅行開始後に取り消した場合、常に全額が払い戻される。"},"ans":["c"],"pt":5,"exp":"aは変更手数料や運賃差額が必要な場合がある。bは所定の取消手数料を差し引いて払い戻される運賃もある。dも誤りで、旅行開始後は使用済み区間分を差し引く。","why":"運賃規則の適用は毎年8問の枠に必ず含まれる。発券期限と予約の取消しは資料編の規則表から読み取る形が定番。","ref":"国際航空運賃／規則の適用"},{"id":"Aovs09","no":9,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"一般旅券の発給申請に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"旅券の残存有効期間が1年未満となったときは、新規発給を申請することができる。","b":"査証欄の余白が見開き3ページ以下となったときは、残存有効期間にかかわらず新規発給を申請することができる。","c":"旅券の残存有効期間が3年未満となったときは、新規発給を申請することができる。","d":"有効な旅券を著しく損傷したときは、新規発給を申請することができる。"},"ans":["c"],"pt":5,"exp":"「残存有効期間が3年未満」は発給申請の事由ではない。1年未満となったとき、査証欄の余白が3ページ以下となったとき、記載事項に変更が生じたとき、著しく損傷したとき、紛失・盗難・焼失の届出をしたときなどが事由。","why":"旅券の発給は5年連続で毎年3〜4問と海外法令の最頻出。「1年未満」を3年・5年に変える誤答が定番。","ref":"旅券法第3条"},{"id":"Aovs10","no":10,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"旅券発給申請における本人確認書類に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"個人番号カードは、1点で本人確認書類の要件を満たす。","b":"健康保険被保険者証と国民年金手帳の2点の組合せは、本人確認書類として認められる。","c":"写真付きの学生証と失効後6か月を経過した旅券の2点の組合せは、本人確認書類として認められる。","d":"平成24年4月1日以降に交付された運転経歴証明書は、1点で本人確認書類の要件を満たす。"},"ans":["a","b","d"],"pt":5,"exp":"cは誤り。写真付き学生証も失効後6か月経過の旅券もいずれもB群であり、B＋Bの組合せは認められない。A＋A、A＋Bは可。","why":"★本人確認書類は2021・2023年度のみで、2024・2025年度は出題なし。2年連続で出ていないため次年度の出題確率が高い。","ref":"旅券法施行規則"},{"id":"Aovs11","no":11,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"旅券の失効に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅券は、発行の日から6か月以内に受領しないときは失効する。","b":"紛失の届出をしたときは、その届出のときに従前の旅券が失効する。","c":"国外において旅券を紛失したときは、遅滞なく領事官に届け出なければならない。","d":"名義人が身体の障害により届出が困難なときは、配偶者又は2親等内の親族が代わって届け出ることができる。"},"ans":["a","c","d"],"pt":5,"exp":"bは誤り。紛失の届出をしても、従前の旅券が失効するのは新たな旅券の発給を受けたとき。国内では都道府県知事を経由して外務大臣へ届け出る。","why":"「発行の日から6か月」は毎年どこかで問われる数字。3か月とする誤答が定番。","ref":"旅券法第18条"},{"id":"Aovs12","no":12,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"外国人の再入国許可に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"再入国許可の有効期間は原則として5年であり、特別永住者は6年である。","b":"みなし再入国許可の有効期間は、出国の日から1年である。","c":"みなし再入国許可についても、在外公館において有効期間の延長を受けることができる。","d":"再入国許可及びみなし再入国許可の有効期間は、在留期間の満了日を超えることができない。"},"ans":["c"],"pt":5,"exp":"みなし再入国許可には在外公館での期間延長の制度がない。通常の再入国許可には1年を超えない範囲での延長制度がある点との対比が核心。","why":"再入国許可は5年連続で毎年1問。「みなし再入国には延長制度がない」は繰り返し問われる非対称。","ref":"入管法第26条・第26条の2"},{"id":"Aovs13","no":13,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"日本に入国する際の携帯品の免税範囲に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"1品目の海外市価の合計額が1万円以下のものは、原則として免税枠20万円の計算から除外される。","b":"20歳未満の者には、酒類及びたばこの免税は適用されない。","c":"6歳未満の子供については、おもちゃなど本人が使用すると認められるもの以外は免税とならない。","d":"香水は3オンスまで免税である。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。香水は2オンス（約56ml）まで免税。酒類は3本、その他の品目は海外市価の合計額20万円まで。","why":"免税範囲は5年連続で毎年2問。「1品目1万円以下は枠から除外」を落とすと申告価格の計算を誤る。","ref":"関税法／携帯品の免税範囲"},{"id":"Aovs14","no":14,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"次の物品のうち、日本への持込みに際して動物検疫又は植物検疫を受ける必要があるもの、あるいは持込みが禁止されているものをすべて選びなさい。","opts":{"a":"ドイツで購入した豚肉のソーセージ（缶詰）","b":"韓国で購入した精米された米","c":"フランスで購入したプロセスチーズ","d":"イタリアで購入した生ハム"},"ans":["a","b","d"],"pt":5,"exp":"cのプロセスチーズは加熱加工された乳製品で検疫の対象外。ドイツ産ソーセージの缶詰とイタリア産生ハムは畜産物として輸入禁止・停止品。精米された米は植物検疫の輸入検査品。","why":"検疫は5年連続で毎年1問。「乳製品・魚介類は対象外」「米は検査必要」「乾燥した茶葉・きのこ類は対象外」の線引きが毎回の分岐点。","ref":"家畜伝染病予防法／植物防疫法"},{"id":"Aovs15","no":15,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"別送品に関する次の記述のうち、正しいものはどれか。","opts":{"a":"別送品が免税の範囲内である場合には、携帯品・別送品申告書の提出を要しない。","b":"別送品は、入国後6か月以内に輸入するものをいい、税関長がやむを得ない事由を認めた場合は期間の延長が認められる。","c":"申告手続をしなかった別送品も、旅具通関により輸入することができる。","d":"別送品の申告は、入国後に税関へ郵送により行う。"},"ans":["b"],"pt":5,"exp":"aは免税範囲内でも申告書2通の提出が必要。cは申告しなかった別送品は一般貿易貨物と同様の輸入手続が必要。dは入国時に提出する。","why":"別送品は2023・2024年度に出題。「免税範囲内でも申告が必要」が繰り返し問われる。","ref":"関税法"},{"id":"Aovs16","no":16,"sub":"ovs","topic":"出入国法令(CIQ)","stem":"日本の出入国手続に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"日本の出国手続は、検疫、税関、出国審査の順に行われる。","b":"出国審査では、旅券と搭乗券を提示する。","c":"合計額が100万円相当額を超える現金等を持ち出すときは、支払手段等の携帯輸出・輸入申告書を提出しなければならない。","d":"クレジットカードは、利用限度額が100万円を超える場合には申告の対象となる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。クレジットカード・キャッシュカードは支払手段に含まれない。支払手段は現金・小切手（旅行小切手を含む）・約束手形・有価証券。金の地金は合計重量1kg超が対象。","why":"CIQの順序（出国はQ→C→I、入国はQ→I→C）と100万円の申告は毎年出題される基本論点。","ref":"関税法／外国為替及び外国貿易法"},{"id":"Aovs17","no":17,"sub":"ovs","topic":"旅行英語","stem":"次の英文の空欄に入る語として最も適切なものはどれか。<br>Guests are kindly requested to ▢ from smoking in all indoor areas of the hotel.","opts":{"a":"refrain","b":"restrain","c":"remain","d":"retain"},"ans":["a"],"pt":5,"exp":"refrain from 〜 で「〜を控える」。禁止・自制を促す注意書きの定型表現。restrainは「抑制する」、remainは「とどまる」、retainは「保持する」。","why":"語彙の空欄補充は5年で毎年1〜2問。refrain from は2024年度に出題された定型で、案内文の頻出表現。","ref":"旅行英語／語彙"},{"id":"Aovs18","no":18,"sub":"ovs","topic":"旅行英語","stem":"次の英文の空欄に入る語句として最も適切なものはどれか。<br>All cancellations must be made ▢ writing at least 30 days prior to the arrival date.","opts":{"a":"in","b":"on","c":"at","d":"by"},"ans":["a"],"pt":5,"exp":"in writing で「書面によって」。契約書・約款の定型表現。prior to 〜（〜に先立って）とあわせて覚える。","why":"前置詞句の定型（in writing / in accordance with / prior to）は約款英文の頻出。2022年度に in accordance with が出題された。","ref":"旅行英語／文法"},{"id":"Aovs19","no":19,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Museum Admission】 Adults £22.00 / Students and seniors (60+) £18.00 / Children (5–15) £11.00 / Children under 5 free. A family ticket (2 adults and up to 3 children) is £60.00. All visitors must arrive at least 15 minutes before the time printed on their ticket. Tickets are non-refundable but may be transferred to another date up to 48 hours before the booked time.","opts":{"a":"5歳未満の子供は無料である。","b":"大人2人と子供3人の家族はファミリーチケットを利用すると個別に購入するより安い。","c":"チケットは払戻しができないが、予約時刻の48時間前までであれば別の日に振り替えることができる。","d":"来館者はチケットに印字された時刻の30分前までに到着しなければならない。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。本文は「at least 15 minutes before」＝少なくとも15分前。bは個別購入だと22×2＋11×3＝77ポンドで、ファミリーチケット60ポンドのほうが安い。","why":"内容一致は毎年6〜7問。数値（年齢区分・時間・金額）を1つだけずらす誤答が定番で、料金計算を伴う形も出る。","ref":"旅行英語／内容一致"},{"id":"Aovs20","no":20,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Hotel Booking Terms】 A deposit of 20% of the total room charge is payable within 14 days of confirmation. The balance is due no later than 30 days before arrival. Cancellations received more than 60 days before arrival will receive a full refund of the deposit. Cancellations received between 60 and 30 days before arrival will forfeit the deposit. Cancellations received less than 30 days before arrival will be charged the full amount.","opts":{"a":"予約確定から14日以内に室料総額の20%の保証金を支払う。","b":"到着の30日前までに残額を支払う。","c":"到着の70日前に取り消した場合、保証金は全額返金される。","d":"到着の45日前に取り消した場合、室料総額の全額が請求される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。到着の60日前から30日前までの取消しは保証金を没収（forfeit the deposit）されるにとどまり、全額請求は30日前を切ってからである。","why":"ホテル約款の英文は5年で複数回。取消しの時期区分（more than / between / less than）を読み分ける形が毎回出る。","ref":"旅行英語／ホテル約款"},{"id":"Aovs21","no":21,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Cruise Conditions】 Passengers must be at least 6 months of age at the time of sailing. Pregnant guests who have entered their 24th week of pregnancy by the end of the cruise will not be permitted to board. All guests must carry a passport valid for at least 6 months beyond the date of disembarkation. Onboard gratuities of $16 per person per day will be added automatically to your account.","opts":{"a":"乗船時に生後6か月以上でなければ乗船できない。","b":"クルーズ終了時点で妊娠24週に入っている場合は乗船できない。","c":"旅券は下船日から6か月以上の残存有効期間が必要である。","d":"船内のチップは1人1日16ドルで、希望者のみが支払う。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。gratuities are added automatically to your account＝自動的に勘定に加算されるのであり、希望者のみではない。","why":"クルーズ約款の英文は2022・2023年度に出題。乗船条件（年齢・妊娠週数・旅券の残存期間）を数値で問う形が定番。","ref":"旅行英語／クルーズ約款"},{"id":"Aovs22","no":22,"sub":"ovs","topic":"旅行英語","stem":"次の英文の内容に合致するものをすべて選びなさい。<br>【Guided Tour Information】 Tours depart daily at 10:00 and 14:00 except on public holidays. Group bookings of 15 or more must be arranged at least two weeks in advance through our reservations team. Audio guides are available in eight languages at no extra charge. Photography is permitted, but the use of flash and tripods is strictly prohibited.","opts":{"a":"ツアーは祝日を除き毎日10時と14時に出発する。","b":"15名以上の団体予約は2週間前までに予約チームを通じて手配する必要がある。","c":"音声ガイドは8言語で用意されており、追加料金はかからない。","d":"写真撮影は全面的に禁止されている。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。Photography is permitted（撮影は許可されている）が、フラッシュと三脚の使用は禁止されている。","why":"ツアー案内文は毎年出題。「〜は許可されているが〜は禁止」という部分否定を全面否定にすり替える誤答が定番。","ref":"旅行英語／内容一致"},{"id":"Aovs23","no":23,"sub":"ovs","topic":"旅行英語","stem":"次の英文の下線部の語と最も近い意味で用いられているものはどれか。<br>The balance of the tour cost is <u>due</u> 45 days before departure.","opts":{"a":"The flight is due to arrive at 6 p.m.","b":"Payment of $500 is due to the hotel on arrival.","c":"The delay was due to bad weather.","d":"She is due to give a speech tomorrow."},"ans":["b"],"pt":5,"exp":"下線部のdueは「支払われるべき」の意味。bの「500ドルが到着時にホテルに支払われるべき」が同じ用法。a・dは「〜する予定である」、cは「〜が原因で」。","why":"多義語の用法を問う形は2021年度に due で出題された。約款英文に頻出の語（due / subject to / in the event of）が狙われる。","ref":"旅行英語／多義語"},{"id":"Aovs24","no":24,"sub":"ovs","topic":"旅行英語","stem":"次の英文の空欄に入る語句として最も適切なものはどれか。<br>▢ the tour is cancelled due to insufficient participants, a full refund will be issued.","opts":{"a":"In the event that","b":"In spite of","c":"On behalf of","d":"With regard to"},"ans":["a"],"pt":5,"exp":"In the event that 〜 で「〜の場合には」。条件を示す約款の定型表現。In spite of は「〜にもかかわらず」、On behalf of は「〜を代表して」、With regard to は「〜に関して」で、いずれも節を導けない、または意味が合わない。","why":"条件節を導く定型（In the event that / Should / Whether）は約款英文の頻出。2025年度に Whether A or B が出題された。","ref":"旅行英語／文法"},{"id":"Aovs25","no":25,"sub":"ovs","topic":"海外観光資源","stem":"次の記述に該当する都市はどれか。<br>ハンガリーの首都で、ドナウ川によって西岸の王宮の丘がある地区と東岸の平坦な地区に分かれ、両者をくさり橋が結ぶ。「ドナウの真珠」と呼ばれる。","opts":{"a":"プラハ","b":"ウィーン","c":"ブダペスト","d":"ブラチスラバ"},"ans":["c"],"pt":2,"exp":"ブダペスト。西岸が王宮の丘のあるブダ、東岸が国会議事堂のあるペスト。漁夫の砦とゲッレールトの丘も知られる。プラハはヴルタヴァ川とカレル橋。","why":"中東欧は5年でほぼ未出の空白地帯。ブダペストは首都かつ世界遺産で、次に出る可能性が高い。ハンガリーはグヤーシュで2022年度に出題実績がある。","ref":"海外観光資源／中東欧"},{"id":"Aovs26","no":26,"sub":"ovs","topic":"海外観光資源","stem":"ヨルダンにある遺跡で、シークと呼ばれる岩の裂け目を抜けた先にエル・ハズネ（宝物殿）が現れることで知られる世界遺産はどれか。","opts":{"a":"パルミラ","b":"ペトラ","c":"バールベック","d":"ペルセポリス"},"ans":["b"],"pt":2,"exp":"ペトラ遺跡。ナバテア人が岩を削って築いた都市。パルミラはシリア、バールベックはレバノン、ペルセポリスはイラン。","why":"中東は5年でトルコ・エジプト以外ほぼ未出。ペトラは世界的知名度が高く、未出の有力候補。","ref":"海外観光資源／中東"},{"id":"Aovs27","no":27,"sub":"ovs","topic":"海外観光資源","stem":"ポーランドにある世界遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"クラクフの歴史地区には、ヴァヴェル城がある。","b":"ヴィエリチカ岩塩坑は、坑内に礼拝堂が彫られている。","c":"アウシュヴィッツ強制収容所は「負の遺産」と呼ばれる。","d":"首都ワルシャワの旧市街は、第二次世界大戦後に復元されたものである。"},"ans":["a","b","c","d"],"pt":2,"exp":"a〜dすべて正しい。ワルシャワの歴史地区は戦災で破壊された街並みを市民が忠実に復元したもので、その点が評価されて世界遺産に登録された。","why":"ポーランドは5年で完全に未出。世界遺産が集中し、負の遺産・復元遺産という特徴的な論点をもつため出題しやすい。","ref":"海外観光資源／中東欧"},{"id":"Aovs28","no":28,"sub":"ovs","topic":"海外観光資源","stem":"南米の自然に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"アンヘル滝はベネズエラのギアナ高地にあり、テーブルマウンテンから落下する世界最大落差の滝である。","b":"イグアスの滝はブラジルとアルゼンチンの国境にあり、「悪魔の喉笛」で知られる。","c":"ウユニ塩湖はペルーにある。","d":"ペリト・モレノ氷河はアルゼンチンのロス・グラシアレス国立公園にある。"},"ans":["c"],"pt":2,"exp":"ウユニ塩湖はボリビア。ペルーはマチュピチュ・クスコ・ナスカの地上絵・チチカカ湖。","why":"南米は5年でイグアス・マチュピチュ・クスコ程度しか出ていない。ウユニ塩湖・ガラパゴス・イースター島は未出の有力候補。","ref":"海外観光資源／南米"},{"id":"Aovs29","no":29,"sub":"ovs","topic":"海外観光資源","stem":"次の記述に該当する都市はどれか。<br>チリ領の絶海の孤島で、モアイと呼ばれる巨石像が数多く残されており、世界文化遺産に登録されている。","opts":{"a":"ガラパゴス諸島","b":"イースター島","c":"フェルナンド・デ・ノローニャ","d":"チロエ島"},"ans":["b"],"pt":2,"exp":"イースター島（ラパ・ヌイ国立公園）。ガラパゴス諸島はエクアドルの自然遺産、フェルナンド・デ・ノローニャはブラジル、チロエ島はチリだが木造教会群で知られる。","why":"南米の島嶼は完全に未出。イースター島は知名度が高く、世界文化遺産としても出題しやすい。","ref":"海外観光資源／南米"},{"id":"Aovs30","no":30,"sub":"ovs","topic":"海外観光資源","stem":"北欧の観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ソグネフィヨルドはノルウェーにある世界最長のフィヨルドである。","b":"ストックホルムはスウェーデンの首都で、「北欧のヴェニス」と呼ばれる。","c":"テンペリアウキオ教会はフィンランドのヘルシンキにある「岩の教会」である。","d":"ブルーラグーンはデンマークにある地熱温泉である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ブルーラグーンはアイスランド。ほかにゲイシール（間欠泉）、グトルフォスの滝、シンクヴェトリル国立公園がある。","why":"北欧は5年でベルゲンとオーロラ観測地しか出ていない。アイスランドは完全に未出で、火山・地熱という特徴から出題しやすい。","ref":"海外観光資源／北欧"},{"id":"Aovs31","no":31,"sub":"ovs","topic":"海外観光資源","stem":"クロアチアの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ドゥブロヴニクは「アドリア海の真珠」と呼ばれる城壁都市である。","b":"スプリトには、ローマ皇帝ディオクレティアヌスの宮殿跡に街が形成された旧市街がある。","c":"プリトヴィツェ湖群国立公園は世界自然遺産に登録されている。","d":"首都はザグレブである。"},"ans":["a","b","c","d"],"pt":2,"exp":"a〜dすべて正しい。クロアチアは世界遺産が集中する国で、いずれも代表的な観光地。","why":"スプリトは2022年度に出題済み。ドゥブロヴニク・プリトヴィツェは未出で、同国内の他の遺産を問う形が想定される。","ref":"海外観光資源／南東欧"},{"id":"Aovs32","no":32,"sub":"ovs","topic":"海外観光資源","stem":"ギリシャの観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"メテオラは奇岩の上に修道院が建つ世界複合遺産である。","b":"サントリーニ島のイアは白壁と青屋根の街並みと夕日で知られる。","c":"デルフィにはアポロン神殿があり、古代ギリシャの聖域とされた。","d":"クノッソス宮殿はロードス島にある。"},"ans":["d"],"pt":2,"exp":"クノッソス宮殿はクレタ島。ミノタウロスの迷宮伝説で知られる。ロードス島は中世都市が世界遺産。","why":"クレタ島は2025年度に出題済み。メテオラ・デルフィ・サントリーニは未出で、同国内の他の遺産を問う形が出やすい。","ref":"海外観光資源／南東欧"},{"id":"Aovs33","no":33,"sub":"ovs","topic":"海外観光資源","stem":"中国の世界遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"九寨溝は四川省にある世界自然遺産である。","b":"麗江の旧市街は雲南省にある世界文化遺産である。","c":"黄山は安徽省にある世界複合遺産である。","d":"拙政園は北京にある庭園である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。拙政園は蘇州の庭園。北京の庭園は頤和園（西太后の離宮）。","why":"中国は毎年出題されるが、九寨溝・麗江・黄山は5年で未出。拙政園と頤和園の取り違えは2023年度に出題実績がある。","ref":"海外観光資源／中国"},{"id":"Aovs34","no":34,"sub":"ovs","topic":"海外観光資源","stem":"ミャンマー及びラオスの観光資源に関する次の記述のうち、正しいものはどれか。","opts":{"a":"バガンはラオスにある仏塔群である。","b":"ルアンパバーンはラオスにあり、早朝の托鉢で知られる世界遺産の古都である。","c":"シュエダゴン・パゴダはラオスの首都にある。","d":"インレー湖はカンボジアにある。"},"ans":["b"],"pt":2,"exp":"バガンとシュエダゴン・パゴダ（ヤンゴン）、インレー湖はいずれもミャンマー。ルアンパバーンはラオスの古都で托鉢が名物。","why":"ミャンマー・ラオスは5年で完全に未出。東南アジアで出題されていない国として次の候補になりやすい。","ref":"海外観光資源／東南アジア"},{"id":"Aovs35","no":35,"sub":"ovs","topic":"海外観光資源","stem":"スリランカ及びネパールの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"シギリヤはスリランカにある「獅子の岩山」と呼ばれる遺跡である。","b":"キャンディには仏歯寺があり、世界遺産に登録されている。","c":"ルンビニはネパールにある釈迦生誕の地である。","d":"タクツァン僧院はネパールにある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。タクツァン僧院はブータンのパロにある断崖の僧院。","why":"南アジアはインドのみが繰り返し出題され、スリランカ・ネパール・ブータンは未出。仏教遺跡という共通軸で出題しやすい。","ref":"海外観光資源／南アジア"},{"id":"Aovs36","no":36,"sub":"ovs","topic":"海外観光資源","stem":"アメリカの国立公園に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"イエローストーン国立公園は世界初の国立公園で、オールドフェイスフルガイザーがある。","b":"ヨセミテ国立公園にはエルキャピタンとハーフドームがある。","c":"ブライスキャニオン国立公園はフードゥーと呼ばれる尖塔状の岩で知られる。","d":"モニュメントバレーはカリフォルニア州にある。"},"ans":["d"],"pt":2,"exp":"モニュメントバレーはアリゾナ州とユタ州にまたがるナバホ族の聖地。カリフォルニア州はヨセミテ・セコイア・デスバレー。","why":"国立公園は2025年度に出題済み。ブライス・ザイオン・アンテロープ・モニュメントバレーは未出で、州との組合せを問う形が出やすい。","ref":"海外観光資源／北米"},{"id":"Aovs37","no":37,"sub":"ovs","topic":"海外観光資源","stem":"ハワイの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ハナウマ湾はオアフ島にある。","b":"ハレアカラ国立公園はマウイ島にある。","c":"プナルウ黒砂海岸はハワイ島にある。","d":"ナパリコーストはモロカイ島にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。ナパリコーストはカウアイ島。同島にはワイメア渓谷・シダの洞窟・ハナレイ湾もある。","why":"ハワイは5年で毎年出題。島の取り違えを狙う形が固定しており、モロカイ島・ラナイ島を混ぜる誤答は未出の切り口。","ref":"海外観光資源／ハワイ"},{"id":"Aovs38","no":38,"sub":"ovs","topic":"海外観光資源","stem":"カナダの観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"ケベックシティの旧市街は城壁に囲まれ、世界遺産に登録されている。","b":"マリーン湖はジャスパー国立公園にあり、スピリット島で知られる。","c":"プリンスエドワード島は「赤毛のアン」の舞台である。","d":"ブッチャートガーデンはバンフにある。"},"ans":["d"],"pt":2,"exp":"ブッチャートガーデンはブリティッシュコロンビア州のビクトリア（バンクーバー島）にある。バンフはルイーズ湖・モレーン湖。","why":"カナダは2025年度に出題済み。西部（バンクーバー・ビクトリア）は未出で、東部との取り違えを狙う形が出やすい。","ref":"海外観光資源／カナダ"},{"id":"Aovs39","no":39,"sub":"ovs","topic":"海外観光資源","stem":"アフリカの観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"マサイマラ国立保護区はケニアにある。","b":"ンゴロンゴロ保全地域はタンザニアにある。","c":"テーブルマウンテンは南アフリカのケープタウンにある。","d":"キリマンジャロはケニアにある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。キリマンジャロはタンザニアにあるアフリカ最高峰。ケニアのアンボセリ国立公園からキリマンジャロを望むことができる。","why":"サファリは2021・2023年度に出題。キリマンジャロの所属国（タンザニア）は誤答を作りやすく、未出の切り口。","ref":"海外観光資源／アフリカ"},{"id":"Aovs40","no":40,"sub":"ovs","topic":"海外観光資源","stem":"モロッコの観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"マラケシュにはジャマ・エル・フナ広場がある。","b":"カラウィーンモスクなど迷路のような旧市街が世界遺産に登録されているのはカサブランカである。","c":"シャウエンは青く塗られた家々の街並みで知られる。","d":"アイト・ベン・ハドゥはワルザザート近郊の集落で世界遺産である。"},"ans":["b"],"pt":2,"exp":"カラウィーンモスクのある旧市街が世界遺産なのはフェズ。カサブランカは最大の商業都市でハッサン2世モスクがある。","why":"モロッコは2021年度に出題され、まさにこのフェズとカサブランカの取り違えが問われた。周期的に再出題されやすい。","ref":"海外観光資源／アフリカ"},{"id":"Aovs41","no":41,"sub":"ovs","topic":"海外観光資源","stem":"オセアニアの世界遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"ウルル－カタジュタ国立公園は複合遺産である。","b":"カカドゥ国立公園は複合遺産である。","c":"グレートバリアリーフは自然遺産である。","d":"トンガリロ国立公園はオーストラリアにある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。トンガリロ国立公園はニュージーランド北島にある複合遺産。オーストラリアの複合遺産はウルル－カタジュタとカカドゥ。","why":"カカドゥは2025年度に出題済み。複合遺産という区分を横断的に問う形は未出で、次に出やすい切り口。","ref":"海外観光資源／オセアニア"},{"id":"Aovs42","no":42,"sub":"ovs","topic":"海外観光資源","stem":"ニュージーランドの観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"ミルフォードサウンドはフィヨルドランド国立公園にある。","b":"タスマン氷河はアオラキ／マウントクック国立公園にある。","c":"ワイトモ鍾乳洞は南島にある。","d":"クイーンズタウンはバンジージャンプ発祥の地とされる。"},"ans":["c"],"pt":2,"exp":"ワイトモ鍾乳洞は北島にある。土ボタルで知られる。南島にはミルフォードサウンド・タスマン氷河・テカポ湖・クイーンズタウンがある。","why":"ニュージーランドは2022・2024年度に出題。北島と南島の取り違えは繰り返し狙われる型。","ref":"海外観光資源／オセアニア"},{"id":"Aovs43","no":43,"sub":"ovs","topic":"海外観光資源","stem":"次の絵画作品とその収蔵施設との組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"「ゲルニカ」（ピカソ） ─ ソフィア王妃芸術センター（マドリード）","b":"「真珠の耳飾りの少女」（フェルメール） ─ マウリッツハイス美術館（ハーグ）","c":"「最後の晩餐」（ダ・ヴィンチ） ─ ウフィツィ美術館（フィレンツェ）","d":"「接吻」（クリムト） ─ ベルヴェデーレ宮殿上宮（ウィーン）"},"ans":["a","b","d"],"pt":2,"exp":"cは誤り。「最後の晩餐」はミラノのサンタ・マリア・デッレ・グラツィエ教会にある壁画。ウフィツィ美術館は「ヴィーナスの誕生」「春」「受胎告知」。","why":"美術館と作品の組合せは5年で毎年1〜2問。ゲルニカのプラド誤答は2024年度、最後の晩餐の所在は未出の切り口。","ref":"海外観光資源／美術館"},{"id":"Aovs44","no":44,"sub":"ovs","topic":"海外観光資源","stem":"次の料理とその国との組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"グヤーシュ ─ ハンガリー","b":"セビーチェ ─ ペルー","c":"ボルシチ ─ スペイン","d":"ウィンナーシュニッツェル ─ オーストリア"},"ans":["a","b","d"],"pt":2,"exp":"cは誤り。ボルシチはウクライナ・ロシアの料理。スペインの代表的な料理はパエリア・ガスパチョ・タパス。","why":"料理と国の組合せは毎年出題。グヤーシュ（2022年度）・トムヤムクン（2025年度）は既出で、セビーチェ・ボルシチは未出。","ref":"海外観光資源／食文化"},{"id":"Aovs45","no":45,"sub":"ovs","topic":"海外実務その他","stem":"次の組合せのうち、都市（A）が10月29日（水）13時（午後1時）のとき、都市（B）の現地時刻が誤っているものはどれか。<br>※10月29日時点で、ヨーロッパは夏時間を終了しており、オーストラリアは夏時間を実施しているものとする。","opts":{"a":"東京（対GMT+9） ─ ロンドン（対GMT+0） ─ 10月29日4時（午前4時）","b":"東京（対GMT+9） ─ パリ（対GMT+1） ─ 10月29日5時（午前5時）","c":"東京（対GMT+9） ─ シドニー（対GMT+11） ─ 10月29日15時（午後3時）","d":"東京（対GMT+9） ─ ホノルル（対GMT−10） ─ 10月29日18時（午後6時）"},"ans":["d"],"pt":5,"exp":"東京13時をGMTに直すと13−9＝4時。ホノルルは4＋（−10）＝−6時＝前日の18時、すなわち10月28日18時。「10月29日18時」とする点で日付が誤り。a（4時）、b（5時）、c（15時）は正しい。","why":"時差は5年連続で毎年1問。10月末の夏時間終了と、日付をまたぐ計算が毎回の分岐点。日付だけを誤らせる誤答は難度が高い。","ref":"時差計算","fig":"<svg viewBox=\"0 0 700 176\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"4\" y=\"6\" width=\"692\" height=\"34\" rx=\"2\" fill=\"var(--ink)\"/>\n<text x=\"20\" y=\"28\" fill=\"var(--paper)\" font-size=\"13\" font-weight=\"700\">現地時間 − 対GMT ＝ GMT時間　／　GMT時間 ＋ 相手の対GMT ＝ 相手の現地時間</text>\n<rect x=\"4\" y=\"50\" width=\"340\" height=\"52\" rx=\"2\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"18\" y=\"70\" font-weight=\"700\" fill=\"var(--ai)\">① 東京13時をGMTに直す</text>\n<text x=\"18\" y=\"92\" font-size=\"13\">13 − (+9) ＝ <tspan font-weight=\"700\">GMT 4時（10月29日）</tspan></text>\n<rect x=\"352\" y=\"50\" width=\"344\" height=\"52\" rx=\"2\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"366\" y=\"70\" font-weight=\"700\">② 相手の対GMTを加える</text>\n<text x=\"366\" y=\"92\" font-size=\"13\">ロンドン 4+0＝4時／パリ 4+1＝5時／シドニー 4+11＝15時</text>\n<rect x=\"4\" y=\"112\" width=\"692\" height=\"58\" rx=\"2\" fill=\"var(--shuSoft)\" stroke=\"var(--shuLine)\"/>\n<text x=\"18\" y=\"132\" font-weight=\"700\" fill=\"var(--shu)\">日付をまたぐ場合</text>\n<text x=\"18\" y=\"152\" font-size=\"13\">ホノルル 4 + (−10) ＝ <tspan font-weight=\"700\">−6時</tspan> → 24を足して <tspan font-weight=\"700\">前日の18時（10月28日18時）</tspan></text>\n<text x=\"18\" y=\"168\" font-size=\"11.5\">計算結果が0を下回ったら前日、24を超えたら翌日。時刻だけでなく<tspan font-weight=\"700\">日付</tspan>も確認する。</text>\n</g></svg>","figcap":"時差の計算手順"},{"id":"Aovs46","no":46,"sub":"ovs","topic":"海外実務その他","stem":"次の航空便の所要時間として正しいものはどれか。<br>NH  203便　東京（NRT）19:55 発 → フランクフルト（FRA）00:35 (+1) 着<br>※東京の対GMTは+9、フランクフルトの対GMTは+1とする。","opts":{"a":"12時間40分","b":"11時間40分","c":"13時間40分","d":"4時間40分"},"ans":["a"],"pt":5,"exp":"出発をGMTに直すと 19:55−9＝10:55。到着は翌日00:35−1＝GMT 23:35（同日）。23:35−10:55＝12時間40分。到着が「+1」表記でも、GMTに直すと同日になる点に注意。","why":"所要時間は5年連続で毎年1〜3問。「+1」表記の処理と、両端をGMTに直してから引く手順が毎回の分岐点。","ref":"所要時間の計算"},{"id":"Aovs47","no":47,"sub":"ovs","topic":"海外実務その他","stem":"シェンゲン協定及び通貨に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"ノルウェーはEUに加盟していないが、シェンゲン協定には加盟している。","b":"アイルランドはユーロを導入しているが、シェンゲン協定には加盟していない。","c":"ポーランドはシェンゲン協定に加盟しており、通貨はユーロである。","d":"スイスはシェンゲン協定に加盟しているが、通貨はスイスフランである。"},"ans":["c"],"pt":5,"exp":"ポーランドはシェンゲン協定加盟国だが通貨はズウォティ。シェンゲン加盟とユーロ導入は別の概念で、加盟していてもユーロ非導入の国（ポーランド・チェコ・ハンガリー・デンマーク・スウェーデン・スイス・ノルウェー）がある。","why":"シェンゲンは2022年度以降4年連続で出題。「加盟とユーロは別」を突く形が毎回。","ref":"シェンゲン協定"},{"id":"Aovs48","no":48,"sub":"ovs","topic":"海外実務その他","stem":"次の物品のうち、日本発の国際線客室内に持ち込むことができるものをすべて選びなさい。<br>※いずれも容量1リットル以下の再封可能な透明プラスチック製袋に余裕をもって入れたものとする。","opts":{"a":"容量100mlの容器に入った化粧水 90ml","b":"容量150mlの容器に入った日焼け止め 50ml","c":"容量80mlのチューブに入った歯磨き粉 60g","d":"容量250mlの容器に入ったコンタクトレンズ用保存液 100ml"},"ans":["a","c"],"pt":5,"exp":"液体物は「容器の容量が100ml以下」であることが要件。bは容器150ml、dは容器250mlでいずれも100mlを超えるため、中身の量にかかわらず持ち込めない。a（容器100ml）とc（容器80ml）は要件を満たす。","why":"★液体物の持込みは2021・2022・2023年度に出題されたが2024・2025年度は出題なし。2年連続で出ていないため次年度の出題確率が高い。判定基準が「容器の容量」である点が核心。","ref":"航空保安／液体物の持込制限"},{"id":"Aovs49","no":49,"sub":"ovs","topic":"海外実務その他","stem":"次の都市コードと空港コードの組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"ニューヨーク（NYC） ─ JFK","b":"ミラノ（MIL） ─ MXP","c":"ワシントン（WAS） ─ IAH","d":"ソウル（SEL） ─ ICN"},"ans":["a","b","d"],"pt":5,"exp":"cは誤り。IAHはヒューストンの空港。ワシントンの空港はIAD（ダレス）とDCA（レーガン・ナショナル）。ミラノはMXP（マルペンサ）とLIN（リナーテ）。","why":"コード類は5年連続で毎年2問。複数空港をもつ都市（NYC・LON・PAR・ROM・MIL・WAS・SEL）が繰り返し狙われる。IAHとIADの取り違えは2025年度に出題された。","ref":"都市コード・空港コード"},{"id":"Aovs50","no":50,"sub":"ovs","topic":"海外実務その他","stem":"次のアライアンスと航空会社の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"oneworld ─ キャセイパシフィック航空（CX）","b":"SkyTeam ─ 大韓航空（KE）","c":"Star Alliance ─ シンガポール航空（SQ）","d":"oneworld ─ ルフトハンザドイツ航空（LH）"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。ルフトハンザドイツ航空（LH）はStar Alliance。oneworldはJL・BA・AA・QF・CX・IB・QR・MH・AY、SkyTeamはDL・AF・KL・KE・AZ・AM・GA・CI・SK。","why":"アライアンスは5年で毎年出題。2024年にSAS（SK）がStar AllianceからSkyTeamへ移籍した点は最新の変化で、次年度に問われる可能性がある。","ref":"アライアンス・航空会社コード"},{"id":"Aovs51","no":51,"sub":"ovs","topic":"海外実務その他","stem":"クルーズ及び宿泊に関する用語の説明のうち、誤っているものはどれか。","opts":{"a":"「テンダーボート」とは、停泊した船と陸との間を行き来する小型ボートをいう。","b":"「ショアエクスカーション」とは、寄港地での観光をいう。","c":"「コネクティングルーム」とは、隣接しているが内部のドアではつながっていない2つの部屋をいう。","d":"「ランオブザハウス」とは、部屋のタイプや眺望を指定せず、空室状況に応じて客室が割り当てられる予約方法をいう。"},"ans":["c"],"pt":5,"exp":"コネクティングルームは内部のドアでつながっている2つの部屋。隣接するが内扉のない部屋はアジョイニングルーム。この2語の取り違えが定番。","why":"クルーズ・宿泊用語は5年で毎年1〜3問。テンダーボートとタグボート、コネクティングとアジョイニングの2組が繰り返し狙われる。","ref":"クルーズ・宿泊の用語"},{"id":"Aovs52","no":52,"sub":"ovs","topic":"海外実務その他","stem":"海外の出入国手続に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"シェンゲン協定加盟国へ渡航する場合、最初に到着した加盟国で入国審査を受ける。","b":"アメリカへ渡航する場合、最初に到着した空港で入国審査と税関検査を受ける。","c":"ESTAの有効期限は、許可を受けた日から2年間（旅券の有効期限が先に到来する場合はその日まで）である。","d":"ロンドンからパリへユーロスターで移動する場合、フランスの入国審査はパリ到着後に行われる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。ユーロスターではジュクスタポーズド・コントロールにより、出発駅で相手国の入国審査を行う（ロンドン発ならロンドンでフランスの審査を受ける）。","why":"出入国手続は5年で毎年1〜2問。シェンゲンの「最初の加盟国」と米国の「最初の到着地」は毎回。ユーロスターの事前審査は2022年度に出題された。","ref":"出入国手続"}]},{"mark":"B","title":"セットB　応用編","desc":"事例に当てはめて判断する問題と、多段階の計算問題を中心にした構成。資料を読みながら解く形式を多く含む。","n":139,"q":[{"id":"Blaw01","no":1,"sub":"law","topic":"登録制度","stem":"次の事例において、A社が受けるべき手続として正しいものはどれか。<br>第3種旅行業者であるA社は、これまで受注型企画旅行のみを実施してきたが、新たに自社を企画者とする海外募集型企画旅行を実施することとした。","opts":{"a":"変更登録を受ける必要がある。","b":"変更の届出をすれば足りる。","c":"新たに登録を受け直す必要がある。","d":"特段の手続は不要である。"},"ans":["a"],"pt":4,"exp":"海外募集型企画旅行を実施できるのは第1種旅行業者のみ。第3種から第1種への変更は登録業務範囲の変更に当たり、変更登録が必要（届出では足りない）。第3種は拠点区域内の国内募集型企画旅行のみ実施できる。","why":"登録制度は毎年3〜4問。業務範囲の表を暗記していても、事例に当てはめる形は難度が上がる。第1〜3種・地域限定の業務範囲は毎年どこかで問われる。","ref":"旅行業法第4条・第6条の4"},{"id":"Blaw02","no":2,"sub":"law","topic":"登録制度","stem":"旅行業の登録業務範囲に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"第2種旅行業者は、海外の受注型企画旅行を実施することができる。","b":"第3種旅行業者は、拠点区域内であれば国内の募集型企画旅行を実施することができる。","c":"地域限定旅行業者は、拠点区域内に限り国内の募集型企画旅行及び受注型企画旅行を実施することができる。","d":"旅行業者代理業者は、自ら企画旅行を実施することができる。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行業者代理業者は所属旅行業者を代理して契約を締結するのみで、自ら企画旅行を実施することはできない。第2種は海外募集型のみ不可で、海外の受注型・手配旅行は可能。","why":"業務範囲は毎年出題。「第2種は海外募集型のみ不可」という限定の理解が問われる。代理業者の権限も定番。","ref":"旅行業法第4条"},{"id":"Blaw03","no":3,"sub":"law","topic":"登録制度","stem":"旅行業の登録の申請及び審査に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"登録申請書には、主たる営業所その他の営業所の名称及び所在地を記載する。","b":"登録行政庁は、登録の申請があったときは、拒否事由に該当する場合を除き、旅行業者登録簿に登録しなければならない。","c":"登録行政庁は、登録をしたときは遅滞なくその旨を申請者に通知しなければならない。","d":"登録を拒否したときは、その理由を示す必要はない。"},"ans":["d"],"pt":4,"exp":"登録を拒否したときは、遅滞なくその理由を示して申請者に通知しなければならない。登録簿には登録年月日・登録番号・氏名等・営業所の名称と所在地・業務範囲を登録する。","why":"登録の手続面（申請書の記載事項・登録簿・通知）は5年で複数回。理由を付す義務は監督処分と共通の論点。","ref":"旅行業法第5条・第6条"},{"id":"Blaw04","no":4,"sub":"law","topic":"営業保証金","stem":"次の事例において、B社が追加で供託すべき営業保証金の額として正しいものはどれか。<br>第2種旅行業者B社の前事業年度における旅行業務に関する旅行者との取引額が増加し、営業保証金の額が1,100万円から1,700万円に引き上げられることとなった。B社は現在1,100万円を供託している。","opts":{"a":"600万円","b":"1,700万円","c":"1,100万円","d":"追加供託は不要である"},"ans":["a"],"pt":4,"exp":"営業保証金の額が引き上げられた場合、その差額（1,700万−1,100万＝600万円）を追加して供託する。事業年度終了後100日以内に供託し、供託書の写しを添えて登録行政庁に届け出る。","why":"営業保証金は2022年度以降4年連続で出題。額の一覧を覚えていても、増額時の差額供託という手続面は未出の切り口。","ref":"旅行業法第9条"},{"id":"Blaw05","no":5,"sub":"law","topic":"営業保証金","stem":"営業保証金の還付及び取戻しに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者が営業保証金から還付を受けるには、登録行政庁の認証を受けなければならない。","b":"還付により営業保証金が不足したときは、旅行業者は不足額を供託しなければならない。","c":"旅行業の登録が抹消されたときは、営業保証金を取り戻すことができる。","d":"営業保証金の取戻しは、6か月を下らない一定期間内に債権の申出をすべき旨を公告した後でなければ行うことができない。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。営業保証金は登録行政庁の認証、弁済業務保証金は旅行業協会の認証を受ける点が対比で問われる。","why":"営業保証金の還付・取戻しの手続は5年で未出。額の暗記だけでは対応できない論点として出題されうる。","ref":"旅行業法第9条・第10条"},{"id":"Blaw06","no":6,"sub":"law","topic":"旅行業務取扱管理者","stem":"次の事例において、C社が選任すべき旅行業務取扱管理者として適切なものはどれか。<br>第2種旅行業者C社は、本邦内の旅行のみを取り扱う営業所Xと、海外旅行を含めて取り扱う営業所Yを有している。","opts":{"a":"Xには国内旅行業務取扱管理者、Yには総合旅行業務取扱管理者を選任する。","b":"X・Yともに国内旅行業務取扱管理者を選任すれば足りる。","c":"Xには地域限定旅行業務取扱管理者を選任すれば足りる。","d":"Yには国内旅行業務取扱管理者と総合旅行業務取扱管理者を各1人ずつ選任しなければならない。"},"ans":["a"],"pt":4,"exp":"本邦内の旅行のみを取り扱う営業所には国内（または総合）、海外旅行を取り扱う営業所には総合の旅行業務取扱管理者を選任する。地域限定旅行業務取扱管理者を選任できるのは、拠点区域内の旅行のみを取り扱う営業所に限られる。","why":"管理者の選任は5年で16問と法令最頻出。試験種別（総合・国内・地域限定）と営業所の取扱範囲の対応は毎年問われる。","ref":"旅行業法第11条の2"},{"id":"Blaw07","no":7,"sub":"law","topic":"旅行業務取扱管理者","stem":"旅行業務取扱管理者の資格及び選任に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"旅行業務取扱管理者試験に合格した者であっても、法第6条第1項第1号から第6号までのいずれかに該当する者は選任できない。","b":"旅行業者等は、営業所における旅行業務に関し1人の旅行業務取扱管理者しか選任していない場合において、その者が欠けたときは、新たに選任するまで契約を締結してはならない。","c":"旅行業務取扱管理者は、旅行者の依頼があったときは、旅行業務取扱管理者証を提示しなければならない。","d":"旅行業務取扱管理者は、同一の旅行業者の営業所であれば複数の営業所を兼任することができる。"},"ans":["d"],"pt":4,"exp":"旅行業務取扱管理者は他の営業所の管理者を兼任できない。ただし、営業所の旅行業務に係る取引の額が少ない場合など一定の要件を満たすときに複数営業所の兼務が認められる特例がある。原則は兼任不可。","why":"「兼任不可」は毎年問われる基本。管理者証の提示義務は外務員証との対比で狙われる。","ref":"旅行業法第11条の2"},{"id":"Blaw08","no":8,"sub":"law","topic":"取引条件説明・書面交付","stem":"旅行業者が旅行者に交付する書面の記載事項に関する次の記述のうち、企画旅行契約の場合に記載しなければならないものをすべて選びなさい。","opts":{"a":"企画者以外の者が企画旅行の参加者を募集する場合は、当該企画者及び募集を行う者の氏名又は名称及び住所並びに登録番号","b":"旅行業務取扱管理者の氏名及び旅行者の依頼に応じて説明する旨","c":"旅行に関する計画に定めるサービスの提供を受ける権利を表示する書面を交付する場合はその旨","d":"旅行業協会に加入している旨及び弁済業務保証金からの弁済限度額"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて記載事項。とくにdの弁済限度額は、保証社員である場合に「営業保証金を供託していない旨」とあわせて記載する。旅行業務取扱管理者の氏名は広告の表示事項ではないが、書面の記載事項である点に注意。","why":"書面の記載事項は5年で12問。広告の表示事項と混同させる形が定番で、管理者の氏名がどちらに含まれるかが分岐点。","ref":"旅行業法施行規則第13条・第14条"},{"id":"Blaw09","no":9,"sub":"law","topic":"取引条件説明・書面交付","stem":"次の場合のうち、取引条件の説明書面の交付を省略することができるものはどれか。","opts":{"a":"旅行者の依頼により乗車券類のみを手配し、その乗車券類を交付する場合","b":"募集型企画旅行契約を締結する場合","c":"受注型企画旅行契約を締結する場合","d":"渡航手続代行契約を締結する場合"},"ans":["a"],"pt":4,"exp":"契約の履行が確実であると認められる場合として、旅行者の依頼により乗車券類・宿泊券等のみを手配し当該書面を交付するときは、説明書面の交付を省略できる。ただし説明そのものは省略できない。","why":"「説明は必須／書面は例外的に省略可」の非対称は毎年問われる。省略できる具体的場面を問う形は難度が高い。","ref":"旅行業法第12条の4"},{"id":"Blaw10","no":10,"sub":"law","topic":"広告・誇大広告","stem":"企画旅行の募集広告に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"旅行代金の額を表示するときは、旅行者が支払うべき対価の額を表示しなければならない。","b":"最少催行人員を定めているときは、その旨を表示しなければならない。","c":"旅程管理業務を行う者の同行の有無を表示しなければならない。","d":"企画者以外の者が募集を行う場合、企画者の名称等の表示は省略することができる。"},"ans":["d"],"pt":4,"exp":"企画者以外の者が募集を行う場合でも企画者の名称等を表示しなければならず、さらに企画者の名称等を募集を行う者の名称等より著しく小さく表示してはならない。","why":"広告の表示事項は5年連続で毎年2〜3問。企画者の表示に関する規制（省略不可・著しく小さくしない）は繰り返し問われる。","ref":"旅行業法第12条の7"},{"id":"Blaw11","no":11,"sub":"law","topic":"約款・料金・標識","stem":"旅行業約款の認可に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業約款は、旅行者の正当な利益を害するおそれがないものでなければならない。","b":"旅行業約款には、旅行業務の取扱いの料金その他の旅行者との取引に係る金銭の収受及び払戻しに関する事項を定めなければならない。","c":"旅行業約款には、責任及び免責に関する事項を定めなければならない。","d":"標準旅行業約款と同一の約款を定めた旅行業者は、あらためて登録行政庁の認可を受けなければならない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。標準旅行業約款と同一の約款を定めたときは、認可を受けたものとみなされる（みなし認可）。約款に定めるべき事項は①料金等の収受・払戻し②契約の変更・解除③責任及び免責④旅行者の青任⑤その他。","why":"約款は5年で18問と法令最多分野。みなし認可と、約款に定めるべき事項の中身が問われる。","ref":"旅行業法第12条の2"},{"id":"Blaw12","no":12,"sub":"law","topic":"約款・料金・標識","stem":"旅行業者等の標識に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"標識の様式は、旅行業者と旅行業者代理業者、旅行サービス手配業者とで異なる。","b":"標識には、登録番号、登録年月日、有効期間の満了日を記載する。","c":"旅行業者等以外の者は、標識又はこれに類似する標識を掲げてはならない。","d":"標識は、営業所において公衆に見やすいように掲げなければならない。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。標識は登録の有無を公衆に示すためのもので、無登録営業を防ぐ機能をもつ。様式は業種・登録種別ごとに定められている。","why":"★標識は2022〜2024年度に3年連続で出題されたが2025年度は出題なし。周期からみて次年度の出題確率が高い。","ref":"旅行業法第12条の9"},{"id":"Blaw13","no":13,"sub":"law","topic":"受託契約","stem":"受託契約に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"受託旅行業者は、委託旅行業者を代理して募集型企画旅行契約を締結することができる。","b":"受託旅行業者は、委託旅行業者を代理して受注型企画旅行契約を締結することができる。","c":"受託契約に基づき締結される契約の当事者は、委託旅行業者と旅行者である。","d":"受託契約を締結した場合、受託旅行業者は旅行業者代理業の登録を受ける必要がある。"},"ans":["a","c"],"pt":4,"exp":"bは誤り。受託契約により代理できるのは「募集型」企画旅行契約に限られる。dも誤りで、受託契約により代理する場合は旅行業者代理業の登録は不要（自己の旅行業登録があれば足りる）。","why":"受託契約は5年連続で毎年1問。「募集型に限る」「代理業の登録は不要」の2点が繰り返し狙われる。","ref":"旅行業法第14条の2"},{"id":"Blaw14","no":14,"sub":"law","topic":"旅程管理","stem":"旅程管理に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅程管理業務を行う主任の者に必要な研修は、観光庁長官の登録を受けた登録研修機関が実施する。","b":"資格要件を満たす者の指導による旅程管理業務に相当する実務の研修を受けた経験は、当該研修を受けた地域を目的地とする旅行に係る経験とみなされる。","c":"手配旅行に同行した添乗員の経験も、旅程管理業務に従事した経験とみなされる。","d":"主任の者以外の添乗員にも、研修の修了及び実務経験の要件が課される。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。資格要件が課されるのは「主任の者」のみで、それ以外の添乗員には要件がない。添乗員が1名だけのときはその者が主任の者にあたる。","why":"旅程管理は2025年度に2問と増加傾向。「主任の者だけに要件」という限定は見落とされやすい。","ref":"旅行業法第12条の11"},{"id":"Blaw15","no":15,"sub":"law","topic":"禁止行為・監督","stem":"旅行業者等の禁止行為に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者に対し、旅行地において施行されている法令に違反する行為を行うことに関し便宜を供与する行為は禁止される。","b":"運送サービスを提供する者に対し、輸送の安全の確保を不当に阻害する行為は禁止される。","c":"旅行者に対し、特定のサービスの提供を受けることを強要する行為は禁止される。","d":"宿泊のサービスを提供する者が住宅宿泊事業の届出をした者であるかどうかを確認しないことは、禁止行為に当たらない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。宿泊提供者が住宅宿泊事業の届出をした者等であるかどうかの確認を怠る行為は、旅行者の保護に欠ける行為として禁止される。","why":"禁止行為は2024・2025年度に出題が少ない（合計1問）。周期からみて出題可能性があり、住宅宿泊事業の確認義務は比較的新しい規定。","ref":"旅行業法第13条・施行規則第30条"},{"id":"Blaw16","no":16,"sub":"law","topic":"禁止行為・監督","stem":"業務改善命令として登録行政庁が命ずることができる措置に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業務取扱管理者を解任すること","b":"旅行者に生じた損害を賠償するために必要な金額を担保することができる保険契約を締結すること","c":"旅程管理業務を行う主任の者を解任すること","d":"旅行業協会に加入すること"},"ans":["a","b"],"pt":4,"exp":"cとdは業務改善命令の内容ではない。命じられるのは①旅行業務取扱管理者の解任②料金・対価の変更③旅行業約款の変更④旅程管理措置の確実な実施⑤保険契約の締結⑥業務運営の改善に必要な措置、の6項目。","why":"業務改善命令の6措置と、命令にならないもの（協会加入・分担金納付・主任の者の解任）の区別は繰り返し問われる。","ref":"旅行業法第18条の3"},{"id":"Blaw17","no":17,"sub":"law","topic":"旅行サービス手配業","stem":"旅行サービス手配業に関する次の記述のうち、旅行サービス手配業の登録が必要となるものをすべて選びなさい。","opts":{"a":"地域限定旅行業者が、拠点区域を超えて手配業務を行う場合","b":"旅行業者代理業者が、所属旅行業者以外の旅行業者のために手配業務を行う場合","c":"旅行業者が、自ら実施する企画旅行のために手配業務を行う場合","d":"無償でボランティアガイドの手配を行う場合"},"ans":["a","b"],"pt":4,"exp":"cは旅行業者が行う手配業務であり登録不要。dは無償であり報酬を得ないため登録不要。地域限定旅行業者が拠点区域を超える場合と、代理業者が所属旅行業者以外のために行う場合は登録が必要。","why":"手配業の登録要否は5年で毎年出題。「旅行業者は登録不要」の例外（地域限定・拠点区域超え）が核心。","ref":"旅行業法第23条"},{"id":"Blaw18","no":18,"sub":"law","topic":"旅行サービス手配業","stem":"旅行サービス手配業者が取引をする者と契約を締結したときに交付する書面の記載事項に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行者に提供すべき旅行に関するサービスの内容","b":"契約に係る旅行サービス手配業務取扱管理者の氏名","c":"契約締結の年月日","d":"旅行者の氏名及び住所"},"ans":["a","b","c"],"pt":4,"exp":"dは記載事項ではない。手配業者は旅行者と直接取引しないため、旅行者の氏名・住所は書面の記載事項に含まれない。記載事項は①取引をする者の氏名等・住所（登録番号）②手配業者の氏名等・住所・登録番号③サービスの内容④対価・料金⑤営業所の名称・所在地⑥手配業務取扱管理者の氏名⑦契約締結の年月日。","why":"手配業の書面交付は未出の切り口。「旅行者と直接取引しない」という手配業の性質から記載事項を導く形は出題しやすい。","ref":"旅行業法第30条"},{"id":"Blaw19","no":19,"sub":"law","topic":"旅行サービス手配業","stem":"旅行サービス手配業の登録の拒否及び監督に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行サービス手配業についても、旅行業と同様の登録の拒否事由が定められている。","b":"登録行政庁は、旅行サービス手配業者に対して業務改善命令を発することができる。","c":"登録行政庁は、旅行サービス手配業者に対して6月以内の業務停止を命ずることができる。","d":"旅行サービス手配業者には、営業保証金の供託義務がある。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行サービス手配業には営業保証金の供託義務も基準資産額の定めもない。拒否事由・禁止行為・業務改善命令・業務停止・登録取消し・立入検査は旅行業と共通して規定がある。","why":"旅行業との「共通する規定／しない規定」の切り分けは毎年問われる。営業保証金がないことは核心。","ref":"旅行業法第25条・第31条"},{"id":"Blaw20","no":20,"sub":"law","topic":"旅行業協会","stem":"旅行業協会の指定及び業務に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業協会は、観光庁長官の指定を受けた一般社団法人である。","b":"旅行業者は、複数の旅行業協会に加入することができる。","c":"旅行業協会は、旅行業務及び旅行サービス手配業務に関する取引の公正の確保を図るための調査、研究及び広報を行う。","d":"旅行業協会の社員は、弁済業務保証金分担金を納付しなければならない。"},"ans":["a","c","d"],"pt":4,"exp":"bは誤り。旅行業者が加入できる旅行業協会は1つに限られる（JATAかANTAのいずれか）。加入するかどうかは自由だが、重複加入はできない。","why":"協会の基本構造（指定・加入の自由・重複加入不可）は未出の切り口。5つの法定業務とあわせて出題されうる。","ref":"旅行業法第41条・第45条"},{"id":"Blaw21","no":21,"sub":"law","topic":"旅行業協会","stem":"弁済業務保証金分担金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"保証社員は、加入しようとする日までに弁済業務保証金分担金を旅行業協会に納付しなければならない。","b":"旅行業協会は、分担金の納付を受けた日から7日以内に弁済業務保証金を供託しなければならない。","c":"分担金の額が増加するときは、事業年度終了の日の翌日から100日以内に納付しなければならない。","d":"保証社員でなくなったときは、7日以内に営業保証金を供託しなければならない。"},"ans":["a","b","c","d"],"pt":4,"exp":"a〜dすべて正しい。期限の数字（加入日まで／7日以内／100日以内／7日以内）を入れ替える誤答が定番。","why":"期限の数字は協会分野の頻出。2021・2025年度に類題が出ており、複数の期限を並べて問う形は難度が高い。","ref":"旅行業法第49条"},{"id":"Blaw22","no":22,"sub":"law","topic":"目的・定義","stem":"旅行業法における「旅行業」の定義に該当しないものはどれか。","opts":{"a":"報酬を得て、企画旅行を実施する行為","b":"報酬を得て、旅行者のため運送等サービスの提供を受けることについて代理して契約を締結する行為","c":"報酬を得て、旅行者のため運送等関連サービスの提供を受けることについて媒介をする行為","d":"報酬を得ないで、知人のために宿泊施設の予約を代行する行為"},"ans":["d"],"pt":4,"exp":"旅行業は「報酬を得て」行う事業であることが要件。報酬を得ない行為は旅行業に該当しない。なお運送等関連サービス（食事・観光施設等）のみを取り扱う行為は、運送または宿泊のサービスの手配に付随しない限り旅行業に当たらない。","why":"定義は毎年2問。「報酬を得て」「事業として」という要件を落とした誤答が定番。","ref":"旅行業法第2条"},{"id":"Blaw23","no":23,"sub":"law","topic":"目的・定義","stem":"次の記述のうち、旅行業の登録を要しないものをすべて選びなさい。","opts":{"a":"旅行業者を代理して旅行業務を取り扱う行為（旅行業者代理業）","b":"運送機関が自ら経営する運送サービスを自ら販売する行為","c":"旅行に関する相談に応ずる行為のみを行う事業","d":"宿泊施設が自ら経営する宿泊サービスを自ら販売する行為"},"ans":["b","d"],"pt":4,"exp":"aは旅行業者代理業の登録が必要。cは旅行相談も旅行業務に含まれ登録が必要。b・dは自ら経営するサービスを自ら販売する行為であり、他人のサービスを媒介・代理するものではないため旅行業に当たらない。","why":"「旅行業に当たらない行為」を問う形は未出の切り口。定義の裏側を問う応用形として出題されうる。","ref":"旅行業法第2条・第3条"},{"id":"Blaw24","no":24,"sub":"law","topic":"約款・料金・標識","stem":"次の事例において、D社の対応として正しいものはどれか。<br>旅行業者D社は、営業所に掲示している旅行業務の取扱いの料金を改定することとした。","opts":{"a":"改定後の料金を掲示すれば足り、登録行政庁の認可・届出はいずれも不要である。","b":"あらかじめ登録行政庁の認可を受けなければならない。","c":"改定後30日以内に登録行政庁に届け出なければならない。","d":"旅行業協会の承認を受けなければならない。"},"ans":["a"],"pt":4,"exp":"旅行業務の取扱いの料金は、事業開始前に定めて営業所に掲示すれば足り、認可も届出も不要。認可が必要なのは旅行業約款。この「料金＝掲示のみ／約款＝認可」の対比が最頻出。","why":"料金と約款の手続の違いは5年で毎年どちらかの形で問われる。事例形式にすると混同しやすい。","ref":"旅行業法第12条"},{"id":"Blaw25","no":25,"sub":"law","topic":"旅行業務取扱管理者","stem":"旅行業務取扱管理者の職務に関する次の記述のうち、施行規則に定められているものをすべて選びなさい。","opts":{"a":"契約締結の年月日、契約の相手方その他の重要事項についての明確な記録又は関係書類の保管に関する事項","b":"旅行に関する個人情報の取扱いに関する事項","c":"企画旅行の円滑な実施のための措置に関する事項","d":"弁済業務保証金分担金の納付に関する事項"},"ans":["a","b","c"],"pt":4,"exp":"dは旅行業者の義務であり、管理者の職務ではない。職務は①計画の作成②料金の掲示③約款の掲示・備置き④取引条件の説明⑤書面の交付⑥広告の表示⑦企画旅行の円滑な実施のための措置⑧苦情の処理⑨記録・書類保管⑩個人情報の管理⑪その他必要な事項。","why":"管理者の職務は5年で16問と最頻出。職務でないもの（営業保証金の供託・分担金の納付）を混ぜる形が定番。","ref":"旅行業法施行規則第10条"},{"id":"Byak01","no":1,"sub":"yak","topic":"総則・定義","stem":"次の事例において、適用される約款の部として正しいものはどれか。<br>旅行者Eは、旅行業者F社に対し、東京〜パリ間の航空券と現地ホテル3泊の手配のみを依頼した。F社は旅程管理は引き受けていない。","opts":{"a":"募集型企画旅行契約の部","b":"受注型企画旅行契約の部","c":"手配旅行契約の部","d":"渡航手続代行契約の部"},"ans":["c"],"pt":4,"exp":"旅行者の依頼により運送・宿泊のサービスを手配するのみで旅程管理を引き受けない契約は手配旅行契約。旅行者からの依頼により計画を作成し旅程管理も引き受ける場合が受注型企画旅行契約。","why":"契約の部の区別は総則の核心。事例から契約類型を判定する形は未出の切り口で、企画旅行と手配旅行の債務の違いの理解を問える。","ref":"手配旅行契約の部 第2条"},{"id":"Byak02","no":2,"sub":"yak","topic":"総則・定義","stem":"旅行業者が負う債務に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"企画旅行契約において、旅行業者は旅行サービスの提供を受けられるように手配し、かつ旅程を管理することを引き受ける。","b":"手配旅行契約において、旅行業者が善良な管理者の注意をもって手配をしたときは、旅行サービス提供機関との契約が締結できなくても債務の履行は終了する。","c":"旅行業者は、手配の全部又は一部を本邦内又は本邦外の他の旅行業者、手配を業として行う者その他の補助者に代行させることができる。","d":"手配代行者の過失により旅行者に損害が生じたときは、当該手配代行者が賠償責任を負い、旅行業者は責任を負わない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。手配を代行させても責任は旅行業者が負う。企画旅行は手配の完成義務＋旅程管理義務、手配旅行は善管注意義務のみという債務の違いが核心。","why":"債務の違いは2025年度に出題。手配代行者の責任は毎年どこかで問われる。","ref":"募集型 第3条・第4条／手配旅行 第3条"},{"id":"Byak03","no":3,"sub":"yak","topic":"契約の成立・申込","stem":"次の事例において、契約の成立時期として正しいものはどれか。<br>旅行者Gは、9月1日に電話で募集型企画旅行の予約をした。旅行業者H社は同日予約を承諾する旨を通知し、9月5日までに申込書と申込金を提出するよう求めた。Gは9月4日に申込書と申込金を提出した。","opts":{"a":"9月1日（予約の申込みをした日）","b":"9月1日（予約の承諾を通知した日）","c":"9月4日（申込書と申込金を提出した日）","d":"9月5日（提出期限の日）"},"ans":["c"],"pt":4,"exp":"電話等による予約では、予約の時点で契約は成立せず、所定の期間内に申込書と申込金が提出されたときに契約が成立する。契約締結の順位は予約の受付順による点も重要。","why":"成立時期は5年連続で毎年2〜5問。事例形式にすると予約日と成立日を混同しやすい。","ref":"募集型 第5条・第8条"},{"id":"Byak04","no":4,"sub":"yak","topic":"契約書面・確定書面","stem":"旅行開始日が10月15日である募集型企画旅行について、確定書面の交付期限として正しいものはどれか。","opts":{"a":"10月5日に申込みがなされた場合、旅行開始日の当日までの契約書面に定める日までに交付すればよい。","b":"10月10日に申込みがなされた場合、旅行開始日の当日までの契約書面に定める日までに交付すればよい。","c":"旅行開始日の前日から起算してさかのぼって7日目に当たる日は、10月9日である。","d":"いずれの場合も、旅行開始日の前日までに交付しなければならない。"},"ans":["b"],"pt":4,"exp":"前日10月14日を1日目として数えると、7日目は10月8日。10月8日以降の申込み（bの10月10日）は当日まで、それより前（aの10月5日）は前日までの契約書面に定める日まで。","why":"確定書面の交付期限は2024・2025年度に連続出題。日付を変えても計算方法は同じで、7日目の数え方が毎回の分岐点。","ref":"募集型 第10条","fig":"<svg viewBox=\"0 0 700 130\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<line x1=\"50\" y1=\"66\" x2=\"650\" y2=\"66\" stroke=\"var(--ink3)\"/>\n<circle cx=\"600\" cy=\"66\" r=\"6\" fill=\"var(--ai)\"/><text x=\"552\" y=\"50\" font-weight=\"700\">10/15 旅行開始日</text>\n<circle cx=\"540\" cy=\"66\" r=\"4\" fill=\"var(--ink3)\"/><text x=\"514\" y=\"90\" font-size=\"11\">10/14 前日＝1日目</text>\n<circle cx=\"300\" cy=\"66\" r=\"6\" fill=\"var(--shu)\"/>\n<text x=\"252\" y=\"50\" fill=\"var(--shu)\" font-weight=\"700\">10/8 ＝ 7日目</text>\n<path d=\"M60 74 L296 74\" stroke=\"var(--koke)\" stroke-width=\"2.5\"/>\n<text x=\"80\" y=\"108\" font-size=\"11.5\" fill=\"var(--koke)\">10/7以前の申込み → 前日（10/14）までの契約書面に定める日まで</text>\n<path d=\"M304 74 L596 74\" stroke=\"var(--kin)\" stroke-width=\"2.5\"/>\n<text x=\"330\" y=\"126\" font-size=\"11.5\">10/8以降の申込み → 当日（10/15）までの契約書面に定める日まで</text>\n</g></svg>","figcap":"旅行開始日10月15日の場合"},{"id":"Byak05","no":5,"sub":"yak","topic":"契約の変更","stem":"次の事例において、旅行業者の対応として正しいものはどれか。<br>募集型企画旅行の実施中、利用予定の鉄道が大雨により運休したため、やむを得ず宿泊地を変更し、宿泊費が1人あたり3,000円増加した。","opts":{"a":"運休は旅行業者の関与し得ない事由であるため、増加額を旅行代金に加算できる。","b":"増加額は旅行業者が負担しなければならない。","c":"旅行者の承諾を得たうえでなければ宿泊地を変更できない。","d":"この場合、旅行者は取消料を支払うことなく契約を解除できる。"},"ans":["a"],"pt":4,"exp":"運送機関の運休はサービス提供の中止であり旅行業者の関与し得ない事由。これにより契約内容を変更して費用が増加したときは、その範囲内で旅行代金を増額できる。ただし過剰予約受付（オーバーブッキング）が原因の場合は増額できない。","why":"「運休なら増額可／オーバーブッキングなら増額不可」の対比は2022年度に出題された定番。事例形式で問われると判断を誤りやすい。","ref":"募集型 第14条"},{"id":"Byak06","no":6,"sub":"yak","topic":"旅行者の解除・取消料","stem":"次の事例において、旅行者が支払うべき取消料の額として正しいものはどれか。<br>旅行代金1人200,000円の海外募集型企画旅行（旅行開始日は8月25日。ピーク時に該当する）を、大人2人で申し込んだ。7月20日に旅行者の都合により全員分を解除した。<br>※取消料は、ピーク時の旅行開始日の前日から起算してさかのぼって40日目に当たる日以降31日目までは旅行代金の10%、30日目以降3日目までは20%とする。","opts":{"a":"40,000円","b":"80,000円","c":"20,000円","d":"取消料は不要"},"ans":["a"],"pt":4,"exp":"旅行開始日8月25日の前日8月24日を1日目として数えると、40日目は7月16日、31日目は7月25日。7月20日はこの期間内なので10%が適用され、200,000円×10%×2人＝40,000円。","why":"取消料の計算は5年で14問。ピーク時（12/20〜1/7、4/27〜5/6、7/20〜8/31）の判定と日数の数え方が二重の分岐点になる。","ref":"募集型 第16条 別表第1","fig":"<svg viewBox=\"0 0 700 150\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<line x1=\"40\" y1=\"66\" x2=\"660\" y2=\"66\" stroke=\"var(--ink3)\"/>\n<circle cx=\"620\" cy=\"66\" r=\"6\" fill=\"var(--ai)\"/><text x=\"566\" y=\"50\" font-weight=\"700\">8/25 旅行開始日</text>\n<text x=\"566\" y=\"90\" font-size=\"10.5\" fill=\"var(--shu)\">7/20〜8/31＝ピーク時</text>\n<circle cx=\"440\" cy=\"66\" r=\"5\" fill=\"var(--ink3)\"/><text x=\"404\" y=\"50\" font-size=\"11\">7/25（31日目）</text>\n<circle cx=\"230\" cy=\"66\" r=\"5\" fill=\"var(--shu)\"/><text x=\"192\" y=\"50\" font-size=\"11\" fill=\"var(--shu)\" font-weight=\"700\">7/16（40日目）</text>\n<circle cx=\"330\" cy=\"66\" r=\"7\" fill=\"var(--koke)\"/><text x=\"292\" y=\"106\" font-size=\"12\" fill=\"var(--koke)\" font-weight=\"700\">7/20 解除</text>\n<path d=\"M232 74 L438 74\" stroke=\"var(--kin)\" stroke-width=\"3\"/>\n<text x=\"256\" y=\"126\" font-size=\"12\"><tspan font-weight=\"700\">10%</tspan> の区間（40日目〜31日目）</text>\n<path d=\"M442 74 L616 74\" stroke=\"var(--ink3)\" stroke-width=\"2\"/>\n<text x=\"470\" y=\"126\" font-size=\"11\">20%（30日目〜3日目）</text>\n</g></svg>","figcap":"取消料の適用区分"},{"id":"Byak07","no":7,"sub":"yak","topic":"旅行者の解除・取消料","stem":"国内募集型企画旅行（宿泊を伴う）の取消料に関する次の記述のうち、正しいものはどれか。","opts":{"a":"旅行開始日の前日から起算してさかのぼって20日目に当たる日以降に解除した場合、旅行代金の20%以内の取消料を収受できる。","b":"旅行開始日の前日から起算してさかのぼって10日目に当たる日以降に解除した場合、旅行代金の20%以内の取消料を収受できる。","c":"旅行開始日の前日に解除した場合、旅行代金の30%以内の取消料を収受できる。","d":"旅行開始日の当日に解除した場合、旅行代金の40%以内の取消料を収受できる。"},"ans":["a"],"pt":4,"exp":"国内旅行（宿泊を伴う）は20日目〜8日目が20%、7日目〜2日目が30%、前日が40%、当日が50%、旅行開始後・無連絡不参加が100%。bの10日目からは日帰り旅行の基準。","why":"国内と海外、宿泊付と日帰りで表が4種類あり、混同を狙う形が毎年出る。","ref":"募集型 第16条 別表第1"},{"id":"Byak08","no":8,"sub":"yak","topic":"旅行業者の解除","stem":"次の事例において、旅行業者の対応として正しいものはどれか。<br>海外募集型企画旅行（旅行開始日7月10日、ピーク時に該当しない）について、最少催行人員に達しなかったため中止することとした。","opts":{"a":"6月15日までに旅行者に通知しなければならない。","b":"6月20日までに旅行者に通知しなければならない。","c":"7月1日までに通知すれば足りる。","d":"通知の期限は定められていない。"},"ans":["a"],"pt":4,"exp":"海外旅行（ピーク時以外）は旅行開始日の前日から起算してさかのぼって23日目に当たる日より前に通知する。前日7月9日を1日目とすると23日目は6月17日で、それより前＝6月16日まで。選択肢では6月15日が該当する。","why":"最少催行人員の通知期限（日帰り3・国内13・海外23・ピーク時33）は毎年問われる。日付に置き換えると計算を要する。","ref":"募集型 第16条"},{"id":"Byak09","no":9,"sub":"yak","topic":"旅程管理・保護措置","stem":"旅程管理業務に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行業者は、旅行者が旅行サービスを受けられないおそれがあると認められるときは、契約に従ったサービスの提供を確実に受けられるために必要な措置を講ずる。","b":"契約内容を変更せざるを得ないときは、代替サービスの手配に努め、旅行日程を変更するときは変更後の日程が当初の趣旨にかなうよう努める。","c":"代替サービスの内容は、当初のものと同等以上でなければならない。","d":"旅行業者は、旅行の内容により添乗員その他の者を同行させて旅程管理業務等を行わせることがある。"},"ans":["a","b","d"],"pt":4,"exp":"cは誤り。代替サービスは「当初のサービスの内容と同様のものとなるよう努める」のであって、同等以上を保証するものではない。","why":"代替サービスの水準を「同等以上」と誤らせる形は2022年度に出題された。努力義務であることの理解が問われる。","ref":"募集型 第22条"},{"id":"Byak10","no":10,"sub":"yak","topic":"責任","stem":"次の事例において、旅行業者の責任として正しいものはどれか。<br>海外募集型企画旅行の実施中、旅行業者の手配代行者の過失により、旅行者の受託手荷物が紛失した。旅行者は帰国後15日目に旅行業者に通知した。","opts":{"a":"旅行業者は責任を負い、旅行者1名につき15万円を限度として賠償する。","b":"通知期限を過ぎているため、旅行業者は責任を負わない。","c":"手配代行者の過失であるため、旅行業者は責任を負わない。","d":"旅行業者は限度額の定めなく賠償する。"},"ans":["a"],"pt":4,"exp":"手荷物の損害は損害発生の翌日から起算して海外旅行は21日以内の通知で足りる（15日目は期限内）。手配代行者の過失も旅行業者が責任を負う。限度額は旅行者1名につき15万円（故意・重大な過失がある場合を除く）。","why":"手荷物の通知期限・限度額・手配代行者の責任の3論点を1問に束ねた複合形。個別には毎年出題される。","ref":"募集型 第27条"},{"id":"Byak11","no":11,"sub":"yak","topic":"特別補償","stem":"次の事例において、旅行業者が支払うべき金額として正しいものはどれか。<br>海外募集型企画旅行参加中の旅行者が事故により死亡した。旅行業者に過失はなかった。<br>※海外旅行の死亡補償金は2,500万円とする。","opts":{"a":"2,500万円","b":"1,500万円","c":"0円（過失がないため）","d":"5,000万円"},"ans":["a"],"pt":4,"exp":"特別補償は旅行業者の責任の有無を問わず支払われる。過失がなくても死亡補償金2,500万円（海外）を法定相続人に支払う。国内旅行は1,500万円。","why":"「責任の有無を問わず支払う」という特別補償の本質は毎年問われる。損害賠償責任がある場合の合算の可否とセットで出る。","ref":"特別補償規程 第4条"},{"id":"Byak12","no":12,"sub":"yak","topic":"特別補償","stem":"次の事例において、旅行業者が支払うべき金額として正しいものはどれか。<br>海外募集型企画旅行参加中の旅行者が旅行業者の過失により死亡し、旅行業者は損害賠償として1,800万円を支払うこととなった。<br>※海外旅行の死亡補償金は2,500万円とする。","opts":{"a":"1,800万円","b":"2,500万円","c":"4,300万円","d":"700万円"},"ans":["b"],"pt":4,"exp":"死亡補償金と損害賠償金は合計しない。補償金2,500万円は賠償金1,800万円の限度で賠償金とみなされ、補償金の支払義務は残る700万円に縮減される。支払総額は1,800万＋700万＝2,500万円。","why":"「死亡・後遺障害は合計しない／入院・通院は合計する」の非対称は特別補償の核心。2025年度に類題が出た。","ref":"特別補償規程 第5条","fig":"<svg viewBox=\"0 0 700 160\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"4\" y=\"6\" width=\"692\" height=\"28\" rx=\"2\" fill=\"var(--shuSoft)\" stroke=\"var(--shuLine)\"/>\n<text x=\"20\" y=\"25\" font-weight=\"700\" fill=\"var(--shu)\">死亡補償金と損害賠償金は「合計しない」</text>\n<text x=\"20\" y=\"56\" font-size=\"11.5\">死亡補償金 2,500万円</text>\n<rect x=\"20\" y=\"62\" width=\"380\" height=\"26\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"34\" y=\"80\" font-size=\"11.5\">2,500万円</text>\n<text x=\"20\" y=\"108\" font-size=\"11.5\">損害賠償金 1,800万円</text>\n<rect x=\"20\" y=\"114\" width=\"274\" height=\"26\" fill=\"var(--kinSoft)\" stroke=\"var(--kinLine)\"/>\n<text x=\"34\" y=\"132\" font-size=\"11.5\">1,800万円（賠償金とみなされる部分）</text>\n<rect x=\"294\" y=\"114\" width=\"106\" height=\"26\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"304\" y=\"132\" font-size=\"11\" fill=\"var(--koke)\">700万（補償金）</text>\n<rect x=\"420\" y=\"56\" width=\"276\" height=\"84\" rx=\"2\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/>\n<text x=\"434\" y=\"80\" font-weight=\"700\">支払総額</text>\n<text x=\"434\" y=\"108\" font-size=\"16\" font-weight=\"700\">2,500万円</text>\n<text x=\"434\" y=\"130\" font-size=\"11\">1,800万＋700万。4,300万円ではない。</text>\n</g></svg>","figcap":"死亡補償金と損害賠償金の関係"},{"id":"Byak13","no":13,"sub":"yak","topic":"特別補償","stem":"次の事例において、企画旅行参加中に当たるものをすべて選びなさい。","opts":{"a":"旅行者が離脱及び復帰の予定日時を届け出て自由行動をとっている間","b":"旅行者が届出をせずに離脱し、復帰するまでの間","c":"添乗員が解散を告げた後、旅行者が帰宅する途中","d":"サービスを一切受けない日として契約書面に明示された無手配日"},"ans":["a"],"pt":4,"exp":"bは届出がないため参加中としない。cは解散告知後で参加中でない。dは無手配日として明示され補償金を支払わない旨も明示されていれば参加中としない。","why":"参加中の範囲は5年で複数回。届出の有無で扱いが変わる点と、解散後・無手配日の扱いが定番。","ref":"特別補償規程 第2条・第3条"},{"id":"Byak14","no":14,"sub":"yak","topic":"旅程保証・変更補償金","stem":"次の事例において、旅行業者が支払うべき変更補償金の額として正しいものはどれか。<br>旅行代金80,000円の募集型企画旅行において、確定書面で特定していた宿泊機関（2泊）が過剰予約受付により利用できなくなり、2泊とも別の宿泊機関に変更された。旅行者への通知は旅行開始日の3日前に行われた。<br>※宿泊機関の名称の変更に係る変更補償金の率は、旅行開始前1.0%、旅行開始後2.0%とする。","opts":{"a":"800円","b":"1,600円","c":"3,200円","d":"支払われない"},"ans":["b"],"pt":4,"exp":"通知が旅行開始日の3日前＝旅行開始前なので率は1.0%。1泊につき80,000×1.0%＝800円、2泊で1,600円。1,000円以上なので支払われる（1,000円未満のときは支払わない）。旅行開始後の通知であれば2.0%×2泊＝3,200円となる。","why":"変更補償金の計算は率×泊数と、最低額1,000円の判定の2段階。2025年度に類題が出た。","ref":"募集型 第29条"},{"id":"Byak15","no":15,"sub":"yak","topic":"旅程保証・変更補償金","stem":"旅程保証に関する次の記述のうち、変更補償金を支払わないものをすべて選びなさい。","opts":{"a":"旅行業者の手配ミスにより、休館日の美術館を日程に組み入れていた。","b":"台風による欠航のため、契約書面に記載した航空便が変更された。","c":"旅行者が契約を解除したため、解除された部分について変更が生じた。","d":"確定書面に記載した宿泊機関が過剰予約受付により変更された。"},"ans":["a","b","c"],"pt":4,"exp":"aは旅行業者の責任が明らかな場合であり損害賠償金の問題となる。bは天災による欠航が原因。cは解除された部分に係る変更。dのみ変更補償金の対象。","why":"不払い事由の4類型（関与し得ない事由・重要な変更でない・解除された部分・賠償責任が明らか）は毎年どれかが問われる。","ref":"募集型 第29条"},{"id":"Byak16","no":16,"sub":"yak","topic":"受注型企画旅行","stem":"受注型企画旅行契約と募集型企画旅行契約の相違点に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"企画書面の交付に関する規定は、受注型にのみある。","b":"電話等による予約に関する規定は、募集型にのみある。","c":"最少催行人員に達しないことによる解除の規定は、募集型にのみある。","d":"旅程管理に関する規定は、募集型にのみある。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅程管理の規定は募集型・受注型の双方にある。企画旅行である以上、旅程管理義務は共通して課される。","why":"募集型と受注型の相違点は5年で毎年出題。「旅程管理は共通」を落とす誤答が定番。","ref":"受注型企画旅行契約の部"},{"id":"Byak17","no":17,"sub":"yak","topic":"手配旅行契約","stem":"手配旅行契約に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"手配するすべての旅行サービスについて権利を表示した書面を交付するときは、契約書面を交付しないことがある。","b":"旅行開始前に運送・宿泊機関等の運賃・料金の改訂、為替相場の変動により旅行代金に変動が生じたときは、旅行業者は旅行代金を変更することがある。","c":"旅行者の都合により契約を解除する場合、旅行者は旅行業者が得るはずであった旅行業務取扱料金を支払わなければならない。","d":"手配旅行契約においても、旅行業者は旅程管理義務を負う。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。手配旅行契約では旅程管理義務を負わない。bの為替変動による変更は企画旅行にはない手配旅行特有の規定。","why":"手配旅行は5年で2問と少ないが、企画旅行との対比で出題されやすい。為替変動の扱いは企画旅行と逆になる。","ref":"手配旅行契約の部"},{"id":"Byak18","no":18,"sub":"yak","topic":"団体・グループ","stem":"団体・グループ契約に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"契約責任者は、旅行業者が定める日までに構成者の名簿を提出しなければならない。","b":"手配旅行契約においては、名簿の提出に代えて人数を通知することができる。","c":"受注型企画旅行契約においては、申込金の支払いを受けることなく契約の締結を承諾することがある。","d":"募集型企画旅行契約においても、申込金不要による契約成立の特則がある。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。申込金不要の特則は受注型企画旅行契約と手配旅行契約にあり、募集型にはない。","why":"団体・グループは5年連続で毎年1問。名簿と人数通知の違い、申込金不要の特則の適用範囲が問われる。","ref":"募集型 第24条〜第26条／手配旅行"},{"id":"Byak19","no":19,"sub":"yak","topic":"渡航手続代行・相談","stem":"渡航手続代行契約及び旅行相談契約に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"渡航手続代行契約は、企画旅行契約又は手配旅行契約を締結した旅行者としか締結できない。","b":"旅行相談契約においては、契約書面の交付を要しない。","c":"いずれの契約においても、損害賠償の通知期限は損害発生の翌日から起算して6か月以内である。","d":"旅行相談契約において、満員等の事由により運送・宿泊機関等との契約が締結できなかったときは、旅行者は相談料金を支払う必要がない。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行業者は手配が可能であることを保証するものではなく、契約が締結できなかった場合でも旅行者は相談料金を支払わなければならない。","why":"渡航手続代行・相談は5年連続で毎年1問。通知期限6か月（企画・手配は2年）は必出。","ref":"渡航手続代行／旅行相談"},{"id":"Byak20","no":20,"sub":"yak","topic":"契約書面・確定書面","stem":"旅行代金の払戻しに関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"旅行開始前に契約が解除され払い戻すべき金額が生じたときは、解除の翌日から起算して7日以内に払い戻す。","b":"旅行開始後の解除により払い戻すべき金額が生じたときは、契約書面に記載した旅行終了日の翌日から起算して30日以内に払い戻す。","c":"変更補償金は、実際の旅行終了日の翌日から起算して30日以内に支払う。","d":"旅行代金の減額により払い戻すべき金額が生じたときは、解除の翌日から起算して7日以内に払い戻す。"},"ans":["a","b","c"],"pt":4,"exp":"dは誤り。旅行代金の減額に伴う払戻しは、契約書面に記載した旅行終了日の翌日から起算して30日以内。7日以内は旅行開始前の解除の場合。","why":"払戻しの3つの期限（7日／30日／変更補償金の30日）は起算点が異なり、毎年混同を狙われる。","ref":"募集型 第19条・第29条"},{"id":"Byak21","no":21,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>各搭乗用片による旅行は、当該航空券の有効期間満了日の24時までに終了しなければならない。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。各搭乗用片による旅行は、有効期間満了日の24時までに「開始」すれば、満了日を過ぎても継続できる。「終了」としている点が誤り。","why":"2021・2022年度に出題された定番。「開始」と「終了」の入替えが毎回の型。","ref":"JAL国際運送約款"},{"id":"Byak22","no":22,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社は、旅客が搭乗手続の締切時刻までに搭乗手続を完了しなかった場合、その座席の予約を取り消すことができる。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。搭乗手続締切時刻・出発時刻に遅れた旅客の予約は取り消される。また発券期限までに発券を受けない旅客の予約も取り消すことができる。","why":"予約・搭乗手続はJAL国際運送約款の中心論点のひとつ。発券期限と締切時刻の2つの期限が問われる。","ref":"JAL国際運送約款"},{"id":"Byak23","no":23,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>時刻表に記載された時刻は保証されたものであり、運送契約の一部を構成する。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。時刻表の時刻は予定であって保証されたものではなく、運送契約の一部を構成しない。接続に支障が生じても会社は責任を負わない。","why":"2022年度に出題。スケジュールの非保証は乗継ぎの責任と結びつく論点。","ref":"JAL国際運送約款"},{"id":"Byak24","no":24,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>最初の国際線区間の搭乗用片が未使用のまま、いずれかの予定寄航地から旅行を開始する場合、その航空券は無効となる。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。航空券は記載された出発地からの旅程の順序にしたがってのみ搭乗用片を使用できる。また航空券は譲渡できない。","why":"2021年度に出題。搭乗用片の使用順序は航空券の効力に関する基本論点。","ref":"JAL国際運送約款"},{"id":"Byak25","no":25,"sub":"yak","topic":"JAL国際運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>コードシェア便を利用する場合の無料手荷物許容量は、航空券を発行した運送人の規則が適用される。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。コードシェア便では、実際に運航を行う他の運送人の規則が適用される。発行した運送人ではない。","why":"コードシェア便の扱いは近年の実務を反映した論点で、5年で未出。次に出やすい切り口。","ref":"JAL国際運送約款"},{"id":"Byak26","no":26,"sub":"yak","topic":"JAL国内旅客運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社は、8歳未満の小児で付添人のない旅客について、運送の引受けを拒絶することがある。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。特別な取扱いを必要とする旅客、重傷病者、8歳未満の付添人のない小児などは運送の拒否・降機の対象となりうる。","why":"2022年度に出題。年齢（8歳）の数字を変える誤答が定番。","ref":"JAL国内旅客運送約款"},{"id":"Byak27","no":27,"sub":"yak","topic":"JAL国内旅客運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社は、満15歳未満の者に対して非常口座席への着席を拒絶することができる。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。非常口座席は、満15歳未満の者、脱出援助に支障がある者、手順を理解できない者、援助に同意しない者に対して着席を拒絶できる。この場合、特別料金等は払い戻し取消手数料は申し受けない。","why":"非常口座席の着席制限は5年で未出。安全に関わる実務規定として出題されうる。","ref":"JAL国内旅客運送約款"},{"id":"Byak28","no":28,"sub":"yak","topic":"JAL国内旅客運送約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>会社は、持込手荷物に生じた損害については、会社又はその使用人に過失があったことが証明された場合に限り賠償の責任を負う。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。受託手荷物は会社の管理下にあった期間に生じた損害について責任を負うのに対し、持込手荷物は過失の証明を要する。この非対称が核心。","why":"受託手荷物と持込手荷物の責任の違いは2023年度に出題。立証責任の所在が問われる。","ref":"JAL国内旅客運送約款"},{"id":"Byak29","no":29,"sub":"yak","topic":"貸切バス約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>運送契約は、バス会社が乗車券を契約責任者に交付したときに成立する。","opts":{"a":"正しい","b":"誤っている"},"ans":["a"],"pt":2,"exp":"正しい。通常は運賃・料金の20%以上の支払いがあったときに乗車券を交付するが、特別の定めをしたときは運送を引き受けることとしたときに交付する。したがって成立時期は必ずしも20%支払時とは限らない。","why":"★貸切バス約款は5年で3問。出題される年は成立時期か出発時刻30分ルールが問われる。","ref":"貸切バス標準運送約款"},{"id":"Byak30","no":30,"sub":"yak","topic":"モデル宿泊約款","stem":"次の記述について、正しいものにはaを、誤っているものにはbを選びなさい。<br>宿泊客が客室に連続して宿泊する場合においては、到着日及び出発日を含め終日客室を使用することができる。","opts":{"a":"正しい","b":"誤っている"},"ans":["b"],"pt":2,"exp":"誤り。連続して宿泊する場合、終日使用できるのは「到着日及び出発日を除き」である。到着日・出発日は所定のチェックイン・チェックアウト時刻による。","why":"★モデル宿泊約款は5年で2問。出る年は客室の使用時間か契約解除が問われる。","ref":"モデル宿泊約款"},{"id":"Bdom01","no":1,"sub":"dom","topic":"国内観光資源","stem":"次の記述に該当する国立公園はどれか。<br>北海道の東部にあり、マリモで知られる湖、世界屈指の透明度をもつ湖、和琴半島が突き出た湖の3つの湖を含む。","opts":{"a":"知床国立公園","b":"釧路湿原国立公園","c":"阿寒摩周国立公園","d":"大雪山国立公園"},"ans":["c"],"pt":2,"exp":"阿寒摩周国立公園。阿寒湖（マリモ・アイヌコタン）、摩周湖（霧の摩周湖・透明度）、屈斜路湖（和琴半島・砂湯）から成る。2017年に阿寒国立公園から改称された。","why":"北海道の湖沼は5年で複数回。個別の湖は既出だが、国立公園という枠で束ねて問う形は未出の切り口。","ref":"国内観光資源／北海道"},{"id":"Bdom02","no":2,"sub":"dom","topic":"国内観光資源","stem":"次の組合せのうち、いずれも同一の県にあるものをすべて選びなさい。","opts":{"a":"龍泉洞 ─ 中尊寺金色堂","b":"康楽館 ─ 田沢湖","c":"銀山温泉 ─ 立石寺","d":"五色沼 ─ 蔵王のお釜"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。五色沼は福島県（裏磐梯）、蔵王のお釜は宮城県。蔵王は宮城・山形にまたがるが、お釜は宮城側にある。a＝岩手、b＝秋田、c＝山形。","why":"同一県判定は毎年3〜4問。東北は県境をまたぐ資源（十和田湖・蔵王）が多く、誤答を作りやすい。","ref":"国内観光資源／東北"},{"id":"Bdom03","no":3,"sub":"dom","topic":"国内観光資源","stem":"関東地方の観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"袋田の滝は茨城県にあり、日本三名瀑のひとつである。","b":"華厳の滝は栃木県の日光にある。","c":"吹割の滝は群馬県にある。","d":"那智の滝は千葉県にある。"},"ans":["d"],"pt":2,"exp":"那智の滝は和歌山県。落差133mで日本三名瀑のひとつ。千葉県の代表的な景勝地は鋸山・犬吠埼・九十九里浜。","why":"三名瀑は5年で未出。個別の滝は出題実績があり、定義と県の組合せを問う形が出やすい。","ref":"国内観光資源／関東"},{"id":"Bdom04","no":4,"sub":"dom","topic":"国内観光資源","stem":"次の空欄に該当するものはどれか。<br>石川県輪島市にある　▢　は、日本海に面した斜面に約1,000枚の小さな田が広がる棚田で、「能登の里山里海」として世界農業遺産に認定されている。","opts":{"a":"大山千枚田","b":"白米千枚田","c":"中山千枚田","d":"丸山千枚田"},"ans":["b"],"pt":2,"exp":"白米千枚田。大山千枚田は千葉県、中山千枚田は香川県小豆島、丸山千枚田は三重県。","why":"白米千枚田は2022年度に出題済み。他の千枚田を選択肢に並べる形は誤答を作りやすく、再出題されうる。","ref":"国内観光資源／中部"},{"id":"Bdom05","no":5,"sub":"dom","topic":"国内観光資源","stem":"中部地方の観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"黒部峡谷はトロッコ電車で知られ、富山県にある。","b":"寸又峡の夢の吊橋は静岡県にある。","c":"昇仙峡は山梨県にある。","d":"大杉谷は長野県にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。大杉谷は三重県にあり、清津峡（新潟）・黒部峡谷（富山）とともに日本三大峡谷を構成する。","why":"渓谷は5年で清津峡・大歩危小歩危が出題。三大峡谷の構成（清津峡・大杉谷・黒部峡谷）は未出。","ref":"国内観光資源／中部"},{"id":"Bdom06","no":6,"sub":"dom","topic":"国内観光資源","stem":"近畿地方の世界文化遺産に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"法隆寺地域の仏教建造物は奈良県にある。","b":"紀伊山地の霊場と参詣道は、和歌山県・奈良県・三重県にまたがる。","c":"百舌鳥・古市古墳群は大阪府にある。","d":"姫路城は京都府にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。姫路城は兵庫県。世界文化遺産に登録された城郭は姫路城と首里城跡（琉球王国のグスク）。","why":"世界遺産は近年の出題傾向として重視されている。百舌鳥・古市古墳群（2019年登録）は5年で未出。","ref":"国内観光資源／近畿"},{"id":"Bdom07","no":7,"sub":"dom","topic":"国内観光資源","stem":"次の下線部a.〜d.のうち、誤っているものはどれか。<br>京都には、白砂に15個の石を配した石庭で知られる <u>a.龍安寺</u>、苔寺の通称をもつ <u>b.西芳寺</u>、御室桜で知られる <u>c.仁和寺</u>、曹源池庭園で知られる <u>d.東福寺</u> がある。","opts":{"a":"龍安寺","b":"西芳寺","c":"仁和寺","d":"東福寺"},"ans":["d"],"pt":2,"exp":"曹源池庭園で知られるのは天龍寺。東福寺は通天橋の紅葉で知られる。a・b・cはいずれも正しい。","why":"京都の寺院は毎年2〜3問。庭園の名称（石庭・曹源池・苔）と寺院の対応は未出の切り口。","ref":"国内観光資源／近畿"},{"id":"Bdom08","no":8,"sub":"dom","topic":"国内観光資源","stem":"中国地方の観光資源に関する次の記述のうち、誤っているものはどれか。","opts":{"a":"秋芳洞は山口県にあり、日本三大鍾乳洞のひとつである。","b":"鳥取砂丘には砂の美術館が隣接している。","c":"足立美術館は島根県にあり、日本庭園で高い評価を受けている。","d":"蒜山高原は広島県にある。"},"ans":["d"],"pt":2,"exp":"蒜山高原は岡山県。広島県の高原は三段峡・帝釈峡などが知られる。","why":"蒜山高原は2025年度に「出石焼─蒜山高原」の組合せで出題され、岡山県であることが問われた。県を変える誤答が再出しやすい。","ref":"国内観光資源／中国"},{"id":"Bdom09","no":9,"sub":"dom","topic":"国内観光資源","stem":"四国地方の観光資源に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"金刀比羅宮は香川県にあり、785段の石段で知られる。","b":"石鎚山は愛媛県にあり、西日本最高峰である。","c":"足摺岬は高知県にある。","d":"鳴門の渦潮は香川県と兵庫県の間の海峡で見られる。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。鳴門の渦潮は徳島県と兵庫県（淡路島）の間の鳴門海峡で見られる。大鳴門橋が架かる。","why":"四国は毎年出題。鳴門海峡の両岸（徳島・淡路島）を香川と誤らせる形は未出の切り口。","ref":"国内観光資源／四国"},{"id":"Bdom10","no":10,"sub":"dom","topic":"国内観光資源","stem":"九州の温泉に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"黒川温泉は熊本県にあり、露天風呂めぐりで知られる。","b":"由布院温泉は大分県にあり、金鱗湖がある。","c":"指宿温泉は鹿児島県にあり、砂むし温泉で知られる。","d":"雲仙温泉は熊本県にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。雲仙温泉は長崎県の島原半島にある。雲仙地獄で知られる。","why":"温泉と県の組合せは毎年出題。九州は温泉が多く、県境をまたいだ誤答を作りやすい。","ref":"国内観光資源／九州"},{"id":"Bdom11","no":11,"sub":"dom","topic":"国内観光資源","stem":"沖縄県の離島に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"東平安名崎は宮古島にある。","b":"川平湾は石垣島にある。","c":"ハテの浜は久米島にある。","d":"マリユドゥの滝は竹富島にある。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。マリユドゥの滝は西表島にある。竹富島は赤瓦の集落とカイジ浜の星砂で知られる。","why":"沖縄の離島は毎年出題。島の取り違えを狙う形が固定しており、八重山諸島内での混同が定番。","ref":"国内観光資源／沖縄"},{"id":"Bdom12","no":12,"sub":"dom","topic":"国内観光資源","stem":"次の組合せのうち、伝統的工芸品とその産地の県がいずれも一致しているものをすべて選びなさい。","opts":{"a":"南部鉄器 ─ 岩手県","b":"熊野筆 ─ 広島県","c":"大内塗 ─ 島根県","d":"加賀友禅 ─ 石川県"},"ans":["a","b","d"],"pt":2,"exp":"cは誤り。大内塗は山口県。島根県の伝統的工芸品は石見焼・雲州そろばん・出雲石燈ろう。","why":"工芸品と県の組合せは陶磁器以外も出題される。熊野筆・大内塗・雲州そろばんは5年で未出。","ref":"国内観光資源／組合せ"},{"id":"Bdom13","no":13,"sub":"dom","topic":"国内観光資源","stem":"日本の城に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"国宝五城は、松本城、犬山城、彦根城、姫路城、松江城である。","b":"現存十二天守には弘前城が含まれる。","c":"備中松山城は雲海に浮かぶ姿で知られ、岡山県にある。","d":"名古屋城は現存天守である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。名古屋城の天守は戦災で焼失し、現在のものは鉄骨鉄筋コンクリート造の復元。現存十二天守には含まれない。","why":"城は5年で複数回。国宝五城は2025年度に犬山城が出題された。現存天守の範囲を問う形は未出。","ref":"国内観光資源／横断"},{"id":"Bdom14","no":14,"sub":"dom","topic":"国内観光資源","stem":"次の記述に該当する街道はどれか。<br>ナイアガラの滝を起点に、トロント、モントリオール、ケベックシティへと続く約800kmの街道で、秋の紅葉が美しい。","opts":{"a":"ロマンチック街道","b":"メープル街道","c":"古城街道","d":"メルヘン街道"},"ans":["b"],"pt":2,"exp":"メープル街道（カナダ）。ロマンチック街道・古城街道・メルヘン街道はいずれもドイツの観光街道。国内旅行実務の問題ではないが、街道の名称は混同されやすい。","why":"観光街道は海外観光資源の論点だが、名称の混同を狙う形として国内・海外双方で出題されうる。","ref":"観光資源／街道"},{"id":"Bdom15","no":15,"sub":"dom","topic":"国内観光資源","stem":"次の祭りとその都道府県の組合せのうち、正しいものをすべて選びなさい。","opts":{"a":"西大寺会陽 ─ 岡山県","b":"山鹿灯籠まつり ─ 熊本県","c":"よさこい祭り ─ 徳島県","d":"唐津くんち ─ 佐賀県"},"ans":["a","b","d"],"pt":2,"exp":"cは誤り。よさこい祭りは高知県。徳島県は阿波踊り。四国の夏祭り（阿波踊り＝徳島、よさこい＝高知）の取り違えが定番。","why":"祭りと県の組合せは毎年出題。四国の2大祭りの混同は誤答として作りやすい。","ref":"国内観光資源／組合せ"},{"id":"Bdom16","no":16,"sub":"dom","topic":"国内観光資源","stem":"重要伝統的建造物群保存地区に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"角館（秋田県）は武家屋敷の町並みとして選定されている。","b":"奈良井（長野県）は中山道の宿場町として選定されている。","c":"温泉津（島根県）は温泉町として選定されている。","d":"城崎（兵庫県）は温泉町として選定されている。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。城崎温泉は外湯めぐりで知られるが重要伝統的建造物群保存地区には選定されていない。温泉町として選定されているのは温泉津（島根）・銀山（山形）など。","why":"重伝建は個別には毎年出題。温泉町としての選定は未出の切り口で、温泉津は2025年度に出題実績がある。","ref":"国内観光資源／横断"},{"id":"Bdom17","no":17,"sub":"dom","topic":"国内観光資源","stem":"次の記述のうち、誤っているものはどれか。","opts":{"a":"白神山地は青森県と秋田県にまたがる世界自然遺産である。","b":"小笠原諸島は東京都に属する世界自然遺産である。","c":"知床は北海道にある世界自然遺産である。","d":"屋久島は熊本県にある世界自然遺産である。"},"ans":["d"],"pt":2,"exp":"屋久島は鹿児島県。国内の世界自然遺産は屋久島・白神山地・知床・小笠原諸島・奄美大島等の5件。","why":"世界自然遺産5件は近年の出題傾向に合致。奄美大島等（2021年登録）を含めた5件の把握が問われる。","ref":"国内観光資源／横断"},{"id":"Bdom18","no":18,"sub":"dom","topic":"国内観光資源","stem":"次の空欄に該当するものはどれか。<br>岐阜県にある　▢　は、「奥美濃の小京都」と呼ばれ、名水百選の宗祇水があり、夏には郡上おどりの徹夜おどりが行われる。","opts":{"a":"高山","b":"郡上八幡","c":"馬籠","d":"白川郷"},"ans":["b"],"pt":2,"exp":"郡上八幡。高山は三町の町並みと高山祭、馬籠は中山道の宿場町、白川郷は合掌造り集落。","why":"郡上八幡は2023年度に出題済み。岐阜県内の他の観光地を並べる形は再出題されやすい。","ref":"国内観光資源／中部"},{"id":"Bdom19","no":19,"sub":"dom","topic":"国内観光資源","stem":"次の郷土料理とその都道府県の組合せのうち、誤っているものはどれか。","opts":{"a":"きりたんぽ ─ 秋田県","b":"ほうとう ─ 山梨県","c":"ちゃんぽん ─ 佐賀県","d":"冷汁 ─ 宮崎県"},"ans":["c"],"pt":2,"exp":"ちゃんぽんは長崎県。佐賀県の郷土料理はシシリアンライス・呼子のいかなど。","why":"郷土料理は毎年出題。九州内での県の取り違え（長崎・佐賀・熊本）は誤答を作りやすい。","ref":"国内観光資源／組合せ"},{"id":"Bdom20","no":20,"sub":"dom","topic":"国内観光資源","stem":"次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"日本三大夜景は、函館山、摩耶山、稲佐山である。","b":"日本三名泉は、有馬温泉、草津温泉、下呂温泉である。","c":"日本三大霊場は、恐山、比叡山、高野山である。","d":"日本三大峡谷は、清津峡、大歩危、黒部峡谷である。"},"ans":["a","b","c"],"pt":2,"exp":"dは誤り。日本三大峡谷は清津峡（新潟）・大杉谷（三重）・黒部峡谷（富山）。大歩危は徳島県の渓谷だが三大峡谷ではない。","why":"「三大○○」は毎年どれかが出る。三大峡谷に大歩危を混ぜる誤答は、両方とも既出資源であるため作りやすい。","ref":"国内観光資源／横断"},{"id":"Bdom21","no":21,"sub":"dom","topic":"宿泊料金","stem":"次の条件で旅館に宿泊する場合、宿泊客が支払うべき料金の総額として正しいものはどれか。<br>大人2人と小学生1人が1泊2食付きで宿泊する。<br>※大人1人あたりの基本宿泊料は15,000円。※小学生は大人に準ずる食事と寝具の提供を受け、大人料金の70%とする。※サービス料は基本宿泊料の10%。※消費税は10%。※入湯税は1人150円（小学生を含む）。","opts":{"a":"49,455円","b":"49,005円","c":"49,900円","d":"44,550円"},"ans":["a"],"pt":5,"exp":"① 基本宿泊料＝15,000×2人＋15,000×0.7（小学生）＝40,500円。② サービス料＝40,500×10%＝4,050円。③ 消費税＝(40,500＋4,050)×10%＝4,455円。④ 入湯税＝150円×3人＝450円（消費税は課さない）。合計 40,500＋4,050＋4,455＋450＝49,455円。","why":"宿泊料金は毎年1〜2問。小学生の70%、サービス料の対象、税に税を課さない点の3段構えが分岐点。","ref":"モデル宿泊約款"},{"id":"Bdom22","no":22,"sub":"dom","topic":"貸切バス運賃","stem":"次の行程で貸切バス（大型車1台）を1泊2日で利用する場合の時間制運賃の対象時間として正しいものはどれか。<br>1日目：8時出庫 → 9時乗車地出発 → 18時宿泊地着（バスは宿泊地に留置）<br>2日目：9時宿泊地出発 → 17時下車地着 → 18時帰庫","opts":{"a":"21時間","b":"23時間","c":"19時間","d":"25時間"},"ans":["b"],"pt":5,"exp":"1日目＝出庫前点呼1時間 ＋ 走行10時間（8時出庫〜18時宿泊地着）＋ 宿泊地到着後1時間 ＝ 12時間。2日目＝宿泊地出発前1時間 ＋ 走行9時間（9時出発〜18時帰庫）＋ 帰庫後点検1時間 ＝ 11時間。合計23時間。宿泊を伴う場合は宿泊場所の到着後・出発前にも各1時間ずつ加算する点が分岐点。","why":"★貸切バスは2024年度に11問と突出。宿泊を伴う場合の点呼・点検時間（各日1時間ずつ）は難度が高く、次に出やすい。","ref":"貸切バス標準運送約款"},{"id":"Bdom23","no":23,"sub":"dom","topic":"貸切バス運賃","stem":"貸切バスの運賃・料金に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"深夜早朝運行料金は、22時から翌朝5時までの間に点呼・点検時間や走行時間が含まれた場合に適用される。","b":"ガイド料、有料道路利用料、駐車料は旅客の実費負担であり、運賃額には含まれない。","c":"距離の端数は10km未満を10kmに切り上げ、時間の端数は30分未満を切り捨て30分以上を切り上げる。","d":"交替運転者配置料金は、法令で交替運転者の配置が義務づけられる場合にのみ適用される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。交替運転者配置料金は、法令で義務づけられる場合のほか、配置について運送申込者と合意した場合にも適用される。","why":"貸切バスの料金体系（深夜早朝・特殊車両・交替運転者）は3種類あり、適用条件を問う形が出やすい。","ref":"貸切バス標準運送約款"},{"id":"Bdom24","no":24,"sub":"dom","topic":"フェリー","stem":"フェリーの乗船券に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"片道の航路距離が100km未満の乗船券の通用期間は、発売当日限りである。","b":"往復乗船券の通用期間は、片道の2倍である。","c":"病気その他旅客の不可抗力により乗船を中止した場合、7日間を限度として通用期間を延長できる。","d":"特急便が所定の時間以上遅れて到着した場合、運賃及び料金の全額が払い戻される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。払い戻されるのは特急・急行料金のみで、運賃は払い戻されない。通用期間は100km未満が当日限り、100〜200kmが2日、200〜400kmが4日、400km以上が7日。","why":"フェリーは毎年出題。通用期間と払戻しの規定は運賃計算以外の切り口として出やすい。","ref":"フェリー運送約款"},{"id":"Bdom25","no":25,"sub":"dom","topic":"国内航空","stem":"次の条件で国内航空券を払いもどす場合の払戻額として正しいものはどれか。<br>券面額22,000円（うち旅客施設使用料440円、旅客保安サービス料1,540円）。取消手数料は取消時期に応じ税抜運賃の30%が適用される。<br>※税抜運賃＝（券面額−旅客施設使用料−旅客保安サービス料）÷1.1とし、取消手数料の1円未満は切り捨てる。","opts":{"a":"16,540円","b":"14,560円","c":"5,460円","d":"18,200円"},"ans":["a"],"pt":5,"exp":"① 税抜運賃＝(22,000−440−1,540)÷1.1＝20,020÷1.1＝18,200円。② 取消手数料＝18,200×30%＝5,460円。③ 払戻額＝22,000−5,460＝16,540円。施設使用料・保安サービス料は返金されるため、払戻額からさらに差し引かない（14,560円とするのは誤り）。","why":"★航空の取消手数料は2021・2023年度のみで2年連続出題なし。JAL方式（税抜運賃に率を乗じる）は計算が2段階で難度が高い。","ref":"国内旅客運送約款"},{"id":"Bdom26","no":26,"sub":"dom","topic":"国内航空","stem":"国内航空の予約及び航空券に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"航空券は記名式であり、第三者に譲渡することができない。","b":"予約は搭乗日の360日前から受け付ける（日本航空の場合）。","c":"搭乗予定便が含まれない航空券の有効期間は、発行日及び翌日から起算して1年間である。","d":"購入期限を過ぎた場合、予約は旅客への通知を経て取り消される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。購入期限を過ぎた予約は「予告なしに」取り消されることがある。通知は要件ではない。","why":"航空券の効力・有効期間は5年で複数回。記名式・譲渡不可と有効期間1年は基本論点。","ref":"国内旅客運送約款"},{"id":"Bdom27","no":27,"sub":"dom","topic":"JR運賃・料金","stem":"次の行程で大人1人が乗車する場合の特急料金として正しいものはどれか。<br>［行程］A駅 —(新幹線 普通車指定席)— B駅 —(在来線特急 普通車指定席)— C駅<br>※B駅は乗継割引の適用駅で、改札を出ずに当日中に乗り継ぐ。<br>※通常期の指定席特急料金は、新幹線区間5,000円、在来線区間2,400円とする。※乗車日は繁忙期（＋200円）に当たる。","opts":{"a":"5,200円＋1,300円＝6,500円","b":"5,200円＋2,600円＝7,800円","c":"5,000円＋1,200円＝6,200円","d":"5,200円＋1,200円＝6,400円"},"ans":["a"],"pt":5,"exp":"①通常期の指定席特急料金に繁忙期の200円を加算（新幹線5,200円、在来線2,600円）。②乗継割引で在来線側を半額にする（2,600÷2＝1,300円）。合計6,500円。加算してから半額にする順序が分岐点。","why":"JR特急料金は5年で25問と国内最頻出。乗継割引と繁忙期加算を組み合わせた計算は毎年の中心論点。","ref":"JR旅客営業規則","fig":"<svg viewBox=\"0 0 700 196\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"12\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<rect x=\"30\" y=\"24\" width=\"150\" height=\"36\" rx=\"2\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"94\" y=\"47\">A駅</text>\n<line x1=\"180\" y1=\"42\" x2=\"272\" y2=\"42\" stroke=\"var(--ai)\" stroke-width=\"3\"/>\n<text x=\"188\" y=\"34\" font-size=\"11\" fill=\"var(--ai)\" font-weight=\"700\">新幹線 指定席</text>\n<rect x=\"274\" y=\"24\" width=\"150\" height=\"36\" rx=\"2\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"330\" y=\"41\" font-size=\"11\">B駅</text><text x=\"292\" y=\"55\" font-size=\"10\" fill=\"var(--koke)\">乗継割引の適用駅</text>\n<line x1=\"424\" y1=\"42\" x2=\"516\" y2=\"42\" stroke=\"var(--kin)\" stroke-width=\"3\"/>\n<text x=\"428\" y=\"34\" font-size=\"11\" font-weight=\"700\">在来線特急 指定席</text>\n<rect x=\"518\" y=\"24\" width=\"150\" height=\"36\" rx=\"2\" fill=\"var(--surface)\" stroke=\"var(--rule)\"/><text x=\"582\" y=\"47\">C駅</text>\n<rect x=\"4\" y=\"76\" width=\"692\" height=\"52\" rx=\"2\" fill=\"var(--aiSoft)\" stroke=\"var(--aiLine)\"/>\n<text x=\"20\" y=\"96\" font-weight=\"700\" fill=\"var(--ai)\">① まず繁忙期の加算をする</text>\n<text x=\"20\" y=\"118\" font-size=\"13\">新幹線 5,000＋200＝<tspan font-weight=\"700\">5,200円</tspan>　／　在来線 2,400＋200＝<tspan font-weight=\"700\">2,600円</tspan></text>\n<rect x=\"4\" y=\"136\" width=\"692\" height=\"54\" rx=\"2\" fill=\"var(--kokeSoft)\" stroke=\"var(--kokeLine)\"/>\n<text x=\"20\" y=\"156\" font-weight=\"700\" fill=\"var(--koke)\">② そのあとで在来線側に乗継割引（半額）</text>\n<text x=\"20\" y=\"178\" font-size=\"13\">2,600 ÷ 2 ＝ <tspan font-weight=\"700\">1,300円</tspan>　→　合計 5,200＋1,300＝<tspan font-weight=\"700\" fill=\"var(--shu)\">6,500円</tspan></text>\n</g></svg>","figcap":"繁忙期加算と乗継割引の適用順序"},{"id":"Bdom28","no":28,"sub":"dom","topic":"JR運賃・料金","stem":"次の行程で大人1人が乗車する場合の運賃計算に関する記述のうち、正しいものはどれか。<br>［行程］大阪市内の駅 → 東京都区内の駅（東海道新幹線経由・営業キロ556.4km）","opts":{"a":"実際の乗車駅・降車駅からの営業キロにより計算する。","b":"大阪駅と東京駅の間の営業キロにより計算し、券面には「大阪市内」「東京都区内」と表示される。","c":"特定都区市内の特例は適用されない。","d":"途中の市内各駅で下車しても前途は無効とならない。"},"ans":["b"],"pt":5,"exp":"特定都区市内制度は中心駅からの営業キロが200.1km以上のときに適用され、中心駅（大阪駅・東京駅）を起点として運賃を計算する。券面表示の都区市内各駅で下車すると前途無効。","why":"特定都区市内は5年で未出。JR普通運賃が2025年度に出題されていないこととあわせ、次に出やすい論点。","ref":"JR旅客営業規則"},{"id":"Bdom29","no":29,"sub":"dom","topic":"JR運賃・料金","stem":"JRの乗車券の有効期間に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"片道の営業キロが400kmまでの普通乗車券の有効期間は3日間である。","b":"往復乗車券の有効期間は、片道の2倍である。","c":"東京近郊区間内相互発着の普通乗車券は、営業キロにかかわらず当日限り有効である。","d":"片道乗車券で乗車中に有効期間が経過した場合、直ちに無効となる。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。片道乗車券で乗車中に有効期間が経過しても、途中下車をしない限り券面表示の最終駅まで使用できる。","why":"有効期間は5年で未出だが、大都市近郊区間の特例とあわせて出題されやすい基本論点。","ref":"JR旅客営業規則"},{"id":"Bdom30","no":30,"sub":"dom","topic":"JR運賃・料金","stem":"次の条件でJR券を払いもどす場合の手数料の合計額として正しいものはどれか。<br>乗車券（8,910円）1枚、指定席特急券（5,490円）1枚を、乗車日の5日前に払いもどす。","opts":{"a":"560円","b":"440円","c":"680円","d":"340円"},"ans":["a"],"pt":5,"exp":"乗車券の払いもどし手数料は220円、指定席特急券は乗車日の2日前までなら340円。合計560円。乗車券と指定券が1枚で発行されていても手数料はそれぞれに必要。","why":"払いもどし手数料は5年連続で毎年1〜2問。乗車券220円と指定券340円を合算する形が定番。","ref":"JR旅客営業規則"},{"id":"Bdom31","no":31,"sub":"dom","topic":"JR運賃・料金","stem":"JRの学生割引及び往復割引に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"学生割引は片道の営業キロが101km以上の場合に、普通運賃が2割引となる。","b":"往復割引は片道の営業キロが601km以上の場合に、ゆき・かえりの普通運賃がそれぞれ1割引となる。","c":"学生割引と往復割引は併用することができる。","d":"学生割引は特急料金にも適用される。"},"ans":["a","b","c"],"pt":5,"exp":"dは誤り。学生割引・往復割引はいずれも運賃のみが対象で、料金（特急料金・グリーン料金等）は割引されない。","why":"学生割引・往復割引は5年で未出。JR運賃の基本論点として出題されうる。","ref":"JR旅客営業規則"},{"id":"Bdom32","no":32,"sub":"dom","topic":"JR運賃・料金","stem":"JRの特別企画乗車券に関する次の記述のうち、正しいものをすべて選びなさい。","opts":{"a":"青春18きっぷは、快速を含む普通列車の自由席に限り有効である。","b":"青春18きっぷに年齢制限はない。","c":"ジパング倶楽部の会員は、「のぞみ」「みずほ」の特急料金についても割引を受けられる。","d":"ジパング倶楽部の新規会員は、3回目まで運賃・料金が2割引となる。"},"ans":["a","b","d"],"pt":5,"exp":"cは誤り。「のぞみ」「みずほ」の特急料金・グリーン料金は、自由席を利用する場合であっても割引の対象外。運賃は割引される。","why":"特別企画乗車券は2022・2023年度に出題。青春18きっぷとジパング倶楽部を並べて問う形は未出。","ref":"JR特別企画乗車券"},{"id":"Bovs01","no":1,"sub":"ovs","topic":"国際航空運賃","stem":"［資料］に基づき、東京（TYO）→ロンドン（LON）→パリ（PAR）→東京（TYO）の旅程について、往復ともFlex Y運賃を適用する場合の合計額として正しいものはどれか。<br>※折り返し地点はPARとする。※サーチャージ及び発券手数料を加算する。","opts":{"a":"860,000＋18,000＋13,000＋10,000＝901,000円","b":"840,000＋18,000＋13,000＋10,000＝881,000円","c":"860,000×1.05＋18,000＋13,000＋10,000＝944,000円","d":"860,000＋18,000＋13,000＝891,000円"},"ans":["a"],"pt":5,"exp":"折り返し地点がPARなのでTYO－PARのFlex Y運賃860,000円を適用。往路TPMは5,955＋215＝6,170でMPM 7,432以内のため割増なし。往路サーチャージ18,000円、復路13,000円、発券手数料10,000円を加算して901,000円。","why":"国際航空運賃は5年連続で毎年8問。折り返し地点から運賃額を選び、マイレージ超過の有無を確認し、サーチャージと手数料を加算するという手順は毎回同じ。","ref":"マイレージシステム","fig":"<svg viewBox=\"0 0 700 330\" xmlns=\"http://www.w3.org/2000/svg\">\n<g font-size=\"11\" fill=\"var(--ink)\" font-family=\"var(--sans)\">\n<text x=\"14\" y=\"18\" font-weight=\"700\" font-size=\"12\">［資料1］運賃規則表（東京発 ヨーロッパ行）</text>\n<rect x=\"14\" y=\"26\" width=\"130\" height=\"22\" fill=\"var(--surface2)\" stroke=\"var(--rule)\"/><text x=\"24\" y=\"41\" font-weight=\"700\">項目</text>\n<rect x=\"144\" y=\"26\" width=\"180\" height=\"22\"
